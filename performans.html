<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ARTIFARMA – Eczane Performans, Gelişim, Prim ve Ücret Yönetim Sistemi</title>
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="Eczane çalışanlarının görev, yetkinlik, performans, gelişim planı, prim ve ücret süreçlerini tek sistemde yöneten uygulama.">
<link rel="icon" href="assets/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="assets/core.js"></script>
<style>
/* =========================================================
   ARTIFARMA — Performans, Gelişim, Prim ve Ücret Yönetim Sistemi
   Tasarım katmanı. Marka: lacivert #2A2A5E · kırmızı #DC1A22
   ========================================================= */
:root{
  --navy:#2A2A5E; --navy-700:#22224d; --navy-900:#14142c; --navy-50:#EEF0F8;
  --red:#DC1A22; --red-700:#b71219; --red-tint:#FBE9EA;
  --green:#167A4B; --green-tint:#E5F4EC;
  --amber:#B4650A; --amber-tint:#FDF1DF;
  --blue:#1D5FB0; --blue-tint:#E8F0FB;
  --bg:#F4F5FA; --card:#fff; --line:#E3E5F0; --line-2:#EFF0F7;
  --ink:#1b1b2c; --muted:#666a82; --faint:#9497ad;
  --r:12px; --r-sm:9px; --sh:0 1px 2px rgba(20,20,44,.06),0 2px 10px rgba(20,20,44,.05);
  --sh-lg:0 10px 34px rgba(20,20,44,.16);
  --yan:250px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:'Plus Jakarta Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;
  background:var(--bg); color:var(--ink); font-size:15px; line-height:1.55;
  -webkit-text-size-adjust:100%; -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{margin:0; line-height:1.25; font-weight:700; color:var(--navy)}
p{margin:0 0 10px}
a{color:var(--navy)}
button,input,select,textarea{font:inherit; color:inherit}
:focus-visible{outline:3px solid #9aa4d8; outline-offset:2px; border-radius:6px}
[hidden]{display:none !important}

/* ---------- Genel yardımcılar ---------- */
.satir{display:flex; gap:10px; align-items:center; flex-wrap:wrap}
.satir-ara{display:flex; gap:10px; align-items:center; justify-content:space-between; flex-wrap:wrap}
.buyu{flex:1 1 auto; min-width:0}
.sag{margin-left:auto}
.kucuk{font-size:12.5px}
.sessiz{color:var(--muted)}
.soluk{color:var(--faint)}
.kalin{font-weight:700}
.orta{text-align:center}
.mt{margin-top:14px} .mt2{margin-top:22px} .mb{margin-bottom:14px}
.gizle-mobil{display:initial}
@media(max-width:820px){.gizle-mobil{display:none !important}}

/* ---------- Üst çubuk ---------- */
.ust{
  position:sticky; top:0; z-index:60; background:var(--navy); color:#fff;
  display:flex; align-items:center; gap:12px; padding:9px 16px;
  padding-top:calc(9px + env(safe-area-inset-top)); box-shadow:0 2px 12px rgba(20,20,44,.24);
}
.af-chip{background:#fff;border-radius:8px;padding:4px 9px;display:inline-flex;align-items:center;height:36px;flex:none;box-shadow:0 1px 3px rgba(0,0,0,.18)}
.af-chip img{height:24px;width:auto;display:block}
.ust-ad{font-weight:800; font-size:14.5px; letter-spacing:.2px; line-height:1.2}
.ust-ad .kisa-ad{display:none}
@media(max-width:700px){ .ust-ad .uzun-ad{display:none} .ust-ad .kisa-ad{display:inline} .ust-alt{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden} }
.ust-alt{font-size:11.5px; opacity:.72; line-height:1.2}
.ust .ikon-dugme{
  background:rgba(255,255,255,.12); border:1px solid rgba(255,255,255,.2); color:#fff;
  border-radius:9px; padding:7px 11px; cursor:pointer; font-size:13px; font-weight:600;
}
.ust .ikon-dugme:hover{background:rgba(255,255,255,.22)}
.menu-dugme{display:none}
@media(max-width:980px){.menu-dugme{display:inline-flex}}
.rozet-say{
  background:var(--red); color:#fff; border-radius:20px; font-size:11px; font-weight:700;
  padding:1px 6px; margin-left:5px; display:inline-block;
}

/* ---------- Yerleşim ---------- */
.govde{display:flex; min-height:calc(100vh - 56px)}
.yan{
  width:var(--yan); flex:none; background:#fff; border-right:1px solid var(--line);
  padding:14px 10px 90px; overflow-y:auto; position:sticky; top:56px;
  height:calc(100vh - 56px);
}
.yan-baslik{font-size:11px; font-weight:800; letter-spacing:.7px; text-transform:uppercase; color:var(--faint); margin:16px 10px 6px}
.yan a{
  display:flex; align-items:center; gap:9px; padding:9px 11px; border-radius:9px;
  color:var(--ink); text-decoration:none; font-size:14px; font-weight:600; margin-bottom:2px;
}
.yan a:hover{background:var(--navy-50)}
.yan a.etkin{background:var(--navy); color:#fff}
.yan a .im{width:18px; text-align:center; font-size:15px; flex:none}
.yan a .say{margin-left:auto; font-size:11px; font-weight:700; background:var(--red-tint); color:var(--red-700); padding:1px 7px; border-radius:20px}
.yan a.etkin .say{background:rgba(255,255,255,.2); color:#fff}
.icerik{flex:1 1 auto; min-width:0; padding:20px 22px 80px}
@media(max-width:980px){
  .yan{
    position:fixed; left:0; top:0; height:100vh; z-index:80; transform:translateX(-102%);
    transition:transform .22s ease; box-shadow:var(--sh-lg); padding-top:20px;
  }
  .yan.acik{transform:none}
  .perde{position:fixed; inset:0; background:rgba(20,20,44,.45); z-index:70}
  .icerik{padding:14px 13px 90px}
}

/* ---------- Sayfa başlığı ---------- */
.sayfa-bas{margin-bottom:16px}
.sayfa-bas h1{font-size:clamp(19px,2.6vw,25px)}
.sayfa-bas p{color:var(--muted); font-size:13.5px; margin:5px 0 0; max-width:70ch}

/* ---------- Kart ---------- */
.kart{background:var(--card); border:1px solid var(--line); border-radius:var(--r); box-shadow:var(--sh); padding:16px; margin-bottom:14px}
.kart.sik{padding:12px}
.kart h3{font-size:15.5px; margin-bottom:4px}
.kart-bas{display:flex; align-items:flex-start; justify-content:space-between; gap:10px; margin-bottom:10px; flex-wrap:wrap}

/* ---------- Özet kartları ---------- */
.ozet{display:grid; grid-template-columns:repeat(auto-fill,minmax(180px,1fr)); gap:12px; margin-bottom:16px}
.oz{background:#fff; border:1px solid var(--line); border-radius:var(--r); padding:13px 14px; box-shadow:var(--sh)}
.oz .et{font-size:11.5px; font-weight:700; text-transform:uppercase; letter-spacing:.5px; color:var(--faint)}
.oz .dg{font-size:25px; font-weight:800; color:var(--navy); line-height:1.15; margin-top:3px; font-variant-numeric:tabular-nums}
.oz .alt{font-size:12px; color:var(--muted); margin-top:2px}
.oz.vurgu{border-left:4px solid var(--red)}
.oz.iyi{border-left:4px solid var(--green)}
.oz.uyar{border-left:4px solid var(--amber)}
/* Dar ekranda sabit en-az genişlik taşmaya yol açar; kolon sayısı sabitlenir. */
@media(max-width:560px){ .ozet{grid-template-columns:repeat(2,minmax(0,1fr))} }
@media(max-width:390px){ .ozet{grid-template-columns:minmax(0,1fr)} }
@media(max-width:560px){ .izgara,.izgara-2{grid-template-columns:minmax(0,1fr)} }

/* ---------- Düğmeler ---------- */
.d{
  display:inline-flex; align-items:center; justify-content:center; gap:7px;
  border:1px solid transparent; border-radius:var(--r-sm); padding:9px 15px;
  font-size:13.5px; font-weight:700; cursor:pointer; text-decoration:none; background:#fff;
  transition:filter .12s ease, background .12s ease; white-space:nowrap;
}
.d:disabled{opacity:.45; cursor:not-allowed}
.d-ana{background:var(--navy); color:#fff}
.d-ana:hover:not(:disabled){background:var(--navy-700)}
.d-kirmizi{background:var(--red); color:#fff}
.d-kirmizi:hover:not(:disabled){background:var(--red-700)}
.d-yesil{background:var(--green); color:#fff}
.d-cizgi{background:#fff; border-color:var(--line); color:var(--navy)}
.d-cizgi:hover:not(:disabled){background:var(--navy-50)}
.d-sade{background:transparent; color:var(--muted); padding:6px 9px; font-weight:600}
.d-sade:hover{color:var(--navy); background:var(--navy-50)}
.d-kk{padding:6px 11px; font-size:12.5px}
.d-tam{width:100%}

/* ---------- Form ---------- */
.alan{margin-bottom:12px}
.alan>label,.et-ust{display:block; font-size:12.5px; font-weight:700; color:var(--navy); margin-bottom:4px}
.alan .ipucu{font-size:12px; color:var(--muted); margin-top:3px}
input[type=text],input[type=password],input[type=number],input[type=date],input[type=file],select,textarea{
  width:100%; border:1px solid var(--line); border-radius:var(--r-sm); padding:9px 11px;
  background:#fff; font-size:14px;
}
input:disabled,select:disabled,textarea:disabled{background:#F7F7FB; color:var(--muted)}
textarea{resize:vertical; min-height:70px; line-height:1.5}
.izgara{display:grid; gap:12px; grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}
.izgara-2{display:grid; gap:12px; grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
fieldset{border:1px solid var(--line); border-radius:var(--r); padding:13px; margin:0 0 13px}
legend{font-size:12.5px; font-weight:800; color:var(--navy); padding:0 6px}
.onay{display:flex; gap:8px; align-items:flex-start; font-size:13.5px; font-weight:600; cursor:pointer}
.onay input{margin-top:3px; width:16px; height:16px; flex:none}

/* ---------- Tablo ---------- */
.tablo-sar{overflow-x:auto; -webkit-overflow-scrolling:touch; border:1px solid var(--line); border-radius:var(--r); background:#fff}
table{border-collapse:collapse; width:100%; font-size:13.5px}
th,td{padding:9px 11px; text-align:left; border-bottom:1px solid var(--line-2); vertical-align:top}
th{background:#FAFAFD; font-size:11.5px; text-transform:uppercase; letter-spacing:.4px; color:var(--muted); font-weight:800; white-space:nowrap; position:sticky; top:0; z-index:1}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover{background:#FCFCFE}
td.sayi,th.sayi{text-align:right; font-variant-numeric:tabular-nums; white-space:nowrap}
.tablo-bos{padding:26px; text-align:center; color:var(--muted); font-size:13.5px}

/* ---------- Etiket / durum ---------- */
.rz{display:inline-flex; align-items:center; gap:5px; font-size:11.5px; font-weight:700; padding:2px 9px; border-radius:20px; border:1px solid transparent; white-space:nowrap}
.rz-gri{background:var(--line-2); color:var(--muted)}
.rz-lacivert{background:var(--navy-50); color:var(--navy)}
.rz-yesil{background:var(--green-tint); color:var(--green)}
.rz-turuncu{background:var(--amber-tint); color:var(--amber)}
.rz-kirmizi{background:var(--red-tint); color:var(--red-700)}
.rz-mavi{background:var(--blue-tint); color:var(--blue)}
.nokta{width:8px; height:8px; border-radius:50%; display:inline-block; flex:none}

/* ---------- Bilgi kutuları ---------- */
.bilgi{border-radius:var(--r-sm); padding:11px 13px; font-size:13px; margin:0 0 13px; border:1px solid; line-height:1.5}
.bilgi b{font-weight:800}
.bilgi-mavi{background:var(--blue-tint); border-color:#C7DAF3; color:#1a3f6e}
.bilgi-sari{background:var(--amber-tint); border-color:#F0D9AE; color:#6d3d05}
.bilgi-kirmizi{background:var(--red-tint); border-color:#F3C9CB; color:#8c1016}
.bilgi-yesil{background:var(--green-tint); border-color:#BEE3CE; color:#0d5133}
.bilgi-gri{background:#F7F8FC; border-color:var(--line); color:var(--muted)}

/* ---------- Açılır bölüm ---------- */
.acilir{border:1px solid var(--line); border-radius:var(--r); background:#fff; margin-bottom:11px; overflow:hidden; box-shadow:var(--sh)}
.acilir>summary{
  list-style:none; cursor:pointer; padding:13px 15px; display:flex; gap:11px; align-items:center;
  font-weight:700; background:#fff; user-select:none;
}
.acilir>summary::-webkit-details-marker{display:none}
.acilir>summary:hover{background:#FAFAFD}
.acilir>summary .ok{margin-left:auto; color:var(--faint); font-size:12px; transition:transform .15s}
.acilir[open]>summary .ok{transform:rotate(90deg)}
.acilir[open]>summary{border-bottom:1px solid var(--line); background:#FAFAFD}
@media(max-width:640px){
  .acilir>summary{flex-wrap:wrap; gap:7px}
  .acilir>summary>span:first-child{flex:1 1 100%}
  .acilir>summary .ok{margin-left:0}
}
.acilir-govde{padding:14px 15px}

/* ---------- Puan düğmeleri ---------- */
.puanlar{display:flex; gap:5px; flex-wrap:wrap}
.puan-d{
  border:1px solid var(--line); background:#fff; border-radius:8px; min-width:42px; padding:7px 5px;
  font-size:13px; font-weight:800; cursor:pointer; color:var(--muted); text-align:center;
}
.puan-d:hover{border-color:var(--navy); color:var(--navy)}
.puan-d.secili{background:var(--navy); color:#fff; border-color:var(--navy)}
.puan-d.d-secili{background:var(--muted); color:#fff; border-color:var(--muted)}
.puan-d:disabled{opacity:.5; cursor:not-allowed}
@media(max-width:640px){
  .puanlar{gap:3px}
  .puan-d{min-width:0; flex:1 1 auto; padding:8px 2px; font-size:12px}
}

/* ---------- İlerleme ---------- */
.cubuk{height:8px; background:var(--line-2); border-radius:20px; overflow:hidden}
.cubuk i{display:block; height:100%; background:var(--navy); border-radius:20px}
.cubuk i.yesil{background:var(--green)} .cubuk i.turuncu{background:var(--amber)} .cubuk i.kirmizi{background:var(--red)}
.adimlar{display:flex; gap:4px; flex-wrap:wrap; margin-bottom:14px}
.adim{
  flex:1 1 90px; border:1px solid var(--line); background:#fff; border-radius:8px; padding:7px 9px;
  font-size:11.5px; font-weight:700; color:var(--muted); text-align:center; line-height:1.3;
}
.adim.gecti{background:var(--green-tint); border-color:#BEE3CE; color:var(--green)}
.adim.simdi{background:var(--navy); border-color:var(--navy); color:#fff}

/* ---------- Kip (modal) ---------- */
.kip-ort{position:fixed; inset:0; background:rgba(20,20,44,.55); z-index:200; display:flex; align-items:center; justify-content:center; padding:16px; overflow-y:auto}
.kip{background:#fff; border-radius:14px; box-shadow:var(--sh-lg); width:100%; max-width:640px; max-height:92vh; display:flex; flex-direction:column; margin:auto}
.kip.genis{max-width:940px}
.kip-bas{padding:14px 17px; border-bottom:1px solid var(--line); display:flex; align-items:center; gap:10px}
.kip-bas h3{font-size:16px; flex:1}
.kip-govde{padding:16px 17px; overflow-y:auto; -webkit-overflow-scrolling:touch}
.kip-ayak{padding:12px 17px; border-top:1px solid var(--line); display:flex; gap:9px; justify-content:flex-end; flex-wrap:wrap; background:#FAFAFD; border-radius:0 0 14px 14px}
@media(max-width:600px){
  .kip-ort{padding:0; align-items:flex-end}
  .kip{max-width:none; border-radius:14px 14px 0 0; max-height:94vh}
  .kip-ayak{border-radius:0}
  .kip-ayak .d{flex:1 1 auto}
}

/* ---------- Bildirim ---------- */
#bildirimKutu{position:fixed; left:50%; bottom:22px; transform:translateX(-50%); z-index:300; display:flex; flex-direction:column; gap:8px; align-items:center; pointer-events:none}
.tost{background:var(--navy-900); color:#fff; padding:10px 16px; border-radius:20px; font-size:13.5px; font-weight:600; box-shadow:var(--sh-lg); max-width:88vw}
.tost.hata{background:var(--red-700)}
.tost.iyi{background:var(--green)}

/* ---------- Giriş ---------- */
.giris-ort{min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px; background:linear-gradient(160deg,#2A2A5E 0%,#191937 100%)}
.giris{background:#fff; border-radius:16px; box-shadow:0 22px 60px rgba(0,0,0,.32); width:100%; max-width:440px; padding:26px}
.giris img.logo{height:44px; display:block; margin:0 auto 16px}
.giris h2{font-size:18px; text-align:center}
.giris .alt{text-align:center; color:var(--muted); font-size:13px; margin:6px 0 18px}
.sekme-satir{display:flex; gap:6px; background:var(--navy-50); padding:4px; border-radius:10px; margin-bottom:16px}
.sekme-satir button{flex:1; border:0; background:transparent; padding:8px 6px; border-radius:7px; font-size:12.5px; font-weight:700; color:var(--muted); cursor:pointer}
.sekme-satir button.etkin{background:#fff; color:var(--navy); box-shadow:var(--sh)}

/* ---------- Sekmeler ---------- */
.sekmeler{display:flex; gap:4px; border-bottom:1px solid var(--line); margin-bottom:16px; overflow-x:auto; -webkit-overflow-scrolling:touch}
.sekmeler button{
  border:0; background:transparent; padding:9px 13px; font-size:13.5px; font-weight:700;
  color:var(--muted); cursor:pointer; border-bottom:3px solid transparent; white-space:nowrap;
}
.sekmeler button.etkin{color:var(--navy); border-bottom-color:var(--red)}

/* ---------- Liste öğesi ---------- */
.liste-oge{display:flex; gap:12px; align-items:center; padding:11px 0; border-bottom:1px solid var(--line-2)}
.liste-oge:last-child{border-bottom:0}
.avatar{width:38px; height:38px; border-radius:10px; background:var(--navy-50); color:var(--navy); display:flex; align-items:center; justify-content:center; font-weight:800; font-size:13px; flex:none}

/* ---------- Yazdırma ---------- */
.rapor{background:#fff; padding:22px; border:1px solid var(--line); border-radius:var(--r)}
.rapor h2{font-size:19px; margin-bottom:3px}
.rapor .rapor-ust{display:flex; gap:12px; align-items:center; border-bottom:2px solid var(--navy); padding-bottom:11px; margin-bottom:16px}
.rapor .rapor-ust img{height:34px}
.rapor h4{font-size:13px; text-transform:uppercase; letter-spacing:.6px; color:var(--red); margin:18px 0 7px}
.rapor .kv{display:grid; grid-template-columns:200px 1fr; gap:5px 12px; font-size:13px}
.rapor .kv b{color:var(--navy)}
@media print{
  .ust,.yan,.perde,#bildirimKutu,.yazdirma-gizle,.af-geri{display:none !important}
  body{background:#fff; font-size:11.5pt}
  .icerik{padding:0}
  .kart,.rapor{box-shadow:none; border:0; page-break-inside:avoid}
  .tablo-sar{border:1px solid #ccc}
  th{position:static}
  a{text-decoration:none; color:#000}
}
</style>
</head>
<body>
<div id="uygulama"></div>
<div id="kipKatman"></div>
<div id="bildirimKutu" aria-live="polite"></div>
<script>
/* =========================================================
   1. TEMEL YARDIMCILAR
   ========================================================= */
'use strict';

const $  = (s, k) => (k || document).querySelector(s);
const $$ = (s, k) => Array.from((k || document).querySelectorAll(s));

/** HTML kaçışı — kullanıcı metni her yerde bu süzgeçten geçer. */
function esc(s){
  return String(s == null ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
const uid = (on) => (on || 'k') + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const bugun = () => new Date().toISOString().slice(0, 10);
const simdi = () => new Date().toISOString();

/** Türkçe küçük harfe indirger, boşlukları sadeleştirir (ad eşleştirme için). */
const sade = (x) => (x || '').toLocaleLowerCase('tr-TR').replace(/\s+/g, ' ').trim();

function tarihTR(g){
  if (!g) return '—';
  const d = new Date(g);
  if (isNaN(d)) return String(g);
  return d.toLocaleDateString('tr-TR', { day:'2-digit', month:'2-digit', year:'numeric' });
}
function tarihSaatTR(g){
  if (!g) return '—';
  const d = new Date(g);
  if (isNaN(d)) return String(g);
  return d.toLocaleString('tr-TR', { day:'2-digit', month:'2-digit', year:'numeric', hour:'2-digit', minute:'2-digit' });
}
const para = (n) => (Number(n) || 0).toLocaleString('tr-TR', { minimumFractionDigits:2, maximumFractionDigits:2 }) + ' TL';
const yuzde = (n, b) => (Number(n) || 0).toLocaleString('tr-TR', { minimumFractionDigits: b == null ? 1 : b, maximumFractionDigits: b == null ? 1 : b }) + '%';
const say2  = (n) => (n == null || isNaN(n)) ? '—' : Number(n).toLocaleString('tr-TR', { minimumFractionDigits:2, maximumFractionDigits:2 });
const gunFark = (a, b) => Math.round((new Date(b || bugun()) - new Date(a)) / 86400000);
function gunEkle(g, n){
  const d = new Date(g || bugun());
  d.setDate(d.getDate() + n);
  return d.toISOString().slice(0, 10);
}
const bas = (a) => (a || '?').trim().split(/\s+/).slice(0, 2).map(w => w[0]).join('').toLocaleUpperCase('tr-TR');

/** SHA-256 özeti — şifreler yalnızca özet olarak saklanır, hiçbir yerde açık durmaz. */
async function ozet(tuz, metin){
  const veri = new TextEncoder().encode(String(tuz) + '|' + String(metin));
  if (crypto && crypto.subtle && crypto.subtle.digest){
    const b = await crypto.subtle.digest('SHA-256', veri);
    return Array.from(new Uint8Array(b)).map(x => x.toString(16).padStart(2, '0')).join('');
  }
  // Güvenli bağlam yoksa (file:// bazı tarayıcılarda) basit yedek özet
  let h = 0x811c9dc5;
  for (const b of veri){ h ^= b; h = Math.imul(h, 0x01000193) >>> 0; }
  return 'yedek' + h.toString(16);
}
const yeniTuz = () => Array.from(crypto.getRandomValues(new Uint8Array(12))).map(x => x.toString(16).padStart(2,'0')).join('');

function rastgeleSifre(n){
  const abc = 'ABCDEFGHJKLMNPRSTUVYZ23456789';
  const r = crypto.getRandomValues(new Uint8Array(n || 6));
  return Array.from(r).map(x => abc[x % abc.length]).join('');
}

/* =========================================================
   4. HESAPLAMA ÇEKİRDEĞİ
   Buradaki fonksiyonlar saf matematiktir; yapay zekâ yardımcısı
   dahil hiçbir bölüm bu sonuçları kendiliğinden değiştiremez.
   ========================================================= */

/**
 * Bölüm puanı = Σ(puan × ağırlık) / Σ(ağırlık)
 * Yalnızca gerçekten puanlanan kriterler paydaya girer; boş ve "D" hariç tutulur.
 * @param {Array} kalemler [{puan:Number|null, agirlik:Number}]
 */
function bolumPuani(kalemler){
  let toplamAgirlik = 0, toplamPuan = 0, sayi = 0;
  kalemler.forEach(k => {
    if (k.puan == null || isNaN(k.puan)) return;         // boş veya "D"
    const a = Number(k.agirlik) || 0;
    if (a <= 0) return;
    toplamAgirlik += a;
    toplamPuan += Number(k.puan) * a;
    sayi++;
  });
  if (toplamAgirlik <= 0) return { puan:null, agirlik:0, sayi:0 };
  return { puan: toplamPuan / toplamAgirlik, agirlik: toplamAgirlik, sayi };
}

/**
 * Genel performans puanı = Σ(bölüm puanı × bölüm ağırlığı) / Σ(kullanılan bölüm ağırlıkları)
 * Hiç puanlanmamış bölüm paydaya girmez; kalan bölümler kendi aralarında oranlanır.
 * @param {Object} bolumPuanlari { disiplin:Number|null, ... }
 * @param {Object} agirliklar    { disiplin:20, ... }
 */
function genelPuan(bolumPuanlari, agirliklar){
  let ta = 0, tp = 0;
  BOLUMLER.forEach(b => {
    const p = bolumPuanlari[b.kod];
    if (p == null || isNaN(p)) return;
    const a = Number(agirliklar[b.kod]) || 0;
    if (a <= 0) return;
    ta += a; tp += p * a;
  });
  if (ta <= 0) return null;
  return Math.round((tp / ta) * 100) / 100;      // iki ondalık
}

/**
 * Prim katsayısı. Aralıklar çakışmaz: puan >= alt sınır kuralıyla
 * yukarıdan aşağı ilk eşleşen aralık geçerlidir.
 */
function katsayiBul(puan, tablo){
  if (puan == null || isNaN(puan)) return null;
  const t = (tablo || KATSAYI_TOHUM).slice().sort((a, b) => b.alt - a.alt);
  for (const s of t){ if (puan >= s.alt) return s; }
  return t[t.length - 1] || null;
}

/** Katsayı tablosunda çakışma/boşluk denetimi — Ayarlar ekranı uyarır. */
function katsayiTablosuDenetle(tablo){
  const t = tablo.slice().sort((a, b) => a.alt - b.alt);
  const sorunlar = [];
  for (let i = 0; i < t.length; i++){
    if (t[i].ust < t[i].alt) sorunlar.push((i + 1) + '. aralıkta üst sınır alt sınırdan küçük.');
    if (i > 0){
      const oncekiUst = t[i - 1].ust, buAlt = t[i].alt;
      const fark = Math.round((buAlt - oncekiUst) * 100) / 100;
      if (buAlt <= oncekiUst) sorunlar.push('“' + say2(t[i - 1].alt) + '–' + say2(oncekiUst) + '” ile “' + say2(buAlt) + '–' + say2(t[i].ust) + '” aralıkları çakışıyor.');
      else if (fark > 0.011) sorunlar.push('“' + say2(oncekiUst) + '” ile “' + say2(buAlt) + '” arasında puan boşluğu var.');
    }
  }
  if (!t.some(x => x.alt <= 0.001)) sorunlar.push('En düşük aralık 0,00 puandan başlamalı.');
  if (!t.some(x => x.ust >= 3.999)) sorunlar.push('En yüksek aralık 4,00 puana kadar çıkmalı.');
  return sorunlar;
}

/** Prim = baz tutar × hedef gerçekleşme oranı × performans katsayısı */
function primHesapla(baz, hedefOrani, katsayi){
  const b = Number(baz) || 0;
  const h = (Number(hedefOrani) || 0) / 100;
  const k = Number(katsayi) || 0;
  return Math.round(b * h * k * 100) / 100;
}

/** Toplam zam oranı = genel zam + (performans bütçesi × katsayı) */
function zamHesapla(genelZam, performansButcesi, katsayi){
  const g = Number(genelZam) || 0;
  const p = Number(performansButcesi) || 0;
  const k = Number(katsayi) || 0;
  return Math.round((g + p * k) * 100) / 100;
}
function yeniUcret(mevcut, toplamZamOrani){
  return Math.round((Number(mevcut) || 0) * (1 + (Number(toplamZamOrani) || 0) / 100) * 100) / 100;
}

/** Görev bileşen puanı → 1–4 (zamanında %40 · doğruluk %40 · kayıt %20) */
function gorevPuani(zaman, dogruluk, kayit, ag){
  const a = ag || GOREV_AGIRLIK;
  const t = (Number(a.zaman) || 0) + (Number(a.dogruluk) || 0) + (Number(a.kayit) || 0);
  if (!t) return null;
  const s = (Number(zaman) || 0) * a.zaman + (Number(dogruluk) || 0) * a.dogruluk + (Number(kayit) || 0) * a.kayit;
  return Math.round((s / t) * 100) / 100;
}

  return DB.competencyCriteria
    .filter(k => k.phId === p && k.aktif !== false)
    .filter(k => k.bolum === 'yetkinlik' ? k.roleId === roleId : (!k.roleId || k.roleId === roleId))
    .sort((a, b) => (BOLUMLER.findIndex(x => x.kod === a.bolum) - BOLUMLER.findIndex(x => x.kod === b.bolum)) || (a.sira - b.sira));
}

/** Bir bölümdeki kriter ağırlıkları toplamı — %100 olmalı. */
function bolumAgirlikToplami(phId, roleId, bolum){
  return kriterler(phId, roleId).filter(k => k.bolum === bolum)
    .reduce((t, k) => t + (Number(k.agirlik) || 0), 0);
}

/* ---------- Görev sonuçlarının kategori özeti ---------- */
/**
 * Bir çalışanın bir dönemdeki, bir kategorideki görev gerçekleşme puanı (1–4).
 * 72 görev tek tek puanlanmaz; kategori ortalaması performans formuna aktarılır.
 */
function gorevKatPuani(donemId, employeeId, katId, phId){
  const ag = ayar(phId).gorevAgirlik || GOREV_AGIRLIK;
  const gorevler = DB.tasks.filter(g => g.katId === katId).map(g => g.id);
  const kayitlar = DB.taskCompletions.filter(c =>
    c.donemId === donemId && c.employeeId === employeeId && gorevler.indexOf(c.taskId) >= 0);
  if (!kayitlar.length) return { puan:null, adet:0 };
  let t = 0;
  kayitlar.forEach(c => { t += gorevPuani(c.zaman, c.dogruluk, c.kayit, ag); });
  return { puan: Math.round((t / kayitlar.length) * 100) / 100, adet: kayitlar.length };
}

/** Çalışanın dönemdeki görev tamamlama oranı ve gecikme sayısı (panolar için). */
function gorevOzeti(donemId, employeeId){
  const atanan = DB.taskAssignments.filter(a => a.employeeId === employeeId && a.rol === 'asil');
  const kayitlar = DB.taskCompletions.filter(c => c.donemId === donemId && c.employeeId === employeeId);
  const zamaninda = kayitlar.filter(c => Number(c.zaman) >= 3).length;
  return {
    atanan: atanan.length,
    kayit: kayitlar.length,
    zamaninda,
    gecikme: kayitlar.length - zamaninda,
    oran: kayitlar.length ? Math.round(zamaninda / kayitlar.length * 100) : null
  };
}

/* ---------- Değerlendirme özeti ---------- */
/**
 * Bir değerlendirmenin bölüm puanlarını, genel puanını, kapsam yeterliliğini
 * ve prim katsayısını hesaplar. Kapanmış dönemlerde dönemin sakladığı
 * ağırlık ve katsayı tablosu kullanılır — sonradan yapılan ayar değişikliği
 * geçmiş dönemleri etkilemez.
 */
function ozetle(ev){
  const d = donem(ev.donemId) || {};
  const a = ayar(ev.phId);
  const agirliklar = d.agirliklarSnapshot || a.bolumAgirliklari;
  const katsayiTablosu = d.katsayiSnapshot || a.katsayiTablosu;
  const kapsamEsigi = d.kapsamSnapshot != null ? d.kapsamSnapshot : (a.zorunluKapsam != null ? a.zorunluKapsam : 70);

  const kalemler = DB.evaluationItems.filter(i => i.evalId === ev.id);
  const bolumler = {}, detay = {};
  BOLUMLER.forEach(b => {
    const bk = kalemler.filter(i => i.bolum === b.kod).map(i => ({
      puan: puanDegeri(i.yonPuan), agirlik: i.agirlik, kalem: i
    }));
    const r = bolumPuani(bk);
    bolumler[b.kod] = r.puan;
    detay[b.kod] = { puan: r.puan, sayi: r.sayi, toplam: bk.length, agirlik: r.agirlik, agirlikTanimli: bk.reduce((t, x) => t + x.agirlik, 0) };
  });

  const genel = genelPuan(bolumler, agirliklar);

  // Öz değerlendirme genel puanı (karşılaştırma için)
  const ozBolum = {};
  BOLUMLER.forEach(b => {
    const bk = kalemler.filter(i => i.bolum === b.kod).map(i => ({ puan: puanDegeri(i.ozPuan), agirlik: i.agirlik }));
    ozBolum[b.kod] = bolumPuani(bk).puan;
  });
  const ozGenel = genelPuan(ozBolum, agirliklar);

  // Zorunlu kriter kapsamı
  const zorunlular = kalemler.filter(i => i.zorunlu !== false);
  const zorunluDeger = zorunlular.filter(i => puanDegeri(i.yonPuan) != null);
  const oran = zorunlular.length ? Math.round(zorunluDeger.length / zorunlular.length * 1000) / 10 : 0;
  const yeterli = zorunlular.length === 0 ? false : oran >= kapsamEsigi;

  const katsayiSatir = yeterli ? katsayiBul(genel, katsayiTablosu) : null;

  return {
    bolumler, detay, genel, ozGenel, agirliklar, katsayiTablosu, kapsamEsigi,
    kapsam: { zorunlu: zorunlular.length, degerlendirilen: zorunluDeger.length, oran, yeterli },
    katsayi: katsayiSatir ? katsayiSatir.katsayi : null,
    katsayiSatir,
    kalemSayisi: kalemler.length,
    puanlanan: kalemler.filter(i => puanDegeri(i.yonPuan) != null).length
  };
}

/** "D" ve boş → null; sayısal kodlar → sayı. */
function puanDegeri(kod){
  if (kod == null || kod === '' || kod === 'D') return null;
  const n = Number(kod);
  return isNaN(n) ? null : n;
}

/** Çalışanın önceki (kapanmış) döneme ait genel puanı. */
function oncekiGenel(employeeId, donemId){
  const d = donem(donemId);
  if (!d) return null;
  const oncekiler = ait('evaluationPeriods', d.phId)
    .filter(x => x.bitis < d.baslangic)
    .sort((a, b) => b.bitis.localeCompare(a.bitis));
  for (const o of oncekiler){
    const ev = DB.evaluations.find(e => e.donemId === o.id && e.employeeId === employeeId && !e.iptal);
    if (ev){ const z = ozetle(ev); if (z.genel != null) return { puan: z.genel, donem: o }; }
  }
  return null;
}

/** Dönemde bu çalışana ait, primi incelemeye düşüren kritik olay var mı? */
function kritikEngel(donemId, employeeId){
  return DB.criticalIncidents.filter(o =>
    o.donemId === donemId && o.employeeId === employeeId && o.primEtkisi !== false && o.yoneticiKarari !== 'Etkisiz');
}

/** Yeni eczane: pozisyonlar, kriterler, görev bankası ve ayarlar birlikte kurulur. */
function eczaneKur(ad, sehir, eczaciAd, kod){
  const ph = {
    id: uid('ph'), kod: kod || ('ECZ-' + rastgeleSifre(4)),
    ad: ad.trim(), sehir: (sehir || '').trim(), eczaci: (eczaciAd || '').trim(),
    olusturma: simdi(), aktif: true
  };
  DB.pharmacies.push(ph);

  // Pozisyonlar
  const rolMap = {};
  ROL_TOHUM.forEach((r, i) => {
    const rol = { id: uid('rol'), phId: ph.id, kod: r.kod, ad: r.ad, aciklama: r.aciklama, sistem: true, sira: i, aktif: true };
    DB.employeeRoles.push(rol);
    rolMap[r.kod] = rol.id;
  });

  // Görev kategorileri
  const katMap = {};
  KATEGORI_TOHUM.forEach((k, i) => {
    const kat = { id: uid('kat'), phId: ph.id, no: i + 1, ad: k, aktif: true };
    DB.taskCategories.push(kat);
    katMap[i + 1] = kat.id;
  });

  // Görev bankası — 72 görev
  GOREV_TOHUM.forEach(g => {
    DB.tasks.push({
      id: uid('gor'), phId: ph.id, no: g[0], katId: katMap[g[1]], aciklama: g[2], siklik: g[3],
      kritik: !!g[4], asilId:null, yedekId:null, kontrolId:null,
      standart: g[4] ? 'Hatasız ve mevzuata uygun; sapma aynı gün bildirilir.' : 'Tanımlı sıklıkta, eksiksiz ve kayıtlı olarak tamamlanır.',
      kanitTuru: g[4] ? 'Sistem kaydı' : 'Kontrol listesi',
      aktif: true
    });
  });

  // Kriterler
  let sira = 0;
  KRITER_TOHUM.disiplin.forEach(k => DB.competencyCriteria.push(kriterYap(ph.id, null, 'disiplin', k, sira++)));
  ROL_TOHUM.forEach(r => {
    (KRITER_TOHUM[r.kod] || []).forEach(k => DB.competencyCriteria.push(kriterYap(ph.id, rolMap[r.kod], 'yetkinlik', k, sira++)));
  });
  KATEGORI_TOHUM.forEach((k, i) => {
    const kk = kriterYap(ph.id, null, 'gorev', [k, 'Bu kategorideki görevler tanımlı sıklıkta, doğru ve kayıtlı biçimde tamamlanır.', GOREV_KRITER_AGIRLIK[i], 0, 1], sira++);
    kk.katId = katMap[i + 1];
    kk.otomatik = true;                 // puanı görev kayıtlarından üretilir
    DB.competencyCriteria.push(kk);
  });
  KRITER_TOHUM.hedef.forEach(k => DB.competencyCriteria.push(kriterYap(ph.id, null, 'hedef', k, sira++)));

  DB.compensationSettings.push(varsayilanAyar(ph.id));
  return ph;
}
function kriterYap(phId, roleId, bolum, k, sira){
  return {
    id: uid('kri'), phId, roleId, bolum,
    ad: k[0], beklenen: k[1], agirlik: k[2],
    kritik: !!k[3], zorunlu: k[4] !== 0,
    otomatik: false, katId: null, sira, aktif: true
  };
}

/** Çalışan ekler ve görev atamalarını üretir. */
function calisanEkle(phId, ad, roleId, ek){
  const e = Object.assign({

/**
 * Yetki kontrolü tek noktadan yapılır; her ekran ve her kayıt işlemi
 * buradan geçer. Ücret ve prim ayrı bir yetkiye bağlıdır.
 */
function yetki(ne){
  if (!OTURUM) return false;
  const r = OTURUM.rol;
  switch (ne){
    case 'eczaneYonet':     return r === 'superadmin';
    case 'tumEczaneler':    return r === 'superadmin';
    case 'ayarYonet':       return r === 'superadmin' || r === 'sahip';
    case 'kriterYonet':     return r === 'superadmin' || r === 'sahip';
    case 'calisanYonet':    return r === 'superadmin' || r === 'sahip';
    case 'kullaniciYonet':  return r === 'superadmin' || r === 'sahip';
    case 'gorevYonet':      return r === 'superadmin' || r === 'sahip';
    case 'gorevKayit':      return r === 'superadmin' || r === 'sahip' || r === 'degerlendirici';
    case 'donemYonet':      return r === 'superadmin' || r === 'sahip';
    case 'degerlendir':     return r === 'superadmin' || r === 'sahip' || r === 'degerlendirici';
    case 'onayla':          return r === 'superadmin' || r === 'sahip';
    case 'olayYonet':       return r === 'superadmin' || r === 'sahip' || r === 'degerlendirici';
    case 'olayKarar':       return r === 'superadmin' || r === 'sahip';
    case 'ucretGor':        return !!OTURUM.ucretYetkisi;
    case 'ucretOnayla':     return (r === 'superadmin' || r === 'sahip') && !!OTURUM.ucretYetkisi;
    case 'ucretIsle':       return (r === 'superadmin' || r === 'sahip' || r === 'ik') && !!OTURUM.ucretYetkisi;
    case 'raporGor':        return r !== 'calisan';
    case 'gecmisGor':       return r === 'superadmin' || r === 'sahip';
    case 'puanDegistir':    return r === 'superadmin' || r === 'sahip' || r === 'degerlendirici';
    default: return false;
  }
}

/** Oturumdaki kullanıcının erişebileceği çalışanlar. */
function gorulebilirCalisanlar(){
  const hepsi = ait('employees').filter(e => e.aktif !== false);
  if (!OTURUM) return [];
  if (OTURUM.rol === 'calisan') return hepsi.filter(e => e.id === OTURUM.calisanId);
  if (OTURUM.rol === 'degerlendirici'){
    const u = kullanici(OTURUM.userId) || {};
    const izin = u.degerlendirebilir || [];
    return hepsi.filter(e => izin.indexOf(e.id) >= 0);
  }
  return hepsi;
}
const calisanGorulebilir = (id) => gorulebilirCalisanlar().some(e => e.id === id);

/** Dönem kapalıysa veya değerlendirme kilitliyse yazma engellenir. */
function kilitli(ev){
  if (!ev) return true;
  if (ev.kilitli) return true;
  const d = donem(ev.donemId);
  return !!(d && d.durum === 'kapali');
}
function kilitUyar(ev){
  if (!kilitli(ev)) return false;
  tost('Bu dönem kapatıldı — kayıt değiştirilemez. Düzeltme için yeni revizyon oluşturun.', 'hata');

}

/* Eczane kaydındaki erişim ayarını okur. Süper yönetici ve danışman
   tarafındaki roller merkezî kısıttan etkilenmez. */
function merkezYetkisi(u){
  if (!window.ArtifarmaYetki) return 'tam';
  if (u.rol === 'superadmin') return 'tam';
  const ph = DB.pharmacies.find(x => x.id === u.phId);
  const kod = ph && (ph.kod || ph.merkezId || ph.id);
  if (!kod) return 'tam';
  const rol = (u.rol === 'sahip' || u.rol === 'ik') ? 'eczaci' : 'personel';
  return ArtifarmaYetki.izin(kod, 'performans', rol);
}

async function girisDene(kadi, sifre){
  const u = DB.users.find(x => x.kadi === String(kadi).trim().toLowerCase() && x.aktif !== false);
  if (!u) return null;
  if (!(await sifreDogrula(u, sifre))) return null;
  u.sonGiris = simdi();
  OTURUM = {
    userId: u.id, phId: u.phId, rol: u.rol,
    ucretYetkisi: !!u.ucretYetkisi, calisanId: u.calisanId,
    seciliEczane: u.rol === 'superadmin' ? (DB.pharmacies[0] ? DB.pharmacies[0].id : null) : u.phId
  };
  /* Merkezî yetki: eczane kaydında bu araç için tanımlanan erişim.
     'yok' → giriş reddedilir, 'rapor' → personel yalnızca raporları görür. */
  OTURUM.merkezYetki = merkezYetkisi(u);
  if (OTURUM.merkezYetki === 'yok'){
    OTURUM = null;
    return { engel: window.ArtifarmaYetki
      ? ArtifarmaYetki.mesaj(u.rol === 'sahip' ? 'eczaci' : 'personel')
      : 'Bu araca erişim yetkiniz yok.' };
  }
  try{ sessionStorage.setItem(OTURUM_ANAHTAR, JSON.stringify(OTURUM)); }catch(e){}
  iz('Users', u.id, 'giris', 'sonGiris', '', simdi(), u.phId);
  await yaz(true);
  /* Kayıt merkezinde bu arada tanımlanan eczane ve çalışanları da alır. */
  await merkezdenEsitle();
  return u;
}
function oturumKapat(){
  OTURUM = null;
  try{ sessionStorage.removeItem(OTURUM_ANAHTAR); }catch(e){}
  SAYFA = 'panel';
  ciz();
}
function oturumGeriYukle(){
  try{
    const s = sessionStorage.getItem(OTURUM_ANAHTAR);
    if (!s) return;
    const o = JSON.parse(s);
    const u = kullanici(o.userId);
    if (u && u.aktif !== false) OTURUM = o;
  }catch(e){}
}

    onaylayanId: null, onayTarihi: null, olusturma: simdi()

/** Önceki dönem puanları — kriter adına göre eşleştirilir. */
function oncekiDonemKalemleri(employeeId, donemId){
  const o = oncekiGenel(employeeId, donemId);
  const harita = {};
  if (!o) return harita;
  const ev = DB.evaluations.find(e => e.donemId === o.donem.id && e.employeeId === employeeId && !e.iptal);
  if (!ev) return harita;
  DB.evaluationItems.filter(i => i.evalId === ev.id).forEach(i => {
    const v = puanDegeri(i.yonPuan);
    if (v != null) harita[i.ad] = v;

  return harita;
}

      const t = hedefPuan[c.id] + (((ix + ci) % 5) - 2) * 0.25;
      i.yonPuan = String(enYakinOlcek(t));
      i.ozPuan  = String(enYakinOlcek(t + (ix % 3 === 0 ? 0.5 : 0)));

    });

  });

  // Gelişim planları
  const plan1 = gelisimPlaniEkle(ph.id, c4.id, d1.id, {
    alan:'Günlük kontrol listelerini takip etme', mevcutPuan:2, hedefPuan:3,
    beklenenDavranis:'Gün sonunda kontrol listesindeki tüm maddeleri işaretlemiş olur.',
    aksiyon:'Her akşam kapanıştan 30 dk önce listeyi birlikte gözden geçirme.',
    egitim:'Eczane içi uygulamalı eğitim', destekId:c3.id,
    baslangic:'2026-08-01', hedefTarih:'2026-10-30'
  });
  const plan2 = gelisimPlaniEkle(ph.id, c2.id, d1.id, {
    alan:'Satış sonrası danışan takibi', mevcutPuan:2.5, hedefPuan:3.5,
    beklenenDavranis:'Ürün satışından 14 gün sonra danışanı arar ve sonucu kaydeder.',
    aksiyon:'Haftalık takip listesi oluşturma ve arama kaydı tutma.',
    egitim:'Danışan iletişimi eğitimi', destekId:c1.id,
    baslangic:'2026-07-15', hedefTarih:'2026-08-10'
  });
  plan2.durum = 'Risk altında';

  await yaz(true);
  return kimlikler;

/** Verilen sayıyı ölçekteki en yakın geçerli puana yuvarlar. */
function enYakinOlcek(x){
  const gecerli = [1, 1.5, 2, 2.5, 3, 3.5, 4];
  let en = gecerli[0], fark = Infinity;
  gecerli.forEach(g => { const f = Math.abs(g - x); if (f < fark){ fark = f; en = g; } });
  return en;
}

/** Gelişim planı + 30/60/90 gün kontrol noktaları. */

    kanit:'', durum:'Başlamadı', sonuc:'', sonrakiKarar:'', olusturma: simdi()
  }, v || {});
  DB.developmentPlans.push(p);

function gorevAta(g, asilId, yedekId, kontrolId, sessiz){

let _kipYigin = [];

/** Uygulama içi kip pencere. Tarayıcının alert/prompt/confirm penceresi
    kullanılmaz — hem tasarım hem de otomatik testler için gereklidir. */
function kip(o){
  const ort = document.createElement('div');
  ort.className = 'kip-ort';
  ort.innerHTML =
    '<div class="kip' + (o.genis ? ' genis' : '') + '" role="dialog" aria-modal="true">' +
      '<div class="kip-bas"><h3>' + esc(o.baslik || '') + '</h3>' +
        '<button class="d d-sade" data-kapat aria-label="Kapat">✕</button></div>' +
      '<div class="kip-govde">' + (o.govde || '') + '</div>' +
      (o.ayak === null ? '' : '<div class="kip-ayak">' + (o.ayak || '<button class="d d-cizgi" data-kapat>Kapat</button>') + '</div>') +
    '</div>';
  $('#kipKatman').appendChild(ort);
  _kipYigin.push(ort);
  $$('[data-kapat]', ort).forEach(b => b.onclick = () => kipKapat());
  ort.addEventListener('mousedown', e => { if (e.target === ort) kipKapat(); });
  const ilk = ort.querySelector('input,select,textarea,button:not([data-kapat])');
  if (ilk) setTimeout(() => ilk.focus(), 60);
  return ort;
}
function kipKapat(){
  const k = _kipYigin.pop();
  if (k) k.remove();
}
document.addEventListener('keydown', e => { if (e.key === 'Escape' && _kipYigin.length) kipKapat(); });

/** Onay penceresi — söz verilen işlem yalnızca "Evet" ile çalışır. */
function onayIste(baslik, metin, tamamAd, islev, tehlike){
  const k = kip({
    baslik,
    govde: '<p>' + metin + '</p>',
    ayak: '<button class="d d-cizgi" data-kapat>Vazgeç</button>' +
          '<button class="d ' + (tehlike ? 'd-kirmizi' : 'd-ana') + '" data-tamam>' + esc(tamamAd || 'Onayla') + '</button>'
  });
  $('[data-tamam]', k).onclick = () => { kipKapat(); islev(); };
}

function metinKip(baslik, deger, ipucu, kaydet){

function panoyaYaz(metin, dugme, etiket){
  const bitir = (ok) => { if (!dugme) return; dugme.textContent = ok ? 'Kopyalandı ✓' : 'Kopyalanamadı'; setTimeout(() => dugme.textContent = etiket, 1600); };
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(metin).then(() => bitir(true), () => bitir(false));
  else {
    const t = document.createElement('textarea'); t.value = metin; t.style.position = 'fixed'; t.style.left = '-9999px';
    document.body.appendChild(t); t.select();
    let ok = false; try{ ok = document.execCommand('copy'); }catch(e){}
    document.body.removeChild(t); bitir(ok);
  }
}

function dosyaIndir(ad, icerik, tur){
  const b = new Blob([icerik], { type: (tur || 'application/json') + ';charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(b); a.download = ad;
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 400);
}
/* Eczaneye bağlı tablolar — her kaydın kendi phId alanı vardır. */
const ECZ_TABLO = ['pharmacies','users','employees','employeeRoles','competencyCriteria',
  'taskCategories','tasks','taskAssignments','taskCompletions','evaluationPeriods','evaluations',
  'criticalIncidents','developmentPlans','compensationSettings','bonusCalculations',
  'salaryIncreaseCalculations','notifications','auditLogs'];

/**
 * Tek bir eczanenin bütün kayıtlarını çıkarır.
 * Eczane sahibi yedek aldığında yalnızca bu dilim dosyaya yazılır;
 * başka eczanenin çalışanı, ücreti veya değerlendirmesi dosyaya girmez.
 */
function eczaneDilimi(phId){
  const d = {};
  ECZ_TABLO.forEach(t => {
    d[t] = t === 'pharmacies' ? DB.pharmacies.filter(x => x.id === phId)
                              : DB[t].filter(x => x.phId === phId);
  });
  const evIds = d.evaluations.map(e => e.id);
  const planIds = d.developmentPlans.map(x => x.id);
  d.evaluationItems = DB.evaluationItems.filter(i => evIds.indexOf(i.evalId) >= 0);
  d.feedbackRecords = DB.feedbackRecords.filter(f => evIds.indexOf(f.evalId) >= 0);
  d.developmentCheckpoints = DB.developmentCheckpoints.filter(c => planIds.indexOf(c.planId) >= 0);
  return d;
}

/** Bir eczanenin bütün kayıtlarını veritabanından çıkarır (geri yükleme öncesi). */
function eczaneDilimiSil(phId){
  const evIds = DB.evaluations.filter(e => e.phId === phId).map(e => e.id);
  const planIds = DB.developmentPlans.filter(x => x.phId === phId).map(x => x.id);
  DB.evaluationItems = DB.evaluationItems.filter(i => evIds.indexOf(i.evalId) < 0);
  DB.feedbackRecords = DB.feedbackRecords.filter(f => evIds.indexOf(f.evalId) < 0);
  DB.developmentCheckpoints = DB.developmentCheckpoints.filter(c => planIds.indexOf(c.planId) < 0);
  ECZ_TABLO.forEach(t => {
    DB[t] = t === 'pharmacies' ? DB.pharmacies.filter(x => x.id !== phId)
                               : DB[t].filter(x => x.phId !== phId);
  });
}

function yedektenDon(){
  const sistem = OTURUM.rol === 'superadmin';
  const ph = aktifEczane();
  const k = kip({
    baslik: 'Yedekten geri dön',
    govde: '<div class="bilgi bilgi-sari"><b>Dikkat:</b> ' + (sistem
             ? 'Sistem yedeği yüklenirse bütün eczanelerin mevcut verisi silinir. '
             : 'Yalnızca <b>' + esc(ph ? ph.ad : '') + '</b> kayıtları değişir; ' +
               'diğer eczaneler etkilenmez. ') +
           'Önce bugünün yedeğini almanız önerilir.</div>' +
           (sistem ? '' : '<div class="bilgi bilgi-gri kucuk">Başka bir eczaneye ait yedek dosyası kabul edilmez.</div>') +
           '<input type="file" id="yDosya" accept="application/json,.json">',
    ayak: '<button class="d d-cizgi" data-kapat>Vazgeç</button><button class="d d-kirmizi" id="yTamam">Geri yükle</button>'
  });
  $('#yTamam', k).onclick = () => {
    const f = $('#yDosya', k).files[0];
    if (!f) return tost('Önce bir yedek dosyası seçin.', 'hata');
    const fr = new FileReader();
    fr.onload = async () => {
      let paket;
      try{ paket = JSON.parse(fr.result); }
      catch(e){ return tost('Dosya okunamadı — bu bir Artıfarma performans yedeği değil.', 'hata'); }
      const v = paket.veri || paket;
      if (!v || !v.pharmacies) return tost('Dosya okunamadı — bu bir Artıfarma performans yedeği değil.', 'hata');
      const kapsam = paket.kapsam || 'sistem';

      if (kapsam === 'sistem'){
        if (!sistem) return tost('Bu bir sistem yedeği. Yalnızca süper yönetici yükleyebilir.', 'hata');
        DB = Object.assign(bosDB(), v);
        await yaz(true); kipKapat(); oturumKapat();
        return tost('Sistem yedeği geri yüklendi. Yeniden giriş yapın.', 'iyi');
      }

      /* Eczane yedeği — hedef eczaneyi kod veya kimlikle bul. */
      const hedef = sistem
        ? (DB.pharmacies.find(x => x.id === paket.eczaneId) ||
           DB.pharmacies.find(x => paket.eczaneKod && (x.kod || '') === paket.eczaneKod))
        : ph;
      if (!hedef) return tost('Yedekteki eczane bu sistemde bulunamadı.', 'hata');
      if (!sistem){
        const ayni = (paket.eczaneId && paket.eczaneId === ph.id) ||
                     (paket.eczaneKod && ph.kod && paket.eczaneKod === ph.kod);
        if (!ayni) return tost('Bu yedek başka bir eczaneye ait — yüklenmedi.', 'hata');
      }

      /* Süper yönetici hesapları ve başka eczanelerin kayıtları dosyadan gelemez. */
      const temiz = {};
      ECZ_TABLO.forEach(t => {
        const l = Array.isArray(v[t]) ? v[t] : [];
        temiz[t] = t === 'pharmacies'
          ? l.filter(x => x.id === hedef.id || l.length === 1).map(x => Object.assign({}, x, { id: hedef.id }))
          : l.map(x => Object.assign({}, x, { phId: hedef.id }));
      });
      temiz.users = temiz.users.filter(u => u.rol !== 'superadmin');
      const evIds = temiz.evaluations.map(e => e.id);
      const planIds = temiz.developmentPlans.map(x => x.id);
      const alt = {
        evaluationItems: (v.evaluationItems || []).filter(i => evIds.indexOf(i.evalId) >= 0),
        feedbackRecords: (v.feedbackRecords || []).filter(x => evIds.indexOf(x.evalId) >= 0),
        developmentCheckpoints: (v.developmentCheckpoints || []).filter(c => planIds.indexOf(c.planId) >= 0)
      };

      eczaneDilimiSil(hedef.id);
      ECZ_TABLO.forEach(t => { DB[t] = DB[t].concat(temiz[t]); });
      Object.keys(alt).forEach(t => { DB[t] = DB[t].concat(alt[t]); });
      iz('Pharmacies', hedef.id, 'guncelle', 'yedektenDon', '', paket.tarih || '', hedef.id);
      await yaz(true); kipKapat(); oturumKapat();
      tost('Eczane yedeği geri yüklendi. Yeniden giriş yapın.', 'iyi');
    };
    fr.readAsText(f);
  };
}

/** Geciken gelişim aksiyonları — kırmızı gösterilir. */
function gecikenAksiyon(phId){
  const p = phId || aktifEczaneId();
  const b = bugun();
  return DB.developmentPlans.filter(x => x.phId === p &&
    ['Tamamlandı','Başarısız'].indexOf(x.durum) < 0 && x.hedefTarih && x.hedefTarih < b);
}
/** Hedef tarihi 15 gün içinde olanlar — turuncu gösterilir. */
function yaklasanAksiyon(phId){
  const p = phId || aktifEczaneId();
  const b = bugun(), s = gunEkle(b, 15);
  return DB.developmentPlans.filter(x => x.phId === p &&
    ['Tamamlandı','Başarısız'].indexOf(x.durum) < 0 && x.hedefTarih && x.hedefTarih >= b && x.hedefTarih <= s);
}
function planDurumRengi(p){
  if (p.durum === 'Tamamlandı') return { sinif:'rz-yesil', ad:'Tamamlandı' };
  if (p.durum === 'Başarısız')  return { sinif:'rz-gri', ad:'Başarısız' };
  if (p.hedefTarih && p.hedefTarih < bugun()) return { sinif:'rz-kirmizi', ad:'Gecikti' };
  if (p.hedefTarih && p.hedefTarih <= gunEkle(bugun(), 15)) return { sinif:'rz-turuncu', ad:'Tarihi yaklaştı' };
  if (p.durum === 'Risk altında') return { sinif:'rz-turuncu', ad:'Risk altında' };
  if (p.durum === 'Devam ediyor') return { sinif:'rz-mavi', ad:'Devam ediyor' };
  return { sinif:'rz-gri', ad: p.durum || 'Başlamadı' };
}

/** Bildirimler her çizimde yeniden türetilir; kullanıcıya göre süzülür. */
function bildirimleriTazele(){
  if (!OTURUM) return;
  const p = aktifEczaneId();
  if (!p) return;
  const yeni = [];
  const ekle = (anahtar, tur, metin, hedef, arg, kime) => {
    yeni.push({ id:'bld_' + anahtar, phId:p, anahtar, tur, metin, hedef, arg, kime, tarih: simdi() });
  };
  gecikenAksiyon(p).forEach(x => ekle('gec_' + x.id, 'gecikme',
    calisanAd(x.employeeId) + ' · “' + x.alan + '” gelişim aksiyonu ' + Math.abs(gunFark(x.hedefTarih)) + ' gün gecikti.', 'gelisim', x.id, x.employeeId));
  yaklasanAksiyon(p).forEach(x => ekle('yak_' + x.id, 'yaklasan',
    calisanAd(x.employeeId) + ' · “' + x.alan + '” için hedef tarih ' + tarihTR(x.hedefTarih) + '.', 'gelisim', x.id, x.employeeId));
  DB.developmentCheckpoints.filter(c => !c.yapildi && c.tarih <= gunEkle(bugun(), 7)).forEach(c => {
    const pl = DB.developmentPlans.find(x => x.id === c.planId);
    if (!pl || pl.phId !== p || ['Tamamlandı','Başarısız'].indexOf(pl.durum) >= 0) return;
    ekle('kn_' + c.id, 'kontrol', calisanAd(pl.employeeId) + ' · ' + c.gun + ' günlük kontrol tarihi: ' + tarihTR(c.tarih), 'gelisim', pl.id, pl.employeeId);
  });
  ait('evaluations', p).filter(e => ['taslak','oz'].indexOf(e.durum) >= 0 && !kilitli(e)).forEach(e => {
    ekle('oz_' + e.id, 'oz', calisanAd(e.employeeId) + ' · öz değerlendirme bekleniyor.', 'degerlendirmeler', e.id, e.employeeId);
  });
  ait('criticalIncidents', p).filter(o => !o.yoneticiKarari).forEach(o => {
    ekle('oly_' + o.id, 'olay', calisanAd(o.employeeId) + ' · ' + o.kod + ' kritik olayı yönetici kararı bekliyor.', 'olaylar', o.id, o.employeeId);
  });
  ait('bonusCalculations', p).filter(b => b.durum === 'inceleme').forEach(b => {
    ekle('prm_' + b.id, 'prim', calisanAd(b.employeeId) + ' · prim ödemesi yönetici incelemesinde.', 'prim', b.id, b.employeeId);
  });

  /* Yalnızca ETKİN eczanenin bildirimleri yeniden türetilir; diğer
     eczanelerin kayıtları olduğu gibi korunur (çapraz silme olmasın). */
  const eskiOkunan = {};
  DB.notifications.forEach(n => { if (n.phId === p && n.okundu) eskiOkunan[n.anahtar] = true; });
  DB.notifications = DB.notifications.filter(n => n.phId !== p)
    .concat(yeni.map(n => Object.assign(n, { okundu: !!eskiOkunan[n.anahtar] })));
}

/** Puanı renkli rozete çevirir; renkle birlikte metin de verilir (erişilebilirlik). */
function puanRozet(p, ekAd){
  if (p == null) return '<span class="rz rz-gri">Veri yok</span>';
  let s = 'rz-kirmizi', a = 'Beklentinin altında';
  if (p >= 3.5){ s = 'rz-yesil'; a = 'Örnek'; }
  else if (p >= 3){ s = 'rz-yesil'; a = 'Karşılıyor+'; }
  else if (p >= 2.5){ s = 'rz-mavi'; a = 'Karşılıyor'; }
  else if (p >= 2){ s = 'rz-turuncu'; a = 'Gelişim gerekli'; }
  return '<span class="rz ' + s + '">' + say2(p) + ' · ' + esc(ekAd || a) + '</span>';
}
function asamaRozet(kod){
  const i = asamaSira(kod);
  const s = kod === 'kapali' ? 'rz-gri' : (i >= 7 ? 'rz-yesil' : (i >= 4 ? 'rz-mavi' : 'rz-turuncu'));
  return '<span class="rz ' + s + '">' + esc(asamaAd(kod)) + '</span>';
}
function adimCubugu(kod){
  const i = asamaSira(kod);
  return '<div class="adimlar">' + ASAMALAR.map((a, ix) =>
    '<div class="adim ' + (ix < i ? 'gecti' : (ix === i ? 'simdi' : '')) + '" title="' + esc(a.ad) + '">' +
    (ix + 1) + '. ' + esc(a.kisa) + '</div>').join('') + '</div>';
}
function degisimOku(yeni, eski){
  if (yeni == null || eski == null) return '<span class="soluk">—</span>';
  const f = Math.round((yeni - eski) * 100) / 100;
  if (Math.abs(f) < 0.005) return '<span class="rz rz-gri">değişim yok</span>';
  return '<span class="rz ' + (f > 0 ? 'rz-yesil' : 'rz-kirmizi') + '">' + (f > 0 ? '▲ +' : '▼ ') + say2(f) + '</span>';
}

/* =========================================================
   13. GÖSTERGE PANELİ
   ========================================================= */
sayfa('panel', function(){
  const ph = aktifEczane();
  if (!ph) return '<div class="kart"><h3>Henüz eczane yok</h3><p class="sessiz">Süper yönetici olarak ' +
    '<a href="#" data-git="eczaneler">Eczaneler</a> ekranından ilk eczaneyi oluşturun.</p></div>';
  if (OTURUM.rol === 'calisan') return calisanPaneli();
  if (OTURUM.rol === 'ik') return ikPaneli();

  const d = secilenDonem();
  const ekip = gorulebilirCalisanlar();
  const degler = d ? ait('evaluations').filter(e => e.donemId === d.id && !e.iptal && ekip.some(c => c.id === e.employeeId)) : [];
  const ozetler = degler.map(e => ({ ev:e, oz: ozetle(e) }));
  const puanli = ozetler.filter(x => x.oz.genel != null);
  const ortalama = puanli.length ? puanli.reduce((t, x) => t + x.oz.genel, 0) / puanli.length : null;

  // Bölüm ortalamaları
  const bolumOrt = {};
  BOLUMLER.forEach(b => {
    const l = ozetler.map(x => x.oz.bolumler[b.kod]).filter(v => v != null);
    bolumOrt[b.kod] = l.length ? l.reduce((t, v) => t + v, 0) / l.length : null;
  });

  // Rol bazında
  const rolOrt = {};
  ait('employeeRoles').forEach(r => {
    const l = puanli.filter(x => (calisan(x.ev.employeeId) || {}).roleId === r.id).map(x => x.oz.genel);
    if (l.length) rolOrt[r.ad] = l.reduce((t, v) => t + v, 0) / l.length;
  });

  const geciken = gecikenAksiyon(), yaklasan = yaklasanAksiyon();
  const acikPlan = ait('developmentPlans').filter(p => ['Tamamlandı','Başarısız'].indexOf(p.durum) < 0);
  const olaylar = d ? ait('criticalIncidents').filter(o => o.donemId === d.id) : [];
  const primler = d ? ait('bonusCalculations').filter(b => b.donemId === d.id) : [];
  const gorevKayit = d ? ait('taskCompletions').filter(c => c.donemId === d.id) : [];
  const zamaninda = gorevKayit.filter(c => Number(c.zaman) >= 3).length;

  let h = sayfaBas('Gösterge Paneli',
    esc(ph.ad) + ' · ' + (d ? esc(d.ad) + ' (' + tarihTR(d.baslangic) + ' – ' + tarihTR(d.bitis) + ')' : 'dönem tanımlı değil'),
    donemSecici());

  h += '<div class="ozet">' +
    ozetKart('Ortalama performans', ortalama == null ? '—' : say2(ortalama), puanli.length + ' değerlendirme · 4,00 üzerinden', ortalama != null && ortalama >= 3 ? 'iyi' : (ortalama != null && ortalama < 2.5 ? 'uyar' : '')) +
    ozetKart('Çalışan', String(ekip.length), ait('employees').filter(e => e.aktif === false).length + ' pasif kayıt') +
    ozetKart('Açık gelişim planı', String(acikPlan.length), geciken.length + ' geciken · ' + yaklasan.length + ' yaklaşan', geciken.length ? 'vurgu' : '') +
    ozetKart('Kritik olay', String(olaylar.length), olaylar.filter(o => !o.yoneticiKarari).length + ' karar bekliyor', olaylar.length ? 'uyar' : '') +
    ozetKart('Görev kaydı', String(gorevKayit.length), gorevKayit.length ? (Math.round(zamaninda / gorevKayit.length * 100) + '% zamanında') : 'kayıt yok') +
    (yetki('ucretGor') ? ozetKart('Hesaplanan prim', para(primler.reduce((t, b) => t + (b.hesaplanan || 0), 0)),
      primler.filter(b => b.durum === 'inceleme').length + ' inceleme · ' + primler.filter(b => b.odemeDurumu === 'Ödendi').length + ' ödendi') : '') +
    '</div>';

  // Bölüm puanları
  h += '<div class="izgara-2">';
  h += '<div class="kart"><h3>Bölüm puanları</h3><p class="kucuk sessiz">Ağırlıklar: ' +
    BOLUMLER.map(b => esc(b.kisa) + ' %' + (d && d.agirliklarSnapshot ? d.agirliklarSnapshot[b.kod] : ayar().bolumAgirliklari[b.kod])).join(' · ') + '</p>' +
    BOLUMLER.map(b => {
      const v = bolumOrt[b.kod];
      const yuz = v == null ? 0 : (v / 4) * 100;
      const sinif = v == null ? '' : (v >= 3 ? 'yesil' : (v >= 2.5 ? '' : (v >= 2 ? 'turuncu' : 'kirmizi')));
      return '<div style="margin:11px 0"><div class="satir-ara kucuk"><b>' + esc(b.ad) + '</b><span>' + (v == null ? 'veri yok' : say2(v)) + '</span></div>' +
        '<div class="cubuk"><i class="' + sinif + '" style="width:' + yuz.toFixed(1) + '%"></i></div></div>';
    }).join('') + '</div>';

  h += '<div class="kart"><h3>Rol bazında performans</h3>' +
    (Object.keys(rolOrt).length
      ? Object.keys(rolOrt).map(r => '<div style="margin:11px 0"><div class="satir-ara kucuk"><b>' + esc(r) + '</b><span>' + say2(rolOrt[r]) + '</span></div>' +
          '<div class="cubuk"><i class="' + (rolOrt[r] >= 3 ? 'yesil' : (rolOrt[r] >= 2.5 ? '' : 'turuncu')) + '" style="width:' + ((rolOrt[r] / 4) * 100).toFixed(1) + '%"></i></div></div>').join('')
      : '<p class="sessiz kucuk">Bu dönemde puanlanmış değerlendirme yok.</p>') + '</div>';
  h += '</div>';

  // Çalışan bazında gelişim
  h += '<div class="kart"><div class="kart-bas"><h3>Çalışan bazında dönemsel gelişim</h3>' +
    '<a class="d d-cizgi d-kk" href="#" data-git="degerlendirmeler">Tüm değerlendirmeler</a></div>' +
    '<div class="tablo-sar"><table><thead><tr><th>Çalışan</th><th>Pozisyon</th><th class="sayi">Önceki</th>' +
    '<th class="sayi">Güncel</th><th>Değişim</th><th>Aşama</th><th class="sayi">Katsayı</th><th>Görev</th></tr></thead><tbody>' +
    (ekip.length ? ekip.map(c => {
      const x = ozetler.find(o => o.ev.employeeId === c.id);
      const onc = d ? oncekiGenel(c.id, d.id) : null;
      const g = d ? gorevOzeti(d.id, c.id) : { oran:null, kayit:0 };
      return '<tr><td><a href="#" data-git="calisan" data-arg="' + c.id + '"><b>' + esc(c.ad) + '</b></a></td>' +
        '<td class="kucuk sessiz">' + esc(pozisyonAd(c.roleId)) + '</td>' +
        '<td class="sayi">' + (onc ? say2(onc.puan) : '—') + '</td>' +
        '<td class="sayi">' + (x && x.oz.genel != null ? say2(x.oz.genel) : '—') + '</td>' +
        '<td>' + degisimOku(x ? x.oz.genel : null, onc ? onc.puan : null) + '</td>' +
        '<td>' + (x ? asamaRozet(x.ev.durum) : '<span class="rz rz-gri">Değerlendirme yok</span>') + '</td>' +
        '<td class="sayi">' + (x && x.oz.katsayi != null ? say2(x.oz.katsayi) : '—') + '</td>' +
        '<td class="kucuk">' + (g.oran == null ? '<span class="soluk">kayıt yok</span>' : g.oran + '% zamanında · ' + g.kayit + ' kayıt') + '</td></tr>';
    }).join('') : '<tr><td colspan="8">' + bosDurum('Çalışan tanımlı değil.') + '</td></tr>') +
    '</tbody></table></div></div>';

  // Geciken aksiyonlar + kritik olaylar
  h += '<div class="izgara-2">';
  h += '<div class="kart"><div class="kart-bas"><h3>Geciken ve yaklaşan aksiyonlar</h3>' +
    '<a class="d d-cizgi d-kk" href="#" data-git="gelisim">Gelişim planları</a></div>' +
    ((geciken.length + yaklasan.length) ? geciken.concat(yaklasan).slice(0, 8).map(p => {
      const r = planDurumRengi(p);
      return '<div class="liste-oge"><div class="buyu"><b class="kucuk">' + esc(calisanAd(p.employeeId)) + '</b>' +
        '<div class="kucuk sessiz">' + esc(p.alan) + ' · hedef ' + tarihTR(p.hedefTarih) + '</div></div>' +
        '<span class="rz ' + r.sinif + '">' + esc(r.ad) + '</span></div>';
    }).join('') : '<p class="sessiz kucuk">Geciken veya yaklaşan aksiyon yok.</p>') + '</div>';

  h += '<div class="kart"><div class="kart-bas"><h3>Kritik olaylar</h3>' +
    '<a class="d d-cizgi d-kk" href="#" data-git="olaylar">Tümü</a></div>' +
    (olaylar.length ? olaylar.slice(0, 8).map(o =>
      '<div class="liste-oge"><div class="buyu"><b class="kucuk">' + esc(o.kod) + ' · ' + esc(calisanAd(o.employeeId)) + '</b>' +
      '<div class="kucuk sessiz">' + esc(o.kategori) + ' · ' + tarihTR(o.tarih) + '</div></div>' +
      '<span class="rz ' + (o.yoneticiKarari ? 'rz-gri' : 'rz-kirmizi') + '">' + esc(o.yoneticiKarari || 'Karar bekliyor') + '</span></div>').join('')
      : '<p class="sessiz kucuk">Bu dönemde kritik olay kaydı yok.</p>') + '</div>';
  h += '</div>';

  // Eğitim ihtiyaçları — düşük puanlı kriterlerden türetilir
  const egitim = egitimIhtiyaclari(d, ekip);
  h += '<div class="kart"><h3>Eğitim ihtiyaçları</h3>' +
    '<p class="kucuk sessiz">Dönemde 2,50 puanın altında kalan kriterler, kaç çalışanda görüldüğüne göre sıralanır.</p>' +
    (egitim.length ? '<div class="tablo-sar"><table><thead><tr><th>Kriter</th><th>Bölüm</th><th class="sayi">Çalışan</th><th class="sayi">Ortalama</th></tr></thead><tbody>' +
      egitim.slice(0, 10).map(e => '<tr><td>' + esc(e.ad) + '</td><td class="kucuk sessiz">' + esc(bolumAd(e.bolum)) + '</td>' +
        '<td class="sayi">' + e.sayi + '</td><td class="sayi">' + say2(e.ort) + '</td></tr>').join('') + '</tbody></table></div>'
      : '<p class="sessiz kucuk">2,50 altında kalan kriter yok.</p>') + '</div>';

  return h;
}, function(){ donemSeciciBagla(); });

function egitimIhtiyaclari(d, ekip){
  if (!d) return [];
  const h = {};
  ait('evaluations').filter(e => e.donemId === d.id && !e.iptal && (!ekip || ekip.some(c => c.id === e.employeeId))).forEach(ev => {
    DB.evaluationItems.filter(i => i.evalId === ev.id).forEach(i => {
      const v = puanDegeri(i.yonPuan);
      if (v == null || v >= 2.5) return;
      if (!h[i.ad]) h[i.ad] = { ad:i.ad, bolum:i.bolum, sayi:0, toplam:0 };
      h[i.ad].sayi++; h[i.ad].toplam += v;
    });
  });
  return Object.keys(h).map(k => ({ ad:h[k].ad, bolum:h[k].bolum, sayi:h[k].sayi, ort:h[k].toplam / h[k].sayi }))
    .sort((a, b) => b.sayi - a.sayi || a.ort - b.ort);
}

/** Çalışan paneli — yalnızca kendi verisi. Sıralama/yarış tablosu gösterilmez. */
function calisanPaneli(){
  const c = calisan(OTURUM.calisanId);
  if (!c) return '<div class="kart"><h3>Çalışan kaydı bulunamadı</h3><p class="sessiz">Yöneticinizle görüşün.</p></div>';
  const d = secilenDonem();
  const ev = d ? DB.evaluations.find(e => e.donemId === d.id && e.employeeId === c.id && !e.iptal) : null;
  const oz = ev ? ozetle(ev) : null;
  const onc = d ? oncekiGenel(c.id, d.id) : null;
  const gb = ev ? DB.feedbackRecords.find(f => f.evalId === ev.id) : null;
  const planlar = DB.developmentPlans.filter(p => p.employeeId === c.id && ['Tamamlandı','Başarısız'].indexOf(p.durum) < 0);
  const g = d ? gorevOzeti(d.id, c.id) : { oran:null, kayit:0, atanan:0 };

  let h = sayfaBas('Merhaba, ' + esc(c.ad.split(' ')[0]),
    esc(pozisyonAd(c.roleId)) + ' · ' + (d ? esc(d.ad) : 'dönem yok'), donemSecici());

  h += '<div class="ozet">' +
    ozetKart('Güncel puanım', oz && oz.genel != null ? say2(oz.genel) : '—', '4,00 üzerinden', oz && oz.genel >= 3 ? 'iyi' : '') +
    ozetKart('Önceki dönem', onc ? say2(onc.puan) : '—', onc ? esc(onc.donem.ad) : 'kayıt yok') +
    ozetKart('Açık gelişim hedefi', String(planlar.length), planlar.filter(p => p.hedefTarih < bugun()).length + ' geciken', planlar.some(p => p.hedefTarih < bugun()) ? 'vurgu' : '') +
    ozetKart('Görevlerim', String(g.atanan), g.kayit + ' değerlendirilmiş kayıt') +
    '</div>';

  if (ev){
    h += '<div class="kart"><div class="kart-bas"><h3>Değerlendirme sürecim</h3>' + asamaRozet(ev.durum) + '</div>' +
      adimCubugu(ev.durum) +
      '<div class="satir">' +
      (asamaSira(ev.durum) < 2 && !kilitli(ev) ? '<button class="d d-ana" data-git="benim">Öz değerlendirmemi yap</button>' : '<a class="d d-cizgi" href="#" data-git="benim">Değerlendirmemi gör</a>') +
      (gb && asamaSira(ev.durum) >= 4 && !gb.okudum ? '<button class="d d-kirmizi" id="cpOkudum">Geri bildirimi okudum</button>' : '') +
      '</div>' +
      (gb && gb.gucluYonler ? '<div class="mt"><b class="kucuk">Güçlü yönlerim</b><p class="kucuk sessiz">' + esc(gb.gucluYonler) + '</p></div>' : '') +
      (gb && gb.gelisimAlanlari ? '<div><b class="kucuk">Gelişim alanlarım</b><p class="kucuk sessiz">' + esc(gb.gelisimAlanlari) + '</p></div>' : '') +
      '</div>';
  } else {
    h += '<div class="kart"><h3>Bu dönem için henüz değerlendirme açılmadı</h3><p class="sessiz kucuk">Yöneticiniz dönemi başlattığında burada görünecek.</p></div>';
  }

  if (oz){
    h += '<div class="kart"><h3>Bölüm puanlarım</h3>' + BOLUMLER.map(b => {
      const v = oz.bolumler[b.kod];
      return '<div style="margin:11px 0"><div class="satir-ara kucuk"><b>' + esc(b.ad) + '</b><span>' + (v == null ? 'değerlendirilmedi' : say2(v)) + '</span></div>' +
        '<div class="cubuk"><i class="' + (v == null ? '' : (v >= 3 ? 'yesil' : (v >= 2.5 ? '' : (v >= 2 ? 'turuncu' : 'kirmizi')))) + '" style="width:' + (v == null ? 0 : (v / 4) * 100).toFixed(1) + '%"></i></div></div>';
    }).join('') + '</div>';
  }

  h += '<div class="kart"><div class="kart-bas"><h3>Gelişim hedeflerim</h3><a class="d d-cizgi d-kk" href="#" data-git="gelisim">Tümü</a></div>' +
    (planlar.length ? planlar.map(p => {
      const r = planDurumRengi(p);
      return '<div class="liste-oge"><div class="buyu"><b class="kucuk">' + esc(p.alan) + '</b>' +
        '<div class="kucuk sessiz">Hedef ' + tarihTR(p.hedefTarih) + ' · ' + esc(p.aksiyon || '') + '</div></div>' +
        '<span class="rz ' + r.sinif + '">' + esc(r.ad) + '</span></div>';
    }).join('') : '<p class="sessiz kucuk">Açık gelişim hedefiniz yok.</p>') + '</div>';

  const yaklasanKontrol = DB.developmentCheckpoints.filter(k => !k.yapildi && planlar.some(p => p.id === k.planId) && k.tarih >= bugun())
    .sort((a, b) => a.tarih.localeCompare(b.tarih)).slice(0, 4);
  if (yaklasanKontrol.length){
    h += '<div class="kart"><h3>Yaklaşan kontrol tarihleri</h3>' + yaklasanKontrol.map(k => {
      const p = DB.developmentPlans.find(x => x.id === k.planId) || {};
      return '<div class="liste-oge"><div class="buyu"><b class="kucuk">' + k.gun + ' günlük kontrol</b>' +
        '<div class="kucuk sessiz">' + esc(p.alan || '') + '</div></div><span class="rz rz-turuncu">' + tarihTR(k.tarih) + '</span></div>';
    }).join('') + '</div>';
  }
  return h;
}

/** İK/Finans paneli — yalnızca onaylanmış sonuçlar, prim ve ücret. */
function ikPaneli(){
  const d = secilenDonem();
  const primler = d ? ait('bonusCalculations').filter(b => b.donemId === d.id) : [];
  const maaslar = d ? ait('salaryIncreaseCalculations').filter(m => m.donemId === d.id) : [];
  const onayli = primler.filter(b => b.onaylanan != null);
  let h = sayfaBas('İnsan Kaynakları / Finans',
    'Yalnızca onaylanmış performans sonuçları, prim ve ücret hesapları görünür. Performans puanları bu ekrandan değiştirilemez.',
    donemSecici());
  h += '<div class="ozet">' +
    ozetKart('Onaylanan prim', para(onayli.reduce((t, b) => t + (b.onaylanan || 0), 0)), onayli.length + ' çalışan') +
    ozetKart('Ödenen', para(primler.filter(b => b.odemeDurumu === 'Ödendi').reduce((t, b) => t + (b.onaylanan || 0), 0)), primler.filter(b => b.odemeDurumu === 'Ödendi').length + ' ödeme') +
    ozetKart('İncelemede', String(primler.filter(b => b.durum === 'inceleme').length), 'yönetici kararı bekliyor', primler.some(b => b.durum === 'inceleme') ? 'uyar' : '') +
    ozetKart('Ücret artışı önerisi', String(maaslar.length), maaslar.filter(m => m.onaylananUcret != null).length + ' onaylı') +
    '</div>';
  h += '<div class="kart"><div class="kart-bas"><h3>Prim bordrosu</h3><a class="d d-cizgi d-kk" href="#" data-git="prim">Prim ekranı</a></div>' +
    primTablosu(primler, true) + '</div>';
  h += '<div class="kart"><div class="kart-bas"><h3>Maaş artışı önerileri</h3><a class="d d-cizgi d-kk" href="#" data-git="maas">Maaş ekranı</a></div>' +
    maasTablosu(maaslar, true) + '</div>';
  return h;
}
SAYFALAR['panel'].bagla = function(){ donemSeciciBagla(); const b = $('#cpOkudum'); if (b) b.onclick = okuduIsaretle; };

function okuduIsaretle(){
  const d = secilenDonem();
  const ev = DB.evaluations.find(e => e.donemId === d.id && e.employeeId === OTURUM.calisanId && !e.iptal);
  if (!ev) return;
  const gb = DB.feedbackRecords.find(f => f.evalId === ev.id);
  if (!gb) return;
  gb.okudum = true; gb.okuduTarih = simdi();
  if (asamaSira(ev.durum) < asamaSira('goruldu')) ev.durum = 'goruldu';
  iz('FeedbackRecords', gb.id, 'guncelle', 'okudum', 'hayır', 'evet');
  yaz(); cizIcerik();
  tost('Okudum onayınız kaydedildi. Bu onay, puanları kabul ettiğiniz anlamına gelmez.', 'iyi');
}

/* =========================================================
   14. ECZANELER (yalnızca süper yönetici)
   ========================================================= */
sayfa('eczaneler', function(){
  if (!yetki('eczaneYonet')) return '<div class="kart">Bu ekranı görme yetkiniz yok.</div>';
  const d = null;
  let h = sayfaBas('Eczaneler',
    'Her eczanenin verisi birbirinden tamamen ayrıdır. Aşağıdaki karşılaştırma yalnızca süper yöneticiye açıktır.',
    '<button class="d d-cizgi" id="ecEsitle">Kayıt merkezinden al</button>' +
    '<button class="d d-ana" id="ecEkle">Yeni eczane</button>');

  const satirlar = DB.pharmacies.map(p => {
    const ekip = DB.employees.filter(e => e.phId === p.id && e.aktif !== false);
    const dnm = donemler(p.id).find(x => x.durum === 'acik') || donemler(p.id)[0];
    const degler = dnm ? DB.evaluations.filter(e => e.donemId === dnm.id && !e.iptal) : [];
    const puanlar = degler.map(e => ozetle(e).genel).filter(v => v != null);
    const ort = puanlar.length ? puanlar.reduce((t, v) => t + v, 0) / puanlar.length : null;
    const olay = DB.criticalIncidents.filter(o => o.phId === p.id && !o.yoneticiKarari).length;
    return '<tr><td><b>' + esc(p.ad) + '</b><div class="kucuk sessiz">' + esc(p.kod) + (p.sehir ? ' · ' + esc(p.sehir) : '') + '</div></td>' +
      '<td class="sayi">' + ekip.length + '</td>' +
      '<td class="kucuk">' + (dnm ? esc(dnm.ad) : '—') + '</td>' +
      '<td class="sayi">' + (ort == null ? '—' : say2(ort)) + '</td>' +
      '<td>' + puanRozet(ort) + '</td>' +
      '<td class="sayi">' + olay + '</td>' +
      '<td><button class="d d-cizgi d-kk" data-sec="' + p.id + '">Yönet</button> ' +
      '<button class="d d-sade d-kk" data-sil="' + p.id + '">Sil</button></td></tr>';
  }).join('');

  h += '<div class="kart"><div class="tablo-sar"><table><thead><tr><th>Eczane</th><th class="sayi">Çalışan</th>' +
    '<th>Güncel dönem</th><th class="sayi">Ortalama</th><th>Durum</th><th class="sayi">Açık olay</th><th></th></tr></thead><tbody>' +
    (DB.pharmacies.length ? satirlar : '<tr><td colspan="7">' + bosDurum('Henüz eczane yok.') + '</td></tr>') +
    '</tbody></table></div></div>';

  h += '<div class="bilgi bilgi-mavi"><b>Ortak kimlik:</b> Eczaneyi ve çalışanları <b>Eczane Kayıt Merkezi</b> ' +
    '(<code>eczaneler.html</code>) sayfasında bir kez tanımlayın; buraya aynı Eczane ID’si, aynı kullanıcı adı ve ' +
    'aynı şifreyle kendiliğinden kurulurlar. Kayıtlar her girişte ve açılışta otomatik alınır; ' +
    '“Kayıt merkezinden al” düğmesi ise sayfayı yenilemeden hemen çeker.</div>';
  return h;
}, function(){

function eczaneKip(){
  const k = kip({
    baslik: 'Yeni eczane',
    govde:
      '<div class="alan"><label>Eczane adı</label><input type="text" id="eAd" placeholder="Örn. Alsancak Marin Eczanesi"></div>' +
      '<div class="izgara"><div class="alan"><label>Şehir</label><input type="text" id="eSehir"></div>' +
      '<div class="alan"><label>Eczacı</label><input type="text" id="eEczaci" placeholder="Ecz. Ad Soyad"></div></div>' +
      '<div class="alan"><label>Yönetici eczacı kullanıcı adı</label><input type="text" id="eKadi" autocapitalize="off" placeholder="ör. marin"></div>' +
      '<div class="bilgi bilgi-mavi">Eczane açıldığında 5 pozisyon, 74 kriter ve 72 görevlik başlangıç görev bankası ' +
      'otomatik kurulur. Yönetici eczacının şifresi üretilip bir kez gösterilir.</div>' +
      '<div id="eHata" class="bilgi bilgi-kirmizi" hidden></div>',
    ayak: '<button class="d d-cizgi" data-kapat>Vazgeç</button><button class="d d-ana" id="eTamam">Eczaneyi kur</button>'
  });
  const inp = $('#eAd', k);
  if (window.ArtifarmaEczane) ArtifarmaEczane.onerileriBagla(inp);
  $('#eTamam', k).onclick = async () => {
    const h = $('#eHata', k), goster = (m) => { h.textContent = m; h.hidden = false; };
    const ad = inp.value.trim(), kadi = $('#eKadi', k).value.trim().toLowerCase();
    if (ad.length < 3) return goster('Eczane adı giriniz.');
    if (!/^[a-z0-9._-]{3,}$/.test(kadi)) return goster('Kullanıcı adı en az 3 karakter olmalı.');
    if (kadiVarMi(kadi)) return goster('Bu kullanıcı adı kullanılıyor.');
    // Ortak eczane kütüğü — aynı eczane tüm Artıfarma araçlarında aynı kimlikle açılır
    const ortak = window.ArtifarmaEczane ? ArtifarmaEczane.esle(ad) : null;
    const ph = eczaneKur(ad, $('#eSehir', k).value, $('#eEczaci', k).value, ortak ? ortak.id : null);
    const sifre = ortak && ortak.yeni ? ortak.sifre : rastgeleSifre(8);
    await kullaniciEkle(ph.id, $('#eEczaci', k).value.trim() || ('Yönetici · ' + ad), kadi, sifre, 'sahip');
    iz('Pharmacies', ph.id, 'ekle', 'eczane', '', ad, ph.id);
    await yaz(true);
    kipKapat();
    OTURUM.seciliEczane = ph.id;
    ciz();
    if (window.ArtifarmaKimlik) ArtifarmaKimlik.goster({
      arac: 'Performans ve Ücret Yönetimi', baslik: ad, ortak: true,
      satirlar: [{ etiket:'Eczane ID', deger: ph.kod }, { etiket:'Kullanıcı adı', deger: kadi }, { etiket:'Şifre', deger: sifre }],
      not: 'Şifre yalnızca özet olarak saklanır; bu ekran kapandıktan sonra bir daha gösterilemez.'
    });
    else tost('Eczane kuruldu. Şifre: ' + sifre, 'iyi');
  };
}
async function eczaneSil(phId){
  ['employees','employeeRoles','competencyCriteria','taskCategories','tasks','taskAssignments','taskCompletions',
   'evaluationPeriods','criticalIncidents','developmentPlans','compensationSettings','bonusCalculations',
   'salaryIncreaseCalculations','notifications','evaluations'].forEach(t => {
    DB[t] = DB[t].filter(x => x.phId !== phId);
  });
  const kalanEval = DB.evaluations.map(e => e.id);
  DB.evaluationItems = DB.evaluationItems.filter(i => kalanEval.indexOf(i.evalId) >= 0);
  DB.feedbackRecords = DB.feedbackRecords.filter(f => kalanEval.indexOf(f.evalId) >= 0);
  const kalanPlan = DB.developmentPlans.map(p => p.id);
  DB.developmentCheckpoints = DB.developmentCheckpoints.filter(c => kalanPlan.indexOf(c.planId) >= 0);
  DB.users = DB.users.filter(u => u.phId !== phId);
  DB.pharmacies = DB.pharmacies.filter(p => p.id !== phId);
  if (OTURUM.seciliEczane === phId) OTURUM.seciliEczane = DB.pharmacies[0] ? DB.pharmacies[0].id : null;
  await yaz(true);
  ciz(); tost('Eczane silindi.', 'iyi');
}

      await yaz(true); kipKapat(); kipKapat(); cizIcerik(); tost('Çalışan silindi.', 'iyi');

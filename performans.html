    h += '<p class="kucuk">Ödenecek prim = prim baz tutarı × hedef gerçekleşme oranı × performans katsayısı.</p>';
    h += '<div class="tablo-sar"><table><thead><tr><th>Çalışan</th><th class="sayi">Baz</th><th class="sayi">Hedef</th>' +
      '<th class="sayi">Puan</th><th class="sayi">Katsayı</th><th class="sayi">Hesaplanan</th><th class="sayi">Onaylanan</th>' +
      '<th>Onaylayan</th><th>Ödeme</th></tr></thead><tbody>' +
      liste.map(b => '<tr><td>' + esc(calisanAd(b.employeeId)) + (b.kritikEngel ? ' (kritik olay)' : '') + '</td>' +
        '<td class="sayi">' + para(b.primBaz) + '</td><td class="sayi">' + yuzde(b.bireyselHedef != null ? b.bireyselHedef : b.genelHedef, 0) + '</td>' +
        '<td class="sayi">' + (b.puan == null ? '—' : say2(b.puan)) + '</td><td class="sayi">' + (b.katsayi == null ? '—' : say2(b.katsayi)) + '</td>' +
        '<td class="sayi">' + para(b.hesaplanan) + '</td><td class="sayi">' + (b.onaylanan == null ? '—' : para(b.onaylanan)) + '</td>' +
        '<td class="kucuk">' + esc(b.onaylayan || '—') + (b.onayTarihi ? '<br>' + tarihTR(b.onayTarihi) : '') + '</td>' +
        '<td class="kucuk">' + esc(b.odemeDurumu || '—') + (b.odemeTarihi ? '<br>' + tarihTR(b.odemeTarihi) : '') + '</td></tr>').join('') +
      '<tr><td colspan="5"><b>Toplam</b></td><td class="sayi"><b>' + para(liste.reduce((t, b) => t + (b.hesaplanan || 0), 0)) + '</b></td>' +
      '<td class="sayi"><b>' + para(liste.reduce((t, b) => t + (b.onaylanan || 0), 0)) + '</b></td><td colspan="2"></td></tr>' +
      '</tbody></table></div>';
    return h;
  }

  if (tur === 'maas'){
    if (!yetki('ucretGor')) return '<p>Bu raporu görme yetkiniz yok.</p>';
    const liste = ait('salaryIncreaseCalculations').filter(m => m.donemId === d.id && calisanGorulebilir(m.employeeId));
    let h = raporUst('Maaş Artışı Öneri Raporu', d.ad);
    h += '<p class="kucuk">Toplam zam oranı = genel/koruyucu zam oranı + (performans artışı bütçesi × performans katsayısı).</p>';
    h += '<div class="tablo-sar"><table><thead><tr><th>Çalışan</th><th class="sayi">Mevcut brüt</th><th class="sayi">Genel zam</th>' +
      '<th class="sayi">Perf. bütçesi</th><th class="sayi">Katsayı</th><th class="sayi">Toplam zam</th>' +
      '<th class="sayi">Önerilen</th><th class="sayi">Onaylanan</th><th>Geçerlilik</th></tr></thead><tbody>' +
      liste.map(m => '<tr><td>' + esc(calisanAd(m.employeeId)) + '</td><td class="sayi">' + para(m.mevcutBrut) + '</td>' +
        '<td class="sayi">' + yuzde(m.genelZam, 0) + '</td><td class="sayi">' + yuzde(m.perfButce, 0) + '</td>' +
        '<td class="sayi">' + (m.katsayi == null ? '—' : say2(m.katsayi)) + '</td><td class="sayi">' + yuzde(m.toplamZam) + '</td>' +
        '<td class="sayi">' + para(m.onerilenUcret) + '</td><td class="sayi">' + (m.onaylananUcret == null ? '—' : para(m.onaylananUcret)) + '</td>' +
        '<td class="kucuk">' + (m.gecerlilik ? tarihTR(m.gecerlilik) : '—') + '</td></tr>').join('') +
      '</tbody></table></div>';
    return h;
  }

  if (tur === 'eczane'){
    const ekip = gorulebilirCalisanlar();
    const degler = ait('evaluations').filter(e => e.donemId === d.id && !e.iptal);
    const puanlar = degler.map(e => ozetle(e).genel).filter(v => v != null);
    const ort = puanlar.length ? puanlar.reduce((t, v) => t + v, 0) / puanlar.length : null;
    let h = raporUst('Eczane Genel Performans Raporu', d.ad + ' · ' + tarihTR(d.baslangic) + ' – ' + tarihTR(d.bitis));
    h += '<div class="kv">' + kvSatir('Çalışan sayısı', String(ekip.length)) +
      kvSatir('Tamamlanan değerlendirme', String(degler.filter(e => asamaSira(e.durum) >= asamaSira('onayli')).length) + ' / ' + degler.length) +
      kvSatir('Ortalama performans puanı', ort == null ? '—' : say2(ort)) +
      kvSatir('Açık gelişim planı', String(ait('developmentPlans').filter(p => ['Tamamlandı','Başarısız'].indexOf(p.durum) < 0).length)) +
      kvSatir('Geciken aksiyon', String(gecikenAksiyon().length)) +
      kvSatir('Kritik olay', String(ait('criticalIncidents').filter(o => o.donemId === d.id).length)) + '</div>';
    h += '<h4>Bölüm ortalamaları</h4><div class="tablo-sar"><table><thead><tr><th>Bölüm</th><th class="sayi">Ağırlık</th><th class="sayi">Ortalama</th></tr></thead><tbody>' +
      BOLUMLER.map(b => {
        const l = degler.map(e => ozetle(e).bolumler[b.kod]).filter(v => v != null);
        const o = l.length ? l.reduce((t, v) => t + v, 0) / l.length : null;
        return '<tr><td>' + esc(b.ad) + '</td><td class="sayi">%' + say2((d.agirliklarSnapshot || {})[b.kod]) + '</td>' +
          '<td class="sayi">' + (o == null ? '—' : say2(o)) + '</td></tr>';
      }).join('') + '</tbody></table></div>';
    h += '<h4>Çalışan bazında</h4><div class="tablo-sar"><table><thead><tr><th>Çalışan</th><th>Pozisyon</th>' +
      '<th class="sayi">Puan</th><th class="sayi">Önceki</th><th class="sayi">Katsayı</th><th>Aşama</th></tr></thead><tbody>' +
      ekip.map(c => {
        const ev = degler.find(e => e.employeeId === c.id);
        const z = ev ? ozetle(ev) : null;
        const onc = oncekiGenel(c.id, d.id);
        return '<tr><td>' + esc(c.ad) + '</td><td>' + esc(pozisyonAd(c.roleId)) + '</td>' +
          '<td class="sayi">' + (z && z.genel != null ? say2(z.genel) : '—') + '</td>' +
          '<td class="sayi">' + (onc ? say2(onc.puan) : '—') + '</td>' +
          '<td class="sayi">' + (z && z.katsayi != null ? say2(z.katsayi) : '—') + '</td>' +
          '<td>' + esc(ev ? asamaAd(ev.durum) : 'değerlendirme yok') + '</td></tr>';
      }).join('') + '</tbody></table></div>';
    const eg = egitimIhtiyaclari(d, ekip);
    if (eg.length){
      h += '<h4>Eğitim ihtiyaçları</h4><div class="tablo-sar"><table><thead><tr><th>Kriter</th><th>Bölüm</th><th class="sayi">Çalışan</th><th class="sayi">Ortalama</th></tr></thead><tbody>' +
        eg.slice(0, 15).map(x => '<tr><td>' + esc(x.ad) + '</td><td>' + esc(bolumAd(x.bolum)) + '</td>' +
          '<td class="sayi">' + x.sayi + '</td><td class="sayi">' + say2(x.ort) + '</td></tr>').join('') + '</tbody></table></div>';
    }
    return h;
  }
  return '<p>Rapor bulunamadı.</p>';
}

/** Rapor verisini Excel’in doğrudan açtığı CSV olarak indirir. */
function raporCsv(tur, arg){
  const d = secilenDonem();
  if (!d) return tost('Önce bir dönem seçin.', 'hata');
  const ad = (RAPORLAR.find(r => r.kod === tur) || {}).ad || tur;
  let bas = [], sat = [];
  if (tur === 'degerlendirme'){
    const ev = DB.evaluations.find(e => e.id === arg) || DB.evaluations.find(e => e.donemId === d.id && e.employeeId === arg && !e.iptal);
    if (!ev) return tost('Kayıt bulunamadı.', 'hata');
    bas = ['Bölüm','Kriter','Ağırlık','Önceki puan','Öz puan','Yönetici puanı','Somut gözlem','Geri bildirim','Çalışanın görüşü'];
    sat = DB.evaluationItems.filter(i => i.evalId === ev.id).map(i => [bolumAd(i.bolum), i.ad, i.agirlik,
      i.oncekiPuan == null ? '' : i.oncekiPuan, i.ozPuan, i.yonPuan, i.gozlem, i.geriBildirim, i.calisanGorusu]);
  } else if (tur === 'gelisim'){
    bas = ['Çalışan','Gelişim alanı','Mevcut','Hedef','Aksiyon','Destek','Başlangıç','Hedef tarihi','Durum','Kanıt','Sonuç'];
    sat = DB.developmentPlans.filter(p => p.employeeId === arg).map(p => [calisanAd(p.employeeId), p.alan, p.mevcutPuan, p.hedefPuan,
      p.aksiyon, p.destekId ? calisanAd(p.destekId) : '', p.baslangic, p.hedefTarih, p.durum, p.kanit, p.sonuc]);
  } else if (tur === 'tutanak'){
    const ev = DB.evaluations.find(e => e.donemId === d.id && e.employeeId === arg && !e.iptal);
    const gb = ev ? DB.feedbackRecords.find(f => f.evalId === ev.id) : null;
    if (!gb) return tost('Kayıt bulunamadı.', 'hata');
    bas = ['Başlık','İçerik'];
    sat = [['Güçlü yönler', gb.gucluYonler], ['Başarılı örnekler', gb.basariliOrnekler], ['Gelişim alanları', gb.gelisimAlanlari],
      ['Somut olaylar', gb.olaylar], ['Çalışanın görüşü', gb.calisanGorusu], ['Uzlaşılan', gb.uzlasilan],
      ['Katılmadığı', gb.katilmadigi], ['Hedefler', gb.hedefler], ['Yönetici notu', gb.yoneticiNotu],
      ['Okudum onayı', gb.okudum ? tarihSaatTR(gb.okuduTarih) : 'verilmedi']];
  } else if (tur === 'prim'){
    if (!yetki('ucretGor')) return tost('Yetkiniz yok.', 'hata');
    bas = ['Çalışan','Prim baz','Hedef oranı','Puan','Katsayı','Hesaplanan','Onaylanan','Kritik engel','Onaylayan','Onay tarihi','Ödeme durumu','Ödeme tarihi','Açıklama'];
    sat = ait('bonusCalculations').filter(b => b.donemId === d.id).map(b => [calisanAd(b.employeeId), b.primBaz,
      (b.bireyselHedef != null ? b.bireyselHedef : b.genelHedef), b.puan, b.katsayi, b.hesaplanan, b.onaylanan,
      b.kritikEngel ? 'Var' : 'Yok', b.onaylayan, b.onayTarihi ? tarihTR(b.onayTarihi) : '', b.odemeDurumu, b.odemeTarihi || '', b.aciklama]);
  } else if (tur === 'maas'){
    if (!yetki('ucretGor')) return tost('Yetkiniz yok.', 'hata');
    bas = ['Çalışan','Mevcut brüt','Mevcut net','Genel zam %','Performans bütçesi %','Katsayı','Toplam zam %','Önerilen ücret','Onaylanan ücret','Geçerlilik','Açıklama'];
    sat = ait('salaryIncreaseCalculations').filter(m => m.donemId === d.id).map(m => [calisanAd(m.employeeId), m.mevcutBrut, m.mevcutNet,
      m.genelZam, m.perfButce, m.katsayi, m.toplamZam, m.onerilenUcret, m.onaylananUcret, m.gecerlilik, m.aciklama]);
  } else if (tur === 'gorev'){
    bas = ['Kategori','Çalışan','Görev puanı','Kayıt sayısı'];
    ait('taskCategories').forEach(kt => gorulebilirCalisanlar().forEach(c => {
      const r = gorevKatPuani(d.id, c.id, kt.id);
      if (r.adet) sat.push([kt.ad, c.ad, r.puan, r.adet]);
    }));
  } else if (tur === 'karsilastirma'){
    const dl = donemler().slice(0, 8).reverse();
    bas = ['Çalışan'].concat(dl.map(x => x.ad));
    sat = gorulebilirCalisanlar().map(c => [c.ad].concat(dl.map(x => {
      const ev = DB.evaluations.find(e => e.donemId === x.id && e.employeeId === c.id && !e.iptal);
      const v = ev ? ozetle(ev).genel : null;
      return v == null ? '' : v;
    })));
  } else {
    bas = ['Çalışan','Pozisyon','Genel puan','Önceki puan','Katsayı','Aşama'];
    sat = gorulebilirCalisanlar().map(c => {
      const ev = DB.evaluations.find(e => e.donemId === d.id && e.employeeId === c.id && !e.iptal);
      const z = ev ? ozetle(ev) : null;
      const onc = oncekiGenel(c.id, d.id);
      return [c.ad, pozisyonAd(c.roleId), z && z.genel != null ? z.genel : '', onc ? onc.puan : '', z && z.katsayi != null ? z.katsayi : '', ev ? asamaAd(ev.durum) : ''];
    });
  }
  csvIndir(ad.replace(/[^\wğüşiöçĞÜŞİÖÇ ]/gi, '').replace(/\s+/g, '-').toLowerCase() + '-' + bugun() + '.csv', bas, sat);
  tost('CSV indirildi. Excel’de doğrudan açılır.', 'iyi');
}

/* =========================================================
   31b. MERKEZÎ KAYIT İLE EŞİTLEME
   Eczaneler ve çalışanlar "Eczane Kayıt Merkezi" (eczaneler.html)
   sayfasında bir kez tanımlanır. Bu bölüm oradaki kütüğü okur ve
   kaydı KENDİ fabrika kodumuzla kurar; merkez hiçbir şemayı taklit
   etmez. Böylece aynı kişi bütün Artıfarma araçlarında aynı kullanıcı
   adı ve şifreyle giriş yapar.

   Şifreler burada yine yalnızca tuzlanmış özet olarak saklanır;
   merkezdeki şifrenin değişip değişmediğini anlamak için ayrıca
   sabit tuzlu bir damga tutulur — bu damga giriş için kullanılmaz.
   ========================================================= */

/** Merkezdeki şifrenin değiştiğini anlamak için kullanılan damga. */
const merkezDamga = (sifre) => ozet('artifarma-merkez', sifre);

/** Pozisyon adını eczanenin rol listesiyle eşler; bulunamazsa "Diğer". */
function pozisyonEsle(phId, ad){
  const roller = DB.employeeRoles.filter(r => r.phId === phId && r.aktif !== false);
  if (!roller.length) return null;
  /* Merkez artık kanonik pozisyon kodu yazıyor ('dermokozmetik' gibi);
     önce onun bu araçtaki karşılığını (ROL_TOHUM kodu) deneriz. */
  if (window.ArtifarmaPozisyon){
    const kod = ArtifarmaPozisyon.arac(ad, 'performans');
    const tam = kod && roller.find(r => r.kod === kod);
    if (tam) return tam;
    const p = ArtifarmaPozisyon.bul(ad) || ArtifarmaPozisyon.coz(ad);
    if (p){
      const adla = roller.find(r => sade(r.ad) === sade(p.ad));
      if (adla) return adla;
    }
  }
  const a = sade(ad);
  return (a && roller.find(r => sade(r.ad) === a)) ||
         (a && roller.find(r => sade(r.ad).indexOf(a) >= 0 || a.indexOf(sade(r.ad)) >= 0)) ||
         roller.find(r => r.kod === 'diger') || roller[0];
}

/** Araç içinde çakışmayan bir kullanıcı adı üretir. */
function bosKadi(istenen, haricId){
  let k = istenen, n = 1;
  while (DB.users.some(u => u.kadi === k && u.id !== haricId)){ n++; k = istenen + n; }
  return k;
}

/** Eczanenin yönetici eczacı hesabını merkezdeki kimlikle kurar/günceller. */
async function merkezSahipHesabi(ph, emir){
  let u = DB.users.find(x => x.phId === ph.id && x.rol === 'sahip' && x.merkezEcz === emir.id);
  if (!u) u = DB.users.find(x => x.phId === ph.id && x.rol === 'sahip');
  const kadi = bosKadi(String(emir.id).toLowerCase(), u ? u.id : null);
  const damga = await merkezDamga(emir.sifre);
  if (!u){
    u = await kullaniciEkle(ph.id, emir.eczaci || ('Yönetici · ' + ph.ad), kadi, emir.sifre, 'sahip',
      { merkezEcz: emir.id, merkezDamga: damga });
    return u;
  }
  u.merkezEcz = emir.id;
  if (u.kadi !== kadi) u.kadi = kadi;
  if (emir.eczaci) u.ad = emir.eczaci;
  u.aktif = true;
  if (u.merkezDamga !== damga){
    await sifreDegistir(u, emir.sifre);
    u.merkezDamga = damga;
  }
  return u;
}

/** Merkezde tanımlı çalışanları bu eczanenin ekibine yansıtır. */
async function merkezCalisanlari(ph){
  if (!window.ArtifarmaCalisan || !ph.kod) return 0;
  let eklenen = 0;
  for (const mc of ArtifarmaCalisan.liste(ph.kod)){
    /* 1) Çalışan kaydı */
    let c = DB.employees.find(x => x.merkezId === mc.id);
    if (!c){
      /* Aynı adla elle açılmış kayıt varsa yenisini üretmek yerine onu bağla. */
      c = DB.employees.find(x => x.phId === ph.id && !x.merkezId && sade(x.ad) === sade(mc.ad));
      if (c) c.merkezId = mc.id;
    }
    if (!c){
      const rol = pozisyonEsle(ph.id, mc.pozisyon);
      c = calisanEkle(ph.id, mc.ad, rol ? rol.id : null, { merkezId: mc.id });
      iz('Employees', c.id, 'ekle', 'calisan', '', mc.ad + ' (merkezî kayıt)', ph.id);
      eklenen++;
    } else {
      if (c.ad !== mc.ad) c.ad = mc.ad;
      c.phId = ph.id;
      c.aktif = mc.aktif !== false;
      /* Rol atanmamışsa (ilk aktarımda pozisyonlar henüz kurulmamış
         olabilir) her senkronda yeniden denenir. */
      if (!c.rolId){
        const r = pozisyonEsle(ph.id, mc.pozisyon);
        if (r) c.rolId = r.id;
      }
    }

    /* 2) Giriş hesabı — çalışan yalnızca kendi kayıtlarını görür. */
    const damga = await merkezDamga(mc.sifre);
    let u = DB.users.find(x => x.merkezId === mc.id);
    if (!u){
      const kadi = bosKadi(mc.kadi);
      /* Araç içinde çakışma çıktıysa merkez kaydı da düzeltilir ki
         kayıt merkezindeki liste hep gerçek kullanıcı adını göstersin. */
      if (kadi !== mc.kadi) ArtifarmaCalisan.guncelle(mc.id, { kadi });
      u = await kullaniciEkle(ph.id, mc.ad, kadi, mc.sifre, 'calisan',
        { calisanId: c.id, merkezId: mc.id, merkezDamga: damga, ucretYetkisi: false });
      iz('Users', u.id, 'ekle', 'kullanici', '', mc.ad + ' (merkezî kayıt)', ph.id);
    } else {
      u.ad = mc.ad; u.phId = ph.id; u.calisanId = c.id;
      u.aktif = mc.aktif !== false;
      const kadi = bosKadi(mc.kadi, u.id);
      if (u.kadi !== kadi){
        u.kadi = kadi;
        if (kadi !== mc.kadi) ArtifarmaCalisan.guncelle(mc.id, { kadi });
      }
      if (u.merkezDamga !== damga){
        await sifreDegistir(u, mc.sifre);
        u.merkezDamga = damga;
      }
    }
  }
  return eklenen;
}

/**
 * Açılışta bir kez çalışır: bekleyen kurulum emirlerini uygular,
 * ardından bütün eczanelerin çalışan listesini merkezle eşitler.
 */
async function merkezdenEsitle(){
  if (!DB.kurulumTamam) return [];   // kurulum bitince yeniden çağrılır
  let kurulan = 0, esitlenen = 0, calisanSayisi = 0, degisti = false;

  if (window.ArtifarmaKurulum){
    for (const k of ArtifarmaKurulum.bekleyenler('performans')){
      try {
        let ph = DB.pharmacies.find(x => (x.kod || '').toUpperCase() === String(k.id).toUpperCase());
        if (!ph){
          ph = eczaneKur(k.ad, k.sehir, k.eczaci, k.id);
          iz('Pharmacies', ph.id, 'ekle', 'eczane', '', k.ad + ' (merkezî kayıt)', ph.id);
          kurulan++;
        }
        await merkezSahipHesabi(ph, k);
        /* Emir yalnızca kayıt gerçekten oluştuktan sonra kapatılır;
           aksi hâlde eczane bir daha hiç kurulmaz. */
        ArtifarmaKurulum.tamamlandi('performans', k.id);
        degisti = true;
      } catch (e){
        console.error('[Performans] Eczane kurulamadı:', k.ad, e);
        tost('“' + k.ad + '” kurulamadı; araç yeniden açıldığında denenecek.', 'hata');
      }
    }

    /* "Tek kimliğe getir" emirleri — kaydı adından bulup kimliği taşırız. */
    for (const k of ArtifarmaKurulum.bekleyenler('performans', 'esle')){
      const ph = DB.pharmacies.find(x => sade(x.ad) === sade(k.ad));
      if (ph){
        ph.kod = k.id;
        await merkezSahipHesabi(ph, k);
        esitlenen++; degisti = true;
      }
      ArtifarmaKurulum.tamamlandi('performans', k.id);
    }
  }

  /* Bir eczanenin çalışan aktarımında çıkan sorun, kurulan eczanenin
     kaydedilmesini engellememeli; her eczane ayrı ayrı korunur. */
  for (const ph of DB.pharmacies.slice()){
    try {
      const n = await merkezCalisanlari(ph);
      if (n){ calisanSayisi += n; degisti = true; }
    } catch (e){
      console.error('[Performans] Çalışan aktarımı başarısız:', ph.ad, e);
      tost('“' + ph.ad + '” çalışanları aktarılamadı; eczane kaydı korundu.', 'hata');
    }
  }

  if (degisti) await yaz(true);
  const haber = [];
  if (kurulan)   haber.push(kurulan + ' eczane kuruldu');
  if (esitlenen) haber.push(esitlenen + ' eczane ortak kimliğe getirildi');
  if (calisanSayisi) haber.push(calisanSayisi + ' çalışan eklendi');
  if (haber.length) tost('Merkezî kayıttan ' + haber.join(', ') + '.', 'iyi');
  return haber;
}

      kontrol('Kapanmış dönemdeki değerlendirme kilitli', true, !!(ev0 && kilitli(ev0)));
    }
    const d1 = DB.evaluationPeriods.find(x => x.durum === 'acik');
    if (d1){
      const olayli = DB.criticalIncidents.find(o => o.donemId === d1.id && o.primEtkisi !== false);
      if (olayli) kontrol('Kritik olayı olan çalışanda prim engeli tespit edilir', true, kritikEngel(d1.id, olayli.employeeId).length > 0);
    }
    const ik = DB.users.find(u => u.rol === 'ik');
    const cal = DB.users.find(u => u.rol === 'calisan');
    if (cal){
      const eskiOturum = OTURUM;
      OTURUM = { userId: cal.id, phId: cal.phId, rol: 'calisan', ucretYetkisi: !!cal.ucretYetkisi, calisanId: cal.calisanId };
      kontrol('Çalışan seviyesindeki kullanıcı ücret verisini göremez', false, yetki('ucretGor'));
      kontrol('Çalışan seviyesindeki kullanıcı başkasının puanını değiştiremez', false, yetki('puanDegistir'));
      OTURUM = eskiOturum;
    }
    if (ik){
      const eskiOturum = OTURUM;
      OTURUM = { userId: ik.id, phId: ik.phId, rol: 'ik', ucretYetkisi: !!ik.ucretYetkisi, calisanId: null };
      kontrol('İK/Finans kullanıcısı performans puanını değiştiremez', false, yetki('puanDegistir'));
      kontrol('İK/Finans kullanıcısı prim ve ücret verisini görebilir', true, yetki('ucretGor'));
      OTURUM = eskiOturum;
    }
  }
  return s;
}

sayfa('testler', function(){
  const s = testleriCalistir();
  const gecen = s.filter(x => x.ok).length;
  let h = sayfaBas('Hesaplama Testleri',
    'Şartnamede istenen doğrulamalar her açılışta yeniden çalıştırılır. Formüller değiştirilirse bu ekran hatayı hemen gösterir.');
  h += '<div class="ozet">' +
    ozetKart('Toplam test', String(s.length), 'hesaplama ve yetki kuralı') +
    ozetKart('Geçen', String(gecen), 'doğrulandı', 'iyi') +
    ozetKart('Kalan', String(s.length - gecen), (s.length - gecen) ? 'inceleyin' : 'sorun yok', (s.length - gecen) ? 'vurgu' : 'iyi') +
    '</div>';
  h += '<div class="kart"><div class="tablo-sar"><table><thead><tr><th>Durum</th><th>Test</th><th>Beklenen</th><th>Bulunan</th></tr></thead><tbody>' +
    s.map(x => '<tr><td>' + (x.ok ? '<span class="rz rz-yesil">Geçti</span>' : '<span class="rz rz-kirmizi">Kaldı</span>') + '</td>' +
      '<td class="kucuk">' + esc(x.ad) + '</td><td class="kucuk sayi">' + esc(JSON.stringify(x.beklenen)) + '</td>' +
      '<td class="kucuk sayi">' + esc(JSON.stringify(x.gercek)) + '</td></tr>').join('') +
    '</tbody></table></div></div>';
  return h;
});

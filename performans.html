/* =========================================================
   17. DOSYA OKUMA — Excel (.xlsx) ve CSV
   Excel dosyası bir zip arşividir; tarayıcının DecompressionStream
   desteğiyle dış kütüphane olmadan açılır.
   ========================================================= */
async function zipAc(dosya){
  const veri = new Uint8Array(await dosya.arrayBuffer());
  const gv = new DataView(veri.buffer);
  let eocd = -1;
  for (let i = veri.length - 22; i >= Math.max(0, veri.length - 66000); i--){
    if (gv.getUint32(i, true) === 0x06054b50){ eocd = i; break; }
  }
  if (eocd < 0) throw new Error('Geçerli bir Excel/zip dosyası değil.');
  const adet = gv.getUint16(eocd + 10, true);
  let p = gv.getUint32(eocd + 16, true);
  const cikti = {};
  const coz = [];
  for (let i = 0; i < adet; i++){
    if (gv.getUint32(p, true) !== 0x02014b50) break;
    const yontem = gv.getUint16(p + 10, true);
    const boy    = gv.getUint32(p + 20, true);
    const adUz   = gv.getUint16(p + 28, true);
    const ekUz   = gv.getUint16(p + 30, true);
    const yorumUz= gv.getUint16(p + 32, true);
    const yerel  = gv.getUint32(p + 42, true);
    const ad = new TextDecoder().decode(veri.subarray(p + 46, p + 46 + adUz));
    const yAdUz = gv.getUint16(yerel + 26, true);
    const yEkUz = gv.getUint16(yerel + 28, true);
    const bas = yerel + 30 + yAdUz + yEkUz;
    coz.push({ ad, yontem, parca: veri.subarray(bas, bas + boy) });
    p += 46 + adUz + ekUz + yorumUz;
  }
  for (const e of coz){
    if (e.yontem === 0){ cikti[e.ad] = new TextDecoder().decode(e.parca); continue; }
    if (e.yontem !== 8) continue;
    if (typeof DecompressionStream !== 'function') throw new Error('Bu tarayıcı sıkıştırılmış Excel dosyası açamıyor. Dosyayı CSV olarak kaydedip yükleyin.');
    const ds = new DecompressionStream('deflate-raw');
    const s = new Blob([e.parca]).stream().pipeThrough(ds);
    cikti[e.ad] = await new Response(s).text();
  }
  return cikti;
}

/** .xlsx → [{ad, satirlar:[[hücre,…],…]}] */
async function excelOku(dosya){
  const z = await zipAc(dosya);
  const ns = 'http://schemas.openxmlformats.org/spreadsheetml/2006/main';
  const ayr = new DOMParser();
  const paylasilan = [];
  if (z['xl/sharedStrings.xml']){
    const d = ayr.parseFromString(z['xl/sharedStrings.xml'], 'application/xml');
    Array.from(d.getElementsByTagNameNS(ns, 'si')).forEach(si => {
      paylasilan.push(Array.from(si.getElementsByTagNameNS(ns, 't')).map(t => t.textContent).join(''));
    });
  }
  const wb = ayr.parseFromString(z['xl/workbook.xml'], 'application/xml');
  const rels = ayr.parseFromString(z['xl/_rels/workbook.xml.rels'], 'application/xml');
  const rMap = {};
  Array.from(rels.getElementsByTagName('Relationship')).forEach(r => rMap[r.getAttribute('Id')] = r.getAttribute('Target'));
  const sonuc = [];
  Array.from(wb.getElementsByTagNameNS(ns, 'sheet')).forEach(sh => {
    const rid = sh.getAttribute('r:id') || sh.getAttributeNS('http://schemas.openxmlformats.org/officeDocument/2006/relationships', 'id');
    let hedef = rMap[rid] || '';
    if (hedef && hedef.indexOf('xl/') !== 0) hedef = 'xl/' + hedef.replace(/^\//, '');
    const xml = z[hedef];
    if (!xml) return;
    const ws = ayr.parseFromString(xml, 'application/xml');
    const satirlar = [];
    Array.from(ws.getElementsByTagNameNS(ns, 'row')).forEach(row => {
      const s = [];
      Array.from(row.getElementsByTagNameNS(ns, 'c')).forEach(c => {
        const ref = c.getAttribute('r') || '';
        const sutun = sutunNo(ref.replace(/[0-9]/g, ''));
        const t = c.getAttribute('t');
        const v = c.getElementsByTagNameNS(ns, 'v')[0];
        const isEl = c.getElementsByTagNameNS(ns, 'is')[0];
        let deger = '';
        if (isEl) deger = Array.from(isEl.getElementsByTagNameNS(ns, 't')).map(x => x.textContent).join('');
        else if (v) deger = t === 's' ? (paylasilan[Number(v.textContent)] || '') : v.textContent;
        if (sutun >= 0) s[sutun] = String(deger).trim();
      });
      satirlar.push(s);
    });
    sonuc.push({ ad: sh.getAttribute('name'), satirlar });
  });
  return sonuc;
}
function sutunNo(harfler){
  if (!harfler) return -1;
  let n = 0;
  for (const h of harfler.toUpperCase()) n = n * 26 + (h.charCodeAt(0) - 64);
  return n - 1;
}

/** CSV/TSV → [[hücre,…],…]  (ayırıcı otomatik bulunur) */
function csvOku(metin){
  metin = metin.replace(/^﻿/, '');
  const ilk = metin.split(/\r?\n/)[0] || '';
  const ayirici = (ilk.split(';').length > ilk.split(',').length)
    ? ';' : (ilk.split('\t').length > ilk.split(',').length ? '\t' : ',');
  const satirlar = [];
  let s = [], h = '', tirnak = false;
  for (let i = 0; i < metin.length; i++){
    const c = metin[i];
    if (tirnak){
      if (c === '"'){ if (metin[i + 1] === '"'){ h += '"'; i++; } else tirnak = false; }
      else h += c;
    } else if (c === '"') tirnak = true;
    else if (c === ayirici){ s.push(h.trim()); h = ''; }
    else if (c === '\n'){ s.push(h.trim()); satirlar.push(s); s = []; h = ''; }
    else if (c !== '\r') h += c;
  }
  if (h.length || s.length){ s.push(h.trim()); satirlar.push(s); }
  return satirlar.filter(x => x.some(y => y !== ''));
}

/** Görev kategorisi kriterleri otomatik puanlıdır; kayıt değişince yenilenir. */
function gorevPuanlariniTazele(donemId, employeeId){
  const ev = DB.evaluations.find(e => e.donemId === donemId && e.employeeId === employeeId && !e.iptal);
  if (!ev || kilitli(ev)) return;
  DB.evaluationItems.filter(i => i.evalId === ev.id && i.otomatik).forEach(i => {
    const r = gorevKatPuani(donemId, employeeId, i.katId, ev.phId);
    const yeni = r.puan == null ? 'D' : String(enYakinOlcek(r.puan));
    if (i.yonPuan !== yeni){
      iz('EvaluationItems', i.id, 'guncelle', i.ad, i.yonPuan, yeni, ev.phId);
      i.yonPuan = yeni;
      i.gozlem = r.adet ? (r.adet + ' görev kaydının ağırlıklı ortalaması: ' + say2(r.puan)) : 'Bu dönemde bu kategoride görev kaydı yok.';
    }
  });
}

    ayak: '<button class="d d-cizgi" data-kapat>Vazgeç</button><button class="d d-ana" id="icTamam" disabled>İçe aktar</button>'
  });
  let cozum = null;
  $('#icDosya', k).onchange = async (e) => {

      }

}

/** Satır dizisini görev nesnelerine çevirir; iki biçim de desteklenir. */
function gorevleriCoz(satirlar){
  const bul = (h) => {
    const s = sade(h);
    for (const alan of Object.keys(BASLIK_ESLESME)) if (BASLIK_ESLESME[alan].indexOf(s) >= 0) return alan;
    return null;
  };
  let basSatir = -1, harita = {};
  for (let i = 0; i < Math.min(satirlar.length, 25); i++){
    const h = {};
    let vurus = 0;
    satirlar[i].forEach((c, ix) => { const a = bul(c); if (a && h[a] === undefined){ h[a] = ix; vurus++; } });
    if (vurus >= 3){ basSatir = i; harita = h; break; }
  }
  const ekip = ait('employees');
  const kisiBul = (ad) => {
    if (!ad) return null;
    const s = sade(ad);
    const t = ekip.find(e => sade(e.ad) === s) || ekip.find(e => sade(e.ad).split(' ')[0] === s);
    return t ? t.id : null;
  };
  const gorevler = [], kategoriler = [], eslesmeyen = [];
  const katEkle = (ad) => { if (ad && kategoriler.indexOf(ad) < 0) kategoriler.push(ad); };

  if (basSatir >= 0 && harita.aciklama !== undefined){
    let sonKat = '';
    for (let i = basSatir + 1; i < satirlar.length; i++){
      const r = satirlar[i];
      const al = (a) => harita[a] === undefined ? '' : (r[harita[a]] || '').trim();
      const aciklama = al('aciklama');
      // Kategori satırı: "1. REÇETE İŞLEMLERİ" gibi, görev açıklaması boş olan satır
      const kategoriBasligi = ((r[0] || '').trim().match(/^(\d+)[.)]\s+(.+)$/) || [])[2];
      if (!aciklama){ if (kategoriBasligi){ sonKat = kategoriBasligi.trim(); katEkle(sonKat); } continue; }
      const kat = al('kat') || sonKat; sonKat = kat || sonKat;
      katEkle(kat);
      const asilAd = al('asil');
      const asil = kisiBul(asilAd);
      if (asilAd && !asil && eslesmeyen.indexOf(asilAd) < 0) eslesmeyen.push(asilAd);
      gorevler.push({
        no: Number(al('no')) || gorevler.length + 1, kat, aciklama,
        siklik: siklikDuzelt(al('siklik')), asil, yedek: kisiBul(al('yedek')), kontrol: kisiBul(al('kontrol')),
        kritik: /evet|1|kritik|x/i.test(al('kritik')),
        standart: al('standart'), kanit: al('kanit') || 'Kontrol listesi',
        aktif: !/pasif|hayır|0/i.test(al('aktif'))
      });
    }
    return { gorevler, kategoriler, eslesmeyen, bicim:'baslik' };
  }

  // "Görev Dağılımı" biçimi: kategori satırı "1. REÇETE İŞLEMLERİ", görev satırı "12 | ... | Günlük | Kişi"
  let sonKat = '';
  satirlar.forEach(r => {
    const a = (r[0] || '').trim(), b = (r[1] || '').trim(), c = (r[2] || '').trim(), dd = (r[3] || '').trim();
    const km = a.match(/^(\d+)[.)]\s+(.+)$/);
    if (km && !b){ sonKat = km[2].trim(); katEkle(sonKat); return; }
    if (/^\d+$/.test(a) && b){
      const asil = kisiBul(dd);
      if (dd && !asil && eslesmeyen.indexOf(dd) < 0) eslesmeyen.push(dd);
      katEkle(sonKat);
      gorevler.push({ no: Number(a), kat: sonKat, aciklama: b, siklik: siklikDuzelt(c),
        asil, yedek:null, kontrol:null, kritik:false, standart:'', kanit:'Kontrol listesi', aktif:true });
    }
  });
  return { gorevler, kategoriler, eslesmeyen, bicim:'dagilim' };
}
function siklikDuzelt(s){
  const t = sade(s);
  if (t.indexOf('gün') >= 0) return 'Günlük';
  if (t.indexOf('haft') >= 0) return 'Haftalık';
  if (t.indexOf('ay') >= 0) return 'Aylık';
  return 'Günlük';
}

function gorevleriKur(cozum, mod){
  const phId = aktifEczaneId();
  if (mod === 'degistir'){
    const silinen = ait('tasks').map(g => g.id);
    DB.tasks = DB.tasks.filter(g => g.phId !== phId);
    DB.taskAssignments = DB.taskAssignments.filter(a => silinen.indexOf(a.taskId) < 0);
    iz('Tasks', phId, 'sil', 'gorevBankasi', silinen.length + ' görev', '');
  }
  // Kategoriler
  cozum.kategoriler.forEach(ad => {
    if (!ait('taskCategories').some(k => sade(k.ad) === sade(ad))){
      const no = Math.max(0, ...ait('taskCategories').map(k => k.no)) + 1;
      DB.taskCategories.push({ id: uid('kat'), phId, no, ad, aktif: true });
    }
  });
  const katBul = (ad) => {
    const k = ait('taskCategories').find(x => sade(x.ad) === sade(ad));
    return k ? k.id : (ait('taskCategories')[0] || {}).id;
  };
  let sayi = 0;
  cozum.gorevler.forEach(g => {
    let mevcut = ait('tasks').find(x => x.no === g.no);
    const v = {
      no: g.no, katId: katBul(g.kat), aciklama: g.aciklama, siklik: g.siklik,
      kritik: g.kritik, standart: g.standart, kanitTuru: g.kanit, aktif: g.aktif
    };
    if (mevcut) Object.assign(mevcut, v);
    else { mevcut = Object.assign({ id: uid('gor'), phId, asilId:null, yedekId:null, kontrolId:null }, v); DB.tasks.push(mevcut); }
    gorevAta(mevcut, g.asil || mevcut.asilId, g.yedek || mevcut.yedekId, g.kontrol || mevcut.kontrolId, true);
    sayi++;
  });
  // Görev kategorisi kriterlerini yeni kategorilerle eşitle
  gorevKriterleriniEsitle(phId);
  iz('Tasks', phId, 'ekle', 'gorevBankasi', '', sayi + ' görev içe aktarıldı (' + mod + ')');
  return sayi;
}
/** Kategori eklendiğinde/silindiğinde görev bölümü kriterleri güncellenir. */
function gorevKriterleriniEsitle(phId){
  const kats = ait('taskCategories', phId);
  const mevcut = DB.competencyCriteria.filter(k => k.phId === phId && k.bolum === 'gorev');
  kats.forEach((kt, i) => {
    let k = mevcut.find(x => x.katId === kt.id);
    if (!k){
      k = kriterYap(phId, null, 'gorev', [kt.ad, 'Bu kategorideki görevler tanımlı sıklıkta, doğru ve kayıtlı biçimde tamamlanır.', 0, 0, 1], 1000 + i);
      k.katId = kt.id; k.otomatik = true;
      DB.competencyCriteria.push(k);
    } else k.ad = kt.ad;
  });
  mevcut.forEach(k => { if (!kats.some(x => x.id === k.katId)) k.aktif = false; });
  // Ağırlıkları %100'e tamamla
  const aktifler = DB.competencyCriteria.filter(k => k.phId === phId && k.bolum === 'gorev' && k.aktif !== false);
  if (aktifler.length){
    const pay = Math.floor(100 / aktifler.length * 100) / 100;
    aktifler.forEach((k, i) => { k.agirlik = i === aktifler.length - 1 ? Math.round((100 - pay * (aktifler.length - 1)) * 100) / 100 : pay; });
  }
}

function donemKip(d){
  const k = kip({
    baslik: d ? 'Dönemi düzenle' : 'Yeni değerlendirme dönemi',
    govde:
      '<div class="alan"><label>Dönem adı</label><input type="text" id="dAd" value="' + esc(d ? d.ad : (new Date().getFullYear() + ' · ' + (new Date().getMonth() < 6 ? '1' : '2') + '. Yarıyıl')) + '"></div>' +
      '<div class="izgara"><div class="alan"><label>Başlangıç</label><input type="date" id="dBas" value="' + esc(d ? d.baslangic : bugun()) + '"></div>' +
      '<div class="alan"><label>Bitiş</label><input type="date" id="dBit" value="' + esc(d ? d.bitis : gunEkle(bugun(), 180)) + '"></div>' +
      '<div class="alan"><label>Eczane hedef gerçekleşme oranı (%)</label><input type="number" id="dHedef" step="0.1" value="' + (d ? d.genelHedefOrani : 100) + '"></div></div>' +
      (d ? '' : '<label class="onay"><input type="checkbox" id="dOtomatik" checked><span>Tüm aktif çalışanlar için değerlendirme taslağı oluştur</span></label>'),
    ayak: '<button class="d d-cizgi" data-kapat>Vazgeç</button><button class="d d-ana" id="dTamam">Kaydet</button>'
  });
  $('#dTamam', k).onclick = async () => {
    const ad = $('#dAd', k).value.trim(), bas = $('#dBas', k).value, bit = $('#dBit', k).value;
    if (ad.length < 3) return tost('Dönem adı giriniz.', 'hata');
    if (!bas || !bit || bit < bas) return tost('Tarih aralığı geçersiz.', 'hata');
    if (d){
      if (d.durum === 'kapali') return tost('Kapatılmış dönem değiştirilemez.', 'hata');
      iz('EvaluationPeriods', d.id, 'guncelle', 'donem', d.ad, ad);
      Object.assign(d, { ad, baslangic: bas, bitis: bit, genelHedefOrani: Number($('#dHedef', k).value) || 100 });
    } else {
      const yeni = donemOlustur(aktifEczaneId(), ad, bas, bit);
      yeni.genelHedefOrani = Number($('#dHedef', k).value) || 100;
      SECILI_DONEM = yeni.id;
      if ($('#dOtomatik', k).checked){
        ait('employees').filter(e => e.aktif !== false).forEach(e => degerlendirmeOlustur(yeni.id, e.id, null));
      }
    }
    await yaz(true); kipKapat(); cizIcerik(); tost('Kaydedildi.', 'iyi');
  };
}

function donemKapat(d){
  const dl = ait('evaluations').filter(e => e.donemId === d.id && !e.iptal);
  const eksik = dl.filter(e => asamaSira(e.durum) < asamaSira('onayli'));
  onayIste('Dönemi kapat',
    '<b>' + esc(d.ad) + '</b> kapatılacak ve tüm kayıtları kilitlenecek. Kapalı dönemde puan, prim ve ücret bilgisi değiştirilemez; ' +
    'düzeltme gerekirse yeni revizyon oluşturulur.' +
    (eksik.length ? '<div class="bilgi bilgi-sari mt"><b>' + eksik.length + ' değerlendirme</b> henüz “Yönetici tarafından onaylandı” aşamasına gelmedi. ' +
      'Yine de kapatırsanız bu kayıtlar bulundukları aşamada kilitlenir.</div>' : ''),
    'Dönemi kapat ve kilitle', async () => {
      d.durum = 'kapali';
      d.kapatmaTarihi = simdi();
      d.kapatan = (kullanici(OTURUM.userId) || {}).ad || '';
      dl.forEach(e => { e.durum = 'kapali'; e.kilitli = true; });
      iz('EvaluationPeriods', d.id, 'kapat', 'durum', 'acik', 'kapali');
      await yaz(true); cizIcerik(); tost('Dönem kapatıldı ve kilitlendi.', 'iyi');
    });
}

/** Kapanmış dönemde düzeltme: eski kayıt korunur, yeni revizyon açılır. */
function revizyonKip(d){
  const dl = ait('evaluations').filter(e => e.donemId === d.id && !e.iptal);
  const k = kip({
    baslik: 'Revizyon oluştur',
    govde:
      '<div class="bilgi bilgi-sari">Kapanmış dönem değiştirilemez. Düzeltme için seçtiğiniz değerlendirmenin ' +
      '<b>yeni bir revizyonu</b> oluşturulur; eski kayıt olduğu gibi korunur ve geçmişte görünmeye devam eder.</div>' +
      '<div class="alan"><label>Değerlendirme</label><select id="rvSec">' +
      dl.map(e => '<option value="' + e.id + '">' + esc(calisanAd(e.employeeId)) + ' · rev.' + e.revizyon + '</option>').join('') + '</select></div>' +
      '<div class="alan"><label>Revizyon gerekçesi</label><textarea id="rvNot" rows="3" placeholder="Neden düzeltme gerekiyor?"></textarea></div>',
    ayak: '<button class="d d-cizgi" data-kapat>Vazgeç</button><button class="d d-ana" id="rvTamam">Revizyon aç</button>'
  });
  $('#rvTamam', k).onclick = async () => {
    const eski = DB.evaluations.find(e => e.id === $('#rvSec', k).value);
    const gerekce = $('#rvNot', k).value.trim();
    if (!eski) return;
    if (!gerekce) return tost('Revizyon gerekçesi zorunludur.', 'hata');
    const yeni = Object.assign({}, eski, {
      id: uid('deg'), revizyon: (eski.revizyon || 1) + 1, revizyonKaynak: eski.id,
      revizyonGerekce: gerekce, durum: 'yonetici', kilitli: false, olusturma: simdi(),
      onaylayanId: null, onayTarihi: null
    });
    DB.evaluations.push(yeni);
    DB.evaluationItems.filter(i => i.evalId === eski.id).forEach(i => {
      DB.evaluationItems.push(Object.assign({}, i, { id: uid('kal'), evalId: yeni.id }));
    });
    const gb = DB.feedbackRecords.find(f => f.evalId === eski.id);
    if (gb) DB.feedbackRecords.push(Object.assign({}, gb, { id: uid('gb'), evalId: yeni.id, okudum: false, okuduTarih: null }));
    eski.iptal = true; eski.iptalNot = 'Revizyon ' + yeni.revizyon + ' ile değiştirildi.';
    iz('Evaluations', yeni.id, 'ekle', 'revizyon', 'rev.' + eski.revizyon, 'rev.' + yeni.revizyon + ' · ' + gerekce);
    await yaz(true); kipKapat(); git('degerlendirme', yeni.id);
    tost('Revizyon açıldı. Eski kayıt korunuyor.', 'iyi');
  };
}

sayfa('degerlendirmeler', function(){
  const d = secilenDonem();
  if (!d) return sayfaBas('Değerlendirmeler', '') +
    '<div class="kart"><h3>Dönem yok</h3><p class="sessiz">Önce <a href="#" data-git="donemler">Dönemler</a> ekranından bir değerlendirme dönemi açın.</p></div>';

  let kayitlar = ait('evaluations').filter(e => e.donemId === d.id && !e.iptal && ekip.some(c => c.id === e.employeeId));
  // İK/Finans yalnızca onaylanmış sonuçları görür; puanları değiştiremez.
  if (OTURUM.rol === 'ik') kayitlar = kayitlar.filter(e => asamaSira(e.durum) >= asamaSira('onayli'));

  let h = sayfaBas(OTURUM.rol === 'ik' ? 'Onaylanmış Değerlendirme Sonuçları' : 'Değerlendirmeler',
    (OTURUM.rol === 'ik' ? 'Yalnızca onaylanmış sonuçlar listelenir; puanlar bu ekrandan değiştirilemez.<br>' : '') +
    esc(d.ad) + ' · ' + tarihTR(d.baslangic) + ' – ' + tarihTR(d.bitis) +
    (d.durum === 'kapali' ? ' · <b>dönem kapalı, kayıtlar kilitli</b>' : ''),
    donemSecici() + (yetki('degerlendir') && d.durum === 'acik' ? '<button class="d d-ana" id="dgEkle">Değerlendirme aç</button>' : ''));

  h += '<div class="kart"><div class="tablo-sar"><table><thead><tr><th>Çalışan</th><th>Pozisyon</th>' +
    '<th>Aşama</th><th class="sayi">Öz</th><th class="sayi">Yönetici</th><th class="sayi">Fark</th>' +
    '<th>Kapsam</th><th class="sayi">Katsayı</th><th></th></tr></thead><tbody>' +
    (kayitlar.length ? kayitlar.map(e => {
      const z = ozetle(e);
      const fark = (z.genel != null && z.ozGenel != null) ? Math.round((z.ozGenel - z.genel) * 100) / 100 : null;
      return '<tr><td><b>' + esc(calisanAd(e.employeeId)) + '</b>' + (e.revizyon > 1 ? ' <span class="rz rz-turuncu">rev.' + e.revizyon + '</span>' : '') + '</td>' +
        '<td class="kucuk sessiz">' + esc(pozisyonAd(e.roleId)) + '</td>' +
        '<td>' + asamaRozet(e.durum) + '</td>' +
        '<td class="sayi">' + (z.ozGenel == null ? '—' : say2(z.ozGenel)) + '</td>' +
        '<td class="sayi"><b>' + (z.genel == null ? '—' : say2(z.genel)) + '</b></td>' +
        '<td class="sayi">' + (fark == null ? '—' : (fark > 0 ? '+' : '') + say2(fark)) + '</td>' +
        '<td>' + (z.kapsam.yeterli
            ? '<span class="rz rz-yesil">%' + say2(z.kapsam.oran) + '</span>'
            : '<span class="rz rz-kirmizi">%' + say2(z.kapsam.oran) + ' · yetersiz</span>') + '</td>' +
        '<td class="sayi">' + (z.katsayi == null ? '<span class="soluk">—</span>' : say2(z.katsayi)) + '</td>' +
        '<td><button class="d d-ana d-kk" data-dgac="' + e.id + '">Aç</button></td></tr>';
    }).join('') : '<tr><td colspan="9">' + bosDurum('Bu dönemde değerlendirme yok.') + '</td></tr>') +
    '</tbody></table></div></div>';

  const eksikler = ekip.filter(c => !kayitlar.some(e => e.employeeId === c.id));
  if (eksikler.length && yetki('degerlendir') && d.durum === 'acik'){
    h += '<div class="bilgi bilgi-sari"><b>' + eksikler.length + ' çalışan için değerlendirme açılmamış:</b> ' +
      esc(eksikler.map(c => c.ad).join(', ')) + ' <button class="d d-cizgi d-kk" id="dgHepsi">Hepsi için aç</button></div>';
  }
  return h;
}, function(){
  donemSeciciBagla();
  $$('[data-dgac]').forEach(b => b.onclick = () => git('degerlendirme', b.dataset.dgac));
  const e = $('#dgEkle'); if (e) e.onclick = degerlendirmeAcKip;
  const t = $('#dgHepsi');
  if (t) t.onclick = async () => {
    const d = secilenDonem();
    gorulebilirCalisanlar().forEach(c => degerlendirmeOlustur(d.id, c.id, OTURUM.calisanId || null));
    await yaz(true); cizIcerik(); tost('Değerlendirmeler açıldı.', 'iyi');
  };
});

function degerlendirmeAcKip(){
  const d = secilenDonem();
  const ekip = gorulebilirCalisanlar().filter(c => !DB.evaluations.some(e => e.donemId === d.id && e.employeeId === c.id && !e.iptal));
  if (!ekip.length) return tost('Tüm çalışanlar için değerlendirme zaten açık.', 'hata');
  const k = kip({
    baslik: 'Değerlendirme aç',
    govde: '<div class="alan"><label>Çalışan</label><select id="daKisi">' +
      ekip.map(c => '<option value="' + c.id + '">' + esc(c.ad) + ' · ' + esc(pozisyonAd(c.roleId)) + '</option>').join('') + '</select></div>' +
      '<div class="bilgi bilgi-gri">Değerlendirme kalemleri, çalışanın pozisyonuna tanımlı kriter setinden üretilir.</div>',
    ayak: '<button class="d d-cizgi" data-kapat>Vazgeç</button><button class="d d-ana" id="daTamam">Aç</button>'
  });
  $('#daTamam', k).onclick = async () => {
    const ev = degerlendirmeOlustur(d.id, $('#daKisi', k).value, OTURUM.calisanId || null);
    await yaz(true); kipKapat(); git('degerlendirme', ev.id);
  };
}

/* =========================================================
   21. DEĞERLENDİRME FORMU
   ========================================================= */
let ACIK_BOLUMLER = { disiplin:true, yetkinlik:false, gorev:false, hedef:false };

sayfa('degerlendirme', function(){
  const ev = DB.evaluations.find(e => e.id === SAYFA_ARG);
  if (!ev) return '<div class="kart">Değerlendirme bulunamadı. <a href="#" data-git="degerlendirmeler">Listeye dön</a></div>';
  const c = calisan(ev.employeeId), d = donem(ev.donemId);
  if (!calisanGorulebilir(ev.employeeId)) return '<div class="kart">Bu değerlendirmeyi görme yetkiniz yok.</div>';

  const kendisi = OTURUM.rol === 'calisan' && OTURUM.calisanId === ev.employeeId;
  const yonetici = yetki('puanDegistir') && !kendisi;
  const kilit = kilitli(ev);
  const yoneticiGorunur = yonetici || asamaSira(ev.durum) >= asamaSira('gorusuldu');
  const z = ozetle(ev);
  const onc = oncekiGenel(ev.employeeId, ev.donemId);
  const kalemler = DB.evaluationItems.filter(i => i.evalId === ev.id);
  const gb = DB.feedbackRecords.find(f => f.evalId === ev.id) || {};

  let h = sayfaBas(c.ad + ' · ' + d.ad,
    esc(pozisyonAd(ev.roleId)) + ' · ' + tarihTR(d.baslangic) + ' – ' + tarihTR(d.bitis) +
    (ev.revizyon > 1 ? ' · <b>revizyon ' + ev.revizyon + '</b>' : '') +
    (kilit ? ' · <b>kilitli</b>' : ''),
    '<button class="d d-cizgi" data-git="' + (kendisi ? 'panel' : 'degerlendirmeler') + '">Geri</button>' +
    '<button class="d d-cizgi" id="dfYapayZeka">Yapay zekâ yardımcısı</button>' +
    '<button class="d d-cizgi" id="dfRapor">Rapor</button>');

  if (kilit) h += '<div class="bilgi bilgi-gri"><b>Bu kayıt kilitli.</b> ' +
    (d.durum === 'kapali' ? 'Dönem kapatıldı. ' : '') + 'Düzeltme için Dönemler ekranından yeni revizyon oluşturun.</div>';
  if (ev.revizyonGerekce) h += '<div class="bilgi bilgi-sari"><b>Revizyon gerekçesi:</b> ' + esc(ev.revizyonGerekce) + '</div>';

  h += adimCubugu(ev.durum);

  h += '<div class="ozet" id="dfOzet">' + ozetIcerik(ev, z, onc, yoneticiGorunur) + '</div>';

  if (!z.kapsam.yeterli && yoneticiGorunur)
    h += '<div class="bilgi bilgi-kirmizi" id="dfKapsam"><b>Yetersiz değerlendirme verisi.</b> ' +
      'Zorunlu kriterlerin en az %' + say2(z.kapsamEsigi) + '’i puanlanmalıdır; şu an %' + say2(z.kapsam.oran) +
      ' (' + z.kapsam.degerlendirilen + '/' + z.kapsam.zorunlu + '). Bu nedenle prim katsayısı hesaplanmaz.</div>';

  // Bölümler
  BOLUMLER.forEach(b => {
    const liste = kalemler.filter(i => i.bolum === b.kod);
    if (!liste.length) return;
    const bp = z.bolumler[b.kod], det = z.detay[b.kod];
    const agToplam = liste.reduce((t, i) => t + i.agirlik, 0);
    h += '<details class="acilir"' + (ACIK_BOLUMLER[b.kod] ? ' open' : '') + ' data-bolum="' + b.kod + '">' +
      '<summary><span>' + esc(b.ad) + '</span>' +
      '<span class="rz rz-lacivert">Bölüm ağırlığı %' + say2(z.agirliklar[b.kod]) + '</span>' +
      (yoneticiGorunur ? '<span class="rz ' + (bp == null ? 'rz-gri' : (bp >= 3 ? 'rz-yesil' : (bp >= 2.5 ? 'rz-mavi' : 'rz-turuncu'))) + '">' +
        (bp == null ? 'puanlanmadı' : 'Puan ' + say2(bp)) + '</span>' : '') +
      '<span class="rz rz-gri">' + det.sayi + '/' + det.toplam + ' puanlandı</span>' +
      '<span class="ok">›</span></summary><div class="acilir-govde">' +
      (Math.abs(agToplam - 100) > 0.01 ? '<div class="bilgi bilgi-sari">Bu bölümdeki kriter ağırlıkları toplamı %' + say2(agToplam) +
        '. Puan yine de yalnızca puanlanan kriterlerin ağırlıklarına bölünerek hesaplanır, ancak ağırlıkları %100’e tamamlamanız önerilir.</div>' : '') +
      (b.kod === 'gorev' ? '<div class="bilgi bilgi-mavi">Bu bölümün puanları görev bankası kayıtlarından otomatik gelir. ' +
        'Gerekirse elle değiştirebilirsiniz; yeni görev kaydı eklendiğinde otomatik değer yeniden yazılır.</div>' : '') +
      liste.map(i => kalemHtml(i, { kendisi, yonetici, kilit, yoneticiGorunur })).join('') +
      '</div></details>';
  });

  // Alt işlem çubuğu
  h += '<div class="kart yazdirma-gizle"><div class="satir">' +
    (kendisi && !kilit && asamaSira(ev.durum) < asamaSira('yonetici')
      ? '<button class="d d-ana" id="dfOzBitir">Öz değerlendirmemi tamamla</button>' : '') +
    (yonetici && !kilit ? '<button class="d d-ana" id="dfYonBitir">Yönetici değerlendirmesini tamamla</button>' : '') +
    (yonetici && !kilit ? '<button class="d d-cizgi" id="dfGorusme">Geri bildirim toplantısı</button>' : '') +
    (!kendisi ? '<button class="d d-cizgi" id="dfPlan">Gelişim planı</button>' : '') +
    (yetki('onayla') && !kilit && asamaSira(ev.durum) >= asamaSira('gorusuldu')
      ? '<button class="d d-yesil" id="dfOnay">Değerlendirmeyi onayla ve kapat</button>' : '') +
    (kendisi && gb.okudum ? '<span class="rz rz-yesil">Okudum onayı verildi · ' + tarihSaatTR(gb.okuduTarih) + '</span>' :
      (kendisi && asamaSira(ev.durum) >= asamaSira('gorusuldu') ? '<button class="d d-kirmizi" id="dfOkudum">Okudum</button>' : '')) +
    '</div>' +
    (kendisi ? '<p class="kucuk sessiz mt">“Okudum” onayı, geri bildirimin size iletildiğini gösterir; ' +
      'puanların tamamını kabul ettiğiniz anlamına gelmez. Katılmadığınız konuları “Çalışanın görüşü” alanına yazabilirsiniz.</p>' : '') +
    '</div>';

  return h;
}, function(){ degerlendirmeBagla(); });

function ozetIcerik(ev, z, onc, yoneticiGorunur){
  return (yoneticiGorunur ? ozetKart('Genel performans', z.genel == null ? '—' : say2(z.genel), '4,00 üzerinden', z.genel != null && z.genel >= 3 ? 'iyi' : (z.genel != null && z.genel < 2.5 ? 'uyar' : '')) : '') +
    ozetKart('Öz değerlendirme', z.ozGenel == null ? '—' : say2(z.ozGenel), 'çalışanın kendi puanı') +
    ozetKart('Önceki dönem', onc ? say2(onc.puan) : '—', onc ? esc(onc.donem.ad) : 'kayıt yok') +
    (yoneticiGorunur ? ozetKart('Prim katsayısı', z.katsayi == null ? '—' : say2(z.katsayi),
      z.katsayi == null ? 'kapsam yetersiz' : esc((z.katsayiSatir || {}).ad || ''), z.katsayi === 0 ? 'vurgu' : '') : '') +
    ozetKart('Kapsam', say2(z.kapsam.oran) + '%', z.kapsam.degerlendirilen + '/' + z.kapsam.zorunlu + ' zorunlu kriter',
      z.kapsam.yeterli ? 'iyi' : 'uyar');
}

function kalemHtml(i, m){
  const oz = puanDegeri(i.ozPuan), yon = puanDegeri(i.yonPuan);
  const fark = (oz != null && yon != null) ? Math.round((oz - yon) * 100) / 100 : null;
  const dugmeler = (alan, secili, pasif) => '<div class="puanlar">' + OLCEK.map(o =>
    '<button class="puan-d ' + (String(secili) === o.kod ? (o.kod === 'D' ? 'd-secili' : 'secili') : '') + '"' +
    (pasif ? ' disabled' : '') + ' data-puan="' + i.id + '|' + alan + '|' + o.kod + '" title="' + esc(o.ad) + '">' +
    (o.kod === 'D' ? 'D' : say2(Number(o.kod)).replace(',00', '')) + '</button>').join('') + '</div>';

  const alanKutu = (alan, etiket, deger, pasif, ipucu) =>
    '<div class="alan"><label>' + etiket + '</label>' +
    '<textarea rows="2" data-metin="' + i.id + '|' + alan + '"' + (pasif ? ' disabled' : '') + ' placeholder="' + esc(ipucu || '') + '">' + esc(deger || '') + '</textarea></div>';

  let h = '<div class="kart sik" data-kalem="' + i.id + '">' +
    '<div class="kart-bas"><div class="buyu"><b>' + esc(i.ad) + '</b>' +
    (i.kritik ? ' <span class="rz rz-kirmizi">Kritik</span>' : '') +
    (i.zorunlu ? '' : ' <span class="rz rz-gri">Durumsal</span>') +
    (i.otomatik ? ' <span class="rz rz-mavi">Görev kaydından</span>' : '') +
    '<div class="kucuk sessiz">' + esc(i.beklenen) + '</div></div>' +
    '<span class="rz rz-lacivert">Ağırlık %' + say2(i.agirlik) + '</span></div>' +
    '<div class="izgara-2">';

  h += '<div><div class="et-ust">Çalışanın öz değerlendirmesi</div>' +
    dugmeler('ozPuan', i.ozPuan, !(m.kendisi && !m.kilit)) + '</div>';

  if (m.yoneticiGorunur){
    h += '<div><div class="et-ust">Yönetici puanı</div>' +
      dugmeler('yonPuan', i.yonPuan, !(m.yonetici && !m.kilit)) + '</div>';
  }
  h += '</div>';

  h += '<div class="satir kucuk mt" style="gap:14px">' +
    '<span class="sessiz">Önceki dönem: <b>' + (i.oncekiPuan == null ? '—' : say2(i.oncekiPuan)) + '</b></span>' +
    (m.yoneticiGorunur ? '<span class="sessiz">Puan farkı (öz − yönetici): <b data-fark="' + i.id + '">' +
      (fark == null ? '—' : (fark > 0 ? '+' : '') + say2(fark)) + '</b></span>' : '') +
    (m.yoneticiGorunur && yon != null ? '<span class="sessiz">' + esc(olcekAd(i.yonPuan)) + '</span>' : '') +
    '</div>';

  if (m.yonetici || m.yoneticiGorunur){
    h += alanKutu('gozlem', 'Somut gözlem / kanıt', i.gozlem, !(m.yonetici && !m.kilit),
      'Tarih, olay ve sonucu içeren somut örnek yazın. Hasta adı veya kimlik bilgisi yazmayın.');
    h += alanKutu('geriBildirim', 'Yöneticinin geri bildirim notu', i.geriBildirim, !(m.yonetici && !m.kilit), '');
  }
  h += alanKutu('calisanGorusu', 'Çalışanın görüşü', i.calisanGorusu, !(m.kendisi && !m.kilit), 'Bu kritere ilişkin kendi değerlendirmeniz.');

  h += '<label class="onay kucuk"><input type="checkbox" data-aksiyon="' + i.id + '"' +
    (i.aksiyon ? ' checked' : '') + (m.yonetici && !m.kilit ? '' : ' disabled') + '>' +
    '<span>Bu kriter için gelişim aksiyonu gerekli</span></label>';

  // Tutarlılık uyarısı
  const uyari = kalemUyarisi(i);
  if (uyari && m.yoneticiGorunur) h += '<div class="bilgi bilgi-sari kucuk mt" style="margin-bottom:0">' + uyari + '</div>';
  return h + '</div>';
}

/** Puan ile yazılı gözlem arasındaki tutarsızlıkları işaretler. */
function kalemUyarisi(i){
  const yon = puanDegeri(i.yonPuan);
  if (yon == null) return '';
  const gozlem = (i.gozlem || '').trim();
  if ((yon <= 2 || yon >= 3.5) && gozlem.length < 15)
    return '<b>Kanıtsız uç puan.</b> ' + say2(yon) + ' puan verilmiş ancak somut gözlem yazılmamış. ' +
      'Uç puanlar itiraz edildiğinde kanıtla desteklenmelidir.';
  if (i.kritik && yon <= 2 && gozlem.length < 15)
    return '<b>Kritik kriterde düşük puan.</b> Somut gözlem ve kritik olay kaydı girilmelidir.';
  const olumsuz = /(sorun|hata|eksik|gecik|şikayet|uyarı|olumsuz|yetersiz|aksama)/i.test(gozlem);
  const olumlu  = /(mükemmel|çok iyi|örnek|başarılı|takdir|üstün)/i.test(gozlem);
  if (yon >= 3.5 && olumsuz) return '<b>Tutarsızlık:</b> puan yüksek ancak gözlem olumsuz ifadeler içeriyor.';
  if (yon <= 2 && olumlu)    return '<b>Tutarsızlık:</b> puan düşük ancak gözlem olumlu ifadeler içeriyor.';
  if (i.oncekiPuan != null && Math.abs(yon - i.oncekiPuan) >= 1.5 && gozlem.length < 15)
    return '<b>Ani puan değişimi.</b> Önceki dönem ' + say2(i.oncekiPuan) + ' idi; gerekçesini gözlem alanına yazın.';
  return '';
}

function degerlendirmeBagla(){
  const ev = DB.evaluations.find(e => e.id === SAYFA_ARG);
  if (!ev) return;
  const kendisi = OTURUM.rol === 'calisan' && OTURUM.calisanId === ev.employeeId;

  $$('[data-bolum]').forEach(dt => dt.addEventListener('toggle', () => { ACIK_BOLUMLER[dt.dataset.bolum] = dt.open; }));

  $$('[data-puan]').forEach(b => b.onclick = () => {
    if (kilitUyar(ev)) return;
    const [id, alan, kod] = b.dataset.puan.split('|');
    const i = DB.evaluationItems.find(x => x.id === id);
    if (!i) return;
    const yeni = i[alan] === kod ? '' : kod;      // aynı düğmeye basınca seçim kalkar
    iz('EvaluationItems', i.id, 'guncelle', i.ad + ' · ' + (alan === 'ozPuan' ? 'öz puan' : 'yönetici puanı'), i[alan] || 'boş', yeni || 'boş', ev.phId);
    i[alan] = yeni;
    const kutu = b.closest('[data-kalem]');
    $$('.puan-d', kutu).forEach(x => {
      const p = x.dataset.puan.split('|');
      if (p[1] !== alan) return;
      x.classList.toggle('secili', p[2] === yeni && p[2] !== 'D');
      x.classList.toggle('d-secili', p[2] === yeni && p[2] === 'D');
    });
    const oz = puanDegeri(i.ozPuan), yon = puanDegeri(i.yonPuan);
    const f = $('[data-fark="' + i.id + '"]');
    if (f) f.textContent = (oz != null && yon != null) ? ((oz - yon > 0 ? '+' : '') + say2(Math.round((oz - yon) * 100) / 100)) : '—';
    ozetiTazele(ev);
    yaz();
  });

  $$('[data-metin]').forEach(t => t.onchange = () => {
    if (kilitUyar(ev)) return;
    const [id, alan] = t.dataset.metin.split('|');
    const i = DB.evaluationItems.find(x => x.id === id);
    if (!i || i[alan] === t.value) return;
    iz('EvaluationItems', i.id, 'guncelle', i.ad + ' · ' + alan, (i[alan] || '').slice(0, 40), t.value.slice(0, 40), ev.phId);
    i[alan] = t.value;
    yaz();
  });

  $$('[data-aksiyon]').forEach(c => c.onchange = () => {
    if (kilitUyar(ev)) return;
    const i = DB.evaluationItems.find(x => x.id === c.dataset.aksiyon);
    i.aksiyon = c.checked; yaz();
  });

  const bagla = (id, f) => { const e = $('#' + id); if (e) e.onclick = f; };
  bagla('dfYapayZeka', () => yapayZekaKip(ev));
  bagla('dfRapor', () => raporAc('degerlendirme', ev.id));
  bagla('dfGorusme', () => gorusmeKip(ev));
  bagla('dfPlan', () => gelisimPlaniKip(null, ev));
  bagla('dfOzBitir', async () => {
    const eksik = DB.evaluationItems.filter(i => i.evalId === ev.id && i.zorunlu && !i.otomatik && !puanDegeri(i.ozPuan)).length;
    onayIste('Öz değerlendirmeyi tamamla',
      eksik ? '<b>' + eksik + ' zorunlu kriter</b> henüz puanlanmadı. Yine de tamamlamak istiyor musunuz?' :
              'Öz değerlendirmeniz yöneticinize iletilecek. Sonrasında düzenleyemezsiniz.',
      'Tamamla', async () => {
        if (asamaSira(ev.durum) < asamaSira('oz')) ev.durum = 'oz';
        iz('Evaluations', ev.id, 'guncelle', 'asama', 'taslak', 'oz', ev.phId);
        await yaz(true); cizIcerik(); tost('Öz değerlendirmeniz kaydedildi.', 'iyi');
      });
  });
  bagla('dfYonBitir', () => {
    const z = ozetle(ev);
    onayIste('Yönetici değerlendirmesini tamamla',
      (z.kapsam.yeterli ? '' : '<div class="bilgi bilgi-kirmizi">Zorunlu kriter kapsamı %' + say2(z.kapsam.oran) +
        ' — eşik %' + say2(z.kapsamEsigi) + '. Bu hâliyle prim katsayısı hesaplanmaz.</div>') +

function ozetiTazele(ev){

function gorusmeKip(ev){

  const alan = (id, etiket, ipucu, satir) =>
    '<div class="alan"><label>' + etiket + '</label><textarea id="' + id + '" rows="' + (satir || 3) + '"' + (kilit ? ' disabled' : '') +
    ' placeholder="' + esc(ipucu || '') + '">' + esc(gb[id.slice(2)] || '') + '</textarea></div>';
  const k = kip({
    baslik: 'Geri bildirim toplantısı · ' + calisanAd(ev.employeeId), genis: true,
    govde:
      '<div class="bilgi bilgi-mavi">Toplantı tutanağı, değerlendirme raporunun ayrılmaz parçasıdır. ' +
      'Çalışanın katılmadığı konuları da yazmak, sürecin adil yürütüldüğünün kaydıdır.</div>' +
      '<div class="izgara"><div class="alan"><label>Görüşme planlanan tarih</label>' +
      '<input type="date" id="gsPlan" value="' + esc(ev.gorusmePlan || '') + '"' + (kilit ? ' disabled' : '') + '></div>' +
      '<div class="alan"><label>Görüşmenin gerçekleştiği tarih</label>' +
      '<input type="date" id="gsTarih" value="' + esc(ev.gorusmeTarihi || '') + '"' + (kilit ? ' disabled' : '') + '></div>' +
      '<div class="alan"><label>Bir sonraki kontrol tarihi</label>' +
      '<input type="date" id="gbSonrakiKontrol2" value="' + esc(gb.sonrakiKontrol || '') + '"' + (kilit ? ' disabled' : '') + '></div></div>' +
      alan('gbgucluYonler', 'Güçlü yönler', 'Dönem içinde açıkça öne çıkan davranışlar.') +
      alan('gbbasariliOrnekler', 'Başarılı örnekler', 'Somut olay, tarih ve sonuç.') +
      alan('gbgelisimAlanlari', 'Geliştirilmesi gereken alanlar', 'En fazla üç öncelikli alan yazmanız önerilir.') +
      alan('gbolaylar', 'Somut olay ve gözlemler', 'Anonim olay kodu kullanın; hasta adı veya kimlik bilgisi yazmayın.') +
      alan('gbcalisanGorusu', 'Çalışanın görüşü', 'Çalışanın kendi ifadesiyle.') +
      alan('gbuzlasilan', 'Üzerinde uzlaşılan konular') +
      alan('gbkatilmadigi', 'Çalışanın katılmadığı konular') +
      alan('gbhedefler', 'Belirlenen gelişim hedefleri') +
      alan('gbyoneticiNotu', 'Genel yönetici notu') +
      (gb.okudum ? '<div class="bilgi bilgi-yesil">Çalışan “Okudum” onayı verdi · ' + tarihSaatTR(gb.okuduTarih) +
        '<br><span class="kucuk">Bu onay, çalışanın tüm puanları kabul ettiği anlamına gelmez.</span></div>'
        : '<div class="bilgi bilgi-gri">Çalışan henüz “Okudum” onayı vermedi.</div>'),
    ayak: kilit ? '<button class="d d-cizgi" data-kapat>Kapat</button>'
      : '<button class="d d-cizgi" data-kapat>Vazgeç</button>' +
        '<button class="d d-cizgi" id="gsPlanla">Görüşmeyi planlandı işaretle</button>' +
        '<button class="d d-ana" id="gsTamam">Kaydet ve görüşüldü olarak işaretle</button>'
  });
  if (kilit) return;
  const topla = () => {
    ['gucluYonler','basariliOrnekler','gelisimAlanlari','olaylar','calisanGorusu','uzlasilan','katilmadigi','hedefler','yoneticiNotu']
      .forEach(a => { const e = $('#gb' + a, k); if (e) gb[a] = e.value.trim(); });

    ev.gorusmePlan = $('#gsPlan', k).value;
    ev.gorusmeTarihi = $('#gsTarih', k).value;
  };

    topla();
    if (!ev.gorusmePlan) return tost('Önce planlanan tarihi girin.', 'hata');
    if (asamaSira(ev.durum) < asamaSira('planlandi')) ev.durum = 'planlandi';
    iz('FeedbackRecords', gb.id, 'guncelle', 'gorusmePlan', '', ev.gorusmePlan, ev.phId);
    await yaz(true); kipKapat(); cizIcerik(); tost('Görüşme planlandı.', 'iyi');

  $('#gsTamam', k).onclick = async () => {
    topla();
    if (!ev.gorusmeTarihi) ev.gorusmeTarihi = bugun();

    iz('FeedbackRecords', gb.id, 'guncelle', 'gorusme', '', 'gerçekleşti ' + ev.gorusmeTarihi, ev.phId);
    await yaz(true); kipKapat(); cizIcerik(); tost('Toplantı tutanağı kaydedildi.', 'iyi');
  };
}

      '<div class="alan"><label>Yapılacak aksiyon</label><textarea id="plAks" rows="2">' + esc(p ? p.aksiyon : '') + '</textarea></div>' +
      '<div class="izgara"><div class="alan"><label>Eğitim / mentorluk ihtiyacı</label><input type="text" id="plEgt" value="' + esc(p ? p.egitim : '') + '"></div>' +

  });

    ozetKart('Bu dönem kayıt', String(g0.kayit), g0.oran == null ? 'değerlendirme yok' : g0.oran + '% zamanında') +
    '</div>';
  const tablo = (baslik, l) => '<div class="kart"><h3>' + baslik + '</h3><div class="tablo-sar"><table><thead><tr>' +
    '<th class="sayi">No</th><th>Görev</th><th>Kategori</th><th>Sıklık</th><th>Başarı standardı</th></tr></thead><tbody>' +
    (l.length ? l.map(g => '<tr><td class="sayi">' + g.no + '</td><td>' + esc(g.aciklama) + (g.kritik ? ' <span class="rz rz-kirmizi">Kritik</span>' : '') + '</td>' +
      '<td class="kucuk sessiz">' + esc((kategori(g.katId) || {}).ad || '') + '</td>' +

  h += tablo('Asıl sorumlusu olduğum görevler', asil);

  let liste = ait('criticalIncidents').filter(o => calisanGorulebilir(o.employeeId));
  if (d) liste = liste.filter(o => !o.donemId || o.donemId === d.id);

    (liste.length ? liste.map(o =>
      '<tr><td><code>' + esc(o.kod) + '</code></td><td class="kucuk">' + tarihTR(o.tarih) + '</td>' +
      '<td>' + esc(calisanAd(o.employeeId)) + '</td><td class="kucuk">' + esc(o.kategori) + '</td>' +

function olayKip(o){
  const d = secilenDonem();
  const ekip = gorulebilirCalisanlar();
  const karar = yetki('olayKarar');
  const al = (id, etiket, deger, satir, ipucu, pasif) =>
    '<div class="alan"><label>' + etiket + '</label><textarea id="' + id + '" rows="' + (satir || 2) + '"' + (pasif ? ' disabled' : '') +
    ' placeholder="' + esc(ipucu || '') + '">' + esc(deger || '') + '</textarea></div>';
  const k = kip({
    baslik: o ? 'Kritik olay · ' + o.kod : 'Yeni kritik olay kaydı', genis: true,
    govde:
      '<div class="izgara"><div class="alan"><label>Olay tarihi</label><input type="date" id="oTarih" value="' + esc(o ? o.tarih : bugun()) + '"></div>' +
      '<div class="alan"><label>Çalışan</label><select id="oKisi"' + (o ? ' disabled' : '') + '>' +
        ekip.map(c => '<option value="' + c.id + '"' + (o && o.employeeId === c.id ? ' selected' : '') + '>' + esc(c.ad) + '</option>').join('') + '</select></div>' +
      '<div class="alan"><label>Olay kategorisi</label><select id="oKat">' +
        KRITIK_KATEGORI.map(x => '<option' + (o && o.kategori === x ? ' selected' : '') + '>' + esc(x) + '</option>').join('') + '</select></div>' +
      '<div class="alan"><label>Etki / risk seviyesi</label><select id="oEtki">' +
        ETKI_SEVIYE.map(x => '<option' + (o && o.etki === x ? ' selected' : '') + '>' + x + '</option>').join('') + '</select></div></div>' +
      al('oAcik', 'Açıklama', o ? o.aciklama : '', 3, 'Ne oldu? Hasta adı ve kimlik bilgisi yazmayın.') +
      al('oKanit', 'Somut kanıt', o ? o.kanit : '', 2, 'Sistem kaydı, kamera, cihaz çıktısı, tutanak…') +
      al('oCalisan', 'Çalışanın açıklaması', o ? o.calisanAciklamasi : '', 2) +
      al('oOnlem', 'Alınan önlem', o ? o.onlem : '', 2) +
      al('oTekrar', 'Tekrarını önleme aksiyonu', o ? o.tekrarOnleme : '', 2) +
      al('oSonuc', 'Sonuç', o ? o.sonuc : '', 2, 'Hasta güvenliği, mevzuat veya finansal sonuç doğdu mu?') +
      '<fieldset><legend>Prim etkisi ve yönetici kararı</legend>' +
      '<label class="onay"><input type="checkbox" id="oPrim"' + (!o || o.primEtkisi !== false ? ' checked' : '') + (karar ? '' : ' disabled') + '>' +
      '<span>Bu olay, ilgili dönemin prim ödemesini yönetici incelemesine alsın</span></label>' +
      '<div class="alan mt"><label>Yönetici kararı</label><select id="oKarar"' + (karar ? '' : ' disabled') + '>' +
        ['', 'Etkisiz', 'Prim onaylandı', 'Prim azaltıldı', 'Prim iptal edildi', 'Uyarı verildi', 'Eğitim planlandı']
          .map(x => '<option value="' + esc(x) + '"' + (o && o.yoneticiKarari === x ? ' selected' : '') + '>' + (x || '— karar bekliyor —') + '</option>').join('') +
      '</select></div>' + al('oKararNot', 'Karar gerekçesi', o ? o.kararNot : '', 2, '', !karar) + '</fieldset>',
    ayak: (o && karar ? '<button class="d d-sade" id="oSil">Sil</button>' : '') +
          '<button class="d d-cizgi" data-kapat>Vazgeç</button><button class="d d-ana" id="oTamam">Kaydet</button>'
  });
  $('#oTamam', k).onclick = async () => {
    const v = {
      tarih: $('#oTarih', k).value, kategori: $('#oKat', k).value, etki: $('#oEtki', k).value,
      aciklama: $('#oAcik', k).value.trim(), kanit: $('#oKanit', k).value.trim(),
      calisanAciklamasi: $('#oCalisan', k).value.trim(), onlem: $('#oOnlem', k).value.trim(),
      tekrarOnleme: $('#oTekrar', k).value.trim(), sonuc: $('#oSonuc', k).value.trim()
    };
    if (karar){ v.primEtkisi = $('#oPrim', k).checked; v.yoneticiKarari = $('#oKarar', k).value; v.kararNot = $('#oKararNot', k).value.trim(); }
    if (!v.aciklama) return tost('Açıklama zorunludur.', 'hata');
    if (o){
      Object.keys(v).forEach(a => { if (String(o[a]) !== String(v[a])) iz('CriticalIncidents', o.id, 'guncelle', a, o[a], v[a]); });
      Object.assign(o, v);
    } else {
      const yeni = Object.assign({
        id: uid('olay'), phId: aktifEczaneId(), employeeId: $('#oKisi', k).value,
        donemId: d ? d.id : null, kod: 'OLY-' + rastgeleSifre(4), primEtkisi: true, yoneticiKarari: '', olusturma: simdi()
      }, v);
      DB.criticalIncidents.push(yeni);
      iz('CriticalIncidents', yeni.id, 'ekle', 'kritikOlay', '', yeni.kod + ' · ' + yeni.kategori);
    }
    await yaz(true); kipKapat(); cizIcerik(); tost('Olay kaydı güncellendi.', 'iyi');
  };
  const s = $('#oSil', k);
  if (s) s.onclick = () => onayIste('Olay kaydını sil', 'Kayıt kalıcı olarak silinecek.', 'Sil', async () => {
    DB.criticalIncidents = DB.criticalIncidents.filter(x => x.id !== o.id);
    iz('CriticalIncidents', o.id, 'sil', 'kritikOlay', o.kod, '');
    await yaz(true); kipKapat(); kipKapat(); cizIcerik();
  }, true);
}

sayfa('prim', function(){

  const d = secilenDonem();
  if (!d) return sayfaBas('Prim Hesaplama', '') + '<div class="kart">' + bosDurum('Önce bir dönem tanımlayın.') + '</div>';
  const a = ayar();
  const liste = ait('bonusCalculations').filter(b => b.donemId === d.id && calisanGorulebilir(b.employeeId));

  let h = sayfaBas('Prim Hesaplama',
    'Ödenecek prim = <b>prim baz tutarı × hedef gerçekleşme oranı × performans katsayısı</b>. ' +
    'Katsayı yalnızca kapsam yeterliyse hesaplanır; kritik olay varsa ödeme yönetici incelemesine düşer.',
    donemSecici() + (yetki('ucretOnayla') && d.durum === 'acik' ? '<button class="d d-ana" id="prHesapla">Dönemi hesapla</button>' : ''));

  h += '<div class="ozet">' +
    ozetKart('Prim dönemi', esc(d.ad), tarihTR(d.baslangic) + ' – ' + tarihTR(d.bitis)) +
    ozetKart('Eczane hedef gerçekleşmesi', yuzde(d.genelHedefOrani, 0), 'dönem ayarından gelir') +
    ozetKart('Hesaplanan toplam', para(liste.reduce((t, b) => t + (b.hesaplanan || 0), 0)), liste.length + ' çalışan') +
    ozetKart('Onaylanan toplam', para(liste.reduce((t, b) => t + (b.onaylanan || 0), 0)), liste.filter(b => b.onaylanan != null).length + ' onay') +
    ozetKart('İncelemede', String(liste.filter(b => b.durum === 'inceleme').length), 'kritik olay nedeniyle', liste.some(b => b.durum === 'inceleme') ? 'vurgu' : '') +
    '</div>';

  h += '<div class="kart">' + primTablosu(liste, false) + '</div>';

  h += '<div class="kart"><h3>Kullanılan katsayı tablosu</h3>' +
    '<p class="kucuk sessiz">Bu dönem açılırken kopyalandı; ayarlarda yapılan değişiklikler bu dönemi etkilemez.</p>' +
    '<div class="tablo-sar"><table><thead><tr><th>Puan aralığı</th><th>Karşılık</th><th class="sayi">Katsayı</th></tr></thead><tbody>' +
    (d.katsayiSnapshot || a.katsayiTablosu).map(s => '<tr><td>' + say2(s.alt) + ' – ' + say2(s.ust) + '</td><td class="kucuk sessiz">' + esc(s.ad || '') + '</td>' +
      '<td class="sayi"><b>' + say2(s.katsayi) + '</b></td></tr>').join('') + '</tbody></table></div></div>';
  return h;
}, function(){
  donemSeciciBagla();
  const e = $('#prHesapla'); if (e) e.onclick = primleriHesapla;
  $$('[data-prm]').forEach(b => b.onclick = () => primKip(DB.bonusCalculations.find(x => x.id === b.dataset.prm)));
});

function primTablosu(liste, salt){
  return '<div class="tablo-sar"><table><thead><tr><th>Çalışan</th><th class="sayi">Baz tutar</th><th class="sayi">Hedef</th>' +
    '<th class="sayi">Puan</th><th class="sayi">Katsayı</th><th class="sayi">Hesaplanan</th><th class="sayi">Onaylanan</th>' +
    '<th>Durum</th><th>Ödeme</th>' + (salt ? '' : '<th></th>') + '</tr></thead><tbody>' +
    (liste.length ? liste.map(b =>
      '<tr><td><b>' + esc(calisanAd(b.employeeId)) + '</b>' + (b.kritikEngel ? ' <span class="rz rz-kirmizi">Kritik olay</span>' : '') + '</td>' +
      '<td class="sayi">' + para(b.primBaz) + '</td>' +
      '<td class="sayi">' + yuzde(b.bireyselHedef != null ? b.bireyselHedef : b.genelHedef, 0) + '</td>' +
      '<td class="sayi">' + (b.puan == null ? '—' : say2(b.puan)) + '</td>' +
      '<td class="sayi">' + (b.katsayi == null ? '<span class="rz rz-kirmizi">yok</span>' : say2(b.katsayi)) + '</td>' +
      '<td class="sayi">' + para(b.hesaplanan) + '</td>' +
      '<td class="sayi"><b>' + (b.onaylanan == null ? '—' : para(b.onaylanan)) + '</b></td>' +
      '<td>' + primDurumRozet(b) + '</td>' +
      '<td class="kucuk">' + esc(b.odemeDurumu || 'Ödenmedi') + (b.odemeTarihi ? '<div class="sessiz">' + tarihTR(b.odemeTarihi) + '</div>' : '') + '</td>' +
      (salt ? '' : '<td><button class="d d-cizgi d-kk" data-prm="' + b.id + '">Aç</button></td>') + '</tr>').join('')
      : '<tr><td colspan="' + (salt ? 9 : 10) + '">' + bosDurum('Bu dönem için prim hesabı yapılmadı.') + '</td></tr>') +
    '</tbody></table></div>';
}
function primDurumRozet(b){
  if (b.durum === 'inceleme') return '<span class="rz rz-kirmizi">Yönetici incelemesinde</span>';
  if (b.durum === 'onayli')   return '<span class="rz rz-yesil">Onaylandı</span>';
  if (b.durum === 'iptal')    return '<span class="rz rz-gri">İptal</span>';
  if (b.katsayi === 0)        return '<span class="rz rz-turuncu">Katsayı 0 · prim yok</span>';
  if (b.katsayi == null)      return '<span class="rz rz-turuncu">Kapsam yetersiz</span>';
  return '<span class="rz rz-mavi">Hesaplandı</span>';
}

async function primleriHesapla(){
  const d = secilenDonem();
  if (d.durum === 'kapali') return tost('Kapalı dönemde prim hesabı değiştirilemez.', 'hata');
  const a = ayar();
  let yeni = 0, guncel = 0, inceleme = 0;
  gorulebilirCalisanlar().forEach(c => {
    const ev = DB.evaluations.find(e => e.donemId === d.id && e.employeeId === c.id && !e.iptal);
    const z = ev ? ozetle(ev) : null;
    const engeller = kritikEngel(d.id, c.id);
    const baz = c.primBaz != null ? c.primBaz : a.primBaz;
    let b = DB.bonusCalculations.find(x => x.donemId === d.id && x.employeeId === c.id);
    const olusturdu = !b;
    if (!b){
      b = { id: uid('prim'), phId: aktifEczaneId(), donemId: d.id, employeeId: c.id,
            bireyselHedef: null, onaylanan: null, aciklama: '', onaylayan: '', onayTarihi: null,
            odemeDurumu: 'Ödenmedi', odemeTarihi: null };
      DB.bonusCalculations.push(b);
      yeni++;
    } else guncel++;
    if (b.durum === 'onayli' && b.onaylanan != null) return;   // onaylanmış primi yeniden hesaplama
    b.primBaz = baz;
    b.genelHedef = d.genelHedefOrani;
    b.puan = z ? z.genel : null;
    b.katsayi = z ? z.katsayi : null;
    b.kritikEngel = engeller.length > 0;
    b.kritikKodlar = engeller.map(o => o.kod).join(', ');
    const oran = b.bireyselHedef != null ? b.bireyselHedef : b.genelHedef;
    b.hesaplanan = b.katsayi == null ? 0 : primHesapla(baz, oran, b.katsayi);
    b.durum = b.kritikEngel ? 'inceleme' : 'hazir';
    if (b.kritikEngel) inceleme++;
    iz('BonusCalculations', b.id, olusturdu ? 'ekle' : 'guncelle', 'prim · ' + c.ad, '', para(b.hesaplanan) + ' · katsayı ' + (b.katsayi == null ? 'yok' : say2(b.katsayi)));
  });
  await yaz(true); cizIcerik();
  tost(yeni + ' yeni, ' + guncel + ' güncel prim hesabı' + (inceleme ? ' · ' + inceleme + ' kayıt incelemeye alındı' : ''), 'iyi');
}

function primKip(b){
  const d = donem(b.donemId);
  const kilit = d.durum === 'kapali';
  const onayla = yetki('ucretOnayla') && !kilit;
  const isle = yetki('ucretIsle') && !kilit;
  const engeller = kritikEngel(b.donemId, b.employeeId);
  const oran = b.bireyselHedef != null ? b.bireyselHedef : b.genelHedef;
  const k = kip({
    baslik: 'Prim · ' + calisanAd(b.employeeId), genis: true,
    govde:
      (b.kritikEngel ? '<div class="bilgi bilgi-kirmizi"><b>Prim ödemesi yönetici incelemesinde.</b> ' +
        'Bu dönemde kritik olay kaydı var (' + esc(b.kritikKodlar || '') + '). Sistem primi kendiliğinden sıfırlamaz; ' +
        'gerekçenizi yazarak onaylayabilir, azaltabilir veya iptal edebilirsiniz.' +
        '<ul style="margin:8px 0 0 18px">' + engeller.map(o => '<li>' + esc(o.kod) + ' · ' + esc(o.kategori) + ' · ' + esc(o.etki) + '</li>').join('') + '</ul></div>' : '') +
      '<div class="tablo-sar"><table><tbody>' +
      '<tr><td>Prim dönemi</td><td class="sayi">' + esc(d.ad) + '</td></tr>' +
      '<tr><td>Prim baz tutarı</td><td class="sayi">' + para(b.primBaz) + '</td></tr>' +
      '<tr><td>Eczane/genel hedef gerçekleşme oranı</td><td class="sayi">' + yuzde(b.genelHedef, 0) + '</td></tr>' +
      '<tr><td>Bireysel hedef gerçekleşme oranı</td><td class="sayi">' + (b.bireyselHedef == null ? '<span class="soluk">genel oran kullanılıyor</span>' : yuzde(b.bireyselHedef, 0)) + '</td></tr>' +
      '<tr><td>Performans puanı</td><td class="sayi">' + (b.puan == null ? '—' : say2(b.puan)) + '</td></tr>' +
      '<tr><td>Performans katsayısı</td><td class="sayi">' + (b.katsayi == null ? 'hesaplanmadı (kapsam yetersiz)' : say2(b.katsayi)) + '</td></tr>' +
      '<tr><td>Kritik engel durumu</td><td class="sayi">' + (b.kritikEngel ? 'Var · incelemede' : 'Yok') + '</td></tr>' +
      '<tr><td><b>Hesaplanan prim</b></td><td class="sayi"><b>' + para(b.primBaz) + ' × ' + yuzde(oran, 0) + ' × ' +
        (b.katsayi == null ? '0' : say2(b.katsayi)) + ' = ' + para(b.hesaplanan) + '</b></td></tr>' +
      '</tbody></table></div>' +
      '<fieldset class="mt"><legend>Yönetici kararı</legend>' +
      '<div class="izgara"><div class="alan"><label>Bireysel hedef gerçekleşme oranı (%)</label>' +
      '<input type="number" id="pbBirey" step="0.1" value="' + (b.bireyselHedef == null ? '' : b.bireyselHedef) + '" placeholder="boş: eczane oranı"' + (onayla ? '' : ' disabled') + '></div>' +
      '<div class="alan"><label>Onaylanan prim (TL)</label>' +
      '<input type="number" id="pbOnay" step="0.01" value="' + (b.onaylanan == null ? '' : b.onaylanan) + '"' + (onayla ? '' : ' disabled') + '></div></div>' +
      '<div class="alan"><label>Açıklama</label><textarea id="pbNot" rows="2"' + (onayla ? '' : ' disabled') + '>' + esc(b.aciklama || '') + '</textarea></div>' +
      (b.onayTarihi ? '<div class="bilgi bilgi-yesil kucuk">Onaylayan: <b>' + esc(b.onaylayan) + '</b> · ' + tarihSaatTR(b.onayTarihi) + '</div>' : '') +
      '</fieldset>' +
      '<fieldset><legend>Ödeme</legend><div class="izgara">' +
      '<div class="alan"><label>Ödeme durumu</label><select id="pbOdeme"' + (isle ? '' : ' disabled') + '>' +
        ODEME_DURUM.map(x => '<option' + (b.odemeDurumu === x ? ' selected' : '') + '>' + x + '</option>').join('') + '</select></div>' +
      '<div class="alan"><label>Ödeme tarihi</label><input type="date" id="pbOdemeT" value="' + esc(b.odemeTarihi || '') + '"' + (isle ? '' : ' disabled') + '></div></div></fieldset>',
    ayak: kilit ? '<button class="d d-cizgi" data-kapat>Kapat</button>'
      : '<button class="d d-cizgi" data-kapat>Vazgeç</button>' +
        (onayla ? '<button class="d d-sade" id="pbIptal">Primi iptal et</button>' +
          '<button class="d d-cizgi" id="pbYeni">Yeniden hesapla</button>' +
          '<button class="d d-yesil" id="pbOnayla">Onayla</button>' : '') +
        '<button class="d d-ana" id="pbKaydet">Kaydet</button>'
  });
  if (kilit) return;
  const topla = () => {
    if (onayla){
      const bir = $('#pbBirey', k).value;

async function maaslariHesapla(){
  const d = secilenDonem();
  if (d.durum === 'kapali') return tost('Kapalı dönemde ücret hesabı değiştirilemez.', 'hata');
  const a = ayar();
  let sayi = 0;
  gorulebilirCalisanlar().forEach(c => {
    const ev = DB.evaluations.find(e => e.donemId === d.id && e.employeeId === c.id && !e.iptal);
    const z = ev ? ozetle(ev) : null;
    const katsayi = z && z.katsayi != null ? z.katsayi : 0;
    let m = DB.salaryIncreaseCalculations.find(x => x.donemId === d.id && x.employeeId === c.id);
    const olusturdu = !m;
    if (!m){
      m = { id: uid('maas'), phId: aktifEczaneId(), donemId: d.id, employeeId: c.id,
            onaylananUcret: null, gecerlilik: '', aciklama: '' };

    }
    if (m.onaylananUcret != null) return;    // onaylanmış öneriyi bozma
    m.mevcutBrut = c.brutUcret || 0;
    m.mevcutNet = c.netUcret || 0;
    m.genelZam = a.genelZam;
    m.perfButce = a.performansButcesi;
    m.katsayi = z ? z.katsayi : null;
    m.puan = z ? z.genel : null;
    m.toplamZam = zamHesapla(a.genelZam, a.performansButcesi, katsayi);
    m.onerilenUcret = yeniUcret(m.mevcutBrut, m.toplamZam);

    sayi++;
    iz('SalaryIncreaseCalculations', m.id, olusturdu ? 'ekle' : 'guncelle', 'zam · ' + c.ad, '', yuzde(m.toplamZam) + ' → ' + para(m.onerilenUcret));
  });
  await yaz(true); cizIcerik();
  tost(sayi + ' ücret önerisi hesaplandı.', 'iyi');
}

/* =========================================================
   27. YAPAY ZEKÂ YARDIMCISI
   Kural tabanlı, çevrimdışı çalışır; hiçbir veri dışarı gönderilmez.
   Ürettiği metinler öneridir: puanı, katsayıyı, primi veya ücreti
   kendi başına değiştirmez. Finansal sonuçlar yalnızca tanımlı
   matematiksel kurallar ve yönetici onayıyla oluşur.
   ========================================================= */
function yzAnaliz(ev){
  const kalemler = DB.evaluationItems.filter(i => i.evalId === ev.id);
  const z = ozetle(ev);
  const puanli = kalemler.filter(i => puanDegeri(i.yonPuan) != null);
  const guclu = puanli.filter(i => puanDegeri(i.yonPuan) >= 3.5).sort((a, b) => puanDegeri(b.yonPuan) - puanDegeri(a.yonPuan));
  const zayif = puanli.filter(i => puanDegeri(i.yonPuan) <= 2.5).sort((a, b) => puanDegeri(a.yonPuan) - puanDegeri(b.yonPuan));
  const uyarilar = [];
  kalemler.forEach(i => { const u = kalemUyarisi(i); if (u) uyarilar.push({ kalem:i, metin:u }); });
  const buyukFark = puanli.filter(i => {
    const o = puanDegeri(i.ozPuan);
    return o != null && Math.abs(o - puanDegeri(i.yonPuan)) >= 1;
  });
  // Öncelik: kritik kriterler önce, sonra en düşük puan, sonra ağırlık
  const oncelikli = zayif.slice().sort((a, b) => (b.kritik - a.kritik) ||
    (puanDegeri(a.yonPuan) - puanDegeri(b.yonPuan)) || (b.agirlik - a.agirlik)).slice(0, 3);
  return { z, guclu, zayif, uyarilar, buyukFark, oncelikli, kalemler };
}

function yzGeriBildirimMetni(ev){
  const c = calisan(ev.employeeId), d = donem(ev.donemId);
  const a = yzAnaliz(ev);
  const onc = oncekiGenel(ev.employeeId, ev.donemId);
  const s = [];
  s.push(c.ad + ' · ' + d.ad + ' dönemi değerlendirme özeti');
  s.push('');
  s.push('Genel performans puanı: ' + (a.z.genel == null ? 'hesaplanamadı' : say2(a.z.genel) + ' / 4,00') +
    (onc ? ' (önceki dönem: ' + say2(onc.puan) + (a.z.genel != null ? ', değişim ' + (a.z.genel - onc.puan > 0 ? '+' : '') + say2(Math.round((a.z.genel - onc.puan) * 100) / 100) : '') + ')' : ''));
  BOLUMLER.forEach(b => {
    const v = a.z.bolumler[b.kod];
    s.push('· ' + b.ad + ': ' + (v == null ? 'bu dönemde değerlendirilmedi' : say2(v)));
  });
  s.push('');
  if (a.guclu.length){
    s.push('GÜÇLÜ YÖNLER');
    a.guclu.slice(0, 5).forEach(i => {
      s.push('· ' + i.ad + ' (' + say2(puanDegeri(i.yonPuan)) + '). ' +
        (i.gozlem ? 'Gözlem: ' + i.gozlem : 'Bu alanda beklentinin üzerinde performans gösterildi.'));
    });
    s.push('');
  }
  if (a.oncelikli.length){
    s.push('ÖNCELİKLİ GELİŞİM ALANLARI (en fazla üç)');
    a.oncelikli.forEach((i, ix) => {
      s.push((ix + 1) + '. ' + i.ad + ' (' + say2(puanDegeri(i.yonPuan)) + '). Beklenen davranış: ' + (i.beklenen || '—') +
        (i.gozlem ? ' Gözlem: ' + i.gozlem : ''));
    });
    s.push('');
  }
  if (a.buyukFark.length){
    s.push('ÖZ DEĞERLENDİRME İLE FARKLILAŞAN KRİTERLER');
    a.buyukFark.slice(0, 5).forEach(i => {
      const o = puanDegeri(i.ozPuan), y = puanDegeri(i.yonPuan);
      s.push('· ' + i.ad + ': çalışan ' + say2(o) + ', yönetici ' + say2(y) +
        ' — görüşmede bu farkın nedeni birlikte konuşulmalıdır.');
    });
    s.push('');
  }
  s.push('Bu metin, girilen puan ve gözlemlerden kural tabanlı olarak üretilmiştir. ' +
    'Görüşmeden önce gözden geçirip kendi ifadenizle düzenleyiniz.');
  return s.join('\n');
}

function yzSmartHedef(i){
  const hedef = Math.min(4, (puanDegeri(i.yonPuan) || 2) + 1);
  return {
    alan: i.ad,
    mevcutPuan: puanDegeri(i.yonPuan),
    hedefPuan: hedef,
    beklenenDavranis: i.beklenen || '',
    aksiyon: '“' + i.ad + '” alanında ' + yzAksiyon(i) + ' Ölçüm: ' + yzOlcum(i),
    egitim: i.kritik ? 'Konu başlığında uygulamalı iç eğitim ve mevzuat tekrarı' : 'Eczane içi mentorluk ve örnek vaka çalışması'
  };
}
function yzAksiyon(i){
  if (i.bolum === 'gorev') return 'kategoriye ait görevler haftalık kontrol listesiyle takip edilir ve gecikme aynı gün bildirilir.';
  if (i.kritik) return 'yazılı protokole birebir uyum sağlanır; her uygulama sonrası kayıt tutulur.';
  if (/iletişim|danışan|hasta/i.test(i.ad)) return 'haftada en az üç görüşme yönetici gözleminde yapılır ve geri bildirim alınır.';
  if (/stok|miat|sipariş|kasa/i.test(i.ad)) return 'ilgili kontrol günlük olarak yapılır ve sonucu kayda geçirilir.';
  return 'belirlenen davranış her vardiyada uygulanır ve haftalık olarak gözden geçirilir.';
}
function yzOlcum(i){
  if (i.bolum === 'gorev') return 'kategori görev puanının 3,00 ve üzerine çıkması.';
  if (i.kritik) return 'dönem içinde bu başlıkta kritik olay kaydı oluşmaması.';
  return 'bir sonraki değerlendirmede kriter puanının hedefe ulaşması.';
}

function yapayZekaKip(ev){
  const a = yzAnaliz(ev);
  const metin = yzGeriBildirimMetni(ev);
  const k = kip({
    baslik: 'Yapay zekâ yardımcısı', genis: true,
    govde:
      '<div class="bilgi bilgi-mavi"><b>Bu yardımcı çevrimdışı ve kural tabanlıdır;</b> verileriniz hiçbir yere gönderilmez. ' +
      'Ürettiği metinler öneridir: puanı, katsayıyı, primi veya maaş artışını kendi başına değiştirmez. ' +
      'Finansal sonuçlar yalnızca tanımlı formüller ve yönetici onayıyla oluşur.</div>' +
      '<div class="sekmeler" id="yzSek">' +
      '<button data-yz="metin" class="etkin">Geri bildirim metni</button>' +
      '<button data-yz="hedef">Gelişim hedefleri</button>' +
      '<button data-yz="uyari">Tutarlılık uyarıları</button>' +
      '<button data-yz="ozet">Karşılaştırmalı özet</button></div>' +
      '<div id="yzGovde"></div>',
    ayak: '<button class="d d-cizgi" data-kapat>Kapat</button><button class="d d-ana" id="yzKopya">Metni kopyala</button>'
  });
  const govde = $('#yzGovde', k);
  const ciz2 = (sekme) => {
    if (sekme === 'metin'){
      govde.innerHTML = '<textarea id="yzMetin" rows="16" style="font-family:inherit">' + esc(metin) + '</textarea>' +
        '<div class="satir mt"><button class="d d-cizgi d-kk" id="yzGbAktar">Toplantı tutanağına aktar</button></div>';
      $('#yzGbAktar', k).onclick = async () => {
        const gb = DB.feedbackRecords.find(f => f.evalId === ev.id);
        if (!gb || kilitUyar(ev)) return;
        gb.gucluYonler = a.guclu.slice(0, 5).map(i => i.ad + ' (' + say2(puanDegeri(i.yonPuan)) + ')').join('\n');
        gb.gelisimAlanlari = a.oncelikli.map((i, ix) => (ix + 1) + '. ' + i.ad + ' (' + say2(puanDegeri(i.yonPuan)) + ')').join('\n');
        gb.basariliOrnekler = a.guclu.slice(0, 5).filter(i => i.gozlem).map(i => i.ad + ': ' + i.gozlem).join('\n');
        gb.olaylar = a.zayif.filter(i => i.gozlem).map(i => i.ad + ': ' + i.gozlem).join('\n');
        iz('FeedbackRecords', gb.id, 'guncelle', 'yapayZekaAktarim', '', 'güçlü/gelişim alanları dolduruldu', ev.phId);
        await yaz(true); tost('Toplantı tutanağına aktarıldı.', 'iyi');
      };
    } else if (sekme === 'hedef'){
      if (!a.oncelikli.length){ govde.innerHTML = '<div class="bilgi bilgi-yesil">2,50 ve altında puanlanmış kriter yok; öncelikli gelişim alanı önerilmiyor.</div>'; return; }
      govde.innerHTML = '<p class="kucuk sessiz">Bir dönemde en fazla üç öncelikli hedef önerilir. ' +
        'Kritik kriterler ve en düşük puanlar önceliklendirilir.</p>' +
        a.oncelikli.map((i, ix) => {
          const s = yzSmartHedef(i);
          return '<div class="kart sik"><b>' + (ix + 1) + '. ' + esc(s.alan) + '</b> ' +
            '<span class="rz rz-turuncu">' + say2(s.mevcutPuan) + ' → ' + say2(s.hedefPuan) + '</span>' +
            '<div class="kucuk mt"><b>Beklenen davranış:</b> ' + esc(s.beklenenDavranis) + '</div>' +
            '<div class="kucuk"><b>SMART aksiyon:</b> ' + esc(s.aksiyon) + '</div>' +
            '<div class="kucuk"><b>Eğitim/mentorluk:</b> ' + esc(s.egitim) + '</div>' +
            '<div class="kucuk sessiz mt"><b>30 gün:</b> uygulamanın başladığı doğrulanır · ' +
            '<b>60 gün:</b> ara ölçüm yapılır · <b>90 gün:</b> hedef puana ulaşıldı mı değerlendirilir.</div>' +
            '<button class="d d-cizgi d-kk mt" data-yzplan="' + i.id + '">Gelişim planı olarak ekle</button></div>';
        }).join('');
      $$('[data-yzplan]', k).forEach(b => b.onclick = () => {
        const i = a.kalemler.find(x => x.id === b.dataset.yzplan);
        const s = yzSmartHedef(i);
        kipKapat();
        const p = gelisimPlaniEkle(aktifEczaneId(), ev.employeeId, ev.donemId, {
          alan: s.alan, mevcutPuan: s.mevcutPuan, hedefPuan: s.hedefPuan,
          beklenenDavranis: s.beklenenDavranis, aksiyon: s.aksiyon, egitim: s.egitim,
          evalId: ev.id, baslangic: bugun(), hedefTarih: gunEkle(bugun(), 90)
        });
        if (asamaSira(ev.durum) < asamaSira('plan')) ev.durum = 'plan';
        yaz(true); gelisimPlaniKip(p, ev);
      });
    } else if (sekme === 'uyari'){
      govde.innerHTML = a.uyarilar.length
        ? a.uyarilar.map(u => '<div class="bilgi bilgi-sari"><b>' + esc(u.kalem.ad) + '</b><br>' + u.metin + '</div>').join('') +
          (a.buyukFark.length ? '<div class="bilgi bilgi-mavi"><b>Öz değerlendirme farkı 1,00 ve üzeri olan ' + a.buyukFark.length +
            ' kriter var.</b> Görüşmede bu farkların nedeni konuşulmalıdır.</div>' : '')
        : '<div class="bilgi bilgi-yesil">Puanlar ile yazılı gözlemler arasında tutarsızlık bulunamadı.</div>';
    } else {
      const onc = oncekiGenel(ev.employeeId, ev.donemId);
      const satir = (et, dg) => '<tr><td>' + et + '</td><td class="sayi">' + dg + '</td></tr>';
      govde.innerHTML = '<div class="tablo-sar"><table><tbody>' +
        satir('Bu dönem genel puanı', a.z.genel == null ? '—' : say2(a.z.genel)) +
        satir('Önceki dönem', onc ? say2(onc.puan) : '—') +
        satir('Değişim', (a.z.genel != null && onc) ? ((a.z.genel - onc.puan > 0 ? '+' : '') + say2(Math.round((a.z.genel - onc.puan) * 100) / 100)) : '—') +
        satir('Çalışanın öz değerlendirmesi', a.z.ozGenel == null ? '—' : say2(a.z.ozGenel)) +
        satir('Puanlanan kriter', a.z.puanlanan + ' / ' + a.z.kalemSayisi) +
        satir('Zorunlu kriter kapsamı', say2(a.z.kapsam.oran) + '%') +
        satir('Prim katsayısı', a.z.katsayi == null ? 'hesaplanmadı' : say2(a.z.katsayi)) +
        '</tbody></table></div>' +
        '<div class="bilgi bilgi-gri mt">' +
        (a.z.genel != null && onc
          ? (a.z.genel > onc.puan
              ? 'Çalışan önceki döneme göre <b>ilerleme</b> göstermiştir. Görüşmede bu ilerlemenin hangi davranışlardan geldiği somutlaştırılmalıdır.'
              : (a.z.genel < onc.puan
                  ? 'Çalışanın puanı önceki döneme göre <b>gerilemiştir</b>. Gerilemenin nedeni (iş yükü, eğitim eksiği, süreç değişikliği) görüşmede açıklığa kavuşturulmalıdır.'
                  : 'Puan önceki dönemle aynı seviyededir.'))
          : 'Karşılaştırma için önceki döneme ait kapanmış bir değerlendirme gerekir.') + '</div>';
    }
  };
  ciz2('metin');
  $$('[data-yz]', k).forEach(b => b.onclick = () => {
    $$('[data-yz]', k).forEach(x => x.classList.toggle('etkin', x === b));
    ciz2(b.dataset.yz);
  });
  $('#yzKopya', k).onclick = () => panoyaYaz(metin, $('#yzKopya', k), 'Metni kopyala');
}

  { kod:'tutanak',       ad:'Geri bildirim toplantı tutanağı',          aciklama:'Görüşmede konuşulanlar, uzlaşılan ve katılınmayan konular.', kisi:true },
  { kod:'gelisim',       ad:'30/60/90 günlük gelişim planı',            aciklama:'Aksiyonlar, kontrol noktaları ve durum.', kisi:true },
  { kod:'karsilastirma', ad:'Dönemsel performans karşılaştırması',      aciklama:'Dönemler arası puan değişimi.', kisi:false },

];

sayfa('raporlar', function(){

  let h = sayfaBas('Raporlar',
    'Her rapor ekranda açılır; <b>PDF</b> için yazdırma penceresinden “PDF olarak kaydet”, ' +
    '<b>Excel</b> için CSV indirme düğmesini kullanın.', donemSecici());

    '<div class="kart"><h3>' + esc(r.ad) + '</h3><p class="kucuk sessiz">' + esc(r.aciklama) + '</p>' +

});

let RAPOR_TUR = null, RAPOR_ARG = null;
function raporAc(tur, arg){ RAPOR_TUR = tur; RAPOR_ARG = arg; git('rapor'); }

sayfa('rapor', function(){
  const govde = raporIcerik(RAPOR_TUR, RAPOR_ARG);
  return '<div class="satir mb yazdirma-gizle"><button class="d d-cizgi" data-git="raporlar">Raporlara dön</button>' +
    '<button class="d d-ana" id="rpYazdir">PDF olarak yazdır</button>' +
    '<button class="d d-cizgi" id="rpCsv">Excel (CSV) indir</button></div>' +
    '<div class="rapor" id="rpIcerik">' + govde + '</div>';
}, function(){
  const y = $('#rpYazdir'); if (y) y.onclick = () => window.print();
  const c = $('#rpCsv'); if (c) c.onclick = () => raporCsv(RAPOR_TUR, RAPOR_ARG);
});

function raporUst(baslik, altbilgi){
  const ph = aktifEczane() || {};
  return '<div class="rapor-ust"><img src="assets/logo.png" alt="Artıfarma Group">' +
    '<div><h2>' + esc(baslik) + '</h2><div class="kucuk sessiz">' + esc(ph.ad || '') +
    (ph.sehir ? ' · ' + esc(ph.sehir) : '') + ' · ' + esc(altbilgi || '') + '</div></div></div>';
}
function kvSatir(et, dg){ return '<b>' + esc(et) + '</b><span>' + (dg == null ? '—' : dg) + '</span>'; }

function raporIcerik(tur, arg){
  const d = secilenDonem();
  if (!d) return '<p>Rapor için önce bir dönem tanımlanmalıdır.</p>';

  if (tur === 'degerlendirme'){
    const ev = DB.evaluations.find(e => e.id === arg) ||
               DB.evaluations.find(e => e.donemId === d.id && e.employeeId === arg && !e.iptal);
    if (!ev) return '<p>Bu çalışan için bu dönemde değerlendirme kaydı yok.</p>';
    const c = calisan(ev.employeeId), dd = donem(ev.donemId), z = ozetle(ev), onc = oncekiGenel(ev.employeeId, ev.donemId);
    const kalemler = DB.evaluationItems.filter(i => i.evalId === ev.id);
    let h = raporUst('Performans Değerlendirme Raporu', dd.ad + ' · ' + tarihTR(dd.baslangic) + ' – ' + tarihTR(dd.bitis));
    h += '<div class="kv">' + kvSatir('Çalışan', esc(c.ad)) + kvSatir('Pozisyon', esc(pozisyonAd(ev.roleId))) +
      kvSatir('İşe başlama', tarihTR(c.iseBaslama)) + kvSatir('Değerlendirme aşaması', esc(asamaAd(ev.durum))) +
      kvSatir('Revizyon', String(ev.revizyon || 1)) +
      kvSatir('Rapor tarihi', tarihTR(bugun())) + '</div>';
    h += '<h4>Puan özeti</h4><div class="tablo-sar"><table><thead><tr><th>Bölüm</th><th class="sayi">Bölüm ağırlığı</th>' +
      '<th class="sayi">Puanlanan kriter</th><th class="sayi">Bölüm puanı</th><th class="sayi">Katkı</th></tr></thead><tbody>' +
      BOLUMLER.map(b => {
        const v = z.bolumler[b.kod], w = z.agirliklar[b.kod];
        return '<tr><td>' + esc(b.ad) + '</td><td class="sayi">%' + say2(w) + '</td>' +
          '<td class="sayi">' + z.detay[b.kod].sayi + ' / ' + z.detay[b.kod].toplam + '</td>' +
          '<td class="sayi">' + (v == null ? 'değerlendirilmedi' : say2(v)) + '</td>' +
          '<td class="sayi">' + (v == null ? '—' : say2(Math.round(v * w) / 100)) + '</td></tr>';
      }).join('') +
      '<tr><td colspan="3"><b>Genel performans puanı</b></td><td class="sayi"><b>' + (z.genel == null ? '—' : say2(z.genel)) + '</b></td>' +
      '<td class="sayi">' + (onc ? 'önceki: ' + say2(onc.puan) : '') + '</td></tr>' +
      '</tbody></table></div>';
    h += '<div class="kv mt">' + kvSatir('Zorunlu kriter kapsamı', say2(z.kapsam.oran) + '% (' + z.kapsam.degerlendirilen + '/' + z.kapsam.zorunlu + ')' +
      (z.kapsam.yeterli ? '' : ' — <b>yetersiz değerlendirme verisi</b>')) +
      kvSatir('Prim katsayısı', z.katsayi == null ? 'hesaplanmadı' : say2(z.katsayi) + ' (' + esc((z.katsayiSatir || {}).ad || '') + ')') +
      kvSatir('Çalışanın öz değerlendirmesi', z.ozGenel == null ? '—' : say2(z.ozGenel)) + '</div>';
    BOLUMLER.forEach(b => {
      const l = kalemler.filter(i => i.bolum === b.kod);
      if (!l.length) return;
      h += '<h4>' + esc(b.ad) + '</h4><div class="tablo-sar"><table><thead><tr><th>Kriter</th><th class="sayi">Ağırlık</th>' +
        '<th class="sayi">Önceki</th><th class="sayi">Öz</th><th class="sayi">Yönetici</th><th>Somut gözlem / geri bildirim</th></tr></thead><tbody>' +
        l.map(i => '<tr><td>' + esc(i.ad) + (i.kritik ? ' <b>(kritik)</b>' : '') + '</td>' +
          '<td class="sayi">%' + say2(i.agirlik) + '</td>' +
          '<td class="sayi">' + (i.oncekiPuan == null ? '—' : say2(i.oncekiPuan)) + '</td>' +
          '<td class="sayi">' + (i.ozPuan === 'D' ? 'D' : (puanDegeri(i.ozPuan) == null ? '—' : say2(puanDegeri(i.ozPuan)))) + '</td>' +
          '<td class="sayi">' + (i.yonPuan === 'D' ? 'D' : (puanDegeri(i.yonPuan) == null ? '—' : say2(puanDegeri(i.yonPuan)))) + '</td>' +
          '<td class="kucuk">' + esc(i.gozlem || '') + (i.geriBildirim ? '<br><i>' + esc(i.geriBildirim) + '</i>' : '') + '</td></tr>').join('') +
        '</tbody></table></div>';
    });
    h += '<p class="kucuk sessiz mt2">“D” işaretli kriterler bu dönemde değerlendirilmemiştir ve ortalamaya katılmamıştır. ' +
      'Bölüm puanı yalnızca puanlanan kriterlerin ağırlıklarına bölünerek hesaplanır.</p>';
    return h;
  }

  if (tur === 'tutanak'){
    const ev = DB.evaluations.find(e => e.donemId === d.id && e.employeeId === arg && !e.iptal);
    if (!ev) return '<p>Bu çalışan için bu dönemde değerlendirme kaydı yok.</p>';
    const gb = DB.feedbackRecords.find(f => f.evalId === ev.id) || {};
    const c = calisan(ev.employeeId);
    let h = raporUst('Geri Bildirim Toplantı Tutanağı', d.ad);
    h += '<div class="kv">' + kvSatir('Çalışan', esc(c.ad)) + kvSatir('Pozisyon', esc(pozisyonAd(ev.roleId))) +
      kvSatir('Görüşme tarihi', tarihTR(ev.gorusmeTarihi)) +
      kvSatir('Bir sonraki kontrol', tarihTR(gb.sonrakiKontrol)) +
      kvSatir('Genel performans puanı', say2(ozetle(ev).genel)) + '</div>';
    [['Güçlü yönler','gucluYonler'],['Başarılı örnekler','basariliOrnekler'],['Geliştirilmesi gereken alanlar','gelisimAlanlari'],
     ['Somut olay ve gözlemler','olaylar'],['Çalışanın görüşü','calisanGorusu'],['Üzerinde uzlaşılan konular','uzlasilan'],
     ['Çalışanın katılmadığı konular','katilmadigi'],['Belirlenen gelişim hedefleri','hedefler'],['Genel yönetici notu','yoneticiNotu']]
      .forEach(([et, alan]) => { h += '<h4>' + et + '</h4><p>' + esc(gb[alan] || '—').replace(/\n/g, '<br>') + '</p>'; });
    h += '<h4>Çalışan onayı</h4><p>' + (gb.okudum
      ? 'Çalışan “Okudum” onayını ' + tarihSaatTR(gb.okuduTarih) + ' tarihinde vermiştir.'
      : 'Çalışan henüz “Okudum” onayı vermemiştir.') +
      '<br><i>“Okudum” onayı, çalışanın tüm puanları kabul ettiği anlamına gelmez.</i></p>';
    h += '<div class="kv mt2">' + kvSatir('Yönetici imzası', '&nbsp;') + kvSatir('Çalışan imzası', '&nbsp;') + '</div>';
    return h;
  }

  if (tur === 'gelisim'){
    const c = calisan(arg);
    const planlar = DB.developmentPlans.filter(p => p.employeeId === arg);
    let h = raporUst('30/60/90 Günlük Gelişim Planı', (c ? c.ad : '') + ' · ' + d.ad);
    if (!planlar.length) return h + '<p>Bu çalışan için gelişim planı bulunmuyor.</p>';
    planlar.forEach(p => {
      const knt = DB.developmentCheckpoints.filter(x => x.planId === p.id).sort((a, b) => a.gun - b.gun);
      h += '<h4>' + esc(p.alan) + '</h4><div class="kv">' +
        kvSatir('Mevcut puan', say2(p.mevcutPuan)) + kvSatir('Hedeflenen puan', say2(p.hedefPuan)) +
        kvSatir('Beklenen davranış', esc(p.beklenenDavranis || '—')) +
        kvSatir('Yapılacak aksiyon', esc(p.aksiyon || '—')) +
        kvSatir('Eğitim / mentorluk', esc(p.egitim || '—')) +
        kvSatir('Destek verecek kişi', esc(p.destekId ? calisanAd(p.destekId) : '—')) +
        kvSatir('Başlangıç / hedef tarihi', tarihTR(p.baslangic) + ' → ' + tarihTR(p.hedefTarih)) +
        kvSatir('Durum', esc(p.durum)) + kvSatir('Başarı kanıtı', esc(p.kanit || '—')) +
        kvSatir('Sonuç', esc(p.sonuc || '—')) + kvSatir('Bir sonraki karar', esc(p.sonrakiKarar || '—')) + '</div>' +
        '<div class="tablo-sar mt"><table><thead><tr><th>Kontrol</th><th>Tarih</th><th>Durum</th><th>Not</th></tr></thead><tbody>' +
        knt.map(x => '<tr><td>' + x.gun + ' gün</td><td>' + tarihTR(x.tarih) + '</td>' +
          '<td>' + (x.yapildi ? 'Yapıldı' : (x.tarih < bugun() ? 'Gecikti' : 'Bekliyor')) + '</td>' +
          '<td>' + esc(x.not || '') + '</td></tr>').join('') + '</tbody></table></div>';
    });
    return h;
  }

  if (tur === 'karsilastirma'){
    const dl = donemler().slice(0, 6).reverse();
    let h = raporUst('Dönemsel Performans Karşılaştırması', dl.length + ' dönem');
    h += '<div class="tablo-sar"><table><thead><tr><th>Çalışan</th>' +
      dl.map(x => '<th class="sayi">' + esc(x.ad) + '</th>').join('') + '<th class="sayi">Değişim</th></tr></thead><tbody>' +
      gorulebilirCalisanlar().map(c => {
        const puanlar = dl.map(x => {
          const ev = DB.evaluations.find(e => e.donemId === x.id && e.employeeId === c.id && !e.iptal);
          return ev ? ozetle(ev).genel : null;
        });
        const dolu = puanlar.filter(v => v != null);
        const fark = dolu.length >= 2 ? Math.round((dolu[dolu.length - 1] - dolu[0]) * 100) / 100 : null;
        return '<tr><td>' + esc(c.ad) + '</td>' + puanlar.map(v => '<td class="sayi">' + (v == null ? '—' : say2(v)) + '</td>').join('') +
          '<td class="sayi">' + (fark == null ? '—' : (fark > 0 ? '+' : '') + say2(fark)) + '</td></tr>';
      }).join('') + '</tbody></table></div>';
    return h;
  }

  if (tur === 'gorev'){
    const kats = ait('taskCategories');
    const ekip = gorulebilirCalisanlar();
    let h = raporUst('Görev Tamamlama Raporu', d.ad);
    h += '<p class="kucuk">Görev performansı: zamanında tamamlama %' + GOREV_AGIRLIK.zaman + ' · doğruluk ve kalite %' +
      GOREV_AGIRLIK.dogruluk + ' · kayıt, bilgilendirme ve sorun bildirme %' + GOREV_AGIRLIK.kayit + '.</p>';
    h += '<div class="tablo-sar"><table><thead><tr><th>Kategori</th>' + ekip.map(c => '<th class="sayi">' + esc(c.ad) + '</th>').join('') + '</tr></thead><tbody>' +
      kats.map(kt => '<tr><td>' + kt.no + '. ' + esc(kt.ad) + '</td>' +
        ekip.map(c => { const r = gorevKatPuani(d.id, c.id, kt.id); return '<td class="sayi">' + (r.puan == null ? '—' : say2(r.puan) + ' (' + r.adet + ')') + '</td>'; }).join('') + '</tr>').join('') +
      '</tbody></table></div>';
    h += '<h4>Çalışan özeti</h4><div class="tablo-sar"><table><thead><tr><th>Çalışan</th><th class="sayi">Atanan görev</th>' +
      '<th class="sayi">Değerlendirilen kayıt</th><th class="sayi">Zamanında</th><th class="sayi">Geciken</th></tr></thead><tbody>' +
      ekip.map(c => { const g = gorevOzeti(d.id, c.id);
        return '<tr><td>' + esc(c.ad) + '</td><td class="sayi">' + g.atanan + '</td><td class="sayi">' + g.kayit + '</td>' +

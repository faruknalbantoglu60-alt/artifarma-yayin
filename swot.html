<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Artıfarma · 360° SWOT Tanı Paneli</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#2A2A5E;--navy-700:#22224d;--navy-900:#16162f;
    --red:#DC1A22;--red-700:#b71219;
    --ink:#1d1d2b;--muted:#6b6b80;--line:#e6e6ee;--line-strong:#d2d2e0;
    --bg:#f5f5f9;--card:#fff;--soft:#f0f0f6;
    --ok:#1f8a52;--ok-bg:#e7f4ec;--warn:#b8860b;--warn-bg:#fbf3e0;
    --s:#1f8a52;--w:#DC1A22;--o:#2A6FDC;--t:#b35a00;
    --radius:14px;--radius-sm:9px;
    --shadow:0 1px 2px rgba(22,22,47,.04),0 8px 24px rgba(22,22,47,.06);
    --font:'Plus Jakarta Sans',system-ui,-apple-system,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:var(--font);background:var(--bg);color:var(--ink);line-height:1.5;-webkit-font-smoothing:antialiased}
  .wrap{max-width:1080px;margin:0 auto;padding:0 20px}
  header.top{background:var(--navy);color:#fff;position:sticky;top:0;z-index:50;border-bottom:3px solid var(--red)}
  .top-inner{display:flex;align-items:center;gap:14px;height:62px}
  .logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:18px;letter-spacing:-.01em;cursor:pointer}
  .logo .mark{width:30px;height:30px;border-radius:8px;background:var(--red);display:grid;place-items:center;font-size:15px;font-weight:800}
  .logo small{display:block;font-size:10px;font-weight:600;letter-spacing:.14em;color:#b9b9d6;text-transform:uppercase;margin-top:1px}
  .top-spacer{flex:1}
  .top-nav{display:flex;gap:6px;align-items:center}
  .top-nav button{background:transparent;border:none;color:#c2c2df;font-family:var(--font);font-weight:600;font-size:13px;padding:8px 12px;border-radius:7px;cursor:pointer}
  .top-nav button:hover,.top-nav button.active{background:rgba(255,255,255,.1);color:#fff}
  .whoami{font-size:12px;color:#b9b9d6;border-left:1px solid rgba(255,255,255,.2);padding-left:12px}
  .whoami b{color:#fff;display:block;font-size:13px}
  .btn{font-family:var(--font);font-weight:600;font-size:14px;border:none;border-radius:var(--radius-sm);padding:10px 16px;cursor:pointer;transition:.15s;display:inline-flex;align-items:center;gap:7px;line-height:1}
  .btn:focus-visible{outline:2px solid var(--red);outline-offset:2px}
  .btn-primary{background:var(--red);color:#fff}.btn-primary:hover{background:var(--red-700)}
  .btn-navy{background:var(--navy);color:#fff}.btn-navy:hover{background:var(--navy-700)}
  .btn-ghost{background:var(--soft);color:var(--navy)}.btn-ghost:hover{background:#e6e6f0}
  .btn-line{background:#fff;color:var(--navy);border:1.5px solid var(--line-strong)}.btn-line:hover{border-color:var(--navy)}
  .btn-sm{padding:7px 12px;font-size:13px}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  main{padding:30px 0 80px}
  .page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:22px;flex-wrap:wrap}
  .page-head h1{font-size:25px;font-weight:800;letter-spacing:-.02em;color:var(--navy)}
  .page-head p{color:var(--muted);font-size:14px;margin-top:4px;max-width:600px}
  .eyebrow{font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--red);margin-bottom:6px}
  .grid{display:grid;gap:16px}.grid-cards{grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
  .ph-card{padding:20px;cursor:pointer;transition:.15s;position:relative;overflow:hidden}
  .ph-card:hover{border-color:var(--navy);transform:translateY(-2px)}
  .ph-card .accent{position:absolute;top:0;left:0;width:4px;height:100%;background:var(--navy)}
  .ph-card h3{font-size:17px;font-weight:700;color:var(--navy);margin-bottom:3px}
  .ph-card .loc{font-size:13px;color:var(--muted);margin-bottom:6px}
  .ph-card .code{font-size:11px;font-weight:700;color:var(--red);letter-spacing:.05em;margin-bottom:14px}
  .ph-card .stats{display:flex;gap:18px;border-top:1px solid var(--line);padding-top:13px}
  .ph-card .stat b{display:block;font-size:18px;font-weight:800}.ph-card .stat span{font-size:11px;color:var(--muted);font-weight:500}
  .empty{text-align:center;padding:70px 20px;border:2px dashed var(--line-strong);border-radius:var(--radius);background:#fafafd}
  .empty .ico{width:54px;height:54px;border-radius:14px;background:var(--soft);display:grid;place-items:center;margin:0 auto 16px;font-size:24px}
  .empty h3{font-size:18px;color:var(--navy);margin-bottom:6px}
  .empty p{color:var(--muted);font-size:14px;max-width:420px;margin:0 auto 18px}
  .section{margin-bottom:26px}
  .section-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:13px;flex-wrap:wrap}
  .section-head h2{font-size:15px;font-weight:700;color:var(--navy);display:flex;align-items:center;gap:9px}
  .section-head h2 .dot{width:8px;height:8px;border-radius:50%;background:var(--red)}
  .info-row{display:flex;gap:14px;flex-wrap:wrap}
  .info-box{flex:1;min-width:180px;background:var(--card);border:1px solid var(--line);border-radius:var(--radius-sm);padding:14px 16px}
  .info-box label{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);display:block;margin-bottom:3px}
  .info-box .v{font-size:15px;font-weight:600}
  .info-box .v.code{color:var(--red);letter-spacing:.04em}
  .person-row{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:var(--radius-sm);padding:13px 16px;margin-bottom:9px;flex-wrap:wrap}
  .avatar{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;font-weight:800;color:#fff;font-size:14px;flex-shrink:0;background:var(--navy)}
  .person-row .who{flex:1;min-width:140px}
  .person-row .who b{font-size:15px;display:block}.person-row .who span{font-size:12px;color:var(--muted)}
  .pwbox{font-size:12px;background:var(--soft);border-radius:7px;padding:5px 9px;font-weight:700;color:var(--navy);letter-spacing:.04em}
  .progress{height:7px;background:var(--soft);border-radius:20px;overflow:hidden;margin-top:12px}
  .progress>i{display:block;height:100%;background:var(--ok);border-radius:20px;transition:width .3s}
  .tag{font-size:11px;font-weight:700;padding:3px 9px;border-radius:30px;white-space:nowrap}
  .tag-done{background:var(--ok-bg);color:var(--ok)}.tag-todo{background:var(--soft);color:var(--muted)}.tag-part{background:var(--warn-bg);color:var(--warn)}
  .row-actions{display:flex;gap:7px;flex-shrink:0;flex-wrap:wrap;justify-content:flex-end}
  .overlay{position:fixed;inset:0;background:rgba(22,22,47,.55);z-index:100;display:none;align-items:flex-start;justify-content:center;padding:30px 16px;overflow-y:auto}
  .overlay.open{display:flex}
  .modal{background:#fff;border-radius:var(--radius);width:100%;max-width:560px;box-shadow:0 24px 60px rgba(0,0,0,.3);animation:pop .18s ease}
  .modal.wide{max-width:780px}
  @keyframes pop{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  .modal-head{padding:20px 24px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}
  .modal-head h3{font-size:18px;font-weight:700;color:var(--navy)}
  .modal-head .x{background:var(--soft);border:none;width:32px;height:32px;border-radius:8px;cursor:pointer;font-size:18px;color:var(--muted)}
  .modal-body{padding:22px 24px;max-height:66vh;overflow-y:auto}
  .modal-foot{padding:16px 24px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:10px;background:#fafafd;border-radius:0 0 var(--radius) var(--radius)}
  .field{margin-bottom:16px}
  .field label{display:block;font-size:13px;font-weight:600;margin-bottom:6px}
  .field input,.field textarea,.field select{width:100%;font-family:var(--font);font-size:14px;padding:10px 12px;border:1.5px solid var(--line-strong);border-radius:var(--radius-sm);color:var(--ink);background:#fff}
  .field input:focus,.field textarea:focus,.field select:focus{outline:none;border-color:var(--navy)}
  .field textarea{resize:vertical;min-height:70px}
  .checks{display:grid;gap:8px;max-height:230px;overflow-y:auto}
  .checks label{display:flex;align-items:center;gap:10px;padding:9px 12px;border:1.5px solid var(--line);border-radius:var(--radius-sm);cursor:pointer;font-size:14px}
  .checks label:hover{border-color:var(--navy)}.checks input{width:auto}
  .dim{border:1px solid var(--line);border-radius:var(--radius-sm);margin-bottom:14px;overflow:hidden}
  .dim-head{background:var(--soft);padding:11px 15px;font-size:13px;font-weight:700;color:var(--navy)}
  .dim-head.fb{background:var(--navy);color:#fff}
  .q{padding:12px 15px;border-top:1px solid var(--line)}.q:first-of-type{border-top:none}
  .q-text{font-size:13.5px;margin-bottom:9px;font-weight:500}
  .scale-grp{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .scale-grp .lbl{font-size:11px;font-weight:700;color:var(--muted);width:78px;flex-shrink:0;text-transform:uppercase;letter-spacing:.04em}
  .likert{display:flex;gap:5px}
  .likert button{width:34px;height:34px;border:1.5px solid var(--line-strong);background:#fff;border-radius:8px;font-weight:700;font-size:13px;cursor:pointer;color:var(--muted)}
  .likert button.on{color:#fff;background:var(--navy);border-color:var(--navy)}
  .peer-block{border:1px solid var(--line);border-radius:var(--radius-sm);padding:12px 15px;margin-bottom:10px}
  .peer-block .ph{font-size:13px;font-weight:700;color:var(--navy);margin-bottom:9px;display:flex;align-items:center;gap:8px}
  .peer-block .ph .av{width:26px;height:26px;border-radius:7px;color:#fff;display:grid;place-items:center;font-size:11px;font-weight:800}
  /* question bank rows */
  .qbank-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px}
  .qbank-tabs button{padding:8px 13px;font-size:13px;font-weight:600;border:1.5px solid var(--line);background:#fff;border-radius:30px;cursor:pointer;color:var(--muted)}
  .qbank-tabs button.active{background:var(--navy);color:#fff;border-color:var(--navy)}
  .qb-group{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--red);margin:18px 0 8px}
  .qb-row{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--line);border-radius:var(--radius-sm);padding:11px 14px;margin-bottom:7px}
  .qb-row.hidden{opacity:.5;background:#fafafd}
  .qb-row .qt{flex:1;font-size:13.5px}
  .qb-row .typ{font-size:10px;font-weight:700;padding:2px 7px;border-radius:20px;background:var(--soft);color:var(--muted);text-transform:uppercase}
  .aud{display:flex;gap:3px;flex-wrap:wrap;max-width:130px;justify-content:flex-end}
  .aud-badge{font-size:9px;font-weight:800;color:#fff;padding:2px 5px;border-radius:5px;letter-spacing:.02em}
  .iconbtn{background:var(--soft);border:none;width:32px;height:32px;border-radius:8px;cursor:pointer;font-size:15px;color:var(--navy)}
  .iconbtn:hover{background:#e6e6f0}
  /* swot */
  .swot-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:16px}
  .quad{border:1px solid var(--line);border-radius:var(--radius-sm);padding:16px 18px;background:#fff}
  .quad h4{font-size:13px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;margin-bottom:11px;display:flex;align-items:center;gap:8px}
  .quad h4 .b{width:22px;height:22px;border-radius:6px;display:grid;place-items:center;color:#fff;font-size:12px}
  .quad.s{border-top:3px solid var(--s)}.quad.s h4{color:var(--s)}.quad.s .b{background:var(--s)}
  .quad.w{border-top:3px solid var(--w)}.quad.w h4{color:var(--w)}.quad.w .b{background:var(--w)}
  .quad.o{border-top:3px solid var(--o)}.quad.o h4{color:var(--o)}.quad.o .b{background:var(--o)}
  .quad.t{border-top:3px solid var(--t)}.quad.t h4{color:var(--t)}.quad.t .b{background:var(--t)}
  .quad ul{list-style:none}
  .quad li{font-size:13.5px;padding:6px 0 6px 16px;position:relative;border-top:1px dashed var(--line)}
  .quad li:first-child{border-top:none}
  .quad li:before{content:"";position:absolute;left:2px;top:13px;width:5px;height:5px;border-radius:50%;background:currentColor;opacity:.5}
  .insight{background:var(--navy);color:#fff;border-radius:var(--radius-sm);padding:18px 20px;margin-bottom:14px}
  .insight h4{font-size:13px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:#fff;margin-bottom:10px;display:flex;gap:8px;align-items:center}
  .insight h4 .b{background:var(--red);width:22px;height:22px;border-radius:6px;display:grid;place-items:center;font-size:12px}
  .insight ul{list-style:none}
  .insight li{font-size:13.5px;padding:6px 0 6px 16px;position:relative;border-top:1px solid rgba(255,255,255,.12);color:#e4e4f2}
  .insight li:first-child{border-top:none}
  .insight li:before{content:"›";position:absolute;left:0;color:var(--red);font-weight:800}
  .swot-tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px;border-bottom:1px solid var(--line)}
  .swot-tab{padding:10px 16px;font-size:13px;font-weight:600;color:var(--muted);background:none;border:none;border-bottom:3px solid transparent;cursor:pointer;margin-bottom:-1px}
  .swot-tab.active{color:var(--navy);border-color:var(--red)}
  .report-block{margin-bottom:30px}
  .report-block .rb-title{font-size:18px;font-weight:800;color:var(--navy);margin-bottom:3px}
  .report-block .rb-sub{font-size:12px;color:var(--muted);margin-bottom:14px;text-transform:uppercase;letter-spacing:.05em;font-weight:600}
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--navy-900);color:#fff;padding:13px 22px;border-radius:30px;font-size:14px;font-weight:600;z-index:200;box-shadow:0 8px 24px rgba(0,0,0,.25);display:none}
  .toast.show{display:block;animation:pop .2s}
  .loadbox{text-align:center;padding:50px 20px}
  .spinner{width:38px;height:38px;border:3px solid var(--line);border-top-color:var(--red);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 16px}
  @keyframes spin{to{transform:rotate(360deg)}}
  .loadbox p{color:var(--muted);font-size:14px}
  .banner{background:var(--warn-bg);border:1px solid #ecd9a6;border-radius:var(--radius-sm);padding:12px 16px;font-size:13px;color:#7a5c00;margin-bottom:18px;display:flex;gap:10px}
  .banner.err{background:#fde8e8;border-color:#f3b4b4;color:#a01217}
  .banner.ok{background:var(--ok-bg);border-color:#bfe3cd;color:#176b40}
  .meta-line{font-size:12px;color:var(--muted);margin-top:8px}
  /* login */
  .login-screen{min-height:100vh;display:grid;place-items:center;background:var(--navy);padding:20px}
  .login-card{background:#fff;border-radius:18px;padding:34px 30px;width:100%;max-width:390px;box-shadow:0 30px 70px rgba(0,0,0,.4)}
  .logochip{background:#fff;border-radius:8px;padding:5px 10px;display:inline-flex;align-items:center;height:38px}
  .logochip img{height:24px;width:auto;display:block}
  .navsub{font-size:10px;font-weight:700;letter-spacing:.14em;color:#b9b9d6;text-transform:uppercase}
  .login-logo{height:48px;width:auto;display:block;margin-bottom:16px}
  .staff-logochip{background:#fff;border-radius:8px;padding:4px 9px;display:inline-flex;align-items:center;height:34px}
  .staff-logochip img{height:22px;width:auto;display:block}
  .login-card .mark{width:46px;height:46px;border-radius:12px;background:var(--red);color:#fff;display:grid;place-items:center;font-size:22px;font-weight:800;margin-bottom:18px}
  .login-card h2{font-size:21px;color:var(--navy);margin-bottom:4px}
  .login-card p{font-size:13px;color:var(--muted);margin-bottom:20px}
  .login-toggle{display:flex;gap:6px;background:var(--soft);padding:5px;border-radius:10px;margin-bottom:20px}
  .login-toggle button{flex:1;border:none;background:transparent;font-family:var(--font);font-weight:600;font-size:13px;padding:9px;border-radius:7px;cursor:pointer;color:var(--muted)}
  .login-toggle button.active{background:#fff;color:var(--navy);box-shadow:0 1px 3px rgba(0,0,0,.1)}
  /* staff thank you */
  .staff-wrap{max-width:760px;margin:0 auto;padding:24px 20px 80px}
  .staff-top{background:var(--navy);color:#fff;padding:18px 20px;border-radius:0 0 16px 16px;margin-bottom:24px;display:flex;align-items:center;gap:12px}
  .staff-top .mark{width:34px;height:34px;border-radius:9px;background:var(--red);display:grid;place-items:center;font-weight:800}
  .staff-top b{font-size:16px}.staff-top span{font-size:12px;color:#b9b9d6;display:block}
  .thanks{text-align:center;padding:70px 20px}
  .thanks .big{font-size:48px;margin-bottom:14px}
  .thanks h2{color:var(--navy);font-size:24px;margin-bottom:8px}
  .thanks p{color:var(--muted);max-width:420px;margin:0 auto 20px}
  @media (max-width:640px){.swot-grid{grid-template-columns:1fr}.page-head h1{font-size:21px}.scale-grp .lbl{width:100%}.top-nav button{padding:8px}}
  @media print{header.top,.staff-top,.swot-tabs,.no-print,.btn{display:none!important}body{background:#fff}main,.staff-wrap{padding:0}.report-block{page-break-inside:avoid}.print-cover{display:block!important}}
  .print-cover{display:none;border-bottom:4px solid var(--navy);padding-bottom:18px;margin-bottom:26px}
  .print-cover .pl{font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--red);font-weight:700}
  .print-cover h1{font-size:28px;color:var(--navy);margin:4px 0}
  .print-cover .mt{font-size:13px;color:var(--muted)}
</style>

<body>
<div id="root"></div>
<div class="overlay" id="overlay"><div class="modal" id="modal"></div></div>
<div class="overlay" id="confirm-overlay" style="z-index:150"><div class="modal" id="confirm-box" style="max-width:430px">
  <div class="modal-head"><h3 id="confirm-title">Onay</h3></div>
  <div class="modal-body"><p id="confirm-msg" style="font-size:15px;line-height:1.55"></p></div>
  <div class="modal-foot"><button class="btn btn-line" id="confirm-cancel">Vazgeç</button><button class="btn btn-primary" id="confirm-ok">Evet</button></div>
</div></div>
<div class="toast" id="toast"></div>
<script>
const LOGO="assets/logo.png";
/* =========================================================
   ARTIFARMA 360° SWOT TANI PANELİ — v3
   Bireysel giriş (Eczane ID + kişi şifresi) · tam gizlilik
   Merkezî düzenlenebilir soru bankası · eczaneye özel PDF rapor
   ========================================================= */

const ROLES={
  eczaci:{label:"Eczacı",color:"#2A2A5E"},
  ikinci_eczaci:{label:"İkinci Eczacı",color:"#3a3a72"},
  yardimci_eczaci:{label:"Yardımcı Eczacı",color:"#484886"},
  teknisyen:{label:"Eczane Teknisyeni",color:"#DC1A22"},
  dermokozmetik:{label:"Dermokozmetik Uzmanı",color:"#b35a00"},
  cirak:{label:"Çırak",color:"#6b6b80"},
};
const ROLE_KEYS=Object.keys(ROLES);

/* ---------- VARSAYILAN SORU BANKASI ---------- */
const BANK_VERSION=3;
function defaultBank(){
  const Q=(group,text,type)=>({id:uid(),group,text,type:type||"scale",hidden:false});
  return {
    eczaci:[
      Q("Liderlik & Yönetim","Eczanenizin en önemli hedefi nedir?","open"),
      Q("Liderlik & Yönetim","Ekibiniz bu hedefi biliyor mu?"),
      Q("Liderlik & Yönetim","Çalışanlarınıza görev verirken yazılı sistem kullanıyor musunuz?"),
      Q("Liderlik & Yönetim","Verdiğiniz görevlerin takibini nasıl yapıyorsunuz?","open"),
      Q("Liderlik & Yönetim","İşler size sorulmadan ilerleyebiliyor mu?"),
      Q("Liderlik & Yönetim","Siz olmadığınızda eczane aynı düzenle çalışabilir mi?"),
      Q("Liderlik & Yönetim","Son bir yılda ekibinizde hangi gelişimleri sağladınız?","open"),

const SH=true;
const K_CFG="af2_cfg",K_IDX="af2_idx",KPH=id=>"af2_ph_"+id;
async function sget(k){ try{ const r=await window.storage.get(k,SH); return r?JSON.parse(r.value):null; }catch(e){ return null; } }
async function sset(k,v){ try{ await window.storage.set(k,JSON.stringify(v),SH); }catch(e){ toast("Kayıt hatası"); console.error(e); } }
async function loadCfg(){ return await sget(K_CFG); }
async function saveCfg(c){ await sset(K_CFG,c); }
async function loadIndex(){ return (await sget(K_IDX))||[]; }

async function loadPh(id){ const p=await sget(KPH(id)); return p?ensureDefaults(p):null; }
async function savePh(p){ await sset(KPH(p.id),p); }

function uiConfirm(msg, okLabel, danger){
  return new Promise(resolve=>{
    const ov=document.getElementById("confirm-overlay");
    document.getElementById("confirm-msg").textContent=msg;
    const okb=document.getElementById("confirm-ok"); okb.textContent=okLabel||"Evet";
    okb.className="btn "+(danger===false?"btn-navy":"btn-primary");
    const cb=document.getElementById("confirm-cancel");
    ov.classList.add("open");
    const done=v=>{ ov.classList.remove("open"); okb.onclick=null; cb.onclick=null; ov.onclick=null; resolve(v); };
    okb.onclick=()=>done(true);
    cb.onclick=()=>done(false);
    ov.onclick=e=>{ if(e.target===ov) done(false); };
  });
}

function downloadFile(filename, text, mime){
  try{
    const blob=new Blob([text],{type:(mime||"text/plain")+";charset=utf-8"});
    const url=URL.createObjectURL(blob);
    const a=document.createElement("a");
    a.href=url; a.download=filename; a.style.display="none";
    document.body.appendChild(a); a.click();
    setTimeout(()=>{ try{document.body.removeChild(a);}catch(e){} URL.revokeObjectURL(url); },1500);
    return true;
  }catch(e){ console.error(e); return false; }
}
function genCode(name){ const base=(name||"ECZ").replace(/[^A-Za-zÇĞİÖŞÜçğıöşü]/g,"").toUpperCase().slice(0,4)||"ECZ"; return base+"-"+Math.floor(1000+Math.random()*9000); }
function ensureDefaults(p){
  if(!p.code) p.code=genCode(p.name);
  (p.people||[]).forEach(pp=>{ if(!pp.pass) pp.pass=genPass(); if(!pp.answers)pp.answers={}; if(!pp.openAnswers)pp.openAnswers={}; if(!pp.peer)pp.peer={}; });
  if(!p.eczaneAnswers)p.eczaneAnswers={}; if(!p.eczaneOpen)p.eczaneOpen={};
  return p;
}

function audienceOf(q,kit){ return (q.roles&&q.roles.length)?q.roles:[kit]; }
// Bir role sorulan tüm sorular: her rol kitinden, kitlesine o rol dahil edilmiş görünür sorular
function roleQuestions(role){
  const out=[];
  ROLE_KEYS.forEach(kit=>{ (CFG.questionBank[kit]||[]).forEach(q=>{ if(!q.hidden && audienceOf(q,kit).includes(role)) out.push(q); }); });
  return out;
}
function scaleQs(role){ return roleQuestions(role).filter(q=>q.type==="scale"); }
function openQs(role){ return roleQuestions(role).filter(q=>q.type==="open"); }
function visiblePeer(){ return (CFG.peerDims||[]).filter(d=>!d.hidden); }
function staffStatus(person){
  const sc=scaleQs(person.role); if(sc.length===0) return person.submitted?"done":"todo";
  let f=0; sc.forEach(q=>{ if(person.answers[q.id]!=null) f++; });
  if(person.submitted) return "done"; if(f===0) return "todo"; return "part";
}
function personAnsweredOrtak(person){
  const o=(CFG.questionBank.ortak||[]).filter(q=>!q.hidden);
  return o.some(q=>q.type==="open"?(person.openAnswers&&person.openAnswers[q.id]):(person.answers&&person.answers[q.id]!=null));
}
function pharmacyProgress(p){
  const totalP=p.people.length;
  const doneP=p.people.filter(x=>staffStatus(x)==="done").length;
  const ortakAnswered=p.people.filter(x=>personAnsweredOrtak(x)).length;
  return {doneP,totalP,ortakAnswered,pct:totalP>0?Math.round(doneP/totalP*100):0};
}

/* Merkezî kayıt sayfasından gelen eczaneleri kurar. */
async function kuyruguIsle(){
  if(!window.ArtifarmaKurulum) return;
  const bekleyen=ArtifarmaKurulum.bekleyenler('swot');
  if(!bekleyen.length) return;
  const idx=await loadIndex();
  for(const k of bekleyen){
    let varMi=false;
    for(const it of idx){ const e=await sget(KPH(it.id));
      if(e && (e.code||'').toUpperCase()===k.id.toUpperCase()){ varMi=true; break; } }
    if(!varMi){
      const p={id:uid(),code:k.id,name:k.ad,
        info:{location:k.sehir||"",populasyon:""},
        people:[{id:uid(),name:k.eczaci||"Eczacı",role:"eczaci",note:"",pass:k.sifre,
                 answers:{},openAnswers:{},peer:{},submitted:false,swot:null}],
        eczaneAnswers:{},eczaneOpen:{},eczaneSwot:null};
      await savePh(p); idx.push({id:p.id,name:p.name});
    }
    ArtifarmaKurulum.tamamlandi('swot',k.id);
  }
  await saveIndex(idx);
  toast(bekleyen.length+" eczane merkezî kayıttan kuruldu");
}

/* Eczane kodunu ortak kimliğe çeker; ortak şifreyle girebilen bir
   eczacı kaydı yoksa ekler (kişi şifreleri kişiye özel kalır). */
async function kuyruguEsitle(){
  if(!window.ArtifarmaKurulum) return;
  const emirler=ArtifarmaKurulum.bekleyenler("swot","esle");
  if(!emirler.length) return;
  const _sade=x=>(x||'').toLocaleLowerCase('tr-TR').replace(/\s+/g,' ').trim();
  const idx=await loadIndex();
  let sayi=0;
  for(const k of emirler){
    for(const it of idx){
      const p=await loadPh(it.id);
      if(p && _sade(p.name)===_sade(k.ad)){
        p.code=k.id;
        if(!p.people.some(x=>x.pass===k.sifre)){
          const ecz=p.people.find(x=>x.role==="eczaci");
          if(ecz) ecz.pass=k.sifre;
          else p.people.push({id:uid(),name:"Eczacı",role:"eczaci",note:"",pass:k.sifre,
                              answers:{},openAnswers:{},peer:{},submitted:false,swot:null});
        }
        await savePh(p); sayi++; break;
      }
    }
    ArtifarmaKurulum.tamamlandi("swot",k.id);
  }
  if(sayi) toast(sayi+" eczane ortak kimliğe getirildi");
}

    if(!CFG.questionBank){ CFG.questionBank=defaultBank(); await saveCfg(CFG); }
    if(!CFG.peerDims){ CFG.peerDims=defaultPeerDims(); await saveCfg(CFG); }
    if(!CFG.adminUser){ CFG.adminUser="admin"; await saveCfg(CFG); }
  }
  /* Kuyruk, yönetici kurulumundan bağımsız işlenir: eczane kayıtları
     CFG gerektirmez, kurulum bitince listede hazır dururlar. */
/* Merkezden gelen silme emirleri. */
async function kuyruguSil(){
  if(!window.ArtifarmaKurulum) return;
  const emirler=ArtifarmaKurulum.bekleyenler("swot","sil");
  if(!emirler.length) return;
  const _sade=x=>(x||'').toLocaleLowerCase('tr-TR').replace(/\s+/g,' ').trim();
  let idx=await loadIndex(), sayi=0;
  for(const k of emirler){
    const kalan=[];
    for(const it of idx){
      const p=await loadPh(it.id);
      const eslesti=p && ((p.code||"").toUpperCase()===k.id.toUpperCase()||_sade(p.name)===_sade(k.ad));
      if(eslesti){ await sset(KPH(it.id),null); sayi++; } else kalan.push(it);
    }
    idx=kalan;
    ArtifarmaKurulum.tamamlandi("swot",k.id);
  }
  if(sayi){ await saveIndex(idx); toast(sayi+" eczane silindi"); }
}

/* Merkezden gelen arşiv emirleri — eczane listede gizlenir. */
async function kuyruguArsiv(){
  if(!window.ArtifarmaKurulum) return;
  const emirler=ArtifarmaKurulum.bekleyenler("swot","arsiv");
  if(!emirler.length) return;
  const _s=x=>(x||"").toLocaleLowerCase("tr-TR").trim();
  const idx=await loadIndex();
  for(const k of emirler){
    for(const it of idx){
      const p=await loadPh(it.id);
      if(p && ((p.code||"").toUpperCase()===k.id.toUpperCase()||_s(p.name)===_s(k.ad))){
        p.arsiv=!!k.arsivDeger; await savePh(p);
      }
    }
    ArtifarmaKurulum.tamamlandi("swot",k.id);
  }
}

/* Merkezdeki çalışanları bu aracın kişi kayıtlarına yansıtır.
   Şifre merkezden gelir; böylece kişi her araca AYNI şifreyle girer. */
async function merkezCalisanlari(){
  if(!window.ArtifarmaCalisan) return;
  const idx=await loadIndex(); let degisti=0;
  for(const it of idx){
    const p=await loadPh(it.id);
    if(!p || !p.code) continue;
    const merkez=ArtifarmaCalisan.liste(p.code);
    if(!merkez.length) continue;
    let yazilacak=false;
    for(const mc of merkez){
      let kisi=p.people.find(x=>x.merkezId===mc.id)
             || p.people.find(x=>!x.merkezId && (x.name||"").toLocaleLowerCase("tr-TR").trim()
                                 ===(mc.ad||"").toLocaleLowerCase("tr-TR").trim());
      const rol=(window.ArtifarmaPozisyon && ArtifarmaPozisyon.arac(mc.pozisyon,"swot")) || "teknisyen";
      if(!kisi){
        /* Şifre bu eczanede başkasındaysa merkezdeki şifre yenilenir;
           tek kaynak merkez olsun diye çakışmayı orada çözeriz. */
        let sifre=mc.sifre;
        if(p.people.some(x=>x.pass===sifre)) sifre=ArtifarmaCalisan.sifreYenile(mc.id).sifre;
        p.people.push({id:uid(),merkezId:mc.id,name:mc.ad,role:rol,note:"",pass:sifre,
          answers:{},openAnswers:{},peer:{},submitted:false,swot:null});
        yazilacak=true;
      }else{
        if(!kisi.merkezId){ kisi.merkezId=mc.id; yazilacak=true; }
        if(kisi.name!==mc.ad){ kisi.name=mc.ad; yazilacak=true; }
        if(kisi.role!==rol){ kisi.role=rol; yazilacak=true; }
        if(kisi.pass!==mc.sifre && !p.people.some(x=>x.id!==kisi.id && x.pass===mc.sifre)){
          kisi.pass=mc.sifre; yazilacak=true;
        }
      }
    }
    /* Merkezde pasife alınan kişi burada da pasif olur; merkezden
       silinen kişi (merkezId'si artık kütükte yok) buradan da kalkar.
       Elle eklenmiş kişilere (merkezId'siz) dokunulmaz. */
    const merkezIdler = merkez.map(x=>x.id);
    merkez.forEach(mc=>{
      const kisi = p.people.find(x=>x.merkezId===mc.id);
      if(kisi && !!kisi.pasif !== (mc.aktif===false)){ kisi.pasif = (mc.aktif===false); yazilacak=true; }
    });
    const kalan = p.people.filter(x=>!x.merkezId || merkezIdler.indexOf(x.merkezId)>=0);
    if(kalan.length !== p.people.length){ p.people = kalan; yazilacak=true; }

    if(yazilacak){ await savePh(p); degisti++; }
  }
  if(degisti) toast("Merkezî çalışan kayıtları alındı");
}

  await kuyruguIsle();
  await kuyruguEsitle();
  await kuyruguSil();
  await kuyruguArsiv();
  await merkezCalisanlari();
  if(!CFG){ renderSetup(); return; }
  if(!SESSION){ renderLogin(); return; }
  renderShell();
}

async function doLogin(){
  const err=$("#lg_err"); const fail=m=>{ err.style.display="block"; err.textContent=m; };

    const u=$("#lg_u").value.trim().toLowerCase(),p=$("#lg_p").value;

    const c=(CFG.consultants||[]).find(x=>x.name.toLowerCase()===u||(x.email||"").toLowerCase()===u);

        const person=p.people.find(pp=>pp.pass===pass);
        if(person){
          if(person.pasif) return fail("Bu kullanıcı pasife alınmış. Eczacınıza başvurun.");

function dlBackup(){

function fileToImport(ev){ const f=ev.target.files[0]; if(!f) return; const r=new FileReader(); r.onload=()=>{ document.getElementById("bk_in").value=r.result; toast("Dosya yüklendi — Geri Yükle'ye bas"); }; r.readAsText(f); }
async function doImport(){
  const raw=document.getElementById("bk_in").value.trim(); if(!raw){ toast("Önce yedek dosyası seç veya metni yapıştır"); return; }

        <button class="iconbtn" title="Sil" onclick="delQ('${QB_TAB}','${q.id}')">🗑</button></div>`).join("");

async function toggleQ(role,id){ const q=CFG.questionBank[role].find(x=>x.id===id); q.hidden=!q.hidden; await saveCfg(CFG); renderQBank($("#app")); }
async function delQ(role,id){ if(!(await uiConfirm("Bu soruyu silmek istediğine emin misin?","Evet, sil"))) return; CFG.questionBank[role]=CFG.questionBank[role].filter(x=>x.id!==id); await saveCfg(CFG); toast("Silindi"); renderQBank($("#app")); }
function editAudience(kit,id){
  const q=CFG.questionBank[kit].find(x=>x.id===id);

  const boxes=ROLE_KEYS.map(r=>`<label><input type="checkbox" class="aud-chk" value="${r}" ${cur.includes(r)?'checked':''}> ${ROLES[r].label}</label>`).join("");

async function saveAudience(kit,id){
  const roles=Array.from(document.querySelectorAll('.aud-chk:checked')).map(x=>x.value);
  if(roles.length===0){ toast("En az bir rol seçilmeli"); return; }
  CFG.questionBank[kit].find(x=>x.id===id).roles=roles;
  await saveCfg(CFG); closeModal(); toast("Atama güncellendi"); renderQBank($("#app"));
}
function editQ(role,id){
  const q=id?CFG.questionBank[role].find(x=>x.id===id):null;
  const groups=[...new Set((CFG.questionBank[role]||[]).map(x=>x.group))];
  const gopts=groups.map(g=>`<option ${q&&q.group===g?'selected':''}>${esc(g)}</option>`).join("");
  const isOrtak=role==="ortak";
  const cur=q?audienceOf(q,role):[role];
  const audField=isOrtak
    ? `<div class="field"><label>Kimler cevaplayacak?</label><div style="font-size:13px;color:var(--muted)">Ortak sorular tüm ekibe (herkese) sorulur.</div></div>`
    : `<div class="field"><label>Kimler cevaplayacak? (birden fazla seçebilirsin)</label><div class="checks">${ROLE_KEYS.map(r=>`<label><input type="checkbox" class="aud-chk" value="${r}" ${cur.includes(r)?'checked':''}> ${ROLES[r].label}</label>`).join("")}</div></div>`;
  openModal(`<div class="modal-head"><h3>${q?"Soruyu Düzenle":"Soru Ekle"}</h3><button class="x" onclick="closeModal()">×</button></div>
    <div class="modal-body">
      <div class="field"><label>Grup / başlık</label><input id="q_group" list="glist" value="${esc(q?q.group:(groups[0]||""))}"><datalist id="glist">${gopts}</datalist></div>
      <div class="field"><label>Soru metni *</label><textarea id="q_text">${esc(q?q.text:"")}</textarea></div>
      <div class="field"><label>Tip</label><select id="q_type"><option value="scale" ${q&&q.type==="scale"?'selected':''}>Puanlı (1-5)</option><option value="open" ${q&&q.type==="open"?'selected':''}>Açık uçlu</option></select></div>
      ${audField}
    </div><div class="modal-foot"><button class="btn btn-line" onclick="closeModal()">Vazgeç</button>
    <button class="btn btn-primary" onclick="saveQ('${role}','${id||""}')">Kaydet</button></div>`);
}
async function saveQ(role,id){
  const text=$("#q_text").value.trim(); if(!text){ toast("Soru metni gerekli"); return; }
  const group=$("#q_group").value.trim()||"Genel", type=$("#q_type").value;
  let roles=null;
  if(role!=="ortak"){ roles=Array.from(document.querySelectorAll('.aud-chk:checked')).map(x=>x.value); if(roles.length===0) roles=[role]; }
  if(id){ const q=CFG.questionBank[role].find(x=>x.id===id); q.text=text; q.group=group; q.type=type; if(roles) q.roles=roles; }
  else CFG.questionBank[role].push({id:uid(),group,text,type,hidden:false,roles:roles||undefined});
  await saveCfg(CFG); closeModal(); toast("Kaydedildi"); renderQBank($("#app"));
}

async function delPeer(id){ if(!(await uiConfirm("Bu kriteri silmek istediğine emin misin?","Evet, sil"))) return; CFG.peerDims=CFG.peerDims.filter(x=>x.id!==id); await saveCfg(CFG); renderQBank($("#app")); }

/* ---------- AI ---------- */
function parseLenientJSON(txt){
  let t=(txt||"").replace(/```json/gi,"").replace(/```/g,"").trim();
  const a=t.indexOf("{"), b=t.lastIndexOf("}");
  if(a>=0&&b>a) t=t.slice(a,b+1);
  return JSON.parse(t);
}
async function callClaude(system,user){
  const res=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({model:"claude-sonnet-4-6",max_tokens:1000,system,messages:[{role:"user",content:user}]})});
  if(!res.ok) throw new Error("API "+res.status);
  const data=await res.json();
  if(data.error) throw new Error(data.error.message||"API hata");
  const txt=(data.content||[]).filter(b=>b.type==="text").map(b=>b.text).join("\n");
  return parseLenientJSON(txt);
}
const SWOT_SYS=`Sen Artıfarma'nın kıdemli eczane yönetim danışmanısın. Türk eczacılık sektörüne hakimsin (SGK, OTC, dermokozmetik, takviye, çapraz satış, personel yönetimi).
Verilen 1-5 ölçekli öz-değerlendirme ve gizli 360° ekip geri bildiriminden profesyonel SWOT üretirsin. 4-5 güçlü yön, 1-2 zayıf yön; 3 izlenecek alan.
Kişinin öz-algısı ile ekip geri bildirimi arasında belirgin (1.5+) fark varsa "kör nokta / algı farkı" olarak işaretle.
Sorular soru formunda olabilir; 5=evet/güçlü, 1=hayır/zayıf demektir. Bazı sorular olumsuz ifade edilebilir (örn. "çatışmalar yaşanıyor mu", "hastalar bekliyor mu", "müdahale oluyor mu"); bu maddelerde yüksek puanı SORUN olarak yorumla, anlamına göre değerlendir.
Yanıtı SADECE geçerli JSON ver. Markdown veya \`\`\` KULLANMA. Türkçe, kısa, eyleme dönük.
Şema: {"guclu":[],"zayif":[],"firsatlar":[],"tehditler":[],"korNoktalar":[],"oneriler":[]}
Her dizide en fazla 4 madde; korNoktalar yoksa boş dizi.`;

function summarizePerson(person,ph){
  const sc=scaleQs(person.role); const groups={};
  sc.forEach(q=>{ (groups[q.group]=groups[q.group]||[]).push(q.text.replace(/\.$/,"")+" (öz:"+(person.answers[q.id]??"yanıtsız")+")"); });
  const lines=Object.entries(groups).map(([g,a])=>"• "+g+": "+a.join(" | "));
  const open=openQs(person.role).filter(q=>person.openAnswers?.[q.id]).map(q=>q.text+" → "+person.openAnswers[q.id]);
  const pdims=visiblePeer(); const fb=[];
  ph.people.forEach(o=>{ if(o.id!==person.id && o.peer && o.peer[person.id]){ const f=o.peer[person.id]; const seg=pdims.filter(d=>f[d.id]).map(d=>d.text+":"+f[d.id]); fb.push(`${o.name} (${ROLES[o.role].label})${o.role==="eczaci"?" [yönetici]":""}: ${seg.join(", ")||"-"}${f.note?" — \""+f.note+"\"":""}`); } });
  return {lines:lines.join("\n"),open:open.join("\n"),fb:fb.join("\n")};
}
async function genPersonSwot(person,ph){
  const s=summarizePerson(person,ph);
  const user=`Analiz birimi: ${ROLES[person.role].label.toUpperCase()} — ${person.name}\nEczane: ${ph.name} (${ph.info.location||""})\n\nÖZ-DEĞERLENDİRME:\n${s.lines}\n\nGİZLİ 360° EKİP GERİ BİLDİRİMİ (bu kişi hakkında):\n${s.fb||"(yok)"}\n\nAÇIK UÇLU:\n${s.open||"(yok)"}\n\nBu kişi için SWOT üret. Öz-algı ile 360° geri bildirimi karşılaştır; fırsat/tehditlerde mesleki gelişim ve sektörel bağlamı dikkate al.`;
  return await callClaude(SWOT_SYS,user);
}
function eczaneDataText(ph){
  const list=(CFG.questionBank.ortak||[]).filter(q=>!q.hidden);
  const scale=list.filter(q=>q.type==="scale"), opens=list.filter(q=>q.type==="open");
  const groups={}; scale.forEach(q=>{ (groups[q.group]=groups[q.group]||[]).push(q); });
  const lines=Object.entries(groups).map(([g,qs])=>{
    const parts=qs.map(q=>{
      const vals=ph.people.map(pp=>pp.answers&&pp.answers[q.id]).filter(v=>v!=null);
      if(!vals.length) return q.text.replace(/\?$/,"")+" (yanıtsız)";
      const avg=(vals.reduce((a,b)=>a+b,0)/vals.length).toFixed(1);
      const spread=Math.max(...vals)-Math.min(...vals);
      return q.text.replace(/\?$/,"")+" (ort:"+avg+"/5"+(spread>=3?" ⚠FİKİR AYRILIĞI":"")+")";
    });
    return "• "+g+": "+parts.join(" | ");
  });
  const openBlocks=opens.map(q=>{
    const ans=ph.people.map(pp=>(pp.openAnswers&&pp.openAnswers[q.id])?`${pp.name}(${ROLES[pp.role].label}): ${pp.openAnswers[q.id]}`:null).filter(Boolean);
    return ans.length?q.text+"\n   - "+ans.join("\n   - "):null;
  }).filter(Boolean);
  return `Yanıtlayan ekip: ${ph.people.map(p=>p.name+" ("+ROLES[p.role].label+")").join(", ")||"(yok)"}\n\nORTAK ALGI VERİLERİ (tüm ekip aynı soruları yanıtladı; ortalama ve fikir ayrılıkları):\n${lines.join("\n")}\n\nEKİP AÇIK UÇLU YANITLARI (rolden role karşılaştır):\n${openBlocks.join("\n")||"(yok)"}`;
}
async function genEczaneSwot(ph){
  const user=`Analiz birimi: ECZANE (İŞLETME) — ${ph.name} (${ph.info.location||""})\nPopülasyon: ${ph.info.populasyon||"(yok)"}\n\n${eczaneDataText(ph)}\n\nBu eczane için işletme düzeyinde SWOT üret. Yüksek ve uyumlu ortalamaları güçlü yön; düşük ortalamaları zayıf yön/tehdit olarak değerlendir. "FİKİR AYRILIĞI" işaretli maddeleri kör nokta olarak öne çıkar. Eğitim, kurumsallaşma ve dijitalleşmedeki açıkları fırsata bağla.`;
  return await callClaude(SWOT_SYS,user);
}

function buildSwotPrompt(ph){

  out+="Sen Artıfarma'nın kıdemli eczane yönetim danışmanısın. Türk eczacılık sektörüne hakimsin (SGK, OTC, dermokozmetik, takviye, çapraz satış, personel yönetimi).\n";
  out+="Aşağıdaki gizli 360° değerlendirme verilerinden, LİSTELENEN HER KİŞİ için ve ECZANE için ayrı bir SWOT üret.\n";
  out+="4-5 puan güçlü yön, 1-2 zayıf yön; 3 izlenecek alandır. Öz-algı ile ekip geri bildirimi arasında 1.5+ fark varsa kör nokta olarak işaretle. Soru-cümlelerde 5=evet/güçlü, 1=hayır/zayıf; olumsuz ifadeli sorularda (çatışma var mı, hasta bekliyor mu vb.) yüksek puanı sorun say.\n";
  out+="ÇIKTIYI SADECE aşağıdaki JSON şemasında ver; başka HİÇBİR metin, açıklama veya markdown ekleme. \"people\" içindeki anahtar olarak her kişinin verilen KİŞİ_ID'sini kullan:\n";
  out+=SCHEMA+"\n";
  out+="Her dizide en fazla 4 kısa, Türkçe, eyleme dönük madde. korNoktalar yoksa boş dizi ver.\n\n";
  out+=`ECZANE: ${ph.name} (${ph.info.location||""})\n\n`;
  ph.people.forEach(person=>{
    if(staffStatus(person)==="todo") return;
    const s=summarizePerson(person,ph);
    out+=`### KİŞİ_ID: ${person.id} — ${person.name} (${ROLES[person.role].label})\n`;
    out+=`ÖZ-DEĞERLENDİRME:\n${s.lines||"(yok)"}\n`;
    out+=`GİZLİ 360° EKİP GERİ BİLDİRİMİ:\n${s.fb||"(yok)"}\n`;
    out+=`AÇIK UÇLU:\n${s.open||"(yok)"}\n\n`;
  });
  out+=`### ECZANE (İŞLETME) — ortak analiz\n${eczaneDataText(ph)}\n`;
  return out;
}
async function openManualSwot(){
  openModal(`<div class="modal-head"><h3>Manuel SWOT · Kopyala–Yapıştır</h3><button class="x" onclick="closeModal()">×</button></div>
    <div class="modal-body">
      <div class="banner">Bu yöntem her ortamda çalışır:<div><b>1)</b> Aşağıdaki metni kopyala. <b>2)</b> Yeni bir Claude sohbetine yapıştırıp gönder. <b>3)</b> Claude'un verdiği JSON çıktısını ikinci kutuya yapıştır ve "Uygula"ya bas.</div></div>
      <div class="field"><label>1 · Bu metni kopyala → Claude'a yapıştır</label>
        <textarea id="manual_prompt" readonly style="height:170px;font-family:ui-monospace,Menlo,monospace;font-size:12px"></textarea>
        <button class="btn btn-navy btn-sm" style="margin-top:8px" onclick="copyPrompt()">📋 Metni Kopyala</button></div>
      <div class="field"><label>2 · Claude'un JSON cevabını buraya yapıştır</label>
        <textarea id="manual_in" placeholder='{"people":{...},"eczane":{...}}' style="height:120px;font-family:ui-monospace,Menlo,monospace;font-size:12px"></textarea></div>
    </div>
    <div class="modal-foot"><button class="btn btn-line" onclick="closeModal()">Kapat</button>
      <button class="btn btn-primary" onclick="applyManualSwot()">Uygula ve Raporu Aç</button></div>`,true);
  const ph=await loadPh(STATE.phId);
  const el=document.getElementById("manual_prompt"); if(el) el.value=buildSwotPrompt(ph);
}
function copyPrompt(){
  const ta=document.getElementById("manual_prompt"); if(!ta) return;
  ta.focus(); ta.select();
  let ok=false; try{ ok=document.execCommand("copy"); }catch(e){}
  if(ok){ toast("Kopyalandı"); return; }
  if(navigator.clipboard){ navigator.clipboard.writeText(ta.value).then(()=>toast("Kopyalandı")).catch(()=>toast("Metni elle seç: Ctrl+A, Ctrl+C")); }
  else toast("Metni elle seç: Ctrl+A, Ctrl+C");
}
async function applyManualSwot(){
  const raw=document.getElementById("manual_in").value;
  let data; try{ data=parseLenientJSON(raw); }catch(e){ toast("JSON okunamadı — çıktının tamamını yapıştırdığından emin ol"); return; }
  const ph=await loadPh(STATE.phId);
  let n=0;
  if(data.people){ ph.people.forEach(p=>{ if(data.people[p.id]){ p.swot=data.people[p.id]; n++; } }); }
  if(data.eczane){ ph.eczaneSwot=data.eczane; n++; }
  if(n===0){ toast("Eşleşen SWOT bulunamadı — kişi ID'leri değişmiş olabilir"); return; }
  ph.reportDate=new Date().toLocaleDateString("tr-TR"); ph.reportBy=SESSION.name;
  await savePh(ph); closeModal(); toast(n+" SWOT uygulandı"); go("report");
}
async function generateAll(){
  const ph=await loadPh(STATE.phId);
  const targets=ph.people.filter(p=>staffStatus(p)!=="todo");
  const ecReady=ph.people.some(p=>personAnsweredOrtak(p));
  if(targets.length===0&&!ecReady){ toast("Önce en az bir değerlendirme doldurulmalı"); return; }
  const total=targets.length+(ecReady?1:0);
  $("#app").innerHTML=`<div class="loadbox"><div class="spinner"></div><p id="loadmsg">Analiz hazırlanıyor…</p></div>`;
  let step=0;
  try{
    for(const person of targets){ step++; $("#loadmsg").textContent=`SWOT üretiliyor (${step}/${total}) · ${person.name}`; person.swot=await genPersonSwot(person,ph); await savePh(ph); }
    if(ecReady){ step++; $("#loadmsg").textContent=`SWOT üretiliyor (${step}/${total}) · İşletme`; ph.eczaneSwot=await genEczaneSwot(ph); await savePh(ph); }
    ph.reportDate=new Date().toLocaleDateString("tr-TR"); ph.reportBy=SESSION.name; await savePh(ph);
    toast("SWOT raporu hazır"); go("report");
  }catch(e){ console.error(e);
    await renderDetail($("#app"));
    toast("Otomatik üretim kapalı — manuel moda geçildi");
    openManualSwot();
  }
}

let RTAB=0;
async function renderReport(app){
  const ph=await loadPh(STATE.phId); if(!ph){ go("list"); return; }
  const blocks=[];
  ph.people.forEach(p=>{ if(p.swot) blocks.push({label:p.name,role:ROLES[p.role].label,swot:p.swot}); });
  if(ph.eczaneSwot) blocks.push({label:ph.name,role:"İşletme",swot:ph.eczaneSwot});
  if(blocks.length===0){ go("detail"); return; }
  if(RTAB>=blocks.length) RTAB=0;
  const tabBtns=blocks.map((b,i)=>`<button class="swot-tab ${i===RTAB?'active':''}" onclick="RTAB=${i};renderReport($('#app'))">${esc(b.label)} · ${b.role}</button>`).join("");
  const sections=blocks.map((b,i)=>`<div class="report-block" style="${i===RTAB?'':'display:none'}" data-sec="${i}">
      <div class="rb-title">${esc(b.label)}</div><div class="rb-sub">${esc(b.role)} · SWOT</div>${renderSwotCard(b.swot)}</div>`).join("");
  app.innerHTML=`
    <div class="page-head no-print"><div>
      <button class="btn btn-line btn-sm" onclick="go('detail')" style="margin-bottom:12px">← ${esc(ph.name)}</button>

      <h1>${esc(ph.name)} — 360° SWOT Analizi</h1>
      <div class="mt">${esc(ph.info.location||"")} · Hazırlayan: ${esc(ph.reportBy||SESSION.name)} · ${esc(ph.reportDate||new Date().toLocaleDateString("tr-TR"))}</div></div>

function printReport(){

}

async function downloadReport(){
  const ph=await loadPh(STATE.phId); if(!ph) return;
  const html=buildReportHTML(ph);
  const name=(ph.name||"eczane").replace(/[^\wÇĞİÖŞÜçğıöşü]+/g,"_")+"_SWOT.html";
  const ok=downloadFile(name, html, "text/html");
  if(ok) toast("Rapor indirildi — açıp PDF olarak yazdırabilirsin");
  else { // fallback: yeni sekmede aç
    try{ const w=window.open("","_blank"); if(w){ w.document.write(html); w.document.close(); toast("Rapor yeni sekmede açıldı"); } else toast("İndirme engellendi"); }
    catch(e){ toast("İndirme bu ortamda engellendi"); }
  }
}
function ql(arr){ return (arr&&arr.length)?arr.map(x=>`<li>${esc(x)}</li>`).join(""):`<li style="opacity:.5">—</li>`; }
function renderSwotCard(s){
  let h=`<div class="swot-grid">
    <div class="quad s"><h4><span class="b">G</span> Güçlü Yönler</h4><ul>${ql(s.guclu)}</ul></div>
    <div class="quad w"><h4><span class="b">Z</span> Zayıf Yönler</h4><ul>${ql(s.zayif)}</ul></div>
    <div class="quad o"><h4><span class="b">F</span> Fırsatlar</h4><ul>${ql(s.firsatlar)}</ul></div>
    <div class="quad t"><h4><span class="b">T</span> Tehditler</h4><ul>${ql(s.tehditler)}</ul></div></div>`;
  if(s.korNoktalar&&s.korNoktalar.length) h+=`<div class="insight"><h4><span class="b">!</span> Kör Noktalar & Algı Farkları</h4><ul>${s.korNoktalar.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div>`;

  return h;
}

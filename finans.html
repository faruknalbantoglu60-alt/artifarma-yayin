      <td class="sol"><button class="btn kucuk" data-ted-duzen="${t.id}">Düzenle</button></td></tr>`).join('')
      || '<tr><td colspan="4" class="sol ikincil">Henüz tedarikçi yok.</td></tr>'}
    </tbody></table></div>`, `<button class="btn kucuk" id="btnTedEkle">+ Tedarikçi</button>`, 'sifir');

  const yilPersA = H.yilPersoneli(e, YIL()).map(p => ({
    p, ciro: topla(yilAylari(YIL()).map(k => H.persToplam(e, k, p.id).ciro)),
    adet: topla(yilAylari(YIL()).map(k => H.persToplam(e, k, p.id).adet))
  })).map(x => ({ ...x, sepet: x.adet ? x.ciro / x.adet : null }));
  const yilTA = topla(yilPersA.map(x => x.ciro));
  const persKart = kart('Personel', 'Satış ve prim takibi için',
    personelTablosu(e, yilPersA, yilTA),
    `<button class="btn kucuk" id="btnPersEkle">+ Personel</button>`, 'sifir');

  return eczListe + (yon ? arsivKart() : '')
    + ayarKart + katKart + `<div class="satir s2">${tedKart}${persKart}</div>`
    + (yon ? yoneticiKart() : eczaneSifreKart(e)) + yedekKart();
}

/**
 * Eczane listesindeki şifre hücresi.
 * Okunabilir kopya saklanıyorsa gizli gösterilir, düğmeyle açılır ve kopyalanır.
 */
function sifreHucresi(x){
  if (!x.sifreHash) return '<span class="rozet uyari"><i></i>giriş kapalı</span>';
  if (!x.sifreAcik) return `<span class="rozet"><i></i>tanımlı · gizli</span>`;
  return `<span class="serit" style="gap:5px">
    <code class="mono" data-sifre-metin="${x.id}"
      style="font-size:12px;letter-spacing:.06em;background:var(--kart3);padding:2px 7px;
             border-radius:var(--r2);user-select:all">${'•'.repeat(Math.min(12, x.sifreAcik.length))}</code>
    <button class="btn kucuk" data-sifre-goster="${x.id}" title="Göster / gizle">Göster</button>
    <button class="btn kucuk" data-sifre-kopya="${x.id}" title="Panoya kopyala">Kopyala</button>
  </span>`;
}

/** Arşiv — yalnızca yönetici görür */
function arsivKart(){
  const ars = D.eczaneler.filter(x => x.arsiv);
  return kart('Arşiv', ars.length ? ars.length + ' eczane arşivde' : 'Arşiv boş',
    ars.length ? `<div class="tsar"><table class="t"><thead><tr>
        <th class="kilit sol">Eczane</th><th class="sol">Kod</th><th class="sol">Arşiv tarihi</th>
        <th>Kayıtlı ay</th><th></th></tr></thead>
      <tbody>${ars.map(x => `<tr>
        <td class="kilit">${kacis(x.ad)}</td>
        <td class="sol mono ikincil">${kacis(x.kod || '—')}</td>
        <td class="sol ikincil">${kacis(x.arsivTarih || '—')}</td>
        <td class="ikincil mono">${Object.keys(x.veri || {}).length}</td>
        <td class="sol"><div class="serit">
          <button class="btn kucuk ana1" data-ecz-geri="${x.id}">Geri çağır</button>
          <button class="btn kucuk" data-ecz-disa="${x.id}">Devir dosyası</button>
          <button class="btn kucuk tehlike" data-ecz-sil="${x.id}">Kalıcı sil</button>
        </div></td></tr>`).join('')}</tbody></table></div>`
      : `<div class="bos">Arşivlenen eczane, listeden ve girişten kalkar ama verisi silinmez.
          İstediğiniz an geri çağırabilirsiniz.</div>`, null, 'sifir');
}

    `<div class="satir s3">
      <label class="alan"><span>Mevcut şifre</span>
        <input class="metinGirdi" type="password" id="ysEski" autocomplete="current-password"></label>
      <label class="alan"><span>Yeni şifre</span>

/** Eczacının kendi şifresini değiştirmesi */

        <input class="metinGirdi" type="password" id="esYeni1" autocomplete="new-password"></label>

function yedekKart(){

      <button class="btn ${yon ? '' : 'ana1'}" id="btnEczYedek">Bu eczaneyi yedekle (JSON)</button>

function bgAyarlar(e, kok){
  const q = s => kok.querySelector(s);
  const ilk = q('#btnIlkEczane'); if (ilk) ilk.onclick = () => eczaneKalibi();

  kok.querySelectorAll('[data-ecz-sec]').forEach(b => b.onclick = () => {
    D.aktif = b.dataset.eczSec; kaydet(true); seciciDoldur(); ciz();
  });
  kok.querySelectorAll('[data-ecz-duzen]').forEach(b => b.onclick = () =>
    eczaneKalibi(D.eczaneler.find(x => x.id === b.dataset.eczDuzen)));
  kok.querySelectorAll('[data-ecz-kimlik]').forEach(b => b.onclick = () =>
    kimlikKalibi(D.eczaneler.find(x => x.id === b.dataset.eczKimlik)));

  kok.querySelectorAll('[data-sifre-goster]').forEach(b => b.onclick = () => {
    const x = D.eczaneler.find(z => z.id === b.dataset.sifreGoster);
    const c = kok.querySelector(`[data-sifre-metin="${x.id}"]`);
    const gizli = c.dataset.acik !== '1';
    c.textContent = gizli ? x.sifreAcik : '•'.repeat(Math.min(12, x.sifreAcik.length));
    c.dataset.acik = gizli ? '1' : '0';
    b.textContent = gizli ? 'Gizle' : 'Göster';
  });
  kok.querySelectorAll('[data-sifre-kopya]').forEach(b => b.onclick = () => {
    const x = D.eczaneler.find(z => z.id === b.dataset.sifreKopya);
    panoyaKopyala(x.sifreAcik, x.ad + ' şifresi');
  });
  kok.querySelectorAll('[data-ecz-disa]').forEach(b => b.onclick = () =>
    eczaneDisaAktar(D.eczaneler.find(x => x.id === b.dataset.eczDisa)));
  kok.querySelectorAll('[data-ecz-kopya]').forEach(b => b.onclick = () => {
    const o = D.eczaneler.find(x => x.id === b.dataset.eczKopya);
    const n = JSON.parse(JSON.stringify(o));
    n.id = yeniId(); n.ad = o.ad + ' (kopya)';
    n.kod = ''; n.sifreHash = ''; n.tuz = yeniTuz();   // kimlik kopyalanmaz
    D.eczaneler.push(n); kaydet(true); seciciDoldur(); ciz();
    bildir('Eczane kopyalandı. Kod ve şifresini ayrıca tanımlayın.');
  });
  kok.querySelectorAll('[data-ecz-arsiv]').forEach(b => b.onclick = () => {
    const o = D.eczaneler.find(x => x.id === b.dataset.eczArsiv);
    onayla('Eczaneyi arşivle',
      o.ad + ' listelerden kalkacak ve eczacı girişi kapanacak. Verisi silinmez; istediğiniz an geri çağırabilirsiniz.',
      'Arşivle', () => {
        o.arsiv = true; o.arsivTarih = new Date().toISOString().slice(0, 10);
        kaydet(true); seciciDoldur(); ciz(); bildir(o.ad + ' arşivlendi.');
      });
  });
  kok.querySelectorAll('[data-ecz-geri]').forEach(b => b.onclick = () => {
    const o = D.eczaneler.find(x => x.id === b.dataset.eczGeri);
    o.arsiv = false; o.arsivTarih = null;
    D.aktif = o.id;
    kaydet(true); seciciDoldur(); ciz(); bildir(o.ad + ' arşivden geri çağrıldı.');
  });
  kok.querySelectorAll('[data-ecz-sil]').forEach(b => b.onclick = () => {
    const o = D.eczaneler.find(x => x.id === b.dataset.eczSil);
    onayla('Eczaneyi sil',
      o.ad + ' ve bu eczaneye ait tüm veriler kalıcı olarak silinecek. Bu işlem geri alınamaz — '
      + 'yalnızca kapanan eczaneler için kullanın, geçici durumlarda arşivi tercih edin.',
      'Kalıcı olarak sil', () => {
        D.eczaneler = D.eczaneler.filter(x => x.id !== o.id);
        kaydet(true); seciciDoldur(); ciz(); bildir('Eczane silindi.');
      });
  });

  /* Yönetici şifresi */
  const ys = q('#btnYonSifre');
  if (ys) ys.onclick = async () => {
    const es = q('#ysEski').value, y1 = q('#ysYeni1').value, y2 = q('#ysYeni2').value;
    if (await sifreOzeti(D.yonetici.tuz, es) !== D.yonetici.hash) return bildir('Mevcut şifre hatalı.', true);
    if (y1.length < 6) return bildir('Yeni şifre en az 6 karakter olmalı.', true);
    if (y1 !== y2)     return bildir('İki yeni şifre aynı değil.', true);
    D.yonetici.tuz = yeniTuz();
    D.yonetici.hash = await sifreOzeti(D.yonetici.tuz, y1);
    kaydet(true); ciz(); bildir('Yönetici şifresi değiştirildi.');
  };
  /* Eczacının kendi şifresi */
  const es = q('#btnEczSifre');
  if (es && e) es.onclick = async () => {
    const o = q('#esEski').value, y1 = q('#esYeni1').value, y2 = q('#esYeni2').value;
    if (await sifreOzeti(e.tuz, o) !== e.sifreHash) return bildir('Mevcut şifre hatalı.', true);
    if (y1.length < 6) return bildir('Yeni şifre en az 6 karakter olmalı.', true);
    if (y1 !== y2)     return bildir('İki yeni şifre aynı değil.', true);
    e.tuz = yeniTuz();
    e.sifreHash = await sifreOzeti(e.tuz, y1);
    /* Danışman şifreyi görebiliyorsa yeni şifre de görünür kalmalı — aksi hâlde
       eczacı şifresini değiştirdiğinde danışman erişimini sessizce kaybederdi. */
    if (e.sifreAcik) e.sifreAcik = y1;
    kaydet(true); ciz(); bildir('Şifreniz değiştirildi.');
  };

  if (!e) { yedekBagla(kok); return; }

  const ak = q('#btnAyarKaydet');
  if (ak) ak.onclick = () => {
    e.ayar.sgkVadeGun = Math.max(0, sayiOku(q('#ayS').value) || 0);
    e.ayar.ozelVadeGun = Math.max(0, sayiOku(q('#ayO').value) || 0);
    e.ayar.disiplinOrani = kis((sayiOku(q('#ayD').value) || 70) / 100, 0.05, 1);
    e.ayar.kkKomisyon = kis((sayiOku(q('#ayK').value) || 0) / 100, 0, 0.2);
    e.ayar.varsayilanTedarikVade = Math.max(0, sayiOku(q('#ayT').value) || 90);
    e.ayar.anaYil = sayiOku(q('#ayY').value) || e.ayar.anaYil;
    kaydet(true); ciz(); bildir('Ayarlar kaydedildi.');
  };

  const ke = q('#btnKatEkle'); if (ke) ke.onclick = () => kategoriKalibi(e);
  kok.querySelectorAll('[data-kat-duzen]').forEach(b =>
    b.onclick = () => kategoriKalibi(e, e.kategoriler.find(k => k.id === b.dataset.katDuzen)));
  const te = q('#btnTedEkle'); if (te) te.onclick = () => tedarikciKalibi(e);
  kok.querySelectorAll('[data-ted-duzen]').forEach(b =>
    b.onclick = () => tedarikciKalibi(e, e.tedarikciler.find(t => t.id === b.dataset.tedDuzen)));
  const pe = q('#btnPersEkle'); if (pe) pe.onclick = () => personelKalibi(e);
  personelEylemBagla(e, kok);

  yedekBagla(kok);
}

/** Eczane kodu ve giriş şifresi — yalnızca yönetici belirler */
function kimlikKalibi(e){
  const kullanilan = D.eczaneler.filter(x => x.id !== e.id)
    .map(x => (x.kod || '').trim().toLowerCase()).filter(Boolean);
  /* Ortak kütükte bu eczane varsa kod ve şifre oradan gelir; böylece
     eczacı bütün Artıfarma araçlarına aynı bilgilerle girer. */
  const ortak = window.ArtifarmaEczane ? ArtifarmaEczane.esle(e.ad) : null;
  kalipAc('Kod ve şifre — ' + e.ad, `
    ${ortak ? `<div class="ipucuMetin" style="background:#eef2fc;border:1px solid #d6e0f5;
      border-radius:8px;padding:10px 12px;margin-bottom:4px">
      <b>Ortak kimlik:</b> Bu eczane diğer Artıfarma araçlarında
      <b class="mono">${kacis(ortak.id)}</b> kimliğiyle kayıtlı. Aşağıdaki alanlar
      aynı bilgilerle dolduruldu; değiştirmezseniz eczacı tüm araçlara tek şifreyle girer.
    </div>` : ''}
    <label class="alan"><span>Eczane kodu</span>
      <input class="metinGirdi mono" id="kmKod" value="${kacis(e.kod || (ortak ? ortak.id : ''))}" placeholder="Örn. ECZ-001"></label>
    <label class="alan"><span>Yeni giriş şifresi</span>
      <input class="metinGirdi" type="password" id="kmSifre" autocomplete="new-password"
        placeholder="${e.sifreHash ? 'Değiştirmeyecekseniz boş bırakın' : 'En az 6 karakter'}"></label>
    <div class="serit">
      <button class="btn kucuk" id="kmUret">Rastgele şifre üret</button>
      <span class="mono" id="kmGoster" style="font-size:13px;color:var(--mrk2)"></span>
    </div>
    ${e.sifreHash ? `<div class="alan"><span>Kayıtlı şifre</span>
      ${e.sifreAcik ? `<div class="serit">
        <code class="mono" id="kmKayitli" style="font-size:13.5px;letter-spacing:.06em;
          background:var(--kart3);padding:6px 11px;border-radius:var(--r2);user-select:all">${'•'.repeat(Math.min(14, e.sifreAcik.length))}</code>
        <button class="btn kucuk" id="kmKayitliGoster">Göster</button>
        <button class="btn kucuk" id="kmKayitliKopya">Kopyala</button>
      </div>`
      : `<div class="ipucuMetin">Bu eczanenin şifresi yalnızca özet olarak tutuluyor, okunamaz.
          Görebilmek için aşağıdaki kutuyu işaretleyip yeni bir şifre belirleyin.</div>`}
    </div>` : ''}

    <label class="alan" style="flex-direction:row;align-items:flex-start;gap:8px">
      <input type="checkbox" id="kmSakla" ${e.sifreAcik || !e.sifreHash ? 'checked' : ''} style="margin-top:3px">
      <span style="text-transform:none;letter-spacing:0;font-family:var(--sans);font-size:13px;color:var(--mrk2)">
        Şifreyi panelde saklansın — sonradan görüp eczacıya iletebilirsiniz</span></label>

    ${e.sifreHash ? `<button class="btn kucuk tehlike" id="kmKapat" style="align-self:flex-start">
      Girişi kapat (şifreyi kaldır)</button>` : ''}
    <p class="ipucuMetin">Eczacı bu kod ve şifreyle girip <b>yalnızca kendi eczanesini</b> görür.
      Girişin doğrulaması her zaman geri döndürülemez özetle yapılır; yukarıdaki kutu
      yalnızca <b>sizin okuyabilmeniz için</b> ikinci bir kopya tutar.</p>
    <p class="ipucuMetin"><b>Dikkat:</b> saklanan şifre, indirdiğiniz yedek ve devir
      dosyalarında okunabilir hâlde bulunur. Eczacıya kişisel şifrelerinden birini
      kullanmamasını söyleyin. Kutuyu boş bırakırsanız şifre okunamaz olur; unutulursa
      yalnızca yenisini belirleyebilirsiniz.</p>
    <p class="ipucuMetin"><b>Not:</b> veriler tarayıcıda durduğu için eczacı kendi bilgisayarından
      girecekse önce <b>Devir dosyası</b> ile eczaneyi ona aktarın. Bu giriş, dosyaya sahip birine
      karşı değil, gündelik erişime karşı koruma sağlar.</p>
  `, [
    { ad:'Vazgeç' },
    { ad:'Kaydet', sinif:'ana1', calistir: k => {
      const kod = k.querySelector('#kmKod').value.trim();
      if (!kod){ bildir('Eczane kodu gerekli.', true); return false; }
      if (kullanilan.includes(kod.toLowerCase())){ bildir('Bu kod başka bir eczanede kullanılıyor.', true); return false; }
      const s = k.querySelector('#kmSifre').value;
      if (!e.sifreHash && s.length < 6){ bildir('Şifre en az 6 karakter olmalı.', true); return false; }
      if (s && s.length < 6){ bildir('Şifre en az 6 karakter olmalı.', true); return false; }
      e.kod = kod;
      /* Şifre özetlenerek saklandığı için bir daha gösterilemez;
         kaydetmeden önce ortak kimlik kartıyla danışmana sunulur. */
      const kart = () => {
        if (!window.ArtifarmaKimlik) return;
        ArtifarmaKimlik.goster({
          arac: 'Eczane Finans Kokpiti', ortak: true,
          baslik: e.ad || 'Eczane',
          kalici: !s,
          satirlar: [{ etiket: 'Eczane kodu', deger: kod }]
            .concat(s ? [{ etiket: 'Şifre', deger: s }] : []),
          not: s ? '' : 'Şifre değiştirilmedi; eczane önceki şifresiyle girmeye devam eder.'
        });
      };
      const sakla = k.querySelector('#kmSakla').checked;
      const bitir = () => { kaydet(true); ciz(); bildir('Kod ve şifre kaydedildi.'); kart(); };
      if (s){
        e.tuz = yeniTuz();
        sifreOzeti(e.tuz, s).then(h => { e.sifreHash = h; e.sifreAcik = sakla ? s : ''; bitir(); });
      } else {
        /* Şifre değişmedi: yalnızca saklama tercihi uygulanır.
           Kapatılırsa okunabilir kopya silinir, açılamaz — yeni şifre gerekir. */
        if (!sakla) e.sifreAcik = '';
        bitir();
      }
    }}
  ]);
  const kalip = $('#kalip');
  if (ortak && !e.sifreHash) {
    const sf = kalip.querySelector('#kmSifre');
    sf.value = ortak.sifre; sf.type = 'text';
    kalip.querySelector('#kmGoster').textContent = 'Ortak şifre — diğer araçlarla aynı';
  }
  const kg = kalip.querySelector('#kmKayitliGoster');
  if (kg) kg.onclick = () => {
    const c = kalip.querySelector('#kmKayitli');
    const gizli = c.dataset.acik !== '1';
    c.textContent = gizli ? e.sifreAcik : '•'.repeat(Math.min(14, e.sifreAcik.length));
    c.dataset.acik = gizli ? '1' : '0';
    kg.textContent = gizli ? 'Gizle' : 'Göster';
  };
  const kk2 = kalip.querySelector('#kmKayitliKopya');
  if (kk2) kk2.onclick = () => panoyaKopyala(e.sifreAcik, 'Şifre');

  kalip.querySelector('#kmUret').onclick = () => {
    const abc = 'ABCDEFGHJKLMNPRSTUVYZ23456789';
    let s = '';
    const r = crypto.getRandomValues(new Uint32Array(10));
    for (let i = 0; i < 10; i++) s += abc[r[i] % abc.length];
    s = s.slice(0, 5) + '-' + s.slice(5);
    kalip.querySelector('#kmSifre').value = s;
    kalip.querySelector('#kmSifre').type = 'text';
    kalip.querySelector('#kmGoster').textContent = 'Bu şifreyi eczacıya iletin →';
  };
  const kap = kalip.querySelector('#kmKapat');
  if (kap) kap.onclick = () => {

    bildir('Bu eczane için giriş kapatıldı.');
  };
}

/** Bu kodu kullanan eczaneler (kendisi hariç) */
function kodKullananlar(kod, haricId){
  const k = (kod || '').trim().toLowerCase();
  if (!k) return [];
  return D.eczaneler.filter(x => x.id !== haricId && (x.kod || '').trim().toLowerCase() === k);
}

/** Tek eczaneyi taşınabilir bir devir dosyası olarak dışa aktarır */
function eczaneDisaAktar(e){
  const paket = {
    format: 'artifarma-eczane', surum: 1,
    tarih: new Date().toISOString().slice(0, 10),
    eczane: JSON.parse(JSON.stringify(e))
  };
  dosyaIndir('eczane-' + (e.kod || e.ad).replace(/[^\wçğıöşüÇĞİÖŞÜ-]+/g, '-') + '.json',
    JSON.stringify(paket, null, 2), 'application/json');
}

/** Devir dosyasını içe alır — mevcut eczanelerin üzerine yazmaz */
function eczaneIceAktar(paket){
  const y = paket.eczane;
  if (!y || !y.id){ bildir('Dosyada eczane kaydı bulunamadı.', true); return; }
  sema(y);
  const mevcut = D.eczaneler.find(x => x.id === y.id);
  /* Aynı kod iki eczanede olamaz — olursa hangisinin açılacağı belirsizleşir.
     Çakışan kayıt kodsuz yüklenir, yönetici yeni bir kod tanımlar. */
  const kimlikTemizle = () => {
    if (kodKullananlar(y.kod, y.id).length){
      const eski = y.kod;
      y.kod = ''; y.sifreHash = ''; y.sifreAcik = '';
      bildir('“' + eski + '” kodu başka bir eczanede kullanılıyor; '
        + y.ad + ' kodsuz yüklendi — yeni kod tanımlayın.', true);
    }
  };
  const uygula = (yeniKayit) => {
    if (yeniKayit){ y.id = yeniId(); y.kod = ''; y.sifreHash = ''; y.sifreAcik = ''; D.eczaneler.push(y); }
    else { kimlikTemizle(); D.eczaneler = D.eczaneler.map(x => x.id === y.id ? y : x); }
    D.aktif = y.id;
    kaydet(true); seciciDoldur(); ciz();
    bildir(y.ad + ' yüklendi.');
  };
  if (!mevcut){
    kimlikTemizle();
    D.eczaneler.push(y); D.aktif = y.id; kaydet(true); seciciDoldur(); ciz();
    bildir(y.ad + ' yüklendi.'); return;
  }
  kalipAc('Bu eczane zaten kayıtlı', `
    <p style="margin:0;font-size:13.5px;color:var(--mrk2);line-height:1.6">
      <b>${kacis(mevcut.ad)}</b> adıyla aynı kayıt bu tarayıcıda mevcut
      (${Object.keys(mevcut.veri || {}).length} aylık veri).
      Dosyadaki sürümde ${Object.keys(y.veri || {}).length} aylık veri var.</p>`, [
    { ad:'Vazgeç' },
    { ad:'Ayrı kayıt olarak ekle', calistir: () => uygula(true) },
    { ad:'Mevcudun üzerine yaz', sinif:'tehlike', calistir: () => uygula(false) }
  ]);
}

/* --- Yedekleme ---
   Dosya indirme iki ortamda da çalışmalı: kendi sunucusunda klasik bağlantıyla,
   claude.ai üzerinde yayınlanmış sayfada ise izin isteyen kaydetme köprüsüyle. */
const INDIRME_HATASI = {
  declined:              null,   /* kullanıcı vazgeçti — mesaj gösterme */
  rate_limited:          'Bir kaydetme penceresi zaten açık. Kapatıp tekrar deneyin.',
  too_large:             'Dosya 16 MB sınırını aşıyor. Eczaneleri ayrı ayrı dışa aktarın.',
  bad_request:           'Dosya oluşturulamadı.',
  rejected_extension:    'Bu dosya türü kaydedilemiyor.',
  extension_not_enabled: 'Bu dosya türü kaydedilemiyor.'
};

async function dosyaIndir(ad, icerik, tip){
  const kopru = window.claude && window.claude.downloads;
  if (kopru){
    const dene = async isim => { await kopru.save({ filename: isim, data: icerik }); };
    try { await dene(ad); bildir('Dosya kaydedildi.'); }
    catch (h){
      const k = h && h.code;
      /* CSV her görünümde açık değil — düz metin olarak yeniden dene */
      if (k === 'extension_not_enabled' || k === 'rejected_extension'){
        try { await dene(ad.replace(/\.[^.]+$/, '') + '.txt');
              bildir('Dosya .txt olarak kaydedildi — Excel’de “Veri → Metinden” ile açabilirsiniz.');
              return; }
        catch (h2){ /* aşağıdaki mesaja düş */ }
      }
      if (k === 'declined') return;
      const m = INDIRME_HATASI[k];
      if (m !== null) bildir(m || 'Dosya kaydedilemedi.', true);
    }
    return;
  }
  const b = new Blob([icerik], { type: tip });
  const u = URL.createObjectURL(b);
  const a = document.createElement('a');
  a.href = u; a.download = ad;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(u), 1500);
  bildir('Dosya indirildi.');
}

function csvIndir(ad, satirlar){
  const csv = satirlar.map(s => s.map(h => {
    const t = String(h ?? '');
    return /[";\n]/.test(t) ? '"' + t.replace(/"/g, '""') + '"' : t;
  }).join(';')).join('\r\n');
  dosyaIndir(ad.replace(/[^\wçğıöşüÇĞİÖŞÜ.-]+/g, '-') + '.csv', '﻿' + csv, 'text/csv;charset=utf-8');
}

function yedekBagla(kok){
  const al = kok.querySelector('#btnYedekAl');
  if (al) al.onclick = () => {
    dosyaIndir('eczane-finans-yedek-' + new Date().toISOString().slice(0, 10) + '.json',
      JSON.stringify(D, null, 2), 'application/json');
  };
  const eb = kok.querySelector('#btnEczYedek');
  if (eb) eb.onclick = () => { const e = E(); if (e) eczaneDisaAktar(e); };

  const ds = kok.querySelector('#dosyaSec');
  /* Tek dosya seçici iki iş görür: tam yedek geri yükleme ve devir dosyası yükleme */
  let bekleyenMod = 'tam';
  const yu = kok.querySelector('#btnYedekYukle');
  const ic = kok.querySelector('#btnEczIce');
  if (yu && ds) yu.onclick = () => { bekleyenMod = 'tam'; ds.click(); };
  if (ic && ds) ic.onclick = () => { bekleyenMod = 'eczane'; ds.click(); };

  if (ds) ds.onchange = () => {
    const f = ds.files[0]; if (!f) return;
    const r = new FileReader();
    r.onload = () => {
      let veri;
      try { veri = JSON.parse(r.result); }
      catch (err){ bildir('Dosya okunamadı — geçerli bir JSON değil.', true); ds.value = ''; return; }

      if (veri && veri.format === 'artifarma-eczane'){
        if (!yoneticiMi()){ bildir('Devir dosyası yüklemek için yönetici girişi gerekir.', true); ds.value = ''; return; }
        eczaneIceAktar(veri); ds.value = ''; return;
      }
      if (bekleyenMod === 'eczane'){
        bildir('Bu bir devir dosyası değil. Tam yedek yüklemek için “Yedekten geri yükle”yi kullanın.', true);
        ds.value = ''; return;
      }
      if (!veri || !Array.isArray(veri.eczaneler)){ bildir('Bu dosya bir eczane yedeği değil.', true); ds.value = ''; return; }
      onayla('Yedekten geri yükle',
        veri.eczaneler.length + ' eczane bulundu. Şu anki tüm veriler bu yedekle değiştirilecek — '
        + 'yönetici şifresi de yedekteki şifreye döner.',
        'Geri yükle', () => {
          D = Object.assign({ eczaneler:[], aktif:null, yil:new Date().getFullYear(), tema:null,
                              yonetici:{ tuz:'', hash:'' } }, veri);
          D.eczaneler.forEach(sema);
          if (!D.eczaneler.some(x => x.id === D.aktif)) D.aktif = D.eczaneler.length ? D.eczaneler[0].id : null;
          kaydet(true); temaUygula();
          if (!D.yonetici || !D.yonetici.hash){ oturumYaz(null); kurulumEkrani(); return; }
          seciciDoldur(); ciz();
          bildir('Yedek geri yüklendi.');
        });
      ds.value = '';
    };
    r.readAsText(f);
  };

  const cs = kok.querySelector('#btnCsvHepsi');
  if (cs) cs.onclick = () => {
    const e = E(); if (!e){ bildir('Aktif eczane yok.', true); return; }
    const y = YIL(), aylar = yilAylari(y);
    const s = [['ECZANE', e.ad], ['YIL', y], []];
    s.push(['KATEGORİ CİROLARI'], ['Kategori', ...aylar.map(ayEtiket), 'Toplam']);
    H.aktifKat(e).forEach(k => s.push([k.ad, ...aylar.map(a => H.katCiro(e, a, k.id)), H.yilKatCiro(e, y, k.id)]));
    EK_NAKIT.forEach(ek => s.push([ek.ad, ...aylar.map(a => (e.veri[a] ? +e.veri[a][ek.alan] || 0 : 0)),
      topla(aylar.map(a => (e.veri[a] ? +e.veri[a][ek.alan] || 0 : 0)))]));
    s.push([], ['DEPO ALIMLARI'], ['Tedarikçi','Vade', ...aylar.map(ayEtiket)]);
    e.tedarikciler.forEach(t => s.push([t.ad, t.vadeGun, ...aylar.map(a => H.netAlim(e, a, t.id))]));
    s.push([], ['NAKİT AKIŞ'], ['Ay','Kasa Girişi','Depo Ödemesi','Rutin Gider','Hesap Dışı','Brüt Kâr','Net Kâr']);
    aylar.forEach(a => { const o = H.ozet(e, a);
      s.push([ayUzun(a), o.giris, o.odeme, o.gider, o.hesapDisi, o.brut, o.net]); });
    csvIndir(e.ad + '-' + y, s);
  };
}

function kapiAc(icerik, baslik, aciklama){
  $('#kapiBaslik').textContent = baslik || 'Eczane Finans Kokpiti';
  $('#kapiAciklama').textContent = aciklama || 'Devam etmek için giriş yapın.';
  $('#kapiGovde').innerHTML = icerik;
  $('#kapi').classList.add('acik');
  const ilk = $('#kapiGovde').querySelector('input');
  if (ilk) setTimeout(() => ilk.focus(), 40);
}
const kapiKapat = () => $('#kapi').classList.remove('acik');
function kapiHata(mesaj){
  const u = $('#kapiGovde .kapiUyari');
  if (!u) return;
  u.textContent = mesaj;
  u.classList.toggle('gor', !!mesaj);
}

/** İlk açılış: yönetici şifresi belirlenir. Şifre dosyada tutulmaz. */
function kurulumEkrani(){
  kapiAc(`
    <div class="kapiUyari"></div>
    <label class="alan"><span>Yönetici şifresi</span>
      <input class="metinGirdi" type="password" id="kwS1" autocomplete="new-password"></label>
    <label class="alan"><span>Şifreyi tekrar girin</span>
      <input class="metinGirdi" type="password" id="kwS2" autocomplete="new-password"></label>
    <button class="btn ana1" id="kwTamam" style="justify-content:center;padding:9px">Kurulumu tamamla</button>
    <p class="kapiNot">Bu şifreyle tüm eczanelere erişirsiniz. Şifre yalnızca bu tarayıcıda,
      geri döndürülemez bir özet olarak saklanır — unutulursa sıfırlanamaz.</p>
  `, 'Kuruluma başlayalım', 'Yönetici şifrenizi belirleyin.');

  const git = async () => {
    const a = $('#kwS1').value, b = $('#kwS2').value;
    if (a.length < 6) return kapiHata('Şifre en az 6 karakter olmalı.');
    if (a !== b)      return kapiHata('İki şifre aynı değil.');
    D.yonetici = { tuz: yeniTuz(), hash: '' };
    D.yonetici.hash = await sifreOzeti(D.yonetici.tuz, a);
    await Depo.yaz(ANAHTAR, D);
    oturumYaz({ tip:'yonetici', ad:'Tüm eczaneler' });
    kapiKapat(); uygulamayiBaslat();
    bildir('Kurulum tamam. Şimdi ilk eczaneyi ekleyebilirsiniz.');
  };
  $('#kwTamam').onclick = git;
  $('#kapiGovde').addEventListener('keydown', e => { if (e.key === 'Enter') git(); });
}

/** Normal giriş: eczacı (kod + şifre) veya yönetici (şifre) */
function girisEkrani(secili){
  const mod = secili || 'eczane';
  kapiAc(`
    <div class="sekmeler" role="tablist">
      <button role="tab" data-mod="eczane"   aria-selected="${mod === 'eczane'}">Eczane girişi</button>
      <button role="tab" data-mod="yonetici" aria-selected="${mod === 'yonetici'}">Yönetici</button>
    </div>
    <div class="kapiUyari"></div>
    ${mod === 'eczane' ? `
      <label class="alan"><span>Eczane kodu</span>
        <input class="metinGirdi" id="kgKod" autocomplete="username" placeholder="Örn. ECZ-001"></label>
      <label class="alan"><span>Şifre</span>
        <input class="metinGirdi" type="password" id="kgSifre" autocomplete="current-password"></label>
      <button class="btn ana1" id="kgTamam" style="justify-content:center;padding:9px">Giriş yap</button>
      <p class="kapiNot">Kodunuzu ve şifrenizi danışmanınız verir.
        Yalnızca kendi eczanenizin verilerini görürsünüz.</p>
    ` : `
      <label class="alan"><span>Yönetici şifresi</span>
        <input class="metinGirdi" type="password" id="kgSifre" autocomplete="current-password"></label>
      <button class="btn ana1" id="kgTamam" style="justify-content:center;padding:9px">Giriş yap</button>
      <p class="kapiNot">Tüm eczanelere erişir, kod ve şifre tanımlar, arşivleme yaparsınız.</p>
    `}
  `, 'Eczane Finans Kokpiti', mod === 'eczane' ? 'Eczane kodunuzla giriş yapın.' : 'Yönetici olarak giriş yapın.');

  $$('#kapiGovde [data-mod]').forEach(b => b.onclick = () => girisEkrani(b.dataset.mod));

  const git = async () => {
    const sifre = $('#kgSifre').value;
    if (!sifre) return kapiHata('Şifre girin.');

    if (mod === 'yonetici'){
      if (!D.yonetici || !D.yonetici.hash) return kapiHata('Yönetici şifresi tanımlı değil.');
      if (await sifreOzeti(D.yonetici.tuz, sifre) !== D.yonetici.hash)
        return kapiHata('Şifre hatalı.');
      oturumYaz({ tip:'yonetici', ad:'Tüm eczaneler' });
      kapiKapat(); uygulamayiBaslat();
      return;
    }

    const kod = ($('#kgKod').value || '').trim().toLowerCase();
    if (!kod) return kapiHata('Eczane kodunu girin.');
    const eslesen = D.eczaneler.filter(x => (x.kod || '').trim().toLowerCase() === kod);
    /* Eski bir yedekten gelen çakışma varsa rastgele birini açmak yerine durdur */
    if (eslesen.length > 1)
      return kapiHata('Bu kod birden fazla eczanede tanımlı. Danışmanınıza başvurun.');
    const e = eslesen[0];
    /* Kod ve şifre hatası ayrı ayrı belirtilmez — hangi kodların var olduğu sızmasın */
    if (!e || !e.sifreHash) return kapiHata('Kod veya şifre hatalı.');
    if (await sifreOzeti(e.tuz, sifre) !== e.sifreHash) return kapiHata('Kod veya şifre hatalı.');
    if (e.arsiv) return kapiHata('Bu eczane arşivde. Danışmanınıza başvurun.');
    /* Merkezî yetki: eczane kaydında bu araç kapalıysa giriş verilmez. */
    if (window.ArtifarmaYetki && ArtifarmaYetki.izin(e.kod, 'finans', 'eczaci') === 'yok')
      return kapiHata(ArtifarmaYetki.mesaj('eczaci'));

    oturumYaz({ tip:'eczane', eczaneId:e.id, ad:e.ad });
    D.aktif = e.id;
    kaydet(true);
    kapiKapat(); uygulamayiBaslat();
  };

  const t = $('#kgTamam'); if (t) t.onclick = git;
  $('#kapiGovde').addEventListener('keydown', e => { if (e.key === 'Enter') git(); });
}

  disiplin: { ad:'Alım Disiplini',    alt:'Alım kapasitesi ile fiili alımın karşılaştırması',ciz:sfDisiplin, bagla:bgDisiplin },
  buyume:   { ad:'Yıl Karşılaştırma', alt:'Yıllar arası aylık büyüme ve iş günü etkisi',     ciz:sfBuyume },
  prim:     { ad:'Hedef & Prim',      alt:'Kademeli hedef tabloları ve hak ediş',            ciz:sfPrim,     bagla:bgPrim },
  urun:     { ad:'Ürün Hedefi',       alt:'Kutu bazlı ürün hedefi ve isteğe bağlı kutu primi',ciz:sfUrun,    bagla:bgUrun },
  ayarlar:  { ad:'Ayarlar & Yedek',   alt:'Eczane, kategori, tedarikçi, personel ve yedek',  ciz:sfAyarlar,  bagla:bgAyarlar }
};

/** Eczanede veri bulunan yıllar (göç ve varsayılan atamalarında kullanılır) */
function veriYillari(e){
  const y = new Set();
  Object.keys(e.veri || {}).forEach(k => y.add(ayYil(k)));
  Object.keys((e.hedef || {}).gunlukAy || {}).forEach(k => y.add(ayYil(k)));
  Object.keys(e.alimlar || {}).forEach(k => y.add(ayYil(k)));
  if (!y.size) y.add((e.ayar && e.ayar.anaYil) || new Date().getFullYear());
  return [...y];
}

/** Eski/eksik alanları tamamlar — sürüm geçişleri için */
function sema(e){
  /* Koleksiyonlar önce normalize edilir; aşağıdaki göçler veriYillari() ile
     bunları okuduğu için sıra önemlidir. */
  ['kategoriler','tedarikciler','personel','giderler','primGruplari','urunler'].forEach(a => { if (!Array.isArray(e[a])) e[a] = []; });
  ['veri','alimlar','stok','giderAy','persSatis','primAy','urunSatis'].forEach(a => { if (!e[a] || typeof e[a] !== 'object') e[a] = {}; });
  e.ayar = Object.assign({ anaYil:new Date().getFullYear(), sgkVadeGun:90, ozelVadeGun:30,
    disiplinOrani:0.7, kkKomisyon:0, varsayilanTedarikVade:90 }, e.ayar || {});
  if (!e.tuz) e.tuz = yeniTuz();
  if (e.kod == null) e.kod = '';
  if (e.sifreHash == null) e.sifreHash = '';
  if (e.sifreAcik == null) e.sifreAcik = '';
  if (e.arsiv == null) e.arsiv = false;
  e.hedef = Object.assign({ varsayilanGunluk:0, yil:{}, gunlukAy:{} }, e.hedef || {});
  if (!e.hedef.gunlukAy || typeof e.hedef.gunlukAy !== 'object') e.hedef.gunlukAy = {};
  if (!e.hedef.yil || typeof e.hedef.yil !== 'object') e.hedef.yil = {};
  /* Eski sürümde hedef tek bir global değerdi ve bütün yılları etkiliyordu.
     Verisi olan her yıla kopyalanır; yeni yıllar artık kendi hedefini bekler. */
  if (+e.hedef.varsayilanGunluk > 0){
    veriYillari(e).forEach(y => {
      if (e.hedef.yil[y] == null) e.hedef.yil[y] = +e.hedef.varsayilanGunluk;
    });
    e.hedef.varsayilanGunluk = 0;
  }
  /* Sabit gider eskiden tek bir global değerdi ve bütün yılları etkiliyordu.
     Verisi olan her yıla kopyalanır; yeni yıllar kendi tutarını bekler. */
  e.giderler.forEach(g => {
    if (!g.id) g.id = yeniId();
    if (!g.yil || typeof g.yil !== 'object') g.yil = {};
    if (+g.tutar > 0){
      veriYillari(e).forEach(y => { if (g.yil[y] == null) g.yil[y] = +g.tutar; });
      g.tutar = 0;
    }
  });
  e.urunOnKosul = Object.assign({ aktif:false, kural:'kesin', altSinir:0.9, kapsam:'primsiz' },
    e.urunOnKosul || {});
  if (!['kesin','kademeli'].includes(e.urunOnKosul.kural)) e.urunOnKosul.kural = 'kesin';
  if (!['primsiz','tumu'].includes(e.urunOnKosul.kapsam)) e.urunOnKosul.kapsam = 'primsiz';
  e.urunler.forEach(u => {
    if (!u.id) u.id = yeniId();
    if (u.aktif === undefined) u.aktif = true;
    if (u.hedef == null) u.hedef = 0;
    if (!u.hedefAy || typeof u.hedefAy !== 'object') u.hedefAy = {};
    /* Eskiden tek bir global hedef bütün aylara uygulanıyordu; davranış
       değişmesin diye verisi olan her aya açılır, sonra global sıfırlanır. */
    if (+u.hedef > 0){
      veriYillari(e).forEach(y => yilAylari(y).forEach(k => {
        if (u.hedefAy[k] == null) u.hedefAy[k] = +u.hedef;
      }));
      u.hedef = 0;
    }
    if (!['yok','sabit','kademe'].includes(u.primTipi)) u.primTipi = 'yok';
    if (u.kutuPrim == null) u.kutuPrim = 0;
    if (!Array.isArray(u.kademeler)) u.kademeler = [];
    /* Eski ikili şart, üç seçenekli hedef kuralına dönüştürülür */
    if (!['yok','kesin','kademeli'].includes(u.hedefKurali)){
      u.hedefKurali = u.hedefSarti ? 'kesin' : 'yok';
      delete u.hedefSarti;
    }
    if (u.altSinir == null) u.altSinir = 0.9;
  });
  e.primGruplari.forEach(g => {
    if (!g.id) g.id = yeniId();
    if (!g.hedefTipi) g.hedefTipi = 'sabit';
    /* Kademe tabanı: gerçek kategori cirosu (varsayılan) ya da personel girişi */
    if (g.taban !== 'personel') g.taban = 'kategori';
    if (!Array.isArray(g.kademeler)) g.kademeler = [];
    if (!Array.isArray(g.carpanlar)) g.carpanlar = [];
    if (g.gunlukHedef == null) g.gunlukHedef = 0;
    if (!g.ay || typeof g.ay !== 'object') g.ay = {};
    if (!g.yilHedef || typeof g.yilHedef !== 'object') g.yilHedef = {};
    /* Global günlük hedef, verisi olan yıllara taşınır */
    if (+g.gunlukHedef > 0){
      veriYillari(e).forEach(y => { if (g.yilHedef[y] == null) g.yilHedef[y] = +g.gunlukHedef; });
      g.gunlukHedef = 0;
    }
    /* Eski sürümlerdeki aylık istisnalar tek yerde toplanır */
    if (g.gunlukAy && typeof g.gunlukAy === 'object'){
      Object.entries(g.gunlukAy).forEach(([k, v]) => {
        if (v === null || v === undefined || v === '') return;
        g.ay[k] = Object.assign({}, g.ay[k], { gunluk: +v || 0 });
      });
      delete g.gunlukAy;
    }
    Object.entries(e.primAy || {}).forEach(([k, kayit]) => {
      const eski = kayit && kayit[g.id];
      if (Array.isArray(eski) && eski.length){
        g.ay[k] = Object.assign({}, g.ay[k], { kademeler: eski });
        delete kayit[g.id];
      }
    });
  });
  e.kategoriler.forEach((k, i) => {
    if (!k.id) k.id = yeniId();
    if (k.renk == null) k.renk = i % 8;
    if (!k.tip) k.tip = 'perakende';
    if (!k.stokGrubu) k.stokGrubu = k.ad;
    if (k.karMarji == null) k.karMarji = 0.25;
    if (k.aktif === undefined) k.aktif = true;
  });
  Object.values(e.veri).forEach(a => { if (!a.kat) a.kat = {}; });
  return e;
}

function ciz(){
  if (!O) return;
  const e = E();
  if (e) sema(e);
  const t = SAYFA[sayfaAdi] || SAYFA.kokpit;
  $('#ustBas').firstChild.nodeValue = t.ad;
  $('#ustAlt').textContent = e ? (e.ad + (e.sehir ? ' · ' + e.sehir : '') + ' · ' + YIL()) : t.alt;
  $$('.rayLink').forEach(b => b.setAttribute('aria-current', b.dataset.sayfa === sayfaAdi ? 'page' : 'false'));
  $$('.sayfa').forEach(s => s.classList.toggle('acik', s.id === 'sf-' + sayfaAdi));

  const hedef = $('#sf-' + sayfaAdi);
  bekleyenGrafikler = [];
  if (!e && sayfaAdi !== 'ayarlar'){
    hedef.innerHTML = yoneticiMi()
      ? kart('Henüz eczane yok', 'Başlamak için bir eczane ekleyin — tüm veriler eczaneye özeldir.',
          `<div class="bos">Üstteki <b>+ Eczane</b> düğmesiyle ilk eczaneyi oluşturun.</div>`)
      : kart('Eczane bulunamadı', 'Bu oturuma bağlı eczane kaydı görünmüyor.',
          `<div class="bos">Danışmanınıza başvurun.</div>`);
    return;
  }
  hedef.innerHTML = t.ciz(e);
  grafikleriBagla();
  if (t.bagla) t.bagla(e, hedef);
}

function sayfaGit(ad){
  if (!SAYFA[ad]) ad = 'kokpit';
  sayfaAdi = ad;
  ciz();
  window.scrollTo({ top:0, behavior:'instant' });
}
$$('.rayLink').forEach(b => b.onclick = () => sayfaGit(b.dataset.sayfa));

/* Eczane / yıl seçicileri */
function seciciDoldur(){
  const liste = gorunenEczaneler();
  const se = $('#secEczane');
  se.innerHTML = liste.map(e => `<option value="${e.id}">${kacis(e.ad)}</option>`).join('')
    || `<option value="">Eczane yok</option>`;
  if (!liste.some(x => x.id === D.aktif)) D.aktif = liste.length ? liste[0].id : null;
  se.value = D.aktif || '';

  /* Eczacı yalnızca kendi eczanesini görür: seçici ve "+ Eczane" gizlenir */
  const cok = yoneticiMi();
  se.hidden = !cok;
  $('#btnYeniEczane').hidden = !cok;
  oturumCipCiz();

  const e = E();
  const yillar = new Set([YIL(), new Date().getFullYear()]);
  if (e){
    Object.keys(e.veri).forEach(k => yillar.add(ayYil(k)));
    Object.keys(e.alimlar).forEach(k => yillar.add(ayYil(k)));
    yillar.add(e.ayar.anaYil);
  }
  const sirali = [...yillar].sort((a, b) => a - b);
  const en = sirali[0] - 2, son = sirali[sirali.length-1] + 2;
  const hepsi = [];
  for (let y = en; y <= son; y++) hepsi.push(y);
  $('#secYil').innerHTML = hepsi.map(y => `<option value="${y}">${y}</option>`).join('');
  $('#secYil').value = YIL();
}
$('#secEczane').onchange = e => { D.aktif = e.target.value; kaydet(true); seciciDoldur(); ciz(); };
$('#secYil').onchange = e => { D.yil = +e.target.value; kaydet(true); ciz(); };
$('#btnYeniEczane').onclick = () => eczaneKalibi();

/* Tema */
function temaUygula(){
  if (D.tema) document.documentElement.setAttribute('data-theme', D.tema);
  else document.documentElement.removeAttribute('data-theme');
}
$('#btnTema').onclick = () => {
  const koyuMu = document.documentElement.getAttribute('data-theme') === 'dark'
    || (!D.tema && matchMedia('(prefers-color-scheme: dark)').matches);
  D.tema = koyuMu ? 'light' : 'dark';
  temaUygula(); kaydet(true); ciz();
};

function eczaneKalibi(mevcut){
  const e = mevcut || null;
  kalipAc(e ? 'Eczaneyi düzenle' : 'Yeni eczane', `
    <label class="alan"><span>Eczane adı</span>
      <input class="metinGirdi" id="kAd" value="${kacis(e ? e.ad : '')}" placeholder="Örn. Yıldız Eczanesi"></label>
    <label class="alan"><span>Şehir / ilçe</span>
      <input class="metinGirdi" id="kSehir" value="${kacis(e ? e.sehir : '')}" placeholder="Örn. Ankara / Çankaya"></label>
    ${e ? '' : `<label class="alan"><span>Ana çalışma yılı</span>
      <input class="metinGirdi num" id="kYil" value="${new Date().getFullYear()}" inputmode="numeric"></label>
      <p class="ipucuMetin">Bir önceki iki yılın verilerini de girebilirsiniz — büyüme analizi bu karşılaştırmadan çıkar.</p>`}
  `, [
    { ad:'Vazgeç' },
    { ad: e ? 'Kaydet' : 'Oluştur', sinif:'ana1', calistir: k => {
      const ad = k.querySelector('#kAd').value.trim();
      if (!ad){ bildir('Eczane adı gerekli.', true); return false; }
      if (e){ e.ad = ad; e.sehir = k.querySelector('#kSehir').value.trim(); }
      else {
        const y = +k.querySelector('#kYil').value || new Date().getFullYear();
        const n = yeniEczane(ad, y);
        n.sehir = k.querySelector('#kSehir').value.trim();
        D.eczaneler.push(n); D.aktif = n.id; D.yil = y;
      }
      kaydet(true); seciciDoldur(); ciz();
      bildir(e ? 'Eczane güncellendi.' : 'Eczane oluşturuldu.');
    }}
  ]);
}

/* --- Açılış --- */
function uygulamayiBaslat(){
  const gorunen = gorunenEczaneler();
  if (!gorunen.some(e => e.id === D.aktif)) D.aktif = gorunen.length ? gorunen[0].id : null;
  if (!D.yil) D.yil = new Date().getFullYear();
  seciciDoldur();
  ciz();
}

(async function baslat(){
  const k = await Depo.oku(ANAHTAR);
  if (k && k.eczaneler) D = Object.assign(D, k);
  if (!D.yonetici) D.yonetici = { tuz:'', hash:'' };
  /* Artıfarma sitesi içinde açıldıysa araç merkezine dönüş bağlantısı ekle;
     tek başına açıldığında bağlantı gösterilmez. */
  if (window.ArtifarmaBackup)
    $('#rayAlt').innerHTML = `<a href="index.html#araclar"
      style="color:#8A8BC0;text-decoration:none">← Araçlar</a>`;
  D.eczaneler.forEach(sema);
  if (!D.yil) D.yil = new Date().getFullYear();

  /* Merkezî kayıt sayfasından gelen eczaneleri KENDİ fabrikamızla kurar;
     böylece kategori, tedarikçi ve gider yapıları eksiksiz oluşur. */
  if (window.ArtifarmaKurulum){
    const bekleyen = ArtifarmaKurulum.bekleyenler('finans');
    let kurulan = 0;
    for (const k of bekleyen){
      const mevcut = D.eczaneler.some(e => (e.kod || '').toLowerCase() === k.id.toLowerCase());
      if (!mevcut){
        const e = yeniEczane(k.ad, D.yil);
        e.kod = k.id;
        e.tuz = yeniTuz();
        e.sifreHash = await sifreOzeti(e.tuz, k.sifre);
        sema(e);
        D.eczaneler.push(e);
        if (!D.aktif) D.aktif = e.id;
        kurulan++;
      }
      ArtifarmaKurulum.tamamlandi('finans', k.id);
    }
    if (kurulan){ kaydet(true); bildir(kurulan + ' eczane merkezî kayıttan kuruldu.'); }

    /* "Tek kimliğe getir" emirleri — şifreyi kendi özet fonksiyonumuzla üretiriz. */
    const esitle = ArtifarmaKurulum.bekleyenler('finans', 'esle');
    let esitlenen = 0;
    const sade = x => (x || '').toLocaleLowerCase('tr-TR').replace(/\s+/g, ' ').trim();
    for (const k of esitle){
      const e = D.eczaneler.find(x => sade(x.ad) === sade(k.ad));
      if (e){
        e.kod = k.id;
        e.tuz = yeniTuz();
        e.sifreHash = await sifreOzeti(e.tuz, k.sifre);
        esitlenen++;
      }
      ArtifarmaKurulum.tamamlandi('finans', k.id);
    }
    if (esitlenen){ kaydet(true); bildir(esitlenen + ' eczane ortak kimliğe getirildi.'); }

    /* Arşiv emirleri */
    const arsivEmir = ArtifarmaKurulum.bekleyenler('finans', 'arsiv');
    let arsivlenen = 0;
    for (const k of arsivEmir){
      D.eczaneler.forEach(e => {
        if ((e.kod || '').toLowerCase() === k.id.toLowerCase() || sade(e.ad) === sade(k.ad)){
          e.arsiv = !!k.arsivDeger; arsivlenen++;
        }
      });
      ArtifarmaKurulum.tamamlandi('finans', k.id);
    }
    if (arsivlenen) kaydet(true);

    /* Silme emirleri */
    const silinecek = ArtifarmaKurulum.bekleyenler('finans', 'sil');
    let silinen = 0;
    for (const k of silinecek){
      const once = D.eczaneler.length;
      D.eczaneler = D.eczaneler.filter(e =>
        (e.kod || '').toLowerCase() !== k.id.toLowerCase() && sade(e.ad) !== sade(k.ad));
      silinen += once - D.eczaneler.length;
      ArtifarmaKurulum.tamamlandi('finans', k.id);
    }
    if (silinen){
      if (!D.eczaneler.some(e => e.id === D.aktif)) D.aktif = D.eczaneler.length ? D.eczaneler[0].id : null;
      kaydet(true); bildir(silinen + ' eczane silindi.');
    }
  }

  temaUygula();

  if (!D.yonetici.hash){ kurulumEkrani(); return; }   // ilk açılış
  O = oturumOku();
  if (!O || (O.tip === 'eczane' && !D.eczaneler.some(e => e.id === O.eczaneId && !e.arsiv))){
    oturumYaz(null);
    girisEkrani('eczane');
    return;
  }
  uygulamayiBaslat();
})();
</script>

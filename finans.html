/* =========================================================
   BÖLÜM 6 — Sayfalar
   ========================================================= */

/* ---------------------------------------------------------
   6.1 KOKPİT
   --------------------------------------------------------- */
function sfKokpit(e){
  const y = YIL(), gy = y - 1;
  const aylar = yilAylari(y);
  const oz = H.yilOzet(e, y), ozG = H.yilOzet(e, gy);
  const ciro = oz.ciro, ciroG = ozG.ciro;
  const buyume = ciroG ? ciro / ciroG - 1 : null;

  const durum = H.yilDurum(e, y);
  const gercekAy = durum.filter(d => d.dolu && !d.tahmin).length;
  const tahminAy = durum.filter(d => d.tahmin || !d.dolu).length;

  /* Alım disiplini — yalnızca kapasitesi hesaplanabilen aylar üzerinden */
  const olculen = aylar.map(k => ({ k, kap: H.alimKapasitesi(e, k), alm: H.netAlimToplam(e, k) }))
    .filter(x => x.kap != null && x.kap > 0);
  const kap = topla(olculen.map(x => x.kap));
  const alm = topla(olculen.map(x => x.alm));
  const dsp = kap ? alm / kap : null;

  const kumulatif = [];
  let bak = 0;
  oz.aylar.forEach(a => { bak += a.net; kumulatif.push(bak); });

  /* Hedef gerçekleşmesi — yalnızca hedef tanımlıysa gösterilir */
  const hedefY = H.yilHedef(e, y);
  const hedefKpi = hedefY ? kpi('Hedef Gerçekleşmesi', YZD0(ciro / hedefY), {
    renkli:true, ham: ciro - hedefY,
    not: 'Yıl hedefi ' + TLk(hedefY) + ' · fark ' + TLk(ciro - hedefY),
    kivilcim: aylar.map(k => { const h = H.hedefDurum(e, k); return h.oran || 0; }),
    kivilcimRenk: ciro >= hedefY ? 'var(--s6)' : 'var(--uyari)' }) : '';

  /* --- KPI şeridi --- */
  const kpiler = `<div class="satir ${hedefY ? 's6' : 's5'}">
    ${kpi('Toplam Ciro · ' + y, TLk(ciro), {
      delta: buyume, not: gy + ': ' + TLk(ciroG),
      kivilcim: aylar.map(k => H.toplamCiro(e, k)), kivilcimRenk:'var(--s1)' })}
    ${kpi('Kasaya Giren Nakit', TLk(oz.giris), {
      not: 'Perakende + vadesi gelen reçete',
      kivilcim: oz.aylar.map(a => a.giris), kivilcimRenk:'var(--s3)' })}
    ${kpi('Nakit Brüt Kâr', TLk(oz.brut), {
      renkli:true, ham:oz.brut, not: oz.brutY != null ? 'Kasa girişinin ' + YZD(oz.brutY) + '’si' : '',
      kivilcim: oz.aylar.map(a => a.brut), kivilcimRenk:'var(--s4)' })}
    ${kpi('Net Kâr (yıl)', TLk(oz.net), {
      renkli:true, ham:oz.net, not: oz.netY != null ? YZD(oz.netY) + ' net marj' : '',
      kivilcim: kumulatif, kivilcimRenk: oz.net < 0 ? 'var(--kotu)' : 'var(--s6)' })}
    ${kpi('Alım Disiplini', dsp == null ? '—' : YZD0(dsp), {
      not: olculen.length
        ? olculen.length + ' ölçülen ay · kapasite ' + TLk(kap)
        : 'Kapasite hesaplanabilen ay yok',
      kivilcim: olculen.map(x => x.alm / x.kap),
      kivilcimRenk: (dsp != null && dsp > 1) ? 'var(--kotu)' : 'var(--s7)' })}
    ${hedefKpi}
  </div>`;

  /* --- Nakit akış grafiği --- */
  const et = aylar.map(ayEtiket);
  const nakitSeri = [
    { ad:'Kasa girişi',   renk:'var(--s3)', veri: oz.aylar.map(a =>  a.giris) },
    { ad:'Depo ödemesi',  renk:'var(--s2)', veri: oz.aylar.map(a => -a.odeme) },
    { ad:'Rutin gider',   renk:'var(--s7)', veri: oz.aylar.map(a => -(a.gider + a.hesapDisi)) }
  ];
  const nakitG = kart('Aylık Nakit Akışı',
    'Yukarısı kasaya giren, aşağısı çıkan — fark o ayın net kârı',
    G(sutunGrafik(et, nakitSeri, { yigin:true, yukseklik:250 }), i => {
      const a = oz.aylar[i];
      return `<b>${ayUzun(a.ay)}</b>
        ${ipSatir('var(--s3)','Kasa girişi', TL(a.giris))}
        ${ipSatir('var(--s2)','Depo ödemesi', TL(-a.odeme))}
        ${ipSatir('var(--s7)','Rutin gider', TL(-(a.gider + a.hesapDisi)))}
        <div class="ayirac"></div>
        ${ipSatir(null,'Net', `<span class="${a.net < 0 ? 'neg' : 'poz'}">${TL(a.net)}</span>`)}`;
    }) + efsane(nakitSeri));

  /* --- 3 yıl ciro trendi --- */
  const yillar = [y - 2, y - 1, y];
  const trendSeri = yillar.map((yy, i) => ({
    ad: String(yy), renk: seriRenk(i === 2 ? 0 : i + 4),
    veri: yilAylari(yy).map(k => H.doluMu(e, k) ? H.toplamCiro(e, k) : null),
    kesik: yilAylari(yy).map(k => H.tahminMi(e, k))
  })).filter(s => s.veri.some(v => v != null));
  const trendG = kart('Ciro Trendi',
    'Kesik çizgi tahmin verisidir',
    trendSeri.length
      ? G(cizgiGrafik(AY_KISA, trendSeri, { yukseklik:250 }), i =>
          `<b>${AY_ADI[i]}</b>` + trendSeri.map(s =>
            ipSatir(s.renk, s.ad + (s.kesik[i] ? ' (tahmin)' : ''), TL(s.veri[i]))).join('')
        ) + efsane(trendSeri.map(s => ({ ad:s.ad, renk:s.renk })), true)
      : bosKart('Karşılaştırma için en az bir yılın verisi gerekiyor.'));

  /* --- Kategori dağılımı --- */
  const katlar = H.aktifKat(e).map(k => ({ k, t: H.yilKatCiro(e, y, k.id) }))
    .filter(x => x.t > 0).sort((a, b) => b.t - a.t);
  let dagilim = katlar.slice(0, 7).map(x => ({
    ad: x.k.ad, deger: x.t, renk: seriRenk(x.k.renk ?? 0),
    yan: ciro ? YZD0(x.t / ciro) : ''
  }));
  if (katlar.length > 7){
    const kalan = topla(katlar.slice(7).map(x => x.t));
    dagilim.push({ ad:'Diğer (' + (katlar.length - 7) + ' kategori)', deger:kalan, renk:'var(--mrk3)',
      yan: ciro ? YZD0(kalan / ciro) : '' });
  }
  const dagilimG = kart('Ciro Kaynağı · ' + y, 'Kategori bazında yıllık pay',
    dagilim.length ? yatayGrafik(dagilim) : bosKart('Kategori verisi girilmemiş.'));

  /* --- Uyarılar --- */
  const uy = [];
  oz.aylar.forEach(a => {
    if (a.kapasite != null && a.kapasite > 0 && a.alim > a.kapasite * 1.02)
      uy.push({ d:'kotu', b:ayUzun(a.ay) + ' — alım kapasitesi aşıldı',
        m:'Kapasite ' + TL(a.kapasite) + ', fiili alım ' + TL(a.alim) + ' (' + YZD0(a.alim/a.kapasite) + ').', s:'disiplin' });
  });
  oz.aylar.forEach(a => {
    if (a.giris > 0 && a.net < 0)
      uy.push({ d:'kotu', b:ayUzun(a.ay) + ' — ay negatif kapanıyor',
        m:'Kasa girişi ' + TL(a.giris) + ', toplam gider ' + TL(a.toplamGider) + '. Açık: ' + TL(-a.net) + '.', s:'nakit' });
  });
  const sonAy = sonGercekAy(e, y);
  if (sonAy){
    H.stokAnaliz(e, sonAy).forEach(s => {
      if (s.ayOmru != null && s.ayOmru > 3 && s.stok > 0)
        uy.push({ d:'uyari', b:s.grup + ' stoğu ağır',
          m:ayUzun(sonAy) + ' satışına göre stok ' + SAY1(s.ayOmru) + ' ayda eriyor. Bağlı sermaye: ' + TL(s.stok) + '.', s:'stok' });
    });
  }
  const eksik = durum.filter(d => !d.dolu).map(d => AY_KISA[ayIdx(d.ay)]);
  if (eksik.length && eksik.length < 12)
    uy.push({ d:'uyari', b:'Veri girilmemiş aylar', m:eksik.join(', ') + ' için ciro verisi yok. Tahmin üretebilirsiniz.', s:'ciro' });
  if (!e.tedarikciler.length || !topla(aylar.map(k => H.toplamAlim(e, k))))
    uy.push({ d:'uyari', b:'Depo alımı girilmemiş', m:'Alım verisi olmadan brüt kâr ve disiplin hesabı çalışmaz.', s:'tedarik' });
  if (!H.rutinGider(e, aylar[0]))
    uy.push({ d:'uyari', b:'Rutin gider tanımlı değil', m:'Net kâr hesabı için aylık sabit giderleri girin.', s:'gider' });

  const uyariG = kart('Dikkat Gerektirenler',
    uy.length ? uy.length + ' başlık' : 'Şu an bir uyarı yok',
    uy.length ? `<div style="display:flex;flex-direction:column;gap:0">` + uy.slice(0, 12).map((u, i) => `
      <button class="rayLink" data-git="${u.s}" style="color:var(--mrk);border-radius:7px;padding:9px 10px;
        border-top:${i ? '1px solid var(--cizgi2)' : '0'};align-items:flex-start;gap:9px">
        <span class="rozet ${u.d}" style="margin-top:1px"><i></i>${u.d === 'kotu' ? 'Kritik' : 'İzle'}</span>
        <span style="min-width:0;text-align:left">
          <b style="display:block;font-size:12.8px;font-weight:600">${kacis(u.b)}</b>
          <span style="font-size:11.8px;color:var(--mrk2);line-height:1.45">${kacis(u.m)}</span>
        </span>
      </button>`).join('') + `</div>`
      : `<div class="bos">Kapasite aşımı, negatif ay veya ağır stok görünmüyor.</div>`, null, 'sifir');

  /* --- Yıl özeti tablosu --- */
  const tablo = kart('Yıl Özeti · ' + y, 'Aylık kasa, gider ve kâr tablosu', `
    <div class="tsar"><table class="t"><thead><tr>
      <th class="kilit sol">Ay</th><th>Ciro</th><th>Kasa Girişi</th><th>Depo Ödemesi</th>
      <th>Rutin Gider</th><th>Brüt Kâr</th><th>Brüt %</th><th>Net Kâr</th><th>Net %</th><th>Kümülatif</th>
    </tr></thead><tbody>
    ${oz.aylar.map((a, i) => `<tr>
      <td class="kilit">${ayEtiket(a.ay)} ${H.tahminMi(e, a.ay) ? '<span class="rozet" style="margin-left:5px">Tahmin</span>' : ''}</td>
      <td>${TL(a.ciro)}</td><td>${TL(a.giris)}</td><td>${TL(a.odeme)}</td><td>${TL(a.gider + a.hesapDisi)}</td>
      <td class="vurgu ${a.brut < 0 ? 'neg' : ''}">${TL(a.brut)}</td><td class="ikincil">${YZD(a.brutY)}</td>
      <td class="vurgu ${a.net < 0 ? 'neg' : 'poz'}">${TL(a.net)}</td><td class="ikincil">${YZD(a.netY)}</td>
      <td class="ikincil ${kumulatif[i] < 0 ? 'neg' : ''}">${TL(kumulatif[i])}</td></tr>`).join('')}
    </tbody><tfoot><tr>
      <td class="kilit">Toplam</td><td>${TL(oz.ciro)}</td><td>${TL(oz.giris)}</td><td>${TL(oz.odeme)}</td>
      <td>${TL(oz.gider + oz.hesapDisi)}</td><td class="${oz.brut < 0 ? 'neg' : ''}">${TL(oz.brut)}</td>
      <td>${YZD(oz.brutY)}</td><td class="${oz.net < 0 ? 'neg' : 'poz'}">${TL(oz.net)}</td>
      <td>${YZD(oz.netY)}</td><td>${TL(oz.net)}</td>
    </tr></tfoot></table></div>`, null, 'sifir');

  const bilgi = `<div class="serit" style="margin-bottom:2px">
    <span class="rozet iyi"><i></i>${gercekAy} ay gerçek</span>
    <span class="rozet"><i></i>${tahminAy} ay tahmin</span>
    <span class="rozet">SGK vadesi ${e.ayar.sgkVadeGun} gün</span>
    <span class="rozet">Özel sigorta ${e.ayar.ozelVadeGun} gün</span>
    <span class="rozet">Disiplin sınırı ${YZD0(e.ayar.disiplinOrani)}</span>
  </div>`;

  return bilgi + kpiler
    + `<div class="satir s21">${nakitG}${uyariG}</div>`
    + `<div class="satir s21">${trendG}${dagilimG}</div>`
    + tablo;
}
function bgKokpit(e, kok){
  kok.querySelectorAll('[data-git]').forEach(b => b.onclick = () => sayfaGit(b.dataset.git));
}

/* ---------------------------------------------------------
   6.2 NAKİT AKIŞ
   --------------------------------------------------------- */
function sfNakit(e){
  const y = YIL(), aylar = yilAylari(y);
  const oz = H.yilOzet(e, y);
  let bak = 0;

  const satirlar = oz.aylar.map((a, i) => {
    const kir = H.nakitKirilim(e, a.ay);
    bak += a.net;
    return `<tr>
      <td class="kilit">${ayUzun(a.ay)}</td>
      <td>${TL(kir.perakende)}</td>
      <td>${TL(kir.sgk)}<div class="goz1" style="font-size:9px;opacity:.7">${ayEtiket(kir.sgkKaynak)}</div></td>
      <td>${TL(kir.ozel)}<div class="goz1" style="font-size:9px;opacity:.7">${ayEtiket(kir.ozelKaynak)}</div></td>
      <td class="vurgu">${TL(a.giris)}</td>
      <td>${TL(a.odeme)}</td>
      <td>${TL(a.gider)}</td>
      <td>${hucre(H.hesapDisi(e, a.ay), { rol:'hd', ay:a.ay }, { etiket:'Hesap dışı ' + ayUzun(a.ay) })}</td>
      <td class="vurgu ${a.brut < 0 ? 'neg' : ''}">${hc('n-b-' + i, a.brut)}</td>
      <td class="ikincil">${hc('n-by-' + i, a.brutY, YZD)}</td>
      <td class="vurgu ${a.net < 0 ? 'neg' : 'poz'}">${hc('n-n-' + i, a.net)}</td>
      <td class="ikincil">${hc('n-ny-' + i, a.netY, YZD)}</td>
      <td class="ikincil">${hc('n-k-' + i, bak)}</td>
    </tr>`;
  }).join('');

  const tablo = kart('Aylık Gelir Takibi · ' + y,
    'SGK ve özel sigorta sütunlarındaki küçük etiket, o paranın hangi ayın reçetesinden geldiğini gösterir',
    `<div class="tsar"><table class="t"><thead>
      <tr>
        <th class="kilit sol" rowspan="2">Ay</th>
        <th colspan="4" style="text-align:center;border-bottom:1px solid var(--cizgi2)">Kasaya Giren</th>
        <th colspan="4" style="text-align:center;border-bottom:1px solid var(--cizgi2)">Çıkan</th>
        <th colspan="4" style="text-align:center;border-bottom:1px solid var(--cizgi2)">Sonuç</th>
      </tr>
      <tr>
        <th>Perakende</th><th>SGK</th><th>Özel Sig.</th><th>Toplam Giriş</th>
        <th>Depo Ödemesi</th><th>Rutin Gider</th><th>Hesap Dışı</th><th></th>
        <th>Brüt Kâr</th><th>Brüt %</th><th>Net Kâr</th><th>Net %</th>
      </tr></thead>
      <tbody>${satirlar}</tbody>
      <tfoot><tr>
        <td class="kilit">Yıl Toplamı</td>
        <td colspan="3"></td><td>${TL(oz.giris)}</td>
        <td>${TL(oz.odeme)}</td><td>${TL(oz.gider)}</td><td>${TL(oz.hesapDisi)}</td><td></td>
        <td class="${oz.brut < 0 ? 'neg' : ''}">${TL(oz.brut)}</td><td>${YZD(oz.brutY)}</td>
        <td class="${oz.net < 0 ? 'neg' : 'poz'}">${TL(oz.net)}</td><td>${YZD(oz.netY)}</td>
      </tr></tfoot></table></div>`, null, 'sifir');

  /* Kümülatif nakit pozisyonu */
  let k2 = 0; const kum = oz.aylar.map(a => (k2 += a.net));
  const kumG = kart('Kümülatif Nakit Pozisyonu',
    'Yıl başından itibaren kasada biriken (veya eksilen) para',
    G(cizgiGrafik(aylar.map(ayEtiket), [
      { ad:'Kümülatif', renk: kum[kum.length-1] < 0 ? 'var(--kotu)' : 'var(--s3)', veri:kum,
        kesik: aylar.map(k => H.tahminMi(e, k)) }
    ], { yukseklik:210 }), i =>
      `<b>${ayUzun(aylar[i])}</b>${ipSatir(null,'O ayın neti', TL(oz.aylar[i].net))}${ipSatir(null,'Kümülatif', TL(kum[i]))}`));

  /* Gider yapısı */
  const yapi = [
    { ad:'Depo ödemesi', deger:oz.odeme, renk:'var(--s2)' },
    { ad:'Rutin gider',  deger:oz.gider, renk:'var(--s7)' },
    { ad:'Hesap dışı',   deger:oz.hesapDisi, renk:'var(--s5)' },
    { ad:'Kalan (net)',  deger:Math.max(0, oz.net), renk:'var(--s3)' }
  ].filter(x => x.deger > 0);
  const yapiG = kart('Kasa Girişi Nereye Gidiyor?',
    'Yılın toplam kasa girişi ' + TLk(oz.giris),
    yapi.length ? yatayGrafik(yapi.map(x => ({ ...x, yan: oz.giris ? YZD0(x.deger / oz.giris) : '' })))
                : bosKart('Veri yok.'));

  return `<div class="satir s21">${kumG}${yapiG}</div>` + tablo;
}
function bgNakit(e, kok){
  izgaraBagla(kok, (t, v) => {
    const a = H.ay(e, t.dataset.ay);
    a.hesapDisi = v || 0;
  });
  kok.addEventListener('change', ev => { if (ev.target.classList.contains('hucre')) setTimeout(ciz, 0); });
}

/* ---------------------------------------------------------
   6.3 KATEGORİ CİROLARI  (ana veri girişi)
   --------------------------------------------------------- */
function sfCiro(e){
  const y = YIL(), gy = y - 1, aylar = yilAylari(y);
  const kats = H.aktifKat(e);

  const bslk = `<th class="kilit sol">Kategori</th>` +
    aylar.map(k => `<th title="${ayUzun(k)}">${AY_KISA[ayIdx(k)]}</th>`).join('') +
    `<th style="border-left:1px solid var(--cizgi)">Toplam</th><th>${gy}</th><th>Büyüme</th>`;

  const katSatir = (k, i) => {
    const t = H.yilKatCiro(e, y, k.id), tg = H.yilKatCiro(e, gy, k.id);
    const b = tg ? t/tg - 1 : null;
    return `<tr>
      <td class="kilit"><span style="display:inline-flex;align-items:center;gap:7px">
        <i style="width:8px;height:8px;border-radius:2px;background:${seriRenk(k.renk ?? i)};flex:none"></i>
        ${kacis(k.ad)}
        ${k.tip !== 'perakende' ? `<span class="rozet" style="font-size:9px">${k.tip === 'sgk' ? 'SGK' : 'Özel'}</span>` : ''}
      </span></td>
      ${aylar.map(a => `<td>${hucre(H.katCiro(e, a, k.id), { rol:'kat', ay:a, kat:k.id },
        { etiket: k.ad + ' ' + ayUzun(a), sinif: H.tahminMi(e, a) ? 'tahmin' : '' })}</td>`).join('')}
      <td class="vurgu" style="border-left:1px solid var(--cizgi)">${hc('c-t-' + k.id, t)}</td>
      <td class="ikincil">${TL(tg)}</td>
      <td class="ikincil">${hc('c-b-' + k.id, b, YZD, b != null && b < 0 ? 'neg' : 'poz')}</td>
    </tr>`;
  };

  const ekSatir = (ek) => {
    const t = topla(aylar.map(a => { const d = e.veri[a]; return d ? +d[ek.alan] || 0 : 0; }));
    const tg = topla(yilAylari(gy).map(a => { const d = e.veri[a]; return d ? +d[ek.alan] || 0 : 0; }));
    return `<tr>
      <td class="kilit" style="color:var(--mrk2)">${kacis(ek.ad)}</td>
      ${aylar.map(a => { const d = e.veri[a];
        return `<td>${hucre(d ? +d[ek.alan] || 0 : 0, { rol:'ek', ay:a, alan:ek.alan }, { etiket: ek.ad + ' ' + ayUzun(a) })}</td>`;
      }).join('')}
      <td class="vurgu" style="border-left:1px solid var(--cizgi)">${hc('c-e-' + ek.alan, t)}</td>
      <td class="ikincil">${TL(tg)}</td>
      <td class="ikincil">${tg ? YZD(t/tg - 1) : '—'}</td>
    </tr>`;
  };

  const ozetSatir = (ad, fn, sinif, idOn) => {
    const d = aylar.map(fn), t = topla(d);
    const tg = topla(yilAylari(gy).map(fn));
    return `<tr class="${sinif}">
      <td class="kilit">${ad}</td>
      ${d.map((v, i) => `<td>${hc(idOn + '-' + i, v)}</td>`).join('')}
      <td style="border-left:1px solid var(--cizgi)">${hc(idOn + '-t', t)}</td>
      <td class="ikincil">${TL(tg)}</td>
      <td class="ikincil">${hc(idOn + '-b', tg ? t/tg - 1 : null, YZD)}</td>
    </tr>`;
  };

  const isGunuSatir = `<tr class="ara">
    <td class="kilit">İş Günü <span class="rozet" style="font-size:9px">düzeltilebilir</span></td>
    ${aylar.map(a => `<td>${hucre(H.isGunu(e, a), { rol:'isg', ay:a }, { etiket:'İş günü ' + ayUzun(a) })}</td>`).join('')}
    <td style="border-left:1px solid var(--cizgi)">${SAY(topla(aylar.map(a => H.isGunu(e, a))))}</td><td></td><td></td>
  </tr>`;

  const gunlukSatir = ozetSatir('Günlük Ortalama Ciro',
    a => { const g = H.isGunu(e, a); return g ? H.toplamCiro(e, a)/g : 0; }, 'ara', 'c-gun');

  const tahminSatir = `<tr class="ara">
    <td class="kilit">Veri Türü</td>
    ${aylar.map(a => `<td style="text-align:center">
      <button class="btn kucuk" data-tahmin="${a}" title="Gerçek / tahmin arasında geçiş"
        style="${H.tahminMi(e, a) ? 'background:var(--uyariZemin);color:var(--uyariYazi);border-color:transparent' : ''}">
        ${H.tahminMi(e, a) ? 'Tahmin' : 'Gerçek'}</button></td>`).join('')}
    <td colspan="3"></td></tr>`;

  const arac = `
    <button class="btn kucuk" id="btnTahmin">Kalan ayları tahminle</button>
    <button class="btn kucuk" id="btnGecenYil">Geçen yıldan +% ile doldur</button>
    <button class="btn kucuk" id="btnCiroDisa">CSV indir</button>`;

  const tablo = kart('Kategori Ciroları · ' + y,
    'Hücreye yazın veya Excel’den bir blok kopyalayıp doğrudan yapıştırın. Ok tuşlarıyla gezinebilirsiniz.',
    `<div class="tsar"><table class="t">
      <thead><tr>${bslk}</tr></thead>
      <tbody>
        ${kats.map(katSatir).join('')}
        ${EK_NAKIT.map(ekSatir).join('')}
      </tbody>
      <tbody>
        ${ozetSatir('SGK Toplamı',        a => H.tipCiro(e, a, 'sgk'), 'ara', 'c-sgk')}
        ${ozetSatir('Özel Sigorta',       a => H.tipCiro(e, a, 'ozel'), 'ara', 'c-ozl')}
        ${ozetSatir('Perakende + Ek Nakit',a => H.nakitCiro(e, a), 'ara', 'c-nkt')}
        ${ozetSatir('TOPLAM CİRO',        a => H.toplamCiro(e, a), 'tpl', 'c-top')}
        ${isGunuSatir}
        ${gunlukSatir}
        ${tahminSatir}
      </tbody>
    </table></div>`, arac, 'sifir');

  /* Kategori payları */
  const paylar = kats.map((k, i) => ({ k, t: H.yilKatCiro(e, y, k.id), i }))
    .filter(x => x.t > 0).sort((a, b) => b.t - a.t);
  const toplamY = H.yilCiro(e, y);
  const payKart = kart('Kategori Payları · ' + y, 'Yıllık ciro içindeki ağırlık',
    paylar.length ? yatayGrafik(paylar.map(x => ({
      ad:x.k.ad, deger:x.t, renk:seriRenk(x.k.renk ?? x.i),
      yan: toplamY ? YZD0(x.t/toplamY) : ''
    }))) : bosKart('Veri girildikçe burada görünür.'));

  /* Kategori büyümesi */
  const buy = kats.map((k, i) => {
    const t = H.yilKatCiro(e, y, k.id), tg = H.yilKatCiro(e, gy, k.id);
    return { k, i, t, tg, b: tg ? t/tg - 1 : null };
  }).filter(x => x.tg > 0 || x.t > 0);
  const buyKart = kart('Kategori Büyümesi', gy + ' → ' + y,
    buy.length ? `<div class="tsar"><table class="t"><thead><tr>
      <th class="kilit sol">Kategori</th><th>${gy}</th><th>${y}</th><th>Fark</th><th>Büyüme</th></tr></thead>
      <tbody>${buy.sort((a,b) => (b.b ?? -9) - (a.b ?? -9)).map(x => `<tr>
        <td class="kilit">${kacis(x.k.ad)}</td><td class="ikincil">${TL(x.tg)}</td><td>${TL(x.t)}</td>
        <td class="${x.t - x.tg < 0 ? 'neg' : 'poz'}">${TL(x.t - x.tg)}</td>
        <td class="vurgu ${x.b != null && x.b < 0 ? 'neg' : 'poz'}">${YZD(x.b)}</td></tr>`).join('')}
      </tbody></table></div>` : bosKart('Karşılaştırma için önceki yıl verisi gerekiyor.'), null, 'sifir');

  return tablo + `<div class="satir s2">${payKart}${buyKart}</div>`;
}

function bgCiro(e, kok){
  const y = YIL(), aylar = yilAylari(y), gy = y - 1;

  function tazele(){
    H.aktifKat(e).forEach(k => {
      const t = H.yilKatCiro(e, y, k.id), tg = H.yilKatCiro(e, gy, k.id);
      hy('c-t-' + k.id, TL(t));
      const b = tg ? t/tg - 1 : null;
      hy('c-b-' + k.id, YZD(b), b != null && b < 0 ? 'neg' : 'poz');
    });
    EK_NAKIT.forEach(ek => hy('c-e-' + ek.alan,
      TL(topla(aylar.map(a => { const d = e.veri[a]; return d ? +d[ek.alan] || 0 : 0; })))));
    const setler = [
      ['c-sgk', a => H.tipCiro(e, a, 'sgk')],
      ['c-ozl', a => H.tipCiro(e, a, 'ozel')],
      ['c-nkt', a => H.nakitCiro(e, a)],
      ['c-top', a => H.toplamCiro(e, a)],
      ['c-gun', a => { const g = H.isGunu(e, a); return g ? H.toplamCiro(e, a)/g : 0; }]
    ];
    setler.forEach(([on, fn]) => {
      const d = aylar.map(fn), t = topla(d);
      d.forEach((v, i) => hy(on + '-' + i, TL(v)));
      hy(on + '-t', TL(t));
      const tg = topla(yilAylari(gy).map(fn));
      hy(on + '-b', YZD(tg ? t/tg - 1 : null));
    });
  }

  izgaraBagla(kok, (t, v) => {
    const d = t.dataset, a = H.ay(e, d.ay);
    if (d.rol === 'kat') a.kat[d.kat] = v || 0;
    else if (d.rol === 'ek') a[d.alan] = v || 0;
    else if (d.rol === 'isg') a.isGunu = v || null;
    tazele();
  });

  kok.querySelectorAll('[data-tahmin]').forEach(b => b.onclick = () => {
    const a = H.ay(e, b.dataset.tahmin);
    a.tahmin = !a.tahmin;
    kaydet(true); ciz();
  });

  const btnT = kok.querySelector('#btnTahmin');
  if (btnT) btnT.onclick = () => {
    const dolu = aylar.filter(a => H.doluMu(e, a) && !H.tahminMi(e, a));
    if (!dolu.length){ bildir('Önce en az bir ayın gerçek verisini girin.', true); return; }
    kalipAc('Kalan ayları tahminle', `
      <p class="ipucuMetin">${dolu.length} ay gerçek veri içeriyor. Boş kalan aylar, son
      <b>3 ayın iş günü başına ortalaması</b> üzerinden doldurulur; ardından aşağıdaki oran uygulanır.</p>
      <label class="alan"><span>Büyüme / düzeltme oranı (%)</span>
        <input class="metinGirdi num" id="tOran" value="0" inputmode="decimal"></label>
      <label class="alan"><span>Kaç aylık ortalama alınsın</span>
        <input class="metinGirdi num" id="tPen" value="3" inputmode="numeric"></label>
    `, [
      { ad:'Vazgeç' },
      { ad:'Tahminleri üret', sinif:'ana1', calistir: k => {
        const oran = 1 + (sayiOku(k.querySelector('#tOran').value) || 0) / 100;
        const pen = Math.max(1, Math.min(12, sayiOku(k.querySelector('#tPen').value) || 3));
        const kaynak = dolu.slice(-pen);
        const kats = H.aktifKat(e);
        let sayac = 0;
        aylar.forEach(a => {
          if (H.doluMu(e, a) && !H.tahminMi(e, a)) return;
          const hedefGun = H.isGunu(e, a);
          const veri = H.ay(e, a);
          kats.forEach(c => {
            const gunluk = topla(kaynak.map(s => H.katCiro(e, s, c.id) / (H.isGunu(e, s) || 1))) / kaynak.length;
            veri.kat[c.id] = Math.round(gunluk * hedefGun * oran);
          });
          EK_NAKIT.forEach(ek => {
            const gunluk = topla(kaynak.map(s => ((e.veri[s] ? +e.veri[s][ek.alan] || 0 : 0)) / (H.isGunu(e, s) || 1))) / kaynak.length;
            veri[ek.alan] = Math.round(gunluk * hedefGun * oran);
          });
          veri.tahmin = true; sayac++;
        });
        kaydet(true); ciz();
        bildir(sayac + ' ay tahminle dolduruldu.');
      }}
    ]);
  };

  const btnG = kok.querySelector('#btnGecenYil');
  if (btnG) btnG.onclick = () => {
    if (!H.yilCiro(e, gy)){ bildir(gy + ' yılında veri yok.', true); return; }
    kalipAc(gy + ' verisinden doldur', `
      <p class="ipucuMetin">${gy} yılının aylık kategori verileri, belirlediğiniz oranla çarpılıp
      ${y} yılının <b>boş</b> aylarına yazılır. Dolu aylar korunur.</p>
      <label class="alan"><span>Büyüme oranı (%)</span>
        <input class="metinGirdi num" id="gOran" value="25" inputmode="decimal"></label>
    `, [
      { ad:'Vazgeç' },
      { ad:'Doldur', sinif:'ana1', calistir: k => {
        const oran = 1 + (sayiOku(k.querySelector('#gOran').value) || 0) / 100;
        let sayac = 0;
        aylar.forEach((a, i) => {
          if (H.doluMu(e, a) && !H.tahminMi(e, a)) return;
          const kay = ayAnh(gy, i), veri = H.ay(e, a);
          H.aktifKat(e).forEach(c => veri.kat[c.id] = Math.round(H.katCiro(e, kay, c.id) * oran));
          EK_NAKIT.forEach(ek => veri[ek.alan] = Math.round((e.veri[kay] ? +e.veri[kay][ek.alan] || 0 : 0) * oran));
          veri.tahmin = true; sayac++;
        });
        kaydet(true); ciz();
        bildir(sayac + ' ay ' + gy + ' verisinden dolduruldu.');
      }}
    ]);
  };

  const btnC = kok.querySelector('#btnCiroDisa');
  if (btnC) btnC.onclick = () => {
    const bas = ['Kategori', ...aylar.map(ayEtiket), 'Toplam'];
    const sat = H.aktifKat(e).map(k => [k.ad, ...aylar.map(a => H.katCiro(e, a, k.id)), H.yilKatCiro(e, y, k.id)]);
    EK_NAKIT.forEach(ek => sat.push([ek.ad, ...aylar.map(a => (e.veri[a] ? +e.veri[a][ek.alan] || 0 : 0)),
      topla(aylar.map(a => (e.veri[a] ? +e.veri[a][ek.alan] || 0 : 0)))]));
    sat.push(['TOPLAM CİRO', ...aylar.map(a => H.toplamCiro(e, a)), H.yilCiro(e, y)]);
    csvIndir(e.ad + '-ciro-' + y, [bas, ...sat]);
  };
}

function sfTedarik(e){
  const y = YIL(), aylar = yilAylari(y);
  const tds = e.tedarikciler.filter(t => t.aktif !== false);

  if (!tds.length)
    return kart('Depo & Alım', 'Önce tedarikçi tanımlayın',
      `<div class="bos">Alım kaydı için en az bir depo/tedarikçi gerekiyor.<br><br>
        <button class="btn ana1" id="btnTedEkle">+ Tedarikçi ekle</button></div>`);

  const izgara = (rol, baslik) => `
    <div class="tsar"><table class="t">
      <thead><tr><th class="kilit sol">${baslik}</th><th>Vade</th>
        ${aylar.map(a => `<th title="${ayUzun(a)}">${AY_KISA[ayIdx(a)]}</th>`).join('')}
        <th style="border-left:1px solid var(--cizgi)">Toplam</th></tr></thead>
      <tbody>${tds.map(t => `<tr>
        <td class="kilit">${kacis(t.ad)}</td>
        <td class="ikincil mono">${t.vadeGun === 0 ? 'Peşin' : t.vadeGun + ' gün'}</td>
        ${aylar.map(a => `<td>${hucre(H.alimKayit(e, a, t.id)[rol], { rol, ay:a, ted:t.id },
          { etiket: t.ad + ' ' + ayUzun(a) })}</td>`).join('')}
        <td class="vurgu" style="border-left:1px solid var(--cizgi)">${hc('d-' + rol + '-' + t.id,
          topla(aylar.map(a => H.alimKayit(e, a, t.id)[rol])))}</td>
      </tr>`).join('')}</tbody>
      <tfoot><tr><td class="kilit">Toplam</td><td></td>
        ${aylar.map((a, i) => `<td>${hc('d-' + rol + '-ay-' + i,
          topla(tds.map(t => H.alimKayit(e, a, t.id)[rol])))}</td>`).join('')}
        <td style="border-left:1px solid var(--cizgi)">${hc('d-' + rol + '-tt',
          topla(aylar.map(a => topla(tds.map(t => H.alimKayit(e, a, t.id)[rol])))))}</td>
      </tr></tfoot></table></div>`;

  const netSatir = `<div class="tsar"><table class="t">
    <thead><tr><th class="kilit sol"></th>
      ${aylar.map(a => `<th>${AY_KISA[ayIdx(a)]}</th>`).join('')}
      <th style="border-left:1px solid var(--cizgi)">Toplam</th></tr></thead>
    <tbody>
      <tr class="ara"><td class="kilit">Net Alım (alım − iade)</td>
        ${aylar.map((a, i) => `<td>${hc('d-net-' + i, H.netAlimToplam(e, a))}</td>`).join('')}
        <td style="border-left:1px solid var(--cizgi)">${hc('d-net-t', topla(aylar.map(a => H.netAlimToplam(e, a))))}</td></tr>
      <tr class="tpl"><td class="kilit">Bu ay ödenen (vadesi gelen)</td>
        ${aylar.map((a, i) => `<td>${hc('d-ode-' + i, H.tedarikOdeme(e, a))}</td>`).join('')}
        <td style="border-left:1px solid var(--cizgi)">${hc('d-ode-t', topla(aylar.map(a => H.tedarikOdeme(e, a))))}</td></tr>
    </tbody></table></div>`;

  const tedListe = `<div class="tsar"><table class="t"><thead><tr>
      <th class="kilit sol">Tedarikçi</th><th>Vade</th><th>Yıllık Alım</th><th>İade</th><th>Net</th><th>Pay</th><th></th>
    </tr></thead><tbody>${e.tedarikciler.map(t => {
      const al = topla(aylar.map(a => H.alimKayit(e, a, t.id).alim));
      const ia = topla(aylar.map(a => H.alimKayit(e, a, t.id).iade));
      const tt = topla(aylar.map(a => H.netAlimToplam(e, a)));
      return `<tr>
        <td class="kilit">${kacis(t.ad)} ${t.aktif === false ? '<span class="rozet">pasif</span>' : ''}</td>
        <td class="mono ikincil">${t.vadeGun === 0 ? 'Peşin' : t.vadeGun + ' gün'}</td>
        <td>${TL(al)}</td><td class="ikincil">${TL(ia)}</td><td class="vurgu">${TL(al - ia)}</td>
        <td class="ikincil">${tt ? YZD0((al - ia)/tt) : '—'}</td>
        <td class="sol"><button class="btn kucuk" data-ted-duzen="${t.id}">Düzenle</button></td></tr>`;
    }).join('')}</tbody></table></div>`;

  /* --- Ödeme takvimi ---
     Takvim yılına değil paranın kendisine göre kurulur: bu yıl ödenen her şey
     (geçen yılın alımları dâhil) artı bu yılın alımlarından gelecek yıla devredenler.
     Aksi hâlde yılın son aylarındaki alımların ödemesi hiçbir yerde görünmezdi. */
  const odemeAylari = new Set();
  aylar.forEach(a => { if (H.tedarikOdemeKirilim(e, a).length) odemeAylari.add(a); });
  aylar.forEach(a => e.tedarikciler.forEach(t => {
    if (H.netAlim(e, a, t.id) !== 0) odemeAylari.add(ayEkle(a, H.vadeAy(t.vadeGun)));
  }));
  /* Yılın 12 ayı her zaman listede kalır; ödemesi olmayan ay atlanmaz, boş gösterilir */
  aylar.forEach(a => odemeAylari.add(a));
  const takvim = [...odemeAylari].sort().map(a => ({ ay:a, k: H.tedarikOdemeKirilim(e, a) }));
  const odemeVar = takvim.some(x => x.k.length);

  /* Mutabakat: yılın alımı nereye gitti */
  const yilAlim = topla(aylar.map(a => H.netAlimToplam(e, a)));
  const devreden = topla(aylar.map(a => topla(e.tedarikciler.map(t =>
    ayYil(ayEkle(a, H.vadeAy(t.vadeGun))) !== y ? H.netAlim(e, a, t.id) : 0))));
  const gecenYildan = topla(aylar.map(a =>
    topla(H.tedarikOdemeKirilim(e, a).filter(r => ayYil(r.kaynak) !== y).map(r => r.tutar))));
  const buYilOdenen = topla(aylar.map(a => H.tedarikOdeme(e, a)));

  const mutabakat = yilAlim || buYilOdenen ? `<div class="serit"
      style="padding:11px 16px;border-bottom:1px solid var(--cizgi2);background:var(--kart2)">
      <span class="rozet">${y} alımı ${TL(yilAlim)}</span>
      <span class="rozet">Bu yıl ödenen ${TL(buYilOdenen)}</span>
      ${gecenYildan ? `<span class="rozet">${y - 1} alımından gelen ${TL(gecenYildan)}</span>` : ''}
      ${devreden ? `<span class="rozet uyari"><i></i>${y + 1} yılına devreden ${TL(devreden)}</span>` : ''}
    </div>` : '';

  const takvimKart = kart('Ödeme Takvimi',
    'Hangi ayın alımı, hangi ay kasadan çıkıyor — vadesi gelecek yıla taşan alımlar da listede',
    odemeVar ? mutabakat + `<div class="tsar"><table class="t"><thead><tr>
        <th class="kilit sol">Ödeme Ayı</th><th class="sol">Tedarikçi</th><th class="sol">Alım Ayı</th><th>Tutar</th>
        <th>O Ayın Kasa Girişi</th><th>Yük</th></tr></thead><tbody>
      ${takvim.map(x => {
        const disYil = ayYil(x.ay) !== y;
        const bilinir = H.doluMu(e, x.ay);
        const g = bilinir ? H.nakitGiris(e, x.ay) : null;
        const tp = topla(x.k.map(r => r.tutar));
        const zemin = disYil ? ' style="background:var(--uyariZemin)"' : '';
        /* Vadesi bu aya düşen alım yoksa ay yine de listede kalır */
        if (!x.k.length) return `<tr${zemin}>
          <td class="kilit">${ayUzun(x.ay)}</td>
          <td class="sol ikincil" colspan="3">Ödeme yok — bu aya vadesi düşen alım bulunmuyor</td>
          <td class="ikincil">${g == null ? '—' : TL(g)}</td>
          <td class="ikincil">${g ? '%0' : '—'}</td></tr>`;
        return x.k.map((r, j) => `<tr${zemin}>
          <td class="kilit">${j ? '' : ayUzun(x.ay)
            + (disYil ? ' <span class="rozet uyari" style="font-size:9px"><i></i>devreden</span>' : '')}</td>
          <td class="sol">${kacis(r.ted.ad)}</td>
          <td class="sol ikincil">${ayUzun(r.kaynak)}</td>
          <td>${TL(r.tutar)}</td>
          <td class="ikincil">${j ? '' : (g == null ? '—' : TL(g))}</td>
          <td class="${j ? '' : (g && tp/g > 0.75 ? 'neg vurgu' : 'ikincil')}">${
            j ? '' : (g ? YZD0(tp/g) : '—')}</td>
        </tr>`).join('');
      }).join('')}</tbody>
      <tfoot><tr><td class="kilit">Toplam</td><td colspan="2"></td>
        <td>${TL(topla(takvim.map(x => topla(x.k.map(r => r.tutar)))))}</td>
        <td colspan="2" class="sol ikincil">${takvim.filter(x => x.k.length).length} ayda ödeme var${
          devreden ? ' · sarı satırlar ' + (y + 1) + ' yılına düşüyor' : ''}</td></tr></tfoot>
      </table>
      <p class="ipucuMetin" style="padding:11px 2px 2px;max-width:88ch">
        <b>Kasa girişi</b> yalnızca cirosu girilmiş aylar için gösterilir; gelecek yılın verisi
        yoksa yük oranı hesaplanamaz. O ayların yükünü görmek için üstteki yıl seçicisinden
        ${y + 1} yılına geçip ciro tahminini girin.</p></div>`
      : bosKart('Alım girildiğinde ödeme takvimi burada oluşur.'), null, 'sifir');

  return kart('Tedarikçiler', 'Vade süresi, o depodan alınan malın kaç ay sonra ödendiğini belirler',
      tedListe, `<button class="btn kucuk" id="btnTedEkle">+ Tedarikçi</button>`, 'sifir')
    + kart('Depo Alımları · ' + y, 'Fatura tutarları — KDV dâhil giriş yapın', izgara('alim', 'Tedarikçi'), null, 'sifir')
    + kart('İadeler · ' + y, 'İade ve mal fazlası düşümleri', izgara('iade', 'Tedarikçi'), null, 'sifir')
    + kart('Net Alım ve Ödeme', 'Alt satır, vadeler uygulandıktan sonra o ay fiilen ödenen tutardır', netSatir, null, 'sifir')
    + takvimKart;
}

function bgTedarik(e, kok){
  const y = YIL(), aylar = yilAylari(y);
  const tds = e.tedarikciler.filter(t => t.aktif !== false);

  function tazele(){
    ['alim','iade'].forEach(rol => {
      tds.forEach(t => hy('d-' + rol + '-' + t.id, TL(topla(aylar.map(a => H.alimKayit(e, a, t.id)[rol])))));
      aylar.forEach((a, i) => hy('d-' + rol + '-ay-' + i, TL(topla(tds.map(t => H.alimKayit(e, a, t.id)[rol])))));
      hy('d-' + rol + '-tt', TL(topla(aylar.map(a => topla(tds.map(t => H.alimKayit(e, a, t.id)[rol]))))));
    });
    aylar.forEach((a, i) => {
      hy('d-net-' + i, TL(H.netAlimToplam(e, a)));
      hy('d-ode-' + i, TL(H.tedarikOdeme(e, a)));
    });
    hy('d-net-t', TL(topla(aylar.map(a => H.netAlimToplam(e, a)))));
    hy('d-ode-t', TL(topla(aylar.map(a => H.tedarikOdeme(e, a)))));
  }

  izgaraBagla(kok, (t, v) => {
    const d = t.dataset;
    if (!e.alimlar[d.ay]) e.alimlar[d.ay] = {};
    if (!e.alimlar[d.ay][d.ted]) e.alimlar[d.ay][d.ted] = { alim:0, iade:0 };
    e.alimlar[d.ay][d.ted][d.rol] = v || 0;
    tazele();
  });

  const btn = kok.querySelector('#btnTedEkle');
  if (btn) btn.onclick = () => tedarikciKalibi(e);
  kok.querySelectorAll('[data-ted-duzen]').forEach(b =>
    b.onclick = () => tedarikciKalibi(e, e.tedarikciler.find(t => t.id === b.dataset.tedDuzen)));
}

function tedarikciKalibi(e, t){
  kalipAc(t ? 'Tedarikçiyi düzenle' : 'Yeni tedarikçi', `
    <label class="alan"><span>Depo / tedarikçi adı</span>
      <input class="metinGirdi" id="tAd" value="${kacis(t ? t.ad : '')}" placeholder="Örn. Selçuk Ecza"></label>
    <label class="alan"><span>Ödeme vadesi (gün)</span>
      <select class="metinGirdi" id="tVade">
        ${[0,30,45,60,75,90,120,150,180].map(g =>
          `<option value="${g}" ${t && t.vadeGun === g ? 'selected' : ''}>${g === 0 ? 'Peşin' : g + ' gün'}</option>`).join('')}
      </select></label>
    <label class="alan" style="flex-direction:row;align-items:center;gap:8px">
      <input type="checkbox" id="tAktif" ${!t || t.aktif !== false ? 'checked' : ''}>
      <span style="text-transform:none;letter-spacing:0;font-family:var(--sans);font-size:13px;color:var(--mrk2)">Aktif olarak kullanılıyor</span></label>
    <p class="ipucuMetin">Vade, alım kapasitesi ve ödeme takvimi hesabında doğrudan kullanılır.
      90 gün vadeli bir depodan Ocak’ta alınan mal, Nisan kasasından ödenir.</p>
  `, [
    ...(t ? [{ ad:'Sil', sinif:'tehlike', calistir: () => {
      onayla('Tedarikçiyi sil', t.ad + ' ve bu tedarikçiye ait tüm alım kayıtları silinecek.', 'Sil', () => {
        e.tedarikciler = e.tedarikciler.filter(x => x.id !== t.id);
        Object.values(e.alimlar).forEach(a => delete a[t.id]);
        kaydet(true); ciz(); bildir('Tedarikçi silindi.');
      });
      return false;
    }}] : []),
    { ad:'Vazgeç' },
    { ad:'Kaydet', sinif:'ana1', calistir: k => {
      const ad = k.querySelector('#tAd').value.trim();
      if (!ad){ bildir('Ad gerekli.', true); return false; }
      const vade = +k.querySelector('#tVade').value;
      const aktif = k.querySelector('#tAktif').checked;
      if (t){ t.ad = ad; t.vadeGun = vade; t.aktif = aktif; }
      else e.tedarikciler.push({ id:yeniId(), ad, vadeGun:vade, aktif });
      kaydet(true); ciz(); bildir('Kaydedildi.');
    }}
  ]);
}

/* ---------------------------------------------------------
   6.5 RUTİN GİDERLER
   --------------------------------------------------------- */
function sfGider(e){
  const y = YIL(), aylar = yilAylari(y);
  const aktif = e.giderler.filter(g => g.aktif !== false);
  const gruplar = [...new Set(aktif.map(g => g.grup))];
  const aylikSabit = topla(aktif.map(g => H.giderYil(g, y)));
  const yillik = topla(aylar.map(a => H.rutinGider(e, a)));
  const ciro = H.yilCiro(e, y);
  const giris = H.yilOzet(e, y).giris;

  const satir = g => `<tr>
    <td class="kilit">${kacis(g.ad)}</td>
    <td>${hucre(H.giderYil(g, y), { rol:'sabit', gid:g.id, yil:y },
      { etiket: g.ad + ' ' + y + ' aylık sabit', yer:'—' })}</td>
    ${aylar.map(a => `<td>${hucre((e.giderAy[a] || {})[g.id] ?? '', { rol:'sapma', gid:g.id, ay:a },
      { etiket: g.ad + ' ' + ayUzun(a), yer:'—' })}</td>`).join('')}
    <td class="vurgu" style="border-left:1px solid var(--cizgi)">${hc('g-t-' + g.id,
      topla(aylar.map(a => H.giderTutar(e, a, g))))}</td>
    <td class="sol"><button class="btn kucuk" data-gid-duzen="${g.id}">…</button></td>
  </tr>`;

  const tablo = `<div class="tsar"><table class="t">
    <thead><tr>
      <th class="kilit sol">Gider Kalemi</th>
      <th style="border-right:1px solid var(--cizgi)">Aylık Sabit · ${y}</th>
      ${aylar.map(a => `<th title="${ayUzun(a)} — yalnızca sapma girin">${AY_KISA[ayIdx(a)]}</th>`).join('')}
      <th style="border-left:1px solid var(--cizgi)">Yıl Toplamı</th><th></th>
    </tr></thead>
    ${gruplar.map(gr => {
      const list = aktif.filter(g => g.grup === gr);
      const grAy = aylar.map(a => topla(list.map(g => H.giderTutar(e, a, g))));
      return `<tbody>
        <tr class="ara"><td class="kilit">${kacis(gr)}</td>
          <td>${hc('g-gr-s-' + kacis(gr), topla(list.map(g => H.giderYil(g, y))))}</td>
          ${grAy.map((v, i) => `<td class="ikincil">${hc('g-gr-' + kacis(gr) + '-' + i, v)}</td>`).join('')}
          <td style="border-left:1px solid var(--cizgi)">${hc('g-gr-t-' + kacis(gr), topla(grAy))}</td><td></td></tr>
        ${list.map(satir).join('')}
      </tbody>`;
    }).join('')}
    <tfoot><tr>
      <td class="kilit">TOPLAM</td>
      <td>${hc('g-sabit', aylikSabit)}</td>
      ${aylar.map((a, i) => `<td>${hc('g-ay-' + i, H.rutinGider(e, a))}</td>`).join('')}
      <td style="border-left:1px solid var(--cizgi)">${hc('g-yil', yillik)}</td><td></td>
    </tr></tfoot></table></div>`;

  const kpiler = `<div class="satir s4">
    ${kpi('Aylık Sabit Gider · ' + y, TL(aylikSabit), { not: aktif.length + ' kalem' })}
    ${kpi('Yıllık Toplam Gider', TLk(yillik), { not:'Aya özel sapmalar dâhil' })}
    ${kpi('Gider / Ciro', ciro ? YZD(yillik/ciro) : '—', { not:'Cironun ne kadarı sabit gidere gidiyor' })}
    ${kpi('Gider / Kasa Girişi', giris ? YZD(yillik/giris) : '—', { not:'Fiilen giren nakde oran' })}
  </div>`;

  const grupPay = gruplar.map((gr, i) => ({
    ad: gr, renk: seriRenk(i),
    deger: topla(aylar.map(a => topla(aktif.filter(g => g.grup === gr).map(g => H.giderTutar(e, a, g)))))
  })).filter(x => x.deger > 0).sort((a, b) => b.deger - a.deger);

  const enBuyuk = aktif.map(g => ({ ad:g.ad, deger:topla(aylar.map(a => H.giderTutar(e, a, g))) }))
    .filter(x => x.deger > 0).sort((a, b) => b.deger - a.deger).slice(0, 10);

  /* Yıl boş mu — giderler her yıl yeniden belirlenir */
  const yilBos = !aktif.some(g => H.giderYiliVar(g, y)) && !aylikSabit;
  const oncekiToplam = topla(aktif.map(g => H.giderYil(g, y - 1)));
  const yilUyari = yilBos ? `<div class="serit" style="padding:11px 16px;
      border-bottom:1px solid var(--cizgi2);background:var(--uyariZemin)">
      <span class="rozet uyari"><i></i>${y} girilmemiş</span>
      <span class="ipucuMetin" style="color:var(--uyariYazi)">
        ${y} yılı için sabit gider tanımlanmamış.${oncekiToplam
          ? ' ' + (y - 1) + ' toplamı aylık ' + TL(oncekiToplam)
            + ' idi — sağdaki düğmeyle zamlı olarak taşıyabilirsiniz.'
          : ''}</span></div>` : '';

  return kpiler
    + kart('Rutin Gider Listesi · ' + y,
        'Sabit tutar her yıl için ayrı tutulur; yalnızca üstte seçili yılı etkiler. '
        + 'Bir ayda farklı ödediyseniz o ayın hücresine yazın — boş bırakılan aylar sabit tutarı kullanır.',
        yilUyari + tablo, `<button class="btn kucuk" id="btnGiderEkle">+ Gider Kalemi</button>
                <button class="btn kucuk" id="btnGiderTasi">${y - 1}’ten taşı</button>
                <button class="btn kucuk" id="btnGiderDisa">CSV indir</button>`, 'sifir')
    + `<div class="satir s2">
        ${kart('Gider Grupları', 'Yıllık dağılım', grupPay.length
          ? yatayGrafik(grupPay.map(x => ({ ...x, yan: yillik ? YZD0(x.deger/yillik) : '' })))
          : bosKart('Gider girilmemiş.'))}
        ${kart('En Ağır 10 Kalem', 'Tek tek kalemler', enBuyuk.length
          ? yatayGrafik(enBuyuk.map((x, i) => ({ ...x, renk:seriRenk(0), yan: yillik ? YZD0(x.deger/yillik) : '' })))
          : bosKart('Gider girilmemiş.'))}
      </div>`;
}

function bgGider(e, kok){
  const y = YIL(), aylar = yilAylari(y);
  function tazele(){
    const aktif = e.giderler.filter(g => g.aktif !== false);
    aktif.forEach(g => hy('g-t-' + g.id, TL(topla(aylar.map(a => H.giderTutar(e, a, g))))));
    [...new Set(aktif.map(g => g.grup))].forEach(gr => {
      const list = aktif.filter(g => g.grup === gr);
      const grAy = aylar.map(a => topla(list.map(g => H.giderTutar(e, a, g))));
      hy('g-gr-s-' + gr, TL(topla(list.map(g => H.giderYil(g, y)))));
      grAy.forEach((v, i) => hy('g-gr-' + gr + '-' + i, TL(v)));
      hy('g-gr-t-' + gr, TL(topla(grAy)));
    });
    hy('g-sabit', TL(topla(aktif.map(g => H.giderYil(g, y)))));
    aylar.forEach((a, i) => hy('g-ay-' + i, TL(H.rutinGider(e, a))));
    hy('g-yil', TL(topla(aylar.map(a => H.rutinGider(e, a)))));
  }

  izgaraBagla(kok, (t, v) => {
    const d = t.dataset;
    if (d.rol === 'sabit'){
      const g = e.giderler.find(x => x.id === d.gid);
      if (g){ if (v == null) delete g.yil[+d.yil]; else g.yil[+d.yil] = v; }
    } else {
      if (!e.giderAy[d.ay]) e.giderAy[d.ay] = {};
      if (v == null) delete e.giderAy[d.ay][d.gid];
      else e.giderAy[d.ay][d.gid] = v;
    }
    tazele();
  });

  const btn = kok.querySelector('#btnGiderEkle');
  if (btn) btn.onclick = () => giderKalibi(e);
  kok.querySelectorAll('[data-gid-duzen]').forEach(b =>
    b.onclick = () => giderKalibi(e, e.giderler.find(g => g.id === b.dataset.gidDuzen)));

  const tas = kok.querySelector('#btnGiderTasi');
  if (tas) tas.onclick = () => {
    const kaynak = e.giderler.filter(g => g.aktif !== false && H.giderYil(g, y - 1) > 0);
    if (!kaynak.length) return bildir((y - 1) + ' yılında sabit gider tanımlı değil.', true);
    const dolu = e.giderler.filter(g => g.aktif !== false && H.giderYiliVar(g, y)).length;
    kalipAc((y - 1) + ' giderlerini ' + y + ' yılına taşı', `
      <p class="ipucuMetin">${kaynak.length} kalemin ${y - 1} tutarı, belirlediğiniz zam oranıyla
        çarpılıp ${y} yılına yazılır.${dolu ? ' <b>' + y + ' için girilmiş ' + dolu
        + ' kalem korunur</b>, yalnızca boş olanlar doldurulur.' : ''}</p>
      <label class="alan"><span>Zam oranı (%)</span>
        <input class="metinGirdi num" id="gzOran" inputmode="decimal" value="30"></label>
      <label class="alan" style="flex-direction:row;align-items:center;gap:8px">
        <input type="checkbox" id="gzUzer">
        <span style="text-transform:none;letter-spacing:0;font-family:var(--sans);font-size:13px;color:var(--mrk2)">
          ${y} için girilmiş tutarların da üzerine yaz</span></label>
    `, [
      { ad:'Vazgeç' },
      { ad:'Taşı', sinif:'ana1', calistir: k => {
        const oran = 1 + (sayiOku(k.querySelector('#gzOran').value) || 0) / 100;
        const uzer = k.querySelector('#gzUzer').checked;
        let n = 0;
        kaynak.forEach(g => {
          if (!uzer && H.giderYiliVar(g, y)) return;
          g.yil[y] = Math.round(H.giderYil(g, y - 1) * oran);
          n++;
        });
        kaydet(true); ciz();
        bildir(n + ' kalem ' + y + ' yılına taşındı.');
      }}
    ]);
  };

  const dis = kok.querySelector('#btnGiderDisa');
  if (dis) dis.onclick = () => {
    const bas = ['Grup','Kalem','Aylık Sabit ' + y, ...aylar.map(ayEtiket), 'Yıl Toplamı'];
    const sat = e.giderler.filter(g => g.aktif !== false).map(g =>
      [g.grup, g.ad, H.giderYil(g, y), ...aylar.map(a => H.giderTutar(e, a, g)),
       topla(aylar.map(a => H.giderTutar(e, a, g)))]);
    csvIndir(e.ad + '-giderler-' + y, [bas, ...sat]);
  };
}

function giderKalibi(e, g){
  const gruplar = [...new Set(e.giderler.map(x => x.grup))];
  kalipAc(g ? 'Gider kalemini düzenle' : 'Yeni gider kalemi', `
    <label class="alan"><span>Kalem adı</span>
      <input class="metinGirdi" id="gAd" value="${kacis(g ? g.ad : '')}" placeholder="Örn. İşyeri Kirası"></label>
    <label class="alan"><span>Grup</span>
      <input class="metinGirdi" id="gGrup" list="grupListe" value="${kacis(g ? g.grup : (gruplar[0] || 'Diğer'))}">
      <datalist id="grupListe">${gruplar.map(x => `<option value="${kacis(x)}">`).join('')}</datalist></label>
    <label class="alan"><span>${YIL()} aylık sabit tutar (₺)</span>
      <input class="metinGirdi num" id="gTutar" inputmode="decimal"
        value="${g ? nfSay.format(H.giderYil(g, YIL())) : ''}"></label>
    <p class="ipucuMetin" style="margin:-6px 0 0">Bu tutar yalnızca <b>${YIL()}</b> yılı içindir.
      Başka bir yıl için üstteki yıl seçicisini değiştirin.</p>
  `, [
    ...(g ? [{ ad:'Sil', sinif:'tehlike', calistir: () => {
      onayla('Gider kalemini sil', g.ad + ' kalemi ve aya özel sapmaları silinecek.', 'Sil', () => {
        e.giderler = e.giderler.filter(x => x.id !== g.id);
        Object.values(e.giderAy).forEach(a => delete a[g.id]);
        kaydet(true); ciz(); bildir('Kalem silindi.');
      });
      return false;
    }}] : []),
    { ad:'Vazgeç' },
    { ad:'Kaydet', sinif:'ana1', calistir: k => {
      const ad = k.querySelector('#gAd').value.trim();
      if (!ad){ bildir('Ad gerekli.', true); return false; }
      const grup = k.querySelector('#gGrup').value.trim() || 'Diğer';
      const tutar = sayiOku(k.querySelector('#gTutar').value) || 0;
      if (g){ g.ad = ad; g.grup = grup; g.yil[YIL()] = tutar; }
      else e.giderler.push({ id:yeniId(), ad, grup, tutar:0, yil:{ [YIL()]: tutar }, aktif:true });
      kaydet(true); ciz(); bildir('Kaydedildi.');
    }}
  ]);
}

/* ---------------------------------------------------------
   6.6 STOK & DEVİR
   --------------------------------------------------------- */
function sfStok(e){
  const y = YIL(), aylar = yilAylari(y);
  const gruplar = H.stokGruplari(e);
  const secAy = (D.stokAy && ayYil(D.stokAy) === y) ? D.stokAy : (sonGercekAy(e, y) || aylar[0]);

  const izgara = `<div class="tsar"><table class="t">
    <thead><tr><th class="kilit sol">Stok Grubu</th>
      ${aylar.map(a => `<th title="${ayUzun(a)}">${AY_KISA[ayIdx(a)]}</th>`).join('')}
      <th style="border-left:1px solid var(--cizgi)">Ortalama</th></tr></thead>
    <tbody>${gruplar.map(g => `<tr>
      <td class="kilit">${kacis(g)}</td>
      ${aylar.map(a => `<td>${hucre(H.grupStok(e, a, g), { rol:'stok', ay:a, grup:g },
        { etiket: g + ' stok ' + ayUzun(a) })}</td>`).join('')}
      <td class="vurgu" style="border-left:1px solid var(--cizgi)">${hc('s-o-' + kacis(g),
        (() => { const d = aylar.map(a => H.grupStok(e, a, g)).filter(v => v > 0);
                 return d.length ? topla(d)/d.length : 0; })())}</td>
    </tr>`).join('')}</tbody>
    <tfoot><tr><td class="kilit">Toplam Stok</td>
      ${aylar.map((a, i) => `<td>${hc('s-t-' + i, topla(gruplar.map(g => H.grupStok(e, a, g))))}</td>`).join('')}
      <td style="border-left:1px solid var(--cizgi)"></td></tr></tfoot></table></div>`;

  /* Seçili ay analizi */
  const an = H.stokAnaliz(e, secAy).filter(x => x.stok > 0 || x.satis > 0);
  const stokT = topla(an.map(x => x.stok)), satisT = topla(an.map(x => x.satis));
  const devirT = stokT ? satisT/stokT : null;

  const durumEt = x => {
    if (x.ayOmru == null) return '<span class="rozet">—</span>';
    if (x.ayOmru > 3)   return '<span class="rozet kotu"><i></i>Ağır stok</span>';
    if (x.ayOmru > 2)   return '<span class="rozet uyari"><i></i>Yavaş</span>';
    if (x.ayOmru < 0.5) return '<span class="rozet uyari"><i></i>Stok riski</span>';
    return '<span class="rozet iyi"><i></i>Dengeli</span>';
  };

  const analizTablo = an.length ? `<div class="tsar"><table class="t"><thead><tr>
      <th class="kilit sol">Grup</th><th>Satış</th><th>Satış Payı</th><th>Stok</th><th>Stok Payı</th>
      <th>Sapma</th><th>Devir</th><th>Stok Ömrü</th><th class="sol">Durum</th></tr></thead>
    <tbody>${an.sort((a, b) => b.stok - a.stok).map(x => `<tr>
      <td class="kilit">${kacis(x.grup)}</td>
      <td>${TL(x.satis)}</td>
      <td class="ikincil">${YZD(x.satisPay)}<span class="olcu"><i style="width:${((x.satisPay||0)*100).toFixed(1)}%;background:var(--s3)"></i></span></td>
      <td>${TL(x.stok)}</td>
      <td class="ikincil">${YZD(x.stokPay)}<span class="olcu"><i style="width:${((x.stokPay||0)*100).toFixed(1)}%;background:var(--s1)"></i></span></td>
      <td class="${x.sapma != null && x.sapma > 0.03 ? 'neg vurgu' : (x.sapma != null && x.sapma < -0.03 ? 'poz vurgu' : 'ikincil')}">
        ${x.sapma == null ? '—' : (x.sapma > 0 ? '+' : '') + nfSay1.format(x.sapma*100) + ' p'}</td>
      <td class="vurgu">${x.devir == null ? '—' : SAY2(x.devir)}</td>
      <td>${x.ayOmru == null ? '—' : SAY1(x.ayOmru) + ' ay'}</td>
      <td class="sol">${durumEt(x)}</td></tr>`).join('')}</tbody>
    <tfoot><tr><td class="kilit">Toplam</td><td>${TL(satisT)}</td><td></td><td>${TL(stokT)}</td><td></td><td></td>
      <td>${devirT == null ? '—' : SAY2(devirT)}</td>
      <td>${devirT ? SAY1(1/devirT) + ' ay' : '—'}</td><td></td></tr></tfoot></table></div>`
    : bosKart('Bu ay için stok veya satış verisi yok.');

  const kpiler = `<div class="satir s4">
    ${kpi('Toplam Stok · ' + ayUzun(secAy), TLk(stokT), { not:'Bağlı sermaye' })}
    ${kpi('Aylık Satış', TLk(satisT), { not:'Aynı ayın kategori cirosu' })}
    ${kpi('Devir Hızı', devirT == null ? '—' : SAY2(devirT), { not:'Satış ÷ Stok — yüksek olan iyi' })}
    ${kpi('Ortalama Stok Ömrü', devirT ? SAY1(1/devirT) + ' ay' : '—', { not:'Mevcut stok kaç ayda erir' })}
  </div>`;

  /* Sapma grafiği: stok payı − satış payı */
  const sapmaSat = an.filter(x => x.sapma != null)
    .sort((a, b) => Math.abs(b.sapma) - Math.abs(a.sapma))
    .map(x => ({ ad:x.grup, deger:x.sapma * 100,
      renk: x.sapma > 0.02 ? 'var(--kotu)' : x.sapma < -0.02 ? 'var(--s3)' : 'var(--mrk3)',
      yan: (x.sapma > 0 ? '+' : '') + nfSay1.format(x.sapma*100) + ' p' }));

  const sapmaKart = kart('Stok–Satış Dengesi · ' + ayUzun(secAy),
    'Kırmızı: satıştaki payından fazla stok tutuluyor. Yeşil: stok payı satış payının altında.',
    sapmaSat.length ? yatayGrafik(sapmaSat, { bicim: v => (v > 0 ? '+' : '') + nfSay1.format(v) + ' puan' })
      : bosKart('Stok girilince burada görünür.'));

  /* Devir trendi */
  const devirSeri = gruplar.slice(0, 6).map((g, i) => ({
    ad: g, renk: seriRenk(i),
    veri: aylar.map(a => { const s = H.grupStok(e, a, g); return s ? H.grupSatis(e, a, g)/s : null; })
  })).filter(s => s.veri.some(v => v != null));
  const devirKart = kart('Devir Hızı Trendi', 'Yükselen çizgi stoğun hızlandığını gösterir',
    devirSeri.length
      ? G(cizgiGrafik(aylar.map(ayEtiket), devirSeri, { yukseklik:230, bicim: v => SAY1(v) }), i =>
          `<b>${ayUzun(aylar[i])}</b>` + devirSeri.map(s =>
            ipSatir(s.renk, s.ad, s.veri[i] == null ? '—' : SAY2(s.veri[i]))).join('')
        ) + efsane(devirSeri.map(s => ({ ad:s.ad, renk:s.renk })), true)
      : bosKart('Stok verisi girildikçe oluşur.'));

  return kpiler
    + kart('Stok Girişi · ' + y,
        'Her grubun ay sonu stok tutarını girin. Satış rakamları kategori sayfasından otomatik gelir.',
        izgara, null, 'sifir')
    + kart('Stok Analizi', 'Seçili ayın satış–stok karşılaştırması', analizTablo,
        aySecici('secStokAy', secAy, y), 'sifir')
    + `<div class="satir s2">${sapmaKart}${devirKart}</div>`;
}

function bgStok(e, kok){
  const y = YIL(), aylar = yilAylari(y), gruplar = H.stokGruplari(e);
  izgaraBagla(kok, (t, v) => {
    const d = t.dataset;
    if (!e.stok[d.ay]) e.stok[d.ay] = {};
    e.stok[d.ay][d.grup] = v || 0;
    gruplar.forEach(g => {
      const dd = aylar.map(a => H.grupStok(e, a, g)).filter(x => x > 0);
      hy('s-o-' + g, TL(dd.length ? topla(dd)/dd.length : 0));
    });
    aylar.forEach((a, i) => hy('s-t-' + i, TL(topla(gruplar.map(g => H.grupStok(e, a, g))))));
  });
  const s = kok.querySelector('#secStokAy');
  if (s) s.onchange = () => { D.stokAy = s.value; kaydet(true); ciz(); };
}

/* ---------------------------------------------------------
   6.7 PERSONEL SATIŞ
   --------------------------------------------------------- */
function sfPersonel(e){
  const y = YIL(), aylar = yilAylari(y);
  const kats = H.aktifKat(e);
  const secAy = (D.persAy && ayYil(D.persAy) === y) ? D.persAy : (sonGercekAy(e, y) || aylar[0]);
  /* Pasife alınmış biri o ay satış yaptıysa satırı görünür kalır — veri kaybolmaz */
  const pers = H.ayPersoneli(e, secAy);
  const olcu = D.persOlcu || 'ciro';

  if (!e.personel.length)
    return kart('Personel Satış', 'Önce ekip üyelerini tanımlayın',
      `<div class="bos">Kişi bazlı satış ve prim takibi için personel eklemelisiniz.<br><br>
        <button class="btn ana1" id="btnPersEkle">+ Personel ekle</button></div>`);

  const dg = (p, k) => H.persKayit(e, secAy, p.id, k.id)[olcu];
  const bic = olcu === 'ciro' ? TL : SAY;

  const izgara = `<div class="tsar"><table class="t">
    <thead><tr><th class="kilit sol">Personel</th>
      ${kats.map(k => `<th>${kacis(k.ad)}</th>`).join('')}
      <th style="border-left:1px solid var(--cizgi)">Toplam</th><th>Pay</th>
      ${olcu === 'ciro' ? '<th>Sepet Ort.</th>' : '<th>İşlem</th>'}</tr></thead>
    <tbody>${pers.map(p => {
      const t = H.persToplam(e, secAy, p.id);
      return `<tr>
        <td class="kilit">${kacis(p.ad)}${p.aktif === false ? ' <span class="rozet">pasif</span>' : ''}${
          p.rol ? `<div class="goz1" style="font-size:9px">${kacis(p.rol)}</div>` : ''}</td>
        ${kats.map(k => `<td>${hucre(dg(p, k), { rol:olcu, ay:secAy, pers:p.id, kat:k.id },
          { etiket: p.ad + ' ' + k.ad })}</td>`).join('')}
        <td class="vurgu" style="border-left:1px solid var(--cizgi)">${hc('p-t-' + p.id, t[olcu], bic)}</td>
        <td class="ikincil">${hc('p-p-' + p.id, null, () => '—')}</td>
        <td class="ikincil">${hc('p-s-' + p.id, olcu === 'ciro' ? t.sepet : t.adet, olcu === 'ciro' ? TL : SAY)}</td>
      </tr>`;
    }).join('')}</tbody>
    <tfoot><tr><td class="kilit">Toplam</td>
      ${kats.map((k, i) => `<td>${hc('p-k-' + i, topla(pers.map(p => dg(p, k))), bic)}</td>`).join('')}
      <td style="border-left:1px solid var(--cizgi)">${hc('p-tt', topla(pers.map(p => H.persToplam(e, secAy, p.id)[olcu])), bic)}</td>
      <td></td><td></td></tr></tfoot></table></div>`;

  /* Kişi bazlı yıllık ciro ve pay */
  const yilPers = H.yilPersoneli(e, y).map((p, i) => {
    const c = topla(aylar.map(a => H.persToplam(e, a, p.id).ciro));
    const ad = topla(aylar.map(a => H.persToplam(e, a, p.id).adet));
    return { p, i, ciro:c, adet:ad, sepet: ad ? c/ad : null };
  });
  const yilT = topla(yilPers.map(x => x.ciro));

  const payKart = kart('Yıllık Ciro Payı · ' + y, 'Kişi bazında toplam katkı',
    yilT ? yatayGrafik(yilPers.filter(x => x.ciro > 0).sort((a, b) => b.ciro - a.ciro).map(x => ({
      ad:x.p.ad, deger:x.ciro, renk:seriRenk(x.i), yan: YZD0(x.ciro/yilT)
    }))) : bosKart('Satış verisi girildikçe oluşur.'));

  const sepetKart = kart('İşlem Başına Ortalama Ciro', 'Sepet büyüklüğü — kim daha yüksek tutarlı satıyor',
    yilPers.some(x => x.sepet)
      ? yatayGrafik(yilPers.filter(x => x.sepet).sort((a, b) => b.sepet - a.sepet).map(x => ({
          ad:x.p.ad, deger:x.sepet, renk:seriRenk(x.i), yan: SAY(x.adet) + ' işlem'
        })))
      : bosKart('İşlem adedi girilince hesaplanır.'));

  const aylikKart = kart('Aylık Ciro Gelişimi', 'Kişi bazında ay ay',
    (() => {
      const seri = pers.map((p, i) => ({ ad:p.ad, renk:seriRenk(i),
        veri: aylar.map(a => { const c = H.persToplam(e, a, p.id).ciro; return c || null; }) }))
        .filter(s => s.veri.some(v => v != null));
      return seri.length
        ? G(cizgiGrafik(aylar.map(ayEtiket), seri, { yukseklik:240 }), i =>
            `<b>${ayUzun(aylar[i])}</b>` + seri.map(s => ipSatir(s.renk, s.ad, TL(s.veri[i]))).join(''))
          + efsane(seri.map(s => ({ ad:s.ad, renk:s.renk })), true)
        : bosKart('Aylık veri girildikçe oluşur.');
    })());

  const arac = `${aySecici('secPersAy', secAy, y)}
    <select class="sec" id="secPersOlcu">
      <option value="ciro" ${olcu === 'ciro' ? 'selected' : ''}>Ciro (₺)</option>
      <option value="adet" ${olcu === 'adet' ? 'selected' : ''}>İşlem adedi</option>
    </select>
    <button class="btn kucuk" id="btnPersEkle">+ Personel</button>`;

  return kart('Personel Satış Girişi', 'Seçili ayın kişi × kategori kırılımı — Excel’den blok yapıştırabilirsiniz',
      izgara, arac, 'sifir')
    + `<div id="primPanel">${primPanelHTML(e, secAy)}</div>`
    + `<div class="satir s2">${payKart}${sepetKart}</div>`
    + aylikKart
    + kart('Ekip',
        e.personel.filter(p => p.aktif !== false).length + ' aktif · '
        + e.personel.filter(p => p.aktif === false).length + ' pasif',
        personelTablosu(e, yilPers, yilT),
        `<button class="btn kucuk" id="btnPersEkle2">+ Personel</button>`, 'sifir');
}

/** Ekip listesi — pasife alma ve silme satırın üstünde durur */
function personelTablosu(e, yilPers, yilT){
  if (!e.personel.length) return `<div class="bos">Henüz personel yok.</div>`;
  return `<div class="tsar"><table class="t"><thead><tr>
      <th class="kilit sol">Ad</th><th class="sol">Görev</th><th class="sol">Durum</th>
      <th>Yıllık Ciro</th><th>İşlem</th><th>Sepet Ort.</th><th>Pay</th><th></th></tr></thead>
    <tbody>${e.personel.map(p => {
      const x = (yilPers || []).find(z => z.p.id === p.id) || { ciro:0, adet:0, sepet:null };
      const aktif = p.aktif !== false;
      return `<tr${aktif ? '' : ' style="opacity:.72"'}>
        <td class="kilit">${kacis(p.ad)}</td>
        <td class="sol ikincil">${kacis(p.rol || '—')}</td>
        <td class="sol">${aktif
          ? '<span class="rozet iyi"><i></i>aktif</span>'
          : '<span class="rozet"><i></i>pasif</span>'}</td>
        <td>${TL(x.ciro)}</td><td class="ikincil">${SAY(x.adet)}</td>
        <td class="ikincil">${x.sepet ? TL(x.sepet) : '—'}</td>
        <td class="ikincil">${yilT ? YZD0(x.ciro / yilT) : '—'}</td>
        <td class="sol"><div class="serit">
          <button class="btn kucuk" data-pers-duzen="${p.id}">Düzenle</button>
          <button class="btn kucuk" data-pers-durum="${p.id}"
            title="${aktif ? 'Giriş listelerinden çıkar, geçmiş verisi kalır' : 'Yeniden satış listesine al'}">
            ${aktif ? 'Pasife al' : 'Aktif et'}</button>
          <button class="btn kucuk tehlike" data-pers-sil="${p.id}">Sil</button>
        </div></td></tr>`;
    }).join('')}</tbody></table>
    <p class="ipucuMetin" style="padding:10px 2px 2px;max-width:82ch">
      İşten ayrılan biri için <b>Pasife al</b> yeterlidir: yeni satış girişinde ve ekip
      listelerinde görünmez, ama geçmiş aylardaki satışları ve primleri olduğu gibi kalır.
      <b>Sil</b> ise kişiyi ve tüm satış geçmişini kalıcı olarak kaldırır.</p></div>`;
}

/** Personel silme / pasife alma düğmelerini bağlar (hem Personel Satış hem Ayarlar) */
function personelEylemBagla(e, kok){
  kok.querySelectorAll('[data-pers-duzen]').forEach(x =>
    x.onclick = () => personelKalibi(e, e.personel.find(p => p.id === x.dataset.persDuzen)));

  kok.querySelectorAll('[data-pers-durum]').forEach(x => x.onclick = () => {
    const p = e.personel.find(z => z.id === x.dataset.persDurum);
    p.aktif = p.aktif === false;
    kaydet(true); ciz();
    bildir(p.ad + (p.aktif ? ' yeniden aktif.' : ' pasife alındı — geçmiş verisi korunuyor.'));
  });

  kok.querySelectorAll('[data-pers-sil]').forEach(x => x.onclick = () => {
    const p = e.personel.find(z => z.id === x.dataset.persSil);
    const ay = new Set(Object.keys(e.persSatis).concat(Object.keys(e.urunSatis)))
      .size ? [...new Set(Object.keys(e.persSatis).concat(Object.keys(e.urunSatis)))]
        .filter(k => H.persVeriVar(e, k, p.id)).length : 0;
    onayla('Personeli sil',
      p.ad + ' ve ' + (ay ? ay + ' aylık satış kaydı' : 'kayıtları') + ' kalıcı olarak silinecek. '
      + 'Geçmiş prim ve ciro raporları bu kişi olmadan yeniden hesaplanır. '
      + (ay ? 'Yalnızca işten ayrıldıysa "Pasife al" daha güvenlidir.' : ''),
      'Kalıcı olarak sil', () => {
        e.personel = e.personel.filter(z => z.id !== p.id);
        Object.values(e.persSatis).forEach(a => delete a[p.id]);
        /* Kutu bazlı ürün satışları da temizlenir; aksi hâlde ürün hedefi
           kimseye ait olmayan adetlerle şişerdi. */
        Object.values(e.urunSatis).forEach(ay =>
          Object.values(ay).forEach(u => delete u[p.id]));
        kaydet(true); ciz(); bildir(p.ad + ' silindi.');
      });
  });
}

/* ---------------------------------------------------------
   Prim gösterim bileşenleri — hem Personel Satış hem Hedef & Prim kullanır
   --------------------------------------------------------- */

/** Tek bir prim tablosunun kişi kırılımı */
function primKisiTablosu(h){
  const satirlar = h.kisi.filter(x => x.satis > 0).sort((a, b) => b.hakedis - a.hakedis);
  if (!satirlar.length)
    return `<div class="bos">Bu ay için satış girilmemiş.${
      h.katToplam ? '<br>Kategori toplamı ' + TL(h.katToplam) + ' üzerinden hesaplandı.' : ''}</div>`;
  return `<div class="tsar"><table class="t"><thead><tr>
      <th class="kilit sol">Personel</th><th>Satış</th><th>Katkı Payı</th>
      <th>Prim Oranı</th><th>Hak Ediş</th></tr></thead>
    <tbody>${satirlar.map(x => `<tr>
      <td class="kilit">${kacis(x.p.ad)}${x.p.aktif === false ? ' <span class="rozet">pasif</span>' : ''}</td>
      <td>${TL(x.satis)}</td>
      <td class="ikincil">${YZD(x.pay)}<span class="olcu"><i style="width:${(x.pay*100).toFixed(1)}%"></i></span></td>
      <td class="ikincil mono">${h.oran ? '%' + nfSay2.format(h.oran*100) : '—'}</td>
      <td class="vurgu">${x.hakedis ? TL(x.hakedis) : '<span class="ikincil">—</span>'}</td></tr>`).join('')}
    </tbody><tfoot>
      ${Math.abs(h.eslesmeyen) > 0.5 ? `<tr>
        <td class="kilit" style="font-weight:500;color:var(--uyariYazi)">Kimseye yazılmamış</td>
        <td class="neg">${TL(h.eslesmeyen)}</td>
        <td class="ikincil" colspan="3">Kategori cirosu ile personel girişi arasındaki fark</td></tr>` : ''}
      <tr>
      <td class="kilit">Toplam</td>
      <td>${TL(h.taban === 'personel' ? h.persToplam : h.katToplam)}</td><td>%100,0</td>
      <td class="mono">${h.oran ? '%' + nfSay2.format(h.oran*100) : '—'}</td>
      <td>${TL(h.hakedis)}</td></tr></tfoot></table></div>`;
}

/** Bir prim tablosunun durum şeridi — hedef, kademe, havuz */
function primDurumSeridi(h){
  const gunlukMod = h.mod === 'gunluk' || h.mod === 'gunluk-ozel';
  /* Kategori cirosu ile personel girişi ayrıştıysa bunu gizlemek yanlış olur */
  const sapma = Math.abs(h.eslesmeyen) > Math.max(1, h.katToplam * 0.002);
  return `<div class="serit" style="gap:6px;margin-bottom:11px">
    <span class="rozet ${sapma ? 'uyari' : ''}" title="Kademeyi belirleyen tutar">
      ${sapma ? '<i></i>' : ''}Satılan ${TL(h.satilan)}
      <span style="opacity:.7">· ${h.taban === 'personel' ? 'personel girişi' : 'kategori cirosu'}</span></span>
    ${sapma ? `<span class="rozet">Kategori ${TL(h.katToplam)}</span>
      <span class="rozet">Personel ${TL(h.persToplam)}</span>
      <span class="rozet kotu"><i></i>Eşleşmeyen ${TL(h.eslesmeyen)}</span>` : ''}
    ${gunlukMod ? `<span class="rozet">Günlük hedef ${TL(h.gunlukHedef)} × ${h.gun} gün</span>` : ''}
    <span class="rozet">Hedef ${TL(h.hedefTutar)}</span>
    ${h.hedefTutar ? `<span class="rozet ${h.hedefOrani >= 1 ? 'iyi' : 'uyari'}"><i></i>
      Gerçekleşme ${YZD0(h.hedefOrani)}</span>` : '<span class="rozet uyari"><i></i>Hedef tanımsız</span>'}
    <span class="rozet ${h.oran ? 'iyi' : ''}">${h.oran
      ? 'Ulaşılan kademe %' + nfSay2.format(h.oran*100)
      : 'Hedef altı — prim yok'}</span>
    <span class="rozet ${h.hakedis ? 'iyi' : ''}"><b>Havuz ${TL(h.hakedis)}</b></span>
    ${h.onKosul && h.onKosul.uygulandi && h.onKosul.carpan < 1
      ? `<span class="rozet kotu" title="Hak ediş ${TL(h.hamHakedis)}"><i></i>
          Ürün hedefi ${h.onKosul.carpan ? '×' + YZD0(h.onKosul.carpan) : 'tutmadı'}</span>` : ''}
  </div>`;
}

/** Tüm prim tablolarının birleşik kişi tablosu ve genel toplam */
function primToplamTablosu(oz){
  const satirlar = oz.kisi.filter(x => x.satis > 0 || x.hakedis > 0)
    .sort((a, b) => b.hakedis - a.hakedis);
  if (!satirlar.length) return `<div class="bos">Henüz hesaplanacak satış yok.</div>`;
  return `<div class="tsar"><table class="t"><thead><tr>
      <th class="kilit sol">Personel</th>
      ${oz.gruplar.map(h => `<th>${kacis(h.grup.ad)}</th>`).join('')}
      <th style="border-left:1px solid var(--cizgi)">Hedefli Satış</th>
      <th>Katkı Payı</th><th>TOPLAM PRİM</th></tr></thead>
    <tbody>${satirlar.map(x => `<tr>
      <td class="kilit">${kacis(x.p.ad)}${x.p.aktif === false ? ' <span class="rozet">pasif</span>' : ''}</td>
      ${x.kirilim.map(k => `<td>${k.hakedis ? TL(k.hakedis) : '<span class="ikincil">—</span>'}
        <div class="goz1" style="font-size:9px;opacity:.7">${k.satis ? TLk(k.satis) + ' satış' : ''}</div></td>`).join('')}
      <td style="border-left:1px solid var(--cizgi)">${TL(x.satis)}</td>
      <td class="ikincil">${YZD(x.pay)}<span class="olcu"><i style="width:${(x.pay*100).toFixed(1)}%"></i></span></td>
      <td class="vurgu" style="font-size:13.5px">${TL(x.hakedis)}</td></tr>`).join('')}
    </tbody><tfoot><tr>
      <td class="kilit">GENEL TOPLAM</td>
      ${oz.gruplar.map(h => `<td>${TL(h.hakedis)}</td>`).join('')}
      <td style="border-left:1px solid var(--cizgi)">${TL(oz.satis)}</td>
      <td>%100,0</td>
      <td style="font-size:14px">${TL(oz.toplam)}</td></tr></tfoot></table></div>`;
}

/**
 * Personel satışı girildiği anda oluşan prim hesabı.
 * Her prim tablosu kendi kartında ayrı hesaplanır, en altta genel toplam durur.
 */
function primPanelHTML(e, ay){
  if (!e.primGruplari.length)
    return kart('Bu Ayın Primi', 'Prim tablosu tanımlı değil',
      `<div class="bos">Kademeli hedef ve prim hesabı için
        <b>Hedef &amp; Prim</b> sayfasından bir tablo oluşturun.</div>`);

  const oz = primOzet(e, ay);

  /* Her tablo için ayrı hesap kartı */
  const grupKartlari = oz.gruplar.map((h, i) => {
    const kats = h.grup.katIds.map(id => H.kategori(e, id)).filter(Boolean);
    return kart(
      `<span style="display:inline-flex;align-items:center;gap:8px">
        <i style="width:9px;height:9px;border-radius:2px;background:${seriRenk(i)};flex:none"></i>
        ${kacis(h.grup.ad)}</span>`,
      (kats.map(k => kacis(k.ad)).join(' · ') || 'Kategori seçilmemiş') + ' · ' + ayUzun(ay),
      primDurumSeridi(h) + primKisiTablosu(h),
      `<span class="goz1">Havuz</span>
       <span class="num" style="font-size:16px;font-weight:660">${TL(h.hakedis)}</span>`);
  }).join('');

  const toplamKart = kart('Toplam Prim · ' + ayUzun(ay),
    oz.gruplar.length + ' prim tablosunun birleşik sonucu — her kişinin bu ay alacağı toplam',
    primToplamTablosu(oz),
    `<span class="goz1">Genel toplam</span>
     <span class="num" style="font-size:18px;font-weight:680">${TL(oz.toplam)}</span>`);

  return grupKartlari + toplamKart;
}

function bgPersonel(e, kok){
  const secAy = (D.persAy && ayYil(D.persAy) === YIL()) ? D.persAy : (sonGercekAy(e, YIL()) || yilAylari(YIL())[0]);
  const olcu = D.persOlcu || 'ciro';
  const kats = H.aktifKat(e), pers = H.ayPersoneli(e, secAy);
  const bic = olcu === 'ciro' ? TL : SAY;

  function tazele(){
    const tt = topla(pers.map(p => H.persToplam(e, secAy, p.id)[olcu]));
    pers.forEach(p => {
      const t = H.persToplam(e, secAy, p.id);
      hy('p-t-' + p.id, bic(t[olcu]));
      hy('p-p-' + p.id, tt ? YZD(t[olcu]/tt) : '—');
      hy('p-s-' + p.id, olcu === 'ciro' ? (t.sepet ? TL(t.sepet) : '—') : SAY(t.adet));
    });
    kats.forEach((k, i) => hy('p-k-' + i, bic(topla(pers.map(p => H.persKayit(e, secAy, p.id, k.id)[olcu])))));
    hy('p-tt', bic(tt));
    /* Prim paneli her girişte yeniden hesaplanır */
    const pp = kok.querySelector('#primPanel');
    if (pp) pp.innerHTML = primPanelHTML(e, secAy);
  }
  tazele();

  izgaraBagla(kok, (t, v) => {
    const d = t.dataset;
    if (!e.persSatis[d.ay]) e.persSatis[d.ay] = {};
    if (!e.persSatis[d.ay][d.pers]) e.persSatis[d.ay][d.pers] = {};
    const r = e.persSatis[d.ay][d.pers];
    if (!r[d.kat]) r[d.kat] = { adet:0, ciro:0 };
    r[d.kat][d.rol] = v || 0;
    tazele();
  });

  const a = kok.querySelector('#secPersAy');
  if (a) a.onchange = () => { D.persAy = a.value; kaydet(true); ciz(); };
  const o = kok.querySelector('#secPersOlcu');
  if (o) o.onchange = () => { D.persOlcu = o.value; kaydet(true); ciz(); };
  kok.querySelectorAll('#btnPersEkle, #btnPersEkle2').forEach(b => b.onclick = () => personelKalibi(e));
  personelEylemBagla(e, kok);
}

function personelKalibi(e, p){
  kalipAc(p ? 'Personeli düzenle' : 'Yeni personel', `
    <label class="alan"><span>Ad soyad</span>
      <input class="metinGirdi" id="pAd" value="${kacis(p ? p.ad : '')}"></label>
    <label class="alan"><span>Görev</span>
      <input class="metinGirdi" id="pRol" value="${kacis(p ? (p.rol || '') : '')}"
        placeholder="Örn. Eczacı, Kalfa, Dermokozmetik Uzmanı"></label>
    <label class="alan" style="flex-direction:row;align-items:center;gap:8px">
      <input type="checkbox" id="pAktif" ${!p || p.aktif !== false ? 'checked' : ''}>
      <span style="text-transform:none;letter-spacing:0;font-family:var(--sans);font-size:13px;color:var(--mrk2)">
        Aktif — satış giriş listesinde görünür</span></label>
    ${p ? `<p class="ipucuMetin">İşten ayrıldıysa işareti kaldırın: geçmiş satışları ve
      primleri korunur, yalnızca yeni giriş listelerinden çıkar.</p>` : ''}
  `, [
    { ad:'Vazgeç' },
    { ad:'Kaydet', sinif:'ana1', calistir: k => {
      const ad = k.querySelector('#pAd').value.trim();
      if (!ad){ bildir('Ad gerekli.', true); return false; }
      const rol = k.querySelector('#pRol').value.trim();
      const aktif = k.querySelector('#pAktif').checked;
      if (p){ p.ad = ad; p.rol = rol; p.aktif = aktif; }
      else e.personel.push({ id:yeniId(), ad, rol, aktif });
      kaydet(true); ciz(); bildir('Kaydedildi.');
    }}
  ]);
}

/* ---------------------------------------------------------
   6.8 ALIM DİSİPLİNİ
   --------------------------------------------------------- */
function sfDisiplin(e){
  const y = YIL(), aylar = yilAylari(y);
  const oran = +e.ayar.disiplinOrani || 0.7;

  const satirlar = aylar.map(a => {
    const v = H.ortVadeAy(e, a);
    const odemeAy = ayEkle(a, v);
    const bilinir = H.doluMu(e, odemeAy);
    const gelecek = bilinir ? H.nakitGiris(e, odemeAy) : null;
    const kap = bilinir ? oran * gelecek : null;
    const alim = H.netAlimToplam(e, a);
    const kul = (kap && kap > 0) ? alim / kap : null;
    const yuk = H.nakitGiris(e, a) ? H.tedarikOdeme(e, a) / H.nakitGiris(e, a) : null;
    return { a, v, odemeAy, bilinir, gelecek, kap, alim, fark: kap == null ? null : kap - alim, kul, yuk };
  });

  const olcum = satirlar.filter(s => s.kap != null && s.kap > 0);
  const belirsiz = satirlar.filter(s => !s.bilinir && s.alim > 0);
  const asim = olcum.filter(s => s.alim > s.kap * 1.02).length;
  const topKap = topla(olcum.map(s => s.kap));
  const topAlim = topla(olcum.map(s => s.alim));
  const yilAlim = topla(satirlar.map(s => s.alim));

  const kpiler = `<div class="satir s4">
    ${kpi('Disiplin Sınırı', YZD0(oran), { not:'Ödeme ayındaki kasa girişinin bu kadarı alıma ayrılabilir' })}
    ${kpi('Ölçülebilen Kapasite', TLk(topKap), {
      not: olcum.length + ' ay hesaplandı' + (belirsiz.length ? ' · ' + belirsiz.length + ' ay veri bekliyor' : '') })}
    ${kpi('Aynı Aylardaki Alım', TLk(topAlim), {
      renkli:true, ham: topKap - topAlim,
      not: topKap ? YZD0(topAlim/topKap) + ' kullanım' : 'Karşılaştırma için veri yok' })}
    ${kpi('Sınır Aşan Ay', asim + ' ay', {
      not: !olcum.length ? 'Henüz ölçülebilen ay yok'
         : asim ? 'Bu aylarda fazla stok riski var' : 'Ölçülen aylar sınır içinde' })}
  </div>`;

  const uyariNot = belirsiz.length ? `<div class="kart" style="border-color:var(--uyari);
      background:var(--uyariZemin);padding:11px 15px;display:flex;gap:10px;align-items:flex-start">
      <span class="rozet uyari" style="margin-top:1px"><i></i>Eksik veri</span>
      <span style="font-size:12.8px;color:var(--uyariYazi);line-height:1.5">
        ${belirsiz.map(s => ayUzun(s.a)).join(', ')} alımlarının kapasitesi hesaplanamıyor:
        bu alımlar <b>${belirsiz.map(s => ayUzun(s.odemeAy)).join(', ')}</b> aylarında ödenecek ve
        o ayların cirosu henüz girilmedi. Üstteki yıl seçicisinden ${ayYil(belirsiz[belirsiz.length-1].odemeAy)}
        yılına geçip <b>Kategori Ciroları → Geçen yıldan +% ile doldur</b> ile tahmin üretirseniz
        bu satırlar da hesaplanır.</span></div>` : '';

  const grafikSeri = [
    { ad:'Alım kapasitesi', renk:'var(--s1)', veri: satirlar.map(s => s.kap) },
    { ad:'Fiili alım',      renk:'var(--s2)', veri: satirlar.map(s => s.alim) }
  ];
  const grafik = kart('Kapasite ve Fiili Alım',
    'Turuncu, maviyi aştığı aylarda eczane ödeyebileceğinden fazla mal almış demektir',
    G(sutunGrafik(aylar.map(ayEtiket), grafikSeri, { yukseklik:250 }), i => {
      const s = satirlar[i];
      return `<b>${ayUzun(s.a)}</b>
        ${ipSatir('var(--s1)','Kapasite', TL(s.kap))}
        ${ipSatir('var(--s2)','Fiili alım', TL(s.alim))}
        <div class="ayirac"></div>
        ${ipSatir(null,'Fark', `<span class="${s.fark < 0 ? 'neg' : 'poz'}">${TL(s.fark)}</span>`)}
        ${ipSatir(null,'Ödeme ayı', ayUzun(s.odemeAy))}`;
    }) + efsane(grafikSeri));

  const tablo = kart('Alım Disiplini Tablosu · ' + y,
    'Bir ayda alınan mal, ortalama vade kadar sonra ödenir. Kapasite, o tarihte kasaya girecek nakde göre hesaplanır.',
    `<div class="tsar"><table class="t"><thead><tr>
      <th class="kilit sol">Alım Ayı</th><th>Ort. Vade</th><th class="sol">Ödeme Ayı</th>
      <th>O Ayın Kasa Girişi</th><th>Kapasite (${YZD0(oran)})</th><th>Fiili Alım</th>
      <th>Fark</th><th>Kullanım</th><th class="sol">Durum</th><th>Ödeme Yükü</th></tr></thead>
    <tbody>${satirlar.map(s => `<tr>
      <td class="kilit">${ayUzun(s.a)}</td>
      <td class="ikincil mono">${s.v} ay</td>
      <td class="sol ikincil">${ayUzun(s.odemeAy)}</td>
      <td class="ikincil">${TL(s.gelecek)}</td>
      <td>${TL(s.kap)}</td>
      <td class="vurgu">${TL(s.alim)}</td>
      <td class="${s.fark == null ? 'ikincil' : (s.fark < 0 ? 'neg' : 'poz')}">${TL(s.fark)}</td>
      <td class="vurgu ${s.kul != null && s.kul > 1 ? 'neg' : ''}">${YZD0(s.kul)}</td>
      <td class="sol">${
        !s.bilinir    ? `<span class="rozet uyari"><i></i>${ayEtiket(s.odemeAy)} verisi yok</span>`
        : s.kap <= 0  ? '<span class="rozet">veri yok</span>'
        : s.kul > 1.02 ? '<span class="rozet kotu"><i></i>Sınır aşıldı</span>'
        : s.kul > 0.9  ? '<span class="rozet uyari"><i></i>Sınırda</span>'
        : s.kul < 0.4  ? '<span class="rozet"><i></i>Düşük alım</span>'
        : '<span class="rozet iyi"><i></i>Uygun</span>'}</td>
      <td class="ikincil ${s.yuk != null && s.yuk > 0.8 ? 'neg' : ''}">${YZD0(s.yuk)}</td>
    </tr>`).join('')}</tbody>
    <tfoot><tr><td class="kilit">Ölçülen ${olcum.length} ay</td><td></td><td></td><td></td>
      <td>${TL(topKap)}</td><td>${TL(topAlim)}</td>
      <td class="${topKap - topAlim < 0 ? 'neg' : 'poz'}">${TL(topKap - topAlim)}</td>
      <td>${topKap ? YZD0(topAlim/topKap) : '—'}</td>
      <td class="sol ikincil" colspan="2">Yılın tamamındaki alım: ${TL(yilAlim)}</td></tr></tfoot></table></div>`,
    `<label class="alan" style="flex-direction:row;align-items:center;gap:7px">
      <span style="white-space:nowrap">Sınır %</span>
      <input class="metinGirdi num" id="inpDisiplin" style="width:70px" inputmode="decimal"
        value="${nfSay.format(oran*100)}"></label>
     <button class="btn kucuk ana1" id="btnDisiplinKaydet">Uygula</button>`, 'sifir');

  const aciklama = kart('Bu sayfa neyi ölçüyor?', null, `
    <div style="font-size:13px;color:var(--mrk2);line-height:1.65;max-width:72ch">
      <p style="margin:0 0 10px">Eczanede para iki farklı hızda hareket eder: perakende tahsilat aynı ay kasaya
      girer, SGK reçetesi <b>${e.ayar.sgkVadeGun} gün</b>, özel sigorta <b>${e.ayar.ozelVadeGun} gün</b> sonra ödenir.
      Depoya olan borç ise kendi vadesinde çıkar.</p>
      <p style="margin:0 0 10px">Bu yüzden “bu ay ne kadar alım yapabilirim?” sorusunun cevabı bu ayın cirosu değil,
      <b>faturanın ödeneceği aydaki kasa girişidir</b>. Kapasite sütunu tam olarak bunu hesaplar:
      alım ayının ortalama vadesi kadar ileri gidilir, o ayın kasa girişinin ${YZD0(oran)}’i alıma ayrılabilir kabul edilir.</p>
      <p style="margin:0">Kalan ${YZD0(1 - oran)} rutin giderler ve eczacının kâr payı içindir.
      Sürekli sınır aşılıyorsa eczane <b>ödeyemeyeceği kadar stok</b> yapıyor demektir.</p>
    </div>`);

  return kpiler + uyariNot + grafik + tablo + aciklama;
}

function bgDisiplin(e, kok){
  const b = kok.querySelector('#btnDisiplinKaydet');
  const i = kok.querySelector('#inpDisiplin');
  if (b && i){
    const uygula = () => {
      const v = sayiOku(i.value);
      if (v == null || v <= 0 || v > 100){ bildir('1 ile 100 arasında bir oran girin.', true); return; }
      e.ayar.disiplinOrani = v / 100;
      kaydet(true); ciz(); bildir('Disiplin sınırı %' + SAY(v) + ' olarak güncellendi.');
    };
    b.onclick = uygula;
    i.onkeydown = ev => { if (ev.key === 'Enter') uygula(); };
  }
}

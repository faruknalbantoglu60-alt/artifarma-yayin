   6.9 YIL KARŞILAŞTIRMA
   --------------------------------------------------------- */
function sfBuyume(e){
  const y = YIL(), y1 = y - 1, y2 = y - 2;
  const yillar = [y2, y1, y];

  const say = yillar.map(yy => ({
    yil: yy,
    aylik: yilAylari(yy).map(k => H.toplamCiro(e, k)),
    gun:   yilAylari(yy).map(k => H.isGunu(e, k)),
    top:   H.yilCiro(e, yy)
  }));
  const varOlan = say.filter(s => s.top > 0);

  const kpiler = `<div class="satir s4">
    ${say.map((s, i) => kpi(s.yil + ' Cirosu', TLk(s.top), {
      delta: i > 0 && say[i-1].top ? s.top/say[i-1].top - 1 : null,
      not: topla(s.gun) ? TL(s.top / topla(s.gun)) + ' / iş günü' : '',
      kivilcim: s.aylik, kivilcimRenk: seriRenk(i)
    })).join('')}
    ${(() => {
      const g0 = topla(say[1].gun) ? say[1].top / topla(say[1].gun) : 0;
      const g1 = topla(say[2].gun) ? say[2].top / topla(say[2].gun) : 0;
      return kpi('İş Günü Düzeltilmiş Büyüme', g0 ? YZD(g1/g0 - 1) : '—', {
        not: 'Gün sayısı etkisi arındırılmış ' + y1 + '→' + y });
    })()}
  </div>`;

  const seri = varOlan.map((s, i) => ({
    ad: String(s.yil), renk: seriRenk(i === varOlan.length - 1 ? 0 : i + 4),
    veri: s.aylik.map(v => v || null),
    kesik: yilAylari(s.yil).map(k => H.tahminMi(e, k))
  }));
  const trend = kart('Aylık Ciro — Yıl Karşılaştırması', 'Kesik çizgi tahmin',
    seri.length ? G(cizgiGrafik(AY_KISA, seri, { yukseklik:270 }), i =>
      `<b>${AY_ADI[i]}</b>` + seri.map(s => ipSatir(s.renk, s.ad, TL(s.veri[i]))).join('') +
      (seri.length > 1 && seri[seri.length-2].veri[i] && seri[seri.length-1].veri[i]
        ? `<div class="ayirac"></div>` + ipSatir(null, 'Büyüme',
            YZD(seri[seri.length-1].veri[i] / seri[seri.length-2].veri[i] - 1)) : '')
    ) + efsane(seri.map(s => ({ ad:s.ad, renk:s.renk })), true)
      : bosKart('En az bir yılın verisi gerekiyor.'));

  const tablo = kart('Ay Ay Karşılaştırma',
    'Günlük ortalama sütunu, ayların iş günü sayısı farkını arındırır — asıl performans farkı budur',
    `<div class="tsar"><table class="t"><thead><tr>
      <th class="kilit sol">Ay</th>
      ${yillar.map(yy => `<th>${yy}</th>`).join('')}
      <th style="border-left:1px solid var(--cizgi)">Büyüme</th>
      <th>İş Günü ${y1}</th><th>İş Günü ${y}</th>
      <th>Günlük Ort. ${y1}</th><th>Günlük Ort. ${y}</th><th>Günlük Büyüme</th>
    </tr></thead><tbody>
    ${AY_ADI.map((ad, i) => {
      const v = say.map(s => s.aylik[i]);
      const b = v[1] ? v[2]/v[1] - 1 : null;
      const g1 = say[1].gun[i], g2 = say[2].gun[i];
      const d1 = g1 ? v[1]/g1 : null, d2 = g2 ? v[2]/g2 : null;
      const gb = (d1 && d2) ? d2/d1 - 1 : null;
      return `<tr>
        <td class="kilit">${ad}</td>
        ${v.map(x => `<td class="${x ? '' : 'ikincil'}">${x ? TL(x) : '—'}</td>`).join('')}
        <td class="vurgu ${b != null && b < 0 ? 'neg' : (b != null ? 'poz' : '')}"
          style="border-left:1px solid var(--cizgi)">${YZD(b)}</td>
        <td class="ikincil mono">${g1}</td><td class="ikincil mono">${g2}</td>
        <td class="ikincil">${d1 ? TL(d1) : '—'}</td><td>${d2 ? TL(d2) : '—'}</td>
        <td class="vurgu ${gb != null && gb < 0 ? 'neg' : (gb != null ? 'poz' : '')}">${YZD(gb)}</td>
      </tr>`;
    }).join('')}
    </tbody><tfoot><tr><td class="kilit">Toplam</td>
      ${say.map(s => `<td>${TL(s.top)}</td>`).join('')}
      <td style="border-left:1px solid var(--cizgi)">${YZD(say[1].top ? say[2].top/say[1].top - 1 : null)}</td>
      <td class="mono">${topla(say[1].gun)}</td><td class="mono">${topla(say[2].gun)}</td>
      <td>${topla(say[1].gun) ? TL(say[1].top/topla(say[1].gun)) : '—'}</td>
      <td>${topla(say[2].gun) ? TL(say[2].top/topla(say[2].gun)) : '—'}</td>
      <td>${(() => { const a = topla(say[1].gun) ? say[1].top/topla(say[1].gun) : 0,
                            b2 = topla(say[2].gun) ? say[2].top/topla(say[2].gun) : 0;
                      return a ? YZD(b2/a - 1) : '—'; })()}</td>
    </tr></tfoot></table></div>`, null, 'sifir');

  /* Kategori bazlı 3 yıl */
  const katTablo = kart('Kategori Bazında Yıllık Gelişim', yillar.join(' → '),
    `<div class="tsar"><table class="t"><thead><tr>
      <th class="kilit sol">Kategori</th>${yillar.map(yy => `<th>${yy}</th>`).join('')}
      <th>Büyüme</th><th>Pay ${y}</th></tr></thead><tbody>
    ${H.aktifKat(e).map((k, i) => {
      const v = yillar.map(yy => H.yilKatCiro(e, yy, k.id));
      const b = v[1] ? v[2]/v[1] - 1 : null;
      const t = H.yilCiro(e, y);
      if (!topla(v)) return '';
      return `<tr><td class="kilit"><span style="display:inline-flex;align-items:center;gap:7px">
          <i style="width:8px;height:8px;border-radius:2px;background:${seriRenk(k.renk ?? i)};flex:none"></i>${kacis(k.ad)}</span></td>
        ${v.map(x => `<td class="${x ? '' : 'ikincil'}">${x ? TL(x) : '—'}</td>`).join('')}
        <td class="vurgu ${b != null && b < 0 ? 'neg' : (b != null ? 'poz' : '')}">${YZD(b)}</td>
        <td class="ikincil">${t ? YZD(v[2]/t) : '—'}</td></tr>`;
    }).join('')}</tbody></table></div>`, null, 'sifir');

  return kpiler + trend + tablo + katTablo;
}

/* ---------------------------------------------------------
   6.10 HEDEF & PRİM
   --------------------------------------------------------- */
/** Bir prim grubunun o aya ait istisna kaydı (varsa) */
const primAyKayit = (grup, ay) => (grup.ay || {})[ay] || null;

/** Aya özel elle kademe tablosu var mı? */
function primElleMi(grup, ay){
  const o = primAyKayit(grup, ay);
  return !!(o && Array.isArray(o.kademeler) && o.kademeler.filter(k => +k.esik > 0).length);
}
/** Aya özel günlük hedef var mı? */
function primGunlukOzelMi(grup, ay){
  const o = primAyKayit(grup, ay);
  return !!(o && o.gunluk !== undefined && o.gunluk !== null && o.gunluk !== '');
}
/** Bir prim grubunun o aydaki günlük hedefi (aya özel değer varsa o kullanılır) */
function primGunluk(grup, ay){
  const o = primAyKayit(grup, ay);
  if (o && o.gunluk !== undefined && o.gunluk !== null && o.gunluk !== '') return +o.gunluk || 0;
  return primYilHedef(grup, ayYil(ay));
}
/** Prim grubunun bir yıldaki varsayılan günlük hedefi */
function primYilHedef(grup, yil){
  const v = (grup.yilHedef || {})[yil];
  if (v !== undefined && v !== null && v !== '') return +v || 0;
  return +grup.gunlukHedef || 0;   // eski kayıtlar için
}
const primYilHedefiVar = (grup, yil) => {
  const v = (grup.yilHedef || {})[yil];
  return v !== undefined && v !== null && v !== '' && +v > 0;
};

/**
 * Bir ayın kademe tablosunu ve hangi kuraldan geldiğini döndürür.
 *  · 'elle'   — o ay için elle yazılmış mutlak ₺ eşikleri (her şeyin üstünde)
 *  · 'gunluk' — günlük satış hedefi × o ayın iş günü = aylık baz; kademeler bu bazın katıdır
 *  · 'sabit'  — grubun sabit ₺ eşik tablosu, tüm aylarda aynı
 * Böylece bir ay diğerlerinden bağımsız olarak belirlenebilir.
 */
function primKademeler(e, grup, ay){
  const gun = H.isGunu(e, ay);
  const gunlukHedef = primGunluk(grup, ay);
  const bazAylik = gunlukHedef * gun;

  if (primElleMi(grup, ay)){
    const kad = primAyKayit(grup, ay).kademeler;
    return { mod:'elle', gun, gunlukHedef, bazAylik,
      kademeler: [...kad].filter(k => +k.esik > 0)
        .map(k => ({ esik:+k.esik, oran:+k.oran })).sort((a, b) => a.esik - b.esik) };
  }
  if (grup.hedefTipi === 'gunluk'){
    /* Hedef girilmemişse aylık baz sıfırdır; eşikleri sıfır kabul edip prim
       vermek yanlış olur — o yıl için kademe yok sayılır. */
    return { mod: primGunlukOzelMi(grup, ay) ? 'gunluk-ozel' : 'gunluk', gun, gunlukHedef, bazAylik,
      kademeler: bazAylik > 0
        ? (grup.carpanlar || []).filter(c => +c.carpan > 0)
            .map(c => ({ esik: bazAylik * +c.carpan, oran:+c.oran, carpan:+c.carpan }))
            .sort((a, b) => a.esik - b.esik)
        : [] };
  }
  return { mod:'sabit', gun, gunlukHedef, bazAylik,
    kademeler: [...(grup.kademeler || [])].filter(k => +k.esik > 0)
      .map(k => ({ esik:+k.esik, oran:+k.oran })).sort((a, b) => a.esik - b.esik) };
}

const PRIM_MOD_ETIKET = {
  'elle':       { ad:'Elle',           sinif:'uyari' },
  'gunluk-ozel':{ ad:'Aya özel günlük', sinif:'uyari' },
  'gunluk':     { ad:'Varsayılan',     sinif:'' },
  'sabit':      { ad:'Sabit eşik',     sinif:'' }
};

/**
 * Bir ayın prim hesabı. Her ay kendi kademe tablosuyla, birbirinden bağımsız hesaplanır.
 * Prim havuzu ulaşılan kademe oranıyla bulunur; her personel havuzdan
 * kendi satış katkısı oranında pay alır.
 */
function primHesap(e, grup, ay){
  const kats = grup.katIds.filter(id => H.kategori(e, id));
  const pers = H.ayPersoneli(e, ay);
  const kisi = pers.map(p => ({
    p, satis: topla(kats.map(kid => H.persKayit(e, ay, p.id, kid).ciro))
  }));
  /* İki ayrı toplam vardır ve eşit olmak zorunda değildir:
     · katToplam  — Kategori Ciroları sayfasındaki gerçek satış
     · persToplam — Personel Satış sayfasına kişi kişi girilmiş kısım
     Aradaki fark, kimseye yazılmamış (eşleşmeyen) satıştır. Kademenin hangisine
     göre belirleneceği tabloda seçilir; dağıtım her hâlükârda kişi payına göredir. */
  const persToplam = topla(kisi.map(x => x.satis));
  const katToplam = topla(kats.map(kid => H.katCiro(e, ay, kid)));
  const taban = grup.taban === 'personel' ? 'personel' : 'kategori';
  const satilan = taban === 'personel' ? (persToplam || katToplam) : (katToplam || persToplam);
  const eslesmeyen = katToplam - persToplam;

  const { mod, gun, gunlukHedef, bazAylik, kademeler: sirali } = primKademeler(e, grup, ay);

  let oran = 0, kademe = null;
  sirali.forEach(k => { if (satilan >= k.esik){ oran = k.oran; kademe = k; } });
  const sonraki = sirali.find(k => k.esik > satilan) || null;
  /* Ürün hedefi ön koşulu açıksa havuz o oranda kısılır */
  const onKosul = H.urunOnKosul(e, ay);
  const hamHakedis = satilan * oran;
  const hakedis = hamHakedis * onKosul.carpan;
  /* 'elle' modda hedef, ilk kademe eşiğidir; diğerlerinde aylık baz */
  const hedefTutar = mod === 'elle' ? (sirali.length ? sirali[0].esik : 0) : bazAylik;

  /* Havuz kişi paylarına göre dağıtılır; paylar personel girişine oranlanır ki
     toplamları %100 etsin ve havuzun tamamı dağıtılsın. */
  const dagitim = persToplam;

  return {
    grup, ay, mod, satilan, oran, kademe, sonraki, kademeler:sirali,
    katToplam, persToplam, taban, eslesmeyen, dagitim,
    onKosul, hamHakedis,
    gun, gunlukHedef, bazAylik, hedefTutar,
    ozelMi: mod === 'elle' || mod === 'gunluk-ozel',
    gunlukGerceklesen: gun ? satilan / gun : null,
    hedefOrani: hedefTutar ? satilan / hedefTutar : null,
    hakedis,
    kisi: kisi.map(x => {
      const pay = dagitim ? x.satis / dagitim : 0;
      return { ...x, pay, hakedis: hakedis * pay };
    })
  };
}

/** Bir aydaki tüm prim gruplarının birleşik sonucu */
function primOzet(e, ay){
  const gruplar = e.primGruplari.map(g => primHesap(e, g, ay));
  const toplam = topla(gruplar.map(h => h.hakedis));
  const satis  = topla(gruplar.map(h => h.satilan));      // kademeyi belirleyen taban
  const dagitim = topla(gruplar.map(h => h.dagitim));     // kişi paylarının paydası
  const kisi = H.ayPersoneli(e, ay).map(p => {
    const satirlar = gruplar.map(h => h.kisi.find(x => x.p.id === p.id) || { satis:0, hakedis:0, pay:0 });
    const ps = topla(satirlar.map(x => x.satis));
    const ph = topla(satirlar.map(x => x.hakedis));
    return { p, satis:ps, hakedis:ph, pay: dagitim ? ps/dagitim : 0,
             kirilim: gruplar.map((h, i) => ({ grup:h.grup, ...satirlar[i] })) };
  });
  return { gruplar, toplam, satis, dagitim, kisi,
           eslesmeyen: topla(gruplar.map(h => h.eslesmeyen)),
           onKosul: H.urunOnKosul(e, ay),
           hamToplam: topla(gruplar.map(h => h.hamHakedis)),
           oran: satis ? toplam/satis : null };
}

/** Eczanenin aylık ciro hedefi — günlük hedeften türer */
function hedefKart(e){
  const y = YIL(), aylar = yilAylari(y);
  const d = aylar.map(k => H.hedefDurum(e, k));
  const yilHedef = topla(d.map(x => x.hedef)), yilCiro = topla(d.map(x => x.ciro));

  const durumEt = x => {
    if (!x.hedef) return '<span class="rozet">hedef yok</span>';
    if (x.oran >= 1)   return '<span class="rozet iyi"><i></i>Tuttu</span>';
    if (x.oran >= 0.9) return '<span class="rozet uyari"><i></i>Yakın</span>';
    return '<span class="rozet kotu"><i></i>Altında</span>';
  };

  const oncekiYil = H.yilHedefiVar(e, y - 1) ? e.hedef.yil[y - 1] : null;
  const yilUyari = (!H.yilHedefiVar(e, y) && !Object.keys(e.hedef.gunlukAy).some(k => ayYil(k) === y))
    ? `<div class="serit" style="padding:11px 16px;border-bottom:1px solid var(--cizgi2);
        background:var(--uyariZemin)"><span class="rozet uyari"><i></i>Hedef tanımsız</span>
        <span class="ipucuMetin">${y} için günlük hedef girilmemiş.${
          oncekiYil ? ' ' + (y-1) + ' hedefi ' + TL(oncekiYil) + ' idi.' : ''}</span></div>`
    : '';

  return kart('Aylık Ciro Hedefi · ' + y,
    'Hedefi günlük olarak girin — aylık hedef, o ayın iş günü sayısıyla çarpılarak bulunur. '
    + 'Hedef her yıl için ayrı tutulur; yalnızca üstte seçili yılı etkiler.',
    yilUyari + `<div class="tsar"><table class="t"><thead><tr>
      <th class="kilit sol">Ay</th><th>İş Günü</th><th>Günlük Hedef</th><th>Aylık Hedef</th>
      <th>Gerçekleşen</th><th>Günlük Gerçekleşen</th><th>Fark</th><th>Gerçekleşme</th><th class="sol">Durum</th>
    </tr></thead><tbody>
    ${d.map((x, i) => `<tr>
      <td class="kilit">${ayUzun(x.ay)}</td>
      <td class="ikincil mono">${x.gun}</td>
      <td>${hucre(x.gunlukHedef, { rol:'hedefGun', ay:x.ay },
        { etiket:'Günlük hedef ' + ayUzun(x.ay), yer:'varsayılan' })}</td>
      <td class="vurgu">${hc('h-a-' + i, x.hedef)}</td>
      <td>${TL(x.ciro)}</td>
      <td class="ikincil">${x.gunlukCiro ? TL(x.gunlukCiro) : '—'}</td>
      <td class="${x.fark == null ? 'ikincil' : (x.fark < 0 ? 'neg' : 'poz')}">${hc('h-f-' + i, x.fark)}</td>
      <td class="vurgu ${x.oran == null ? 'ikincil' : (x.oran < 1 ? 'neg' : 'poz')}">${hc('h-o-' + i, x.oran, YZD0)}
        ${x.oran == null ? '' : `<span class="olcu"><i style="width:${kis(x.oran * 100, 0, 100).toFixed(1)}%;
          background:${x.oran >= 1 ? 'var(--iyi)' : 'var(--uyari)'}"></i></span>`}</td>
      <td class="sol">${durumEt(x)}</td></tr>`).join('')}
    </tbody><tfoot><tr>
      <td class="kilit">Yıl Toplamı</td>
      <td class="mono">${topla(d.map(x => x.gun))}</td><td></td>
      <td>${TL(yilHedef)}</td><td>${TL(yilCiro)}</td><td></td>
      <td class="${yilCiro - yilHedef < 0 ? 'neg' : 'poz'}">${yilHedef ? TL(yilCiro - yilHedef) : '—'}</td>
      <td>${yilHedef ? YZD0(yilCiro / yilHedef) : '—'}</td><td></td>
    </tr></tfoot></table></div>`,
    `<label class="alan" style="flex-direction:row;align-items:center;gap:7px">
      <span style="white-space:nowrap">${y} günlük hedefi</span>
      <input class="metinGirdi num" id="inpHedefVars" style="width:120px" inputmode="decimal"
        value="${H.yilHedefiVar(e, y) ? nfSay.format(e.hedef.yil[y]) : ''}"
        placeholder="tanımsız"></label>
     <button class="btn kucuk ana1" id="btnHedefVars">${y} aylarına uygula</button>`, 'sifir');
}

function sfPrim(e){
  const y = YIL(), aylar = yilAylari(y);
  const secAy = (D.primAySec && ayYil(D.primAySec) === y) ? D.primAySec : (sonGercekAy(e, y) || aylar[0]);

  if (!e.primGruplari.length)
    return hedefKart(e) + kart('Prim Tabloları', 'Henüz prim tablosu yok',
      `<div class="bos" style="max-width:62ch;margin:0 auto">
        Ekip primini kademeli hedeflerle yönetin. Genellikle iki tablo kurulur:
        biri <b>dermokozmetik</b> için, biri <b>ilaç ve dermokozmetik dışı</b> satışlar için.
        Hedefi günlük satış olarak da verebilirsiniz — aylık eşikler iş gününe göre kendiliğinden ayarlanır.<br><br>
        <button class="btn ana1" id="btnPrimEkle">+ Prim tablosu oluştur</button>
      </div>`);

  const grupKart = grup => {
    const h = primHesap(e, grup, secAy);
    const kats = grup.katIds.map(id => H.kategori(e, id)).filter(Boolean);

    const kademeSerit = `<div class="serit" style="gap:6px">${h.kademeler.map(k => {
      const aktif = h.kademe && +k.esik === +h.kademe.esik;
      return `<span class="rozet ${aktif ? 'iyi' : ''}" style="${aktif ? '' : 'opacity:.65'}"
        title="${k.carpan ? 'Günlük hedefin ' + nfSay2.format(k.carpan) + ' katı' : ''}">
        ${TLk(k.esik)}${k.carpan ? ' <span style="opacity:.7">(×' + nfSay2.format(k.carpan) + ')</span>' : ''}
        → %${nfSay2.format(k.oran*100)}</span>`;
    }).join('')}</div>`;

    const yilYok = grup.hedefTipi === 'gunluk' && !primYilHedefiVar(grup, y)
      && !aylar.some(a => primGunlukOzelMi(grup, a));
    const yilUyariG = yilYok ? `<div class="serit" style="gap:8px;margin-bottom:11px;padding:9px 12px;
        border-radius:var(--r2);background:var(--uyariZemin)">
        <span class="rozet uyari"><i></i>Hedef tanımsız</span>
        <span class="ipucuMetin" style="color:var(--uyariYazi)">${y} için günlük hedef girilmemiş —
          bu yılın kademeleri oluşmadığı için prim hesaplanmıyor.
          <b>Varsayılan kademeler</b> düğmesinden ${y} hedefini girin.</span></div>` : '';

    const gunlukSerit = grup.hedefTipi === 'gunluk' ? `<div class="serit" style="gap:6px;margin-bottom:9px">
      <span class="rozet">Günlük hedef ${TL(h.gunlukHedef)}</span>
      <span class="rozet">${h.gun} iş günü</span>
      <span class="rozet">Aylık baz ${TL(h.bazAylik)}</span>
      <span class="rozet ${!h.gunlukHedef ? '' : (h.gunlukGerceklesen >= h.gunlukHedef ? 'iyi' : 'uyari')}">
        ${h.gunlukHedef ? '<i></i>' : ''}Günlük gerçekleşen ${TL(h.gunlukGerceklesen)}</span>
    </div>` : '';

    const ilerleme = h.sonraki ? (() => {
      const alt = h.kademe ? +h.kademe.esik : 0;
      const p = kis((h.satilan - alt) / ((+h.sonraki.esik - alt) || 1), 0, 1);
      return `<div style="margin-top:10px">
        <div style="display:flex;justify-content:space-between;font-size:11.5px;color:var(--mrk2)">
          <span>Bir üst kademeye ${TL(+h.sonraki.esik - h.satilan)} kaldı</span>
          <span class="mono">%${nfSay2.format(h.sonraki.oran*100)}</span></div>
        <div style="height:6px;border-radius:3px;background:var(--cizgi2);margin-top:5px;overflow:hidden">
          <div style="height:100%;width:${(p*100).toFixed(1)}%;background:var(--s3);border-radius:3px"></div></div>
      </div>`;
    })() : `<p class="ipucuMetin" style="margin-top:10px">${
      h.kademeler.length ? 'En üst kademeye ulaşıldı.' : 'Bu yıl için kademe tanımlı değil.'}</p>`;

    const kisiTablo = primKisiTablosu(h);

    /* --- 12 aylık plan: her ay ayrı ayrı belirlenebilir --- */
    const acik = !!(D.primPlan && D.primPlan[grup.id]);
    const planlar = aylar.map(a => primHesap(e, grup, a));
    const ozelSayi = planlar.filter(x => x.ozelMi).length;

    const planTablo = !acik ? '' : `<div class="tsar" style="margin-top:12px"><table class="t">
      <thead><tr>
        <th class="kilit sol">Ay</th><th>İş Günü</th><th>Günlük Hedef</th><th>Aylık Hedef</th>
        <th class="sol">Kademeler</th><th>Satılan</th><th>Gerçekleşme</th><th>Oran</th><th>Prim</th>
        <th class="sol">Kaynak</th><th></th></tr></thead>
      <tbody>${planlar.map(x => {
        const et = PRIM_MOD_ETIKET[x.mod] || PRIM_MOD_ETIKET.gunluk;
        const elle = x.mod === 'elle';
        return `<tr${x.ay === secAy ? ' class="ara"' : ''}>
          <td class="kilit">${ayUzun(x.ay)}</td>
          <td class="ikincil mono">${x.gun}</td>
          <td>${elle ? '<span class="ikincil">—</span>'
            : hucre(x.gunlukHedef, { rol:'primGun', grup:grup.id, ay:x.ay },
                { etiket:'Günlük hedef ' + ayUzun(x.ay), yer: y + ' varsayılanı' })}</td>
          <td class="vurgu">${TL(x.hedefTutar)}</td>
          <td class="sol ikincil mono" style="font-size:10.5px">${
            x.kademeler.length
              ? x.kademeler.map(k =>
                  `<span style="white-space:nowrap">${TLk(k.esik)}→%${nfSay2.format(k.oran*100)}</span>`)
                .join('<span style="opacity:.45;padding:0 6px">·</span>')
              : 'kademe yok'}</td>
          <td>${TL(x.satilan)}</td>
          <td class="ikincil ${x.hedefOrani != null && x.hedefOrani < 1 ? 'neg' : 'poz'}">${YZD0(x.hedefOrani)}</td>
          <td class="mono ${x.oran ? 'vurgu' : 'ikincil'}">${x.oran ? '%' + nfSay2.format(x.oran*100) : '—'}</td>
          <td class="vurgu">${x.hakedis ? TL(x.hakedis) : '<span class="ikincil">—</span>'}</td>
          <td class="sol"><span class="rozet ${et.sinif}">${et.sinif ? '<i></i>' : ''}${et.ad}</span></td>
          <td class="sol"><div class="serit">
            <button class="btn kucuk" data-prim-ay="${grup.id}|${x.ay}">Elle</button>
            ${x.ozelMi ? `<button class="btn kucuk" data-prim-sifirla="${grup.id}|${x.ay}"
              title="Bu ayı varsayılan kurala döndür">↺</button>` : ''}
          </div></td></tr>`;
      }).join('')}</tbody>
      <tfoot><tr><td class="kilit">Yıl</td><td class="mono">${topla(planlar.map(x => x.gun))}</td><td></td>
        <td>${TL(topla(planlar.map(x => x.hedefTutar)))}</td><td></td>
        <td>${TL(topla(planlar.map(x => x.satilan)))}</td><td></td><td></td>
        <td>${TL(topla(planlar.map(x => x.hakedis)))}</td><td colspan="2"></td></tr></tfoot></table>
      <p class="ipucuMetin" style="padding:10px 2px 2px;max-width:88ch">
        <b>Günlük Hedef</b> sütununa yazdığınız değer yalnızca o ayı etkiler; boş bırakırsanız
        tablonun varsayılan hedefi geçerli olur. Bir ayın kademelerini tamamen kendiniz yazmak
        isterseniz <b>Elle</b> düğmesini kullanın — o ay artık günlük hedeften bağımsız hesaplanır.
        <b>↺</b> ayı varsayılan kurala döndürür.</p></div>`;

    return kart(kacis(grup.ad),
      (kats.map(k => kacis(k.ad)).join(' · ') || 'Kategori seçilmemiş')
        + (ozelSayi ? ` · <b>${ozelSayi} ayda özel ayar</b>` : ''),
      `<div class="satir s3" style="margin-bottom:14px">
        ${kpi('Satılan · ' + ayEtiket(secAy), TLk(h.satilan), {
          not: (h.hedefOrani != null ? 'Hedefin ' + YZD0(h.hedefOrani) + '’si · ' : '')
             + (h.persToplam ? 'personel girişinden' : 'kategori toplamından') })}
        ${kpi('Ulaşılan Kademe', h.oran ? '%' + nfSay2.format(h.oran*100) : 'Hedef altı', {
          not: h.kademe ? 'Eşik ' + TL(h.kademe.esik) : 'İlk eşiğe ulaşılmadı' })}
        ${kpi('Toplam Prim Havuzu', TL(h.hakedis), { not: 'Satılan × ulaşılan oran' })}
      </div>
      ${yilUyariG}${gunlukSerit}${kademeSerit}${ilerleme}
      <div class="ayirac" style="margin:14px 0 12px"></div>
      ${kisiTablo}
      ${planTablo}`,
      `<span class="goz1">${ayEtiket(secAy)} havuzu</span>
       <span class="num" style="font-size:15px;font-weight:660;margin-right:4px">${TL(h.hakedis)}</span>
       <button class="btn kucuk" data-prim-plan="${grup.id}" aria-expanded="${acik}">
        ${acik ? 'Aylık planı gizle' : 'Aylık plan'}${ozelSayi ? ' · ' + ozelSayi : ''}</button>
       <button class="btn kucuk" data-prim-duzen="${grup.id}">Varsayılan kademeler</button>
       <button class="btn kucuk tehlike" data-prim-sil="${grup.id}">Sil</button>`);
  };

  /* Yıl boyu prim özeti */
  const pers = H.yilPersoneli(e, y);
  const yilOzet = aylar.map(a => {
    const gr = e.primGruplari.map(g => primHesap(e, g, a));
    const kisiTop = {};
    pers.forEach(p => kisiTop[p.id] = topla(gr.map(h => (h.kisi.find(x => x.p.id === p.id) || {}).hakedis || 0)));
    return { ay:a, toplam: topla(gr.map(h => h.hakedis)), kisi:kisiTop, satis: topla(gr.map(h => h.satilan)) };
  });
  const yilTop = topla(yilOzet.map(x => x.toplam));

  const ozetTablo = kart('Yıllık Prim Hak Edişi · ' + y, 'Tüm tabloların toplamı',
    `<div class="tsar"><table class="t"><thead><tr>
      <th class="kilit sol">Ay</th><th>Hedefli Satış</th>
      ${pers.map(p => `<th>${kacis(p.ad)}</th>`).join('')}
      <th style="border-left:1px solid var(--cizgi)">Toplam Prim</th><th>Prim / Satış</th></tr></thead>
    <tbody>${yilOzet.map(x => `<tr>
      <td class="kilit">${ayEtiket(x.ay)}</td><td class="ikincil">${TL(x.satis)}</td>
      ${pers.map(p => `<td>${x.kisi[p.id] ? TL(x.kisi[p.id]) : '<span class="ikincil">—</span>'}</td>`).join('')}
      <td class="vurgu" style="border-left:1px solid var(--cizgi)">${TL(x.toplam)}</td>
      <td class="ikincil">${x.satis ? YZD(x.toplam/x.satis) : '—'}</td></tr>`).join('')}
    </tbody><tfoot><tr><td class="kilit">Toplam</td>
      <td>${TL(topla(yilOzet.map(x => x.satis)))}</td>
      ${pers.map(p => `<td>${TL(topla(yilOzet.map(x => x.kisi[p.id] || 0)))}</td>`).join('')}
      <td style="border-left:1px solid var(--cizgi)">${TL(yilTop)}</td><td></td></tr></tfoot></table></div>`,
    null, 'sifir');

  /* --- Eşleşme kontrolü: kategori cirosu ile personel girişi tutuyor mu --- */
  const eslesmeKart = (() => {
    const satirlar = aylar.map(a => {
      const gr = e.primGruplari.map(g => primHesap(e, g, a));
      return { ay:a, gr,
        kat: topla(gr.map(h => h.katToplam)),
        per: topla(gr.map(h => h.persToplam)),
        fark: topla(gr.map(h => h.eslesmeyen)) };
    });
    const sorunlu = satirlar.filter(x => Math.abs(x.fark) > Math.max(1, x.kat * 0.002));
    if (!satirlar.some(x => x.kat || x.per)) return '';
    return kart('Eşleşme Kontrolü · ' + y,
      sorunlu.length
        ? sorunlu.length + ' ayda kategori cirosu ile personel girişi tutmuyor'
        : 'Tüm aylarda kategori cirosu ile personel girişi tutuyor',
      `<div class="tsar"><table class="t"><thead><tr>
        <th class="kilit sol">Ay</th>
        ${e.primGruplari.map(g => `<th>${kacis(g.ad)}<div class="goz1" style="font-size:9px">kategori / personel</div></th>`).join('')}
        <th style="border-left:1px solid var(--cizgi)">Kategori Cirosu</th>
        <th>Personel Girişi</th><th>Fark</th><th class="sol">Durum</th></tr></thead>
      <tbody>${satirlar.map(x => {
        const bozuk = Math.abs(x.fark) > Math.max(1, x.kat * 0.002);
        return `<tr${x.ay === secAy ? ' class="ara"' : ''}>
          <td class="kilit">${ayUzun(x.ay)}</td>
          ${x.gr.map(h => `<td class="${Math.abs(h.eslesmeyen) > Math.max(1, h.katToplam*0.002) ? 'neg' : 'ikincil'}">
            ${TLk(h.katToplam)} / ${TLk(h.persToplam)}</td>`).join('')}
          <td style="border-left:1px solid var(--cizgi)">${TL(x.kat)}</td>
          <td>${TL(x.per)}</td>
          <td class="vurgu ${bozuk ? 'neg' : 'ikincil'}">${x.fark ? TL(x.fark) : '—'}</td>
          <td class="sol">${bozuk
            ? '<span class="rozet kotu"><i></i>Açık var</span>'
            : (x.kat ? '<span class="rozet iyi"><i></i>Tutuyor</span>' : '<span class="rozet">veri yok</span>')}</td>
        </tr>`;
      }).join('')}</tbody>
      <tfoot><tr><td class="kilit">Yıl</td>
        ${e.primGruplari.map(function(){ return '<td></td>'; }).join('')}
        <td style="border-left:1px solid var(--cizgi)">${TL(topla(satirlar.map(x => x.kat)))}</td>
        <td>${TL(topla(satirlar.map(x => x.per)))}</td>
        <td class="${topla(satirlar.map(x => x.fark)) ? 'neg' : ''}">${TL(topla(satirlar.map(x => x.fark)))}</td>
        <td></td></tr></tfoot></table>
      <p class="ipucuMetin" style="padding:11px 2px 2px;max-width:92ch">
        <b>Kategori cirosu</b> Kategori Ciroları sayfasından, <b>personel girişi</b> Personel Satış
        sayfasından gelir. Fark, o ay <b>hiç kimseye yazılmamış</b> satıştır — çoğu zaman eksik
        personel girişi ya da prim tablosuna eklenmemiş bir kategoridir.
        Kademe varsayılan olarak kategori cirosuna göre belirlenir, bu yüzden fark primi düşürmez;
        yalnızca dağıtımda payı olmayan satış anlamına gelir.</p></div>`,
      null, 'sifir');
  })();

  const ayOz = primOzet(e, secAy);
  const ayToplamKart = e.primGruplari.length > 1
    ? kart('Bu Ayın Toplam Primi · ' + ayUzun(secAy),
        e.primGruplari.length + ' prim tablosunun birleşik sonucu — her kişinin bu ay alacağı toplam',
        primToplamTablosu(ayOz),
        `<span class="goz1">Genel toplam</span>
         <span class="num" style="font-size:18px;font-weight:680">${TL(ayOz.toplam)}</span>`)
    : '';

  const ok = H.urunOnKosul(e, secAy);
  const okSerit = ok.uygulandi ? `<div class="kart" style="border-color:${
      ok.carpan === 1 ? 'var(--iyi)' : 'var(--uyari)'};background:${
      ok.carpan === 1 ? 'var(--iyiZemin)' : 'var(--uyariZemin)'};padding:12px 16px;
      display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap">
      <span class="rozet ${ok.carpan === 1 ? 'iyi' : (ok.carpan ? 'uyari' : 'kotu')}"><i></i>
        Ürün hedefi ön koşulu</span>
      <span style="font-size:13px;line-height:1.55;color:${
        ok.carpan === 1 ? 'var(--iyiYazi)' : 'var(--uyariYazi)'};min-width:0">
        ${ayUzun(secAy)} · toplam kutu hedefi <b>${SAY(ok.hedef)}</b>, satılan <b>${SAY(ok.satilan)}</b>
        (${YZD0(ok.oran)}). ${ok.carpan === 1
          ? 'Ön koşul sağlandı, ciro primi tam ödeniyor.'
          : (ok.carpan === 0
            ? '<b>Ön koşul tutmadı — bu ay ciro primi ödenmiyor.</b>'
            : 'Ciro primi hak edişin <b>' + YZD0(ok.carpan) + '</b>’i kadar ödeniyor.')}
        <a href="#" data-git="urun" style="color:inherit;text-decoration:underline">Ürün Hedefi</a>
        sayfasından değiştirebilirsiniz.</span></div>` : '';

  return hedefKart(e)
    + okSerit
    + `<div class="serit">${aySecici('secPrimAy', secAy, y)}
      <button class="btn kucuk" id="btnPrimEkle">+ Prim tablosu</button>
      <button class="btn kucuk tehlike" id="btnPrimSifirla">Prim sistemini sıfırla</button></div>`
    + e.primGruplari.map(grupKart).join('')
    + ayToplamKart
    + eslesmeKart
    + ozetTablo;
}

function bgPrim(e, kok){
  const y = YIL(), aylar = yilAylari(y);
  const b = kok.querySelector('#btnPrimEkle');
  if (b) b.onclick = () => primGrupKalibi(e);
  kok.querySelectorAll('[data-git]').forEach(x =>
    x.onclick = ev => { ev.preventDefault(); sayfaGit(x.dataset.git); });
  const s = kok.querySelector('#secPrimAy');
  if (s) s.onchange = () => { D.primAySec = s.value; kaydet(true); ciz(); };
  kok.querySelectorAll('[data-prim-duzen]').forEach(x =>
    x.onclick = () => primGrupKalibi(e, e.primGruplari.find(g => g.id === x.dataset.primDuzen)));

  const grupBul = id => e.primGruplari.find(g => g.id === id);

  /* Aylık plan aç / kapa */
  kok.querySelectorAll('[data-prim-plan]').forEach(x => x.onclick = () => {
    D.primPlan = D.primPlan || {};
    D.primPlan[x.dataset.primPlan] = !D.primPlan[x.dataset.primPlan];
    kaydet(true); ciz();
  });

  /* Bir ayın kademelerini elle yaz */
  kok.querySelectorAll('[data-prim-ay]').forEach(x => x.onclick = () => {
    const [gid, ay] = x.dataset.primAy.split('|');
    primAyKalibi(e, grupBul(gid), ay);
  });

  /* Bir ayı varsayılan kurala döndür */
  kok.querySelectorAll('[data-prim-sifirla]').forEach(x => x.onclick = () => {
    const [gid, ay] = x.dataset.primSifirla.split('|');
    const g = grupBul(gid);
    delete g.ay[ay];
    kaydet(true); ciz();
    bildir(ayUzun(ay) + ' varsayılan kurala döndürüldü.');
  });

  /* Tek prim tablosunu sil */
  kok.querySelectorAll('[data-prim-sil]').forEach(x => x.onclick = () => {
    const g = grupBul(x.dataset.primSil);
    onayla('Prim tablosunu sil',
      g.ad + ' tablosu ve bu tabloya ait tüm aylık ayarlar silinecek. Personel satış verisi etkilenmez.',
      'Sil', () => {
        e.primGruplari = e.primGruplari.filter(z => z.id !== g.id);
        kaydet(true); ciz(); bildir('Prim tablosu silindi.');
      });
  });

  /* Prim sistemini tümüyle sıfırla */
  const ps = kok.querySelector('#btnPrimSifirla');
  if (ps) ps.onclick = () => onayla('Prim sistemini sıfırla',
    e.primGruplari.length + ' prim tablosu ve tüm aylık kademe ayarları silinecek. '
    + 'Personel satışları, ciro ve hedef verileri korunur — prim tablolarını sıfırdan kurabilirsiniz.',
    'Hepsini sil', () => {
      e.primGruplari = [];
      e.primAy = {};
      kaydet(true); ciz(); bildir('Prim sistemi sıfırlandı.');
    });

  /* Aylık hedef ve aylık prim günlük hedefi ızgaraları */
  izgaraBagla(kok, (t, v) => {
    const d = t.dataset;
    if (d.rol === 'hedefGun'){
      if (v == null) delete e.hedef.gunlukAy[d.ay];
      else e.hedef.gunlukAy[d.ay] = v;
      aylar.forEach((k, i) => {
        const x = H.hedefDurum(e, k);
        hy('h-a-' + i, TL(x.hedef));
        hy('h-f-' + i, TL(x.fark), x.fark == null ? 'ikincil' : (x.fark < 0 ? 'neg' : 'poz'));
        hy('h-o-' + i, YZD0(x.oran), x.oran == null ? 'ikincil' : (x.oran < 1 ? 'neg' : 'poz'));
      });
      return;
    }
    if (d.rol === 'primGun'){
      const g = grupBul(d.grup); if (!g) return;
      if (v == null){
        if (g.ay[d.ay]) delete g.ay[d.ay].gunluk;
        if (g.ay[d.ay] && !Object.keys(g.ay[d.ay]).length) delete g.ay[d.ay];
      } else {
        g.ay[d.ay] = Object.assign({}, g.ay[d.ay], { gunluk: v });
      }
      /* Eşikler ve prim değiştiği için satırların tamamı yenilenir */
      kaydet(true); setTimeout(ciz, 0);
    }
  });

  const hv = kok.querySelector('#btnHedefVars');
  if (hv) hv.onclick = () => {
    const v = sayiOku(kok.querySelector('#inpHedefVars').value);
    if (v == null || v < 0) return bildir('Geçerli bir günlük hedef girin.', true);
    const istisna = Object.keys(e.hedef.gunlukAy).filter(k => ayYil(k) === y).length;
    onayla(y + ' aylarına uygula',
      y + ' yılının 12 ayı için günlük hedef ' + TL(v) + ' olacak'
      + (istisna ? ' ve bu yıla girdiğiniz ' + istisna + ' aylık istisna silinecek' : '')
      + '. Diğer yıllar etkilenmez.',
      'Uygula', () => {
        e.hedef.yil[y] = v;
        /* Yalnızca seçili yılın aya özel istisnaları temizlenir */
        Object.keys(e.hedef.gunlukAy).forEach(k => { if (ayYil(k) === y) delete e.hedef.gunlukAy[k]; });
        kaydet(true); ciz();
        bildir(y + ' yılının tüm aylarına uygulandı.');
      });
  };
}

/**
 * Tek bir ayın kademe tablosunu elle belirler.
 * Buraya değer yazıldığı anda o ay, grubun varsayılan kuralından tamamen ayrılır.
 */
function primAyKalibi(e, grup, ay){
  const h = primHesap(e, grup, ay);
  const mevcut = primElleMi(grup, ay) ? primAyKayit(grup, ay).kademeler : h.kademeler;
  const gun = H.isGunu(e, ay);

  kalipAc(ayUzun(ay) + ' — ' + grup.ad, `
    <div class="serit" style="gap:6px">
      <span class="rozet">${gun} iş günü</span>
      <span class="rozet">Satılan ${TL(h.satilan)}</span>
      <span class="rozet ${h.mod === 'elle' ? 'uyari' : ''}">${
        h.mod === 'elle' ? 'Şu an elle' : 'Şu an ' + (PRIM_MOD_ETIKET[h.mod] || {}).ad.toLowerCase()}</span>
    </div>
    <label class="alan"><span>Bu ayın günlük satış hedefi (₺ / gün)</span>
      <input class="metinGirdi num" id="paGun" inputmode="decimal"
        value="${primGunlukOzelMi(grup, ay) ? nfSay.format(h.gunlukHedef) : ''}"
        placeholder="Boş = ${ayYil(ay)} varsayılanı (${nfSay.format(primYilHedef(grup, ayYil(ay)))})"></label>
    <p class="ipucuMetin" style="margin:-4px 0 4px">Yalnızca günlük hedefi değiştirmek istiyorsanız
      buraya yazıp kaydedin; kademeler tablonun katlarından yeniden hesaplanır.</p>

    <div class="alan"><span>Ya da bu ayın eşiklerini doğrudan yazın (₺)</span>
      <div class="tsar"><table class="t" style="font-size:12.5px">
        <thead><tr><th class="sol">#</th><th>Ciro Eşiği (₺)</th><th>Prim Oranı (%)</th></tr></thead>
        <tbody>${Array.from({length:6}, (_, i) => `<tr>
          <td class="sol ikincil">${i+1}</td>
          <td><input class="metinGirdi num paEsik" inputmode="decimal" style="text-align:right"
            value="${mevcut[i] ? nfSay.format(Math.round(mevcut[i].esik)) : ''}"></td>
          <td><input class="metinGirdi num paOran" inputmode="decimal" style="text-align:right"
            value="${mevcut[i] ? nfSay2.format(mevcut[i].oran*100) : ''}"></td></tr>`).join('')}
        </tbody></table></div></div>
    <p class="ipucuMetin">Eşik yazarsanız bu ay <b>yalnızca bu tablodan</b> hesaplanır; günlük hedef
      ve katlar o ay için devre dışı kalır. Alanları boşaltıp kaydederseniz ay
      varsayılan kurala döner.</p>
  `, [
    ...(h.ozelMi ? [{ ad:'Varsayılana döndür', calistir: () => {
      delete grup.ay[ay];
      kaydet(true); ciz(); bildir(ayUzun(ay) + ' varsayılan kurala döndü.');
    }}] : []),
    { ad:'Vazgeç' },
    { ad:'Kaydet', sinif:'ana1', calistir: k => {
      const gunluk = sayiOku(k.querySelector('#paGun').value);
      const esikler = Array.from(k.querySelectorAll('.paEsik')).map(x => sayiOku(x.value));
      const oranlar = Array.from(k.querySelectorAll('.paOran')).map(x => sayiOku(x.value));
      const kademeler = esikler.map((es, i) => ({ esik: es || 0, oran: (oranlar[i] || 0) / 100 }))
        .filter(x => x.esik > 0);
      const kayit = {};
      if (gunluk != null && gunluk > 0) kayit.gunluk = gunluk;
      if (kademeler.length) kayit.kademeler = kademeler;
      if (Object.keys(kayit).length) grup.ay[ay] = kayit;
      else delete grup.ay[ay];
      kaydet(true); ciz();
      bildir(ayUzun(ay) + (Object.keys(kayit).length ? ' için özel ayar kaydedildi.' : ' varsayılana döndü.'));
    }}
  ]);
}

function primGrupKalibi(e, g){
  const kats = H.aktifKat(e);
  const varsayilanKademe = [
    { esik:0, oran:0.01 }, { esik:0, oran:0.0125 }, { esik:0, oran:0.015 },
    { esik:0, oran:0.0175 }, { esik:0, oran:0.02 }, { esik:0, oran:0.0225 }
  ];
  const kad = (g && g.kademeler && g.kademeler.length) ? g.kademeler : varsayilanKademe;
  const car = (g && g.carpanlar) ? g.carpanlar : [];
  const tip = g ? (g.hedefTipi || 'sabit') : 'gunluk';
  kalipAc(g ? 'Prim tablosunu düzenle' : 'Yeni prim tablosu', `
    <label class="alan"><span>Tablo adı</span>
      <input class="metinGirdi" id="pgAd" value="${kacis(g ? g.ad : '')}"
        placeholder="Örn. Dermokozmetik Hedefi"></label>
    <div class="alan"><span>Hangi kategoriler sayılsın</span>
      <div style="display:grid;grid-template-columns:repeat(2,1fr);gap:5px;border:1px solid var(--cizgi);
        border-radius:var(--r2);padding:9px;max-height:170px;overflow:auto">
        ${kats.map(k => `<label style="display:flex;gap:7px;align-items:center;font-size:13px;color:var(--mrk)">
          <input type="checkbox" class="pgKat" value="${k.id}" ${g && g.katIds.includes(k.id) ? 'checked' : ''}>
          ${kacis(k.ad)}</label>`).join('')}
      </div></div>
    <label class="alan"><span>Kademe hangi tutara göre belirlensin</span>
      <select class="metinGirdi" id="pgTaban">
        <option value="kategori" ${!g || g.taban !== 'personel' ? 'selected' : ''}>Kategori cirosu — Kategori Ciroları sayfasındaki gerçek satış</option>
        <option value="personel" ${g && g.taban === 'personel' ? 'selected' : ''}>Personel girişi — yalnızca kişilere yazılmış satış</option>
      </select></label>
    <p class="ipucuMetin" style="margin:-6px 0 4px">Personel satışları kategori cirosunun tamamını
      kapsamıyorsa iki tutar farklı olur. <b>Kategori cirosu</b> seçiliyken kademe gerçek satışa göre
      belirlenir; havuz yine kişilere satış katkısı oranında dağıtılır.</p>

    <label class="alan"><span>Hedef nasıl belirlensin</span>
      <select class="metinGirdi" id="pgTip">
        <option value="gunluk" ${tip === 'gunluk' ? 'selected' : ''}>Günlük satış hedefi — iş gününe göre aylığa çevrilir</option>
        <option value="sabit"  ${tip === 'sabit'  ? 'selected' : ''}>Sabit aylık ciro eşiği (₺)</option>
      </select></label>

    <div id="pgGunlukAlan" ${tip === 'gunluk' ? '' : 'hidden'}>
      <label class="alan" style="margin-bottom:11px"><span>${YIL()} günlük satış hedefi (₺ / gün)</span>
        <input class="metinGirdi num" id="pgGunluk" inputmode="decimal"
          value="${g && primYilHedefiVar(g, YIL()) ? nfSay.format(primYilHedef(g, YIL())) : ''}"
          placeholder="Örn. 35.000"></label>
      <p class="ipucuMetin" style="margin:-6px 0 10px">Bu hedef yalnızca <b>${YIL()}</b> yılı içindir.
        Başka bir yıl için üstteki yıl seçicisini değiştirip bu pencereyi yeniden açın.</p>
      <div class="alan"><span>Kademeler — günlük hedefin katı ve o kattaki prim oranı</span>
        <div class="tsar"><table class="t" style="font-size:12.5px">
          <thead><tr><th class="sol">#</th><th>Hedefin Katı</th><th>Prim Oranı (%)</th><th class="sol">Örnek (26 iş günü)</th></tr></thead>
          <tbody>${Array.from({length:6}, (_, i) => `<tr>
            <td class="sol ikincil">${i+1}</td>
            <td><input class="metinGirdi num pgCarpan" inputmode="decimal" style="text-align:right"
              value="${car[i] ? nfSay2.format(car[i].carpan) : (i < 4 ? nfSay2.format(1 + i*0.1) : '')}"></td>
            <td><input class="metinGirdi num pgCOran" inputmode="decimal" style="text-align:right"
              value="${car[i] ? nfSay2.format((car[i].oran || 0)*100) : (i < 4 ? nfSay2.format(1 + i*0.25) : '')}"></td>
            <td class="sol ikincil mono pgOrnek">—</td></tr>`).join('')}
          </tbody></table></div></div>
      <p class="ipucuMetin" style="margin-top:9px">1,00 katı = hedefi tutturmak. 1,10 = hedefi %10 aşmak.
        Aylık eşik her ay o ayın iş günü sayısıyla yeniden hesaplanır, ayrıca uğraşmanız gerekmez.
        Bir aya özel hedef vermek isterseniz kaydettikten sonra o ayın hücresinden değiştirebilirsiniz.</p>
    </div>

    <div id="pgSabitAlan" ${tip === 'sabit' ? '' : 'hidden'}>
      <div class="alan"><span>Kademeler — eşiğe ulaşıldığında o oran uygulanır</span>
        <div class="tsar"><table class="t" style="font-size:12.5px">
          <thead><tr><th class="sol">#</th><th>Ciro Eşiği (₺)</th><th>Prim Oranı (%)</th></tr></thead>
          <tbody>${Array.from({length:6}, (_, i) => `<tr>
            <td class="sol ikincil">${i+1}</td>
            <td><input class="metinGirdi num pgEsik" inputmode="decimal" style="text-align:right"
              value="${kad[i] ? (kad[i].esik || '') : ''}"></td>
            <td><input class="metinGirdi num pgOran" inputmode="decimal" style="text-align:right"
              value="${kad[i] ? nfSay2.format((kad[i].oran || 0)*100) : ''}"></td></tr>`).join('')}
          </tbody></table></div></div>
    </div>

    <p class="ipucuMetin">Prim, o ay tablodaki kategorilerde yapılan <b>toplam</b> satışa göre bir orana kilitlenir.
      Oluşan havuz, her personele kendi satış katkısı oranında dağıtılır.</p>
  `, [
    ...(g ? [{ ad:'Sil', sinif:'tehlike', calistir: () => {
      onayla('Prim tablosunu sil', g.ad + ' tablosu silinecek.', 'Sil', () => {
        e.primGruplari = e.primGruplari.filter(x => x.id !== g.id);
        kaydet(true); ciz(); bildir('Tablo silindi.');
      });
      return false;
    }}] : []),
    { ad:'Vazgeç' },
    { ad:'Kaydet', sinif:'ana1', calistir: k => {
      const ad = k.querySelector('#pgAd').value.trim();
      if (!ad){ bildir('Tablo adı gerekli.', true); return false; }
      const katIds = Array.from(k.querySelectorAll('.pgKat')).filter(x => x.checked).map(x => x.value);
      if (!katIds.length){ bildir('En az bir kategori seçin.', true); return false; }
      const yeniTip = k.querySelector('#pgTip').value;

      const esikler = Array.from(k.querySelectorAll('.pgEsik')).map(x => sayiOku(x.value));
      const oranlar = Array.from(k.querySelectorAll('.pgOran')).map(x => sayiOku(x.value));
      const kademeler = esikler.map((es, i) => ({ esik: es || 0, oran: (oranlar[i] || 0) / 100 }))
        .filter(x => x.esik > 0);

      const carpanlarHam = Array.from(k.querySelectorAll('.pgCarpan')).map(x => sayiOku(x.value));
      const cOranlar = Array.from(k.querySelectorAll('.pgCOran')).map(x => sayiOku(x.value));
      const carpanlar = carpanlarHam.map((c, i) => ({ carpan: c || 0, oran: (cOranlar[i] || 0) / 100 }))
        .filter(x => x.carpan > 0);
      const gunluk = sayiOku(k.querySelector('#pgGunluk').value) || 0;

      if (yeniTip === 'gunluk'){
        if (!gunluk){ bildir('Günlük satış hedefini girin.', true); return false; }
        if (!carpanlar.length){ bildir('En az bir kademe katı girin.', true); return false; }
      } else if (!kademeler.length){
        bildir('En az bir kademe eşiği girin.', true); return false;
      }

      const v = { ad, katIds, hedefTipi:yeniTip, kademeler, carpanlar,
                  taban: k.querySelector('#pgTaban').value === 'personel' ? 'personel' : 'kategori' };
      if (g){
        Object.assign(g, v);              // g.ay (aylık istisnalar) korunur
        g.yilHedef[YIL()] = gunluk;       // günlük hedef yalnızca seçili yıla yazılır
      } else {
        e.primGruplari.push({ id:yeniId(), ay:{}, gunlukHedef:0,
          yilHedef:{ [YIL()]: gunluk }, ...v });
      }
      kaydet(true); ciz(); bildir('Prim tablosu kaydedildi.');
    }}
  ]);

  /* Mod değiştirme ve canlı örnek hesap */
  const kk = $('#kalip');
  const tazeleOrnek = () => {
    const gun = sayiOku(kk.querySelector('#pgGunluk').value) || 0;
    kk.querySelectorAll('.pgCarpan').forEach((inp, i) => {
      const c = sayiOku(inp.value);
      const h = kk.querySelectorAll('.pgOrnek')[i];
      h.textContent = (gun && c) ? TL(gun * 26 * c) : '—';
    });
  };
  kk.querySelector('#pgTip').onchange = ev => {
    kk.querySelector('#pgGunlukAlan').hidden = ev.target.value !== 'gunluk';
    kk.querySelector('#pgSabitAlan').hidden  = ev.target.value !== 'sabit';
  };
  kk.querySelector('#pgGunluk').oninput = tazeleOrnek;
  kk.querySelectorAll('.pgCarpan').forEach(i => i.oninput = tazeleOrnek);
  tazeleOrnek();
}

/* ---------------------------------------------------------
   6.10b ÜRÜN HEDEFİ — kutu bazlı, prim isteğe bağlı
   --------------------------------------------------------- */
const URUN_PRIM_ETIKET = { yok:'Takip', sabit:'Kutu başı', kademe:'Kademeli' };

function sfUrun(e){
  const y = YIL(), aylar = yilAylari(y);
  const secAy = (D.urunAy && ayYil(D.urunAy) === y) ? D.urunAy : (sonGercekAy(e, y) || aylar[0]);

  if (!H.aktifUrun(e).length)
    return kart('Ürün Hedefi', 'Henüz hedefli ürün yok',
      `<div class="bos" style="max-width:66ch;margin:0 auto">
        Ciro hedeflerinden ayrı olarak tek tek ürünlere <b>adet (kutu) hedefi</b> koyabilirsiniz.
        Önce ayı seçer, sonra o aya hedefleyeceğiniz ürünleri eklersiniz — her ay farklı
        ürünlerle çalışabilirsiniz.<br><br>
        <b>Prim isteğe bağlıdır:</b> kutu başı tutar tanımlarsanız hak ediş hesaplanır,
        tanımlamazsanız ürün yalnızca takibe alınır ve personel performansını ölçersiniz.<br><br>
        <div class="serit" style="justify-content:center">${aySecici('secUrunAy', secAy, y)}
        <button class="btn ana1" id="btnAyUrun">Bu aya ürün ekle</button></div>
      </div>`);

  const oz = H.urunOzet(e, secAy);
  const pers = oz.pers;

  const kpiler = `<div class="satir s${oz.primliMi ? 4 : 3}">
    ${kpi('Takipteki Ürün', SAY(oz.urunler.length), {
      not: oz.hedefli.length + ' tanesine ' + ayEtiket(secAy) + ' hedefi verilmiş' })}
    ${kpi('Hedef · ' + ayEtiket(secAy), SAY(oz.hedefT) + ' kutu', {
      not: oz.hedefli.length ? oz.hedefli.length + ' ürünün bu ayki hedefi' : 'Bu aya hedef verilmemiş' })}
    ${kpi('Satılan', SAY(oz.satilanT) + ' kutu', {
      renkli:true, ham: oz.hedefliSatilan - oz.hedefT,
      not: oz.hedefT
        ? 'Hedefli ürünlerde ' + SAY(oz.hedefliSatilan) + ' → gerçekleşme ' + YZD0(oz.hedefliSatilan / oz.hedefT)
        : 'Bu aya hedef verilmemiş' })}
    ${oz.primliMi ? kpi('Kutu Primi', TL(oz.primT), { not:'Bu ayın toplam hak edişi' }) : ''}
  </div>`;

  /* --- Giriş ızgarası: ürün × personel --- */
  const izgara = !oz.urunler.length ? `<div class="bos" style="max-width:60ch;margin:0 auto">
      <b>${ayUzun(secAy)}</b> için henüz hedefli ürün yok.<br>
      Bu aya hangi ürünleri hedefleyeceğinizi seçin — her ay farklı ürünlerle çalışabilirsiniz.<br><br>
      <button class="btn ana1" id="btnAyUrun2">Bu aya ürün ekle</button></div>`
    : `<div class="tsar"><table class="t">
    <thead><tr>
      <th class="kilit sol">Ürün</th><th class="sol">Marka</th><th>Hedef</th>
      ${pers.map(p => `<th>${kacis(p.ad)}</th>`).join('')}
      <th style="border-left:1px solid var(--cizgi)">Satılan</th><th>Gerçekleşme</th>
      ${oz.primliMi ? '<th class="sol">Prim Kuralı</th><th>Prim</th>' : ''}
      <th></th></tr></thead>
    <tbody>${oz.urunler.map((x, i) => `<tr>
      <td class="kilit">${kacis(x.u.ad)}${x.hedef ? '' :
        ' <span class="rozet uyari" style="font-size:9px"><i></i>hedefsiz</span>'}
        <div class="goz1" style="font-size:9px;opacity:.75">${
          H.urunHedefliAylar(x.u, y).length} ay hedefli · ${y}</div></td>
      <td class="sol ikincil">${kacis(x.u.marka || '—')}</td>
      <td>${hucre(x.hedef, { rol:'urunHedef', ay:secAy, urun:x.u.id },
        { etiket: x.u.ad + ' hedef', yer:'—' })}</td>
      ${pers.map(p => `<td>${hucre(H.urunAdet(e, secAy, x.u.id, p.id),
        { rol:'urunAdet', ay:secAy, urun:x.u.id, pers:p.id },
        { etiket: x.u.ad + ' · ' + p.ad })}</td>`).join('')}
      <td class="vurgu" style="border-left:1px solid var(--cizgi)">${hc('u-s-' + i, x.satilan, SAY)}</td>
      <td class="${x.oran == null ? 'ikincil' : (x.oran >= 1 ? 'poz' : 'neg')}">
        ${hc('u-o-' + i, x.oran, YZD0)}
        ${x.oran == null ? '' : `<span class="olcu"><i style="width:${kis(x.oran*100,0,100).toFixed(1)}%;
          background:${x.oran >= 1 ? 'var(--iyi)' : 'var(--uyari)'}"></i></span>`}</td>
      ${oz.primliMi ? `<td class="sol ikincil mono" style="font-size:10.5px">${urunKuralMetni(x.u)}</td>
        <td class="vurgu">${hc('u-p-' + i, x.prim)}${urunCarpanEtiket(x)}</td>` : ''}
      <td class="sol"><div class="serit">
        <button class="btn kucuk" data-urun-duzen="${x.u.id}">Düzenle</button>
        <button class="btn kucuk tehlike" data-urun-cikar="${x.u.id}"
          title="Yalnızca ${ayUzun(secAy)} listesinden çıkarır">Bu aydan çıkar</button>
      </div></td>
    </tr>`).join('')}</tbody>
    <tfoot><tr><td class="kilit">Toplam</td><td></td>
      <td>${hc('u-ht', oz.hedefT, SAY)}</td>
      ${pers.map((p, j) => `<td>${hc('u-k-' + j,
        topla(oz.urunler.map(x => H.urunAdet(e, secAy, x.u.id, p.id))), SAY)}</td>`).join('')}
      <td style="border-left:1px solid var(--cizgi)">${hc('u-st', oz.satilanT, SAY)}</td>
      <td>${hc('u-ot', oz.hedefT ? oz.satilanT/oz.hedefT : null, YZD0)}</td>
      ${oz.primliMi ? '<td></td><td>' + hc('u-pt', oz.primT) + '</td>' : ''}
      <td></td></tr></tfoot></table></div>`;

  const kisilan = oz.urunler.filter(x => x.u.primTipi !== 'yok' && x.carpan < 1);
  const kisikSerit = kisilan.length ? `<div class="serit" style="padding:11px 16px;
      border-bottom:1px solid var(--cizgi2);background:var(--uyariZemin)">
      <span class="rozet uyari"><i></i>Hedef kuralı işledi</span>
      <span class="ipucuMetin" style="color:var(--uyariYazi)">${kisilan.map(x =>
        kacis(x.u.ad) + ' ' + (x.carpan === 0 ? '— hedef altı, prim yok'
          : '— gerçekleşme ' + YZD0(x.oran) + ', hak edişin ' + YZD0(x.carpan) + '’i ödeniyor')
      ).join(' · ')}</span></div>` : '';

  const girisKart = kart(ayUzun(secAy) + ' Hedefleri',
    oz.urunler.length
      ? oz.urunler.length + ' ürün · her personelin sattığı kutu adedini yazın'
      : 'Bu aya hedefli ürün eklenmemiş',
    kisikSerit + izgara,
    `${aySecici('secUrunAy', secAy, y)}
     <button class="btn kucuk ana1" id="btnAyUrun">+ Bu aya ürün ekle</button>`, 'sifir');

  /* --- Personel özeti --- */
  const persKart = kart(oz.primliMi ? 'Personel Kutu Primi · ' + ayUzun(secAy)
                                     : 'Personel Performansı · ' + ayUzun(secAy),
    oz.primliMi ? 'Hedefli ürünlerde kişi başına satış ve hak ediş'
                : 'Hedefli ürünlerde kişi başına satış — prim tanımlı değil',
    oz.kisi.some(x => x.adet > 0) ? `<div class="tsar"><table class="t"><thead><tr>
        <th class="kilit sol">Personel</th>
        ${oz.urunler.map(x => `<th>${kacis(x.u.ad)}</th>`).join('')}
        <th style="border-left:1px solid var(--cizgi)">Toplam Kutu</th><th>Pay</th>
        ${oz.primliMi ? '<th>Hak Ediş</th>' : ''}</tr></thead>
      <tbody>${oz.kisi.filter(x => x.adet > 0).sort((a, b) => b.adet - a.adet).map(x => `<tr>
        <td class="kilit">${kacis(x.p.ad)}${x.p.aktif === false ? ' <span class="rozet">pasif</span>' : ''}</td>
        ${oz.urunler.map(u => {
          const a = H.urunAdet(e, secAy, u.u.id, x.p.id);
          return `<td class="${a ? '' : 'ikincil'}">${a ? SAY(a) : '—'}</td>`;
        }).join('')}
        <td class="vurgu" style="border-left:1px solid var(--cizgi)">${SAY(x.adet)}</td>
        <td class="ikincil">${YZD(oz.satilanT ? x.adet/oz.satilanT : null)}
          <span class="olcu"><i style="width:${(oz.satilanT ? x.adet/oz.satilanT*100 : 0).toFixed(1)}%"></i></span></td>
        ${oz.primliMi ? `<td class="vurgu">${x.prim ? TL(x.prim) : '<span class="ikincil">—</span>'}</td>` : ''}
      </tr>`).join('')}</tbody>
      <tfoot><tr><td class="kilit">Toplam</td>
        ${oz.urunler.map(x => `<td>${SAY(x.satilan)}</td>`).join('')}
        <td style="border-left:1px solid var(--cizgi)">${SAY(oz.satilanT)}</td><td>%100,0</td>
        ${oz.primliMi ? '<td>' + TL(oz.primT) + '</td>' : ''}</tr></tfoot></table></div>`
      : `<div class="bos">Bu ay için satış girilmemiş.</div>`,
    null, 'sifir');

  /* --- Yıllık takip --- */
  const yilSatir = aylar.map(a => H.urunOzet(e, a));
  const yilKart = kart('Yıllık Takip · ' + y, 'Ay ay hedef, satış ve varsa prim',
    `<div class="tsar"><table class="t"><thead><tr>
      <th class="kilit sol">Ay</th><th>Hedef</th><th>Satılan</th><th>Fark</th><th>Gerçekleşme</th>
      ${oz.primliMi ? '<th>Kutu Primi</th>' : ''}<th class="sol">Durum</th></tr></thead>
    <tbody>${yilSatir.map((x, i) => {
      const oran = x.hedefT ? x.satilanT/x.hedefT : null;
      return `<tr${aylar[i] === secAy ? ' class="ara"' : ''}>
        <td class="kilit">${ayUzun(aylar[i])}</td>
        <td>${SAY(x.hedefT)}</td><td class="vurgu">${SAY(x.satilanT)}</td>
        <td class="${x.satilanT - x.hedefT < 0 ? 'neg' : 'poz'}">${x.hedefT ? SAY(x.satilanT - x.hedefT) : '—'}</td>
        <td class="${oran == null ? 'ikincil' : (oran >= 1 ? 'poz' : 'neg')}">${YZD0(oran)}</td>
        ${oz.primliMi ? `<td>${x.primT ? TL(x.primT) : '<span class="ikincil">—</span>'}</td>` : ''}
        <td class="sol">${!x.hedefT ? '<span class="rozet">hedef yok</span>'
          : oran >= 1 ? '<span class="rozet iyi"><i></i>Tuttu</span>'
          : oran >= 0.9 ? '<span class="rozet uyari"><i></i>Yakın</span>'
          : '<span class="rozet kotu"><i></i>Altında</span>'}</td></tr>`;
    }).join('')}</tbody>
    <tfoot><tr><td class="kilit">Yıl</td>
      <td>${SAY(topla(yilSatir.map(x => x.hedefT)))}</td>
      <td>${SAY(topla(yilSatir.map(x => x.satilanT)))}</td>
      <td colspan="2"></td>
      ${oz.primliMi ? '<td>' + TL(topla(yilSatir.map(x => x.primT))) + '</td>' : ''}
      <td></td></tr></tfoot></table></div>`, null, 'sifir');

  /* --- Ürün kataloğu: hangi ürün hangi aylarda hedefli --- */
  const katalog = kart('Ürün Kataloğu',
    e.urunler.length + ' ürün · bir ürünü birden çok aya hedefleyebilirsiniz',
    e.urunler.length ? `<div class="tsar"><table class="t"><thead><tr>
        <th class="kilit sol">Ürün</th><th class="sol">Marka</th><th class="sol">Prim Kuralı</th>
        <th class="sol">${y} hedefli aylar</th><th>Toplam Hedef</th><th>Satılan</th><th></th></tr></thead>
      <tbody>${e.urunler.map(u => {
        const ah = H.urunHedefliAylar(u, y);
        const tHedef = topla(ah.map(k => H.urunHedef(e, u, k)));
        const tSat = topla(yilAylari(y).map(k => H.urunToplam(e, k, u.id)));
        return `<tr${u.aktif === false ? ' style="opacity:.6"' : ''}>
          <td class="kilit">${kacis(u.ad)}${u.aktif === false ? ' <span class="rozet">pasif</span>' : ''}</td>
          <td class="sol ikincil">${kacis(u.marka || '—')}</td>
          <td class="sol ikincil mono" style="font-size:10.5px">${urunKuralMetni(u)}</td>
          <td class="sol">${ah.length
            ? `<span class="serit" style="gap:4px">${ah.map(k =>
                `<span class="rozet" style="font-size:9px">${AY_KISA[ayIdx(k)]}</span>`).join('')}</span>`
            : '<span class="ikincil">hedef yok</span>'}</td>
          <td>${SAY(tHedef)}</td><td class="ikincil">${SAY(tSat)}</td>
          <td class="sol"><button class="btn kucuk" data-urun-duzen="${u.id}">Düzenle</button></td>
        </tr>`;
      }).join('')}</tbody></table>
      <p class="ipucuMetin" style="padding:10px 2px 2px;max-width:86ch">
        Ürün adı ve prim kuralı katalogda bir kez tanımlanır; her ay hangi ürünleri
        hedefleyeceğinizi <b>${ayUzun(secAy)} Hedefleri</b> kartından seçersiniz.
        Bir ürün yalnızca hedef verdiğiniz aylarda o ayın listesinde görünür.</p></div>`
      : `<div class="bos">Katalog boş.</div>`,
    `<button class="btn kucuk" id="btnUrunEkle">+ Katalog ürünü</button>`, 'sifir');

  return kpiler + onKosulKart(e, secAy) + girisKart + persKart + yilKart + katalog;
}

/**
 * Bir aya ürün ekler: katalogdan seçilir ya da yenisi tanımlanır,
 * ardından o ayın (ve isteğe bağlı diğer ayların) hedefi yazılır.
 */
function aylikUrunKalibi(e, ay){
  const y = ayYil(ay);
  const uygun = H.aktifUrun(e).filter(u => H.urunHedef(e, u, ay) <= 0);
  kalipAc(ayUzun(ay) + ' — ürün ekle', `
    ${uygun.length ? `<label class="alan"><span>Katalogdan seç</span>
      <select class="metinGirdi" id="ayUrun">
        <option value="">— yeni ürün tanımla —</option>
        ${uygun.map(u => `<option value="${u.id}">${kacis(u.ad)}${
          u.marka ? ' · ' + kacis(u.marka) : ''}</option>`).join('')}
      </select></label>` : `<input type="hidden" id="ayUrun" value="">
      <p class="ipucuMetin">Katalogda bu aya eklenebilecek başka ürün yok — yenisini tanımlayın.</p>`}

    <div id="ayYeniAlan">
      <div class="satir s2">
        <label class="alan"><span>Ürün adı</span>
          <input class="metinGirdi" id="ayAd" placeholder="Örn. D Vitamini 50.000 IU"></label>
        <label class="alan"><span>Marka (isteğe bağlı)</span>
          <input class="metinGirdi" id="ayMarka" placeholder="Örn. Solgar"></label>
      </div>
      <p class="ipucuMetin" style="margin:-6px 0 4px">Prim kuralını kaydettikten sonra
        <b>Düzenle</b>’den tanımlayabilirsiniz; varsayılan olarak yalnızca takip edilir.</p>
    </div>

    <label class="alan"><span>${ayUzun(ay)} kutu hedefi</span>
      <input class="metinGirdi num" id="ayHedef" inputmode="numeric" placeholder="Örn. 120"></label>

    <div class="alan"><span>Aynı hedefi başka aylara da uygula</span>
      <div style="display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:5px">
        ${yilAylari(y).map((k, i) => `<label style="display:flex;align-items:center;gap:5px;
            font-size:12px;color:var(--mrk2)">
          <input type="checkbox" class="aySec" value="${k}" ${k === ay ? 'checked disabled' : ''}>
          ${AY_KISA[i]}</label>`).join('')}
      </div>
      <p class="ipucuMetin" style="margin-top:6px">${ayUzun(ay)} zaten seçili.
        İşaretlediğiniz aylara aynı hedef yazılır; sonradan tek tek değiştirebilirsiniz.</p>
    </div>
  `, [
    { ad:'Vazgeç' },
    { ad:'Ekle', sinif:'ana1', calistir: k => {
      const hedef = sayiOku(k.querySelector('#ayHedef').value);
      if (!hedef || hedef <= 0){ bildir('Kutu hedefi girin.', true); return false; }
      const secili = k.querySelector('#ayUrun').value;
      let u = secili ? e.urunler.find(x => x.id === secili) : null;
      if (!u){
        const ad = k.querySelector('#ayAd').value.trim();
        if (!ad){ bildir('Ürün adı gerekli.', true); return false; }
        u = { id: yeniId(), ad, marka: k.querySelector('#ayMarka').value.trim(),
              aktif: true, hedef: 0, hedefAy: {}, primTipi: 'yok', kutuPrim: 0,
              kademeler: [], hedefKurali: 'yok', altSinir: 0.9 };
        e.urunler.push(u);
      }
      const aylar = [ay].concat(Array.from(k.querySelectorAll('.aySec'))
        .filter(x => x.checked && !x.disabled).map(x => x.value));
      [...new Set(aylar)].forEach(a => u.hedefAy[a] = hedef);
      kaydet(true); ciz();
      bildir(u.ad + ' eklendi — ' + aylar.length + ' aya hedef yazıldı.');
    }}
  ]);

  const kk = $('#kalip');
  const sec = kk.querySelector('#ayUrun');
  if (sec && sec.tagName === 'SELECT') sec.onchange = () => {
    kk.querySelector('#ayYeniAlan').hidden = !!sec.value;
  };
}

/** Ürün hedeflerinin toplamını ciro primine ön koşul yapan ayar kartı */
function onKosulKart(e, ay){
  const ok = H.urunOnKosul(e, ay);
  const kapsamAd = ok.kapsam === 'tumu' ? 'tüm hedefli ürünler' : 'kutu primi olmayan ürünler';

  const durum = !ok.aktif
    ? `<div class="bos" style="text-align:left;padding:4px 0">
        Kapalı — ürün hedefleri ciro primini etkilemiyor.</div>`
    : (!ok.hedef
      ? `<div class="serit"><span class="rozet uyari"><i></i>Hedef yok</span>
          <span class="ipucuMetin">${ayUzun(ay)} için ${kapsamAd} arasında hedef girilmemiş;
          ön koşul bu ay işlemiyor.</span></div>`
      : `<div class="satir s3" style="margin-bottom:12px">
          ${kpi('Toplam Kutu Hedefi', SAY(ok.hedef) + ' kutu', {
            not: ok.urunler.length + ' ürünün hedefi toplandı' })}
          ${kpi('Satılan', SAY(ok.satilan) + ' kutu', {
            renkli:true, ham: ok.satilan - ok.hedef,
            not: 'Gerçekleşme ' + YZD0(ok.oran) })}
          ${kpi('Ciro Primine Etkisi', ok.carpan === 1 ? 'Tam ödeme' : YZD0(ok.carpan), {
            not: ok.carpan === 1 ? 'Ön koşul sağlandı'
               : (ok.carpan === 0 ? 'Ön koşul tutmadı — ciro primi ödenmiyor'
                                  : 'Ciro primi bu oranda ödenecek') })}
        </div>
        <div class="tsar"><table class="t"><thead><tr>
          <th class="kilit sol">Sayılan Ürün</th><th>Hedef</th><th>Satılan</th><th>Fark</th></tr></thead>
        <tbody>${ok.urunler.map(x => `<tr>
          <td class="kilit">${kacis(x.u.ad)}${x.u.marka ? ' <span class="ikincil">· ' + kacis(x.u.marka) + '</span>' : ''}</td>
          <td>${SAY(x.hedef)}</td><td>${SAY(x.satilan)}</td>
          <td class="${x.satilan - x.hedef < 0 ? 'neg' : 'poz'}">${SAY(x.satilan - x.hedef)}</td></tr>`).join('')}
        </tbody><tfoot><tr><td class="kilit">Toplam</td>
          <td>${SAY(ok.hedef)}</td><td>${SAY(ok.satilan)}</td>
          <td class="${ok.satilan - ok.hedef < 0 ? 'neg' : 'poz'}">${SAY(ok.satilan - ok.hedef)}</td>
        </tr></tfoot></table></div>
        <p class="ipucuMetin" style="margin-top:10px;max-width:88ch">
          Tek tek ürünlerin tutup tutmaması önemli değildir — <b>toplam kutu hedefi</b> baz alınır.
          Bir üründe %90'da kalıp diğerinde %110 yapmak toplamda dengelenir.</p>`);

  return kart('Ciro Primi Ön Koşulu',
    'Ürün hedeflerinin toplamı, Hedef &amp; Prim sayfasındaki ciro priminin ödenme şartı olabilir',
    `<div class="satir s3" style="margin-bottom:14px">
      <label class="alan"><span>Ön koşul</span>
        <select class="metinGirdi" id="okAktif">
          <option value="0" ${ok.aktif ? '' : 'selected'}>Kapalı — ciro primi ürün hedefinden bağımsız</option>
          <option value="1" ${ok.aktif ? 'selected' : ''}>Açık — ciro primi ürün hedefine bağlı</option>
        </select></label>
      <label class="alan"><span>Kural</span>
        <select class="metinGirdi" id="okKural">
          <option value="kesin"    ${ok.kural === 'kesin'    ? 'selected' : ''}>Kesin — toplam hedef tutmazsa ciro primi ödenmez</option>
          <option value="kademeli" ${ok.kural === 'kademeli' ? 'selected' : ''}>Kademeli — alt sınır altında yok, arada orantılı</option>
        </select></label>
      <label class="alan"><span>Hangi ürünler sayılsın</span>
        <select class="metinGirdi" id="okKapsam">
          <option value="primsiz" ${ok.kapsam === 'primsiz' ? 'selected' : ''}>Kutu primi olmayanlar (önerilen)</option>
          <option value="tumu"    ${ok.kapsam === 'tumu'    ? 'selected' : ''}>Tüm hedefli ürünler</option>
        </select></label>
    </div>
    <div class="satir s3" style="margin-bottom:14px">
      <label class="alan" id="okAltAlan" ${ok.kural === 'kademeli' ? '' : 'hidden'}>
        <span>Alt sınır (%)</span>
        <input class="metinGirdi num" id="okAlt" inputmode="decimal"
          value="${nfSay.format(ok.altSinir * 100)}"></label>
    </div>
    ${durum}`,
    `<button class="btn kucuk ana1" id="btnOkKaydet">Kaydet</button>`);
}

/** Ürünün prim kuralının kısa metni */
function urunKuralMetni(u){
  let t;
  if (u.primTipi === 'sabit') t = TL(u.kutuPrim) + '/kutu';
  else if (u.primTipi === 'kademe'){
    const k = [...(u.kademeler || [])].filter(x => +x.adet > 0).sort((a, b) => a.adet - b.adet);
    t = k.length ? k.map(x => SAY(x.adet) + '+ → ' + TL(x.tutar)).join(' · ') : 'kademe yok';
  } else return 'prim yok';
  const kural = u.hedefKurali || 'yok';
  if (kural === 'kesin') t += ' · hedef şartlı';
  else if (kural === 'kademeli')
    t += ' · ' + YZD0(u.altSinir == null ? 0.9 : u.altSinir) + ' altı ödenmez';
  return t;
}

/** Hedef kuralının o ayki etkisi — tabloda prim altında görünür */
function urunCarpanEtiket(x){
  if (x.u.primTipi === 'yok' || x.carpan === 1) return '';
  if (x.carpan === 0)
    return `<div class="goz1" style="font-size:9px;color:var(--kotuYazi)">hedef altı — ödenmiyor</div>`;
  return `<div class="goz1" style="font-size:9px;color:var(--uyariYazi)"
    title="Hak ediş ${TL(x.hamPrim)} · gerçekleşme ${YZD0(x.carpan)}">×${YZD0(x.carpan)} orantılı</div>`;
}

function bgUrun(e, kok){
  const y = YIL(), aylar = yilAylari(y);
  const secAy = (D.urunAy && ayYil(D.urunAy) === y) ? D.urunAy : (sonGercekAy(e, y) || aylar[0]);

  kok.querySelectorAll('#btnUrunEkle').forEach(b => b.onclick = () => urunKalibi(e));
  kok.querySelectorAll('#btnAyUrun, #btnAyUrun2').forEach(b =>
    b.onclick = () => aylikUrunKalibi(e, secAy));

  kok.querySelectorAll('[data-urun-cikar]').forEach(b => b.onclick = () => {
    const u = e.urunler.find(x => x.id === b.dataset.urunCikar);
    const satis = H.urunToplam(e, secAy, u.id);
    onayla(ayUzun(secAy) + ' listesinden çıkar',
      u.ad + ' bu ayın hedef listesinden çıkarılacak. Diğer aylardaki hedefleri ve katalogdaki '
      + 'kaydı korunur.' + (satis ? ' Bu aya girilmiş ' + SAY(satis) + ' kutuluk satış da silinecek.' : ''),
      'Çıkar', () => {
        delete u.hedefAy[secAy];
        if (e.urunSatis[secAy]) delete e.urunSatis[secAy][u.id];
        kaydet(true); ciz(); bildir(u.ad + ' ' + ayUzun(secAy) + ' listesinden çıkarıldı.');
      });
  });
  kok.querySelectorAll('[data-urun-duzen]').forEach(b =>
    b.onclick = () => urunKalibi(e, e.urunler.find(u => u.id === b.dataset.urunDuzen)));
  const a = kok.querySelector('#secUrunAy');
  if (a) a.onchange = () => { D.urunAy = a.value; kaydet(true); ciz(); };

  const okK = kok.querySelector('#okKural');
  if (okK) okK.onchange = () => { kok.querySelector('#okAltAlan').hidden = okK.value !== 'kademeli'; };
  const okB = kok.querySelector('#btnOkKaydet');
  if (okB) okB.onclick = () => {
    e.urunOnKosul = {
      aktif: kok.querySelector('#okAktif').value === '1',
      kural: kok.querySelector('#okKural').value,
      kapsam: kok.querySelector('#okKapsam').value,
      altSinir: kis((sayiOku(kok.querySelector('#okAlt').value) || 90) / 100, 0, 1)
    };
    kaydet(true); ciz();
    bildir(e.urunOnKosul.aktif ? 'Ön koşul açıldı — ciro primi ürün hedefine bağlandı.'
                               : 'Ön koşul kapatıldı.');
  };

  izgaraBagla(kok, (t, v) => {
    const d = t.dataset;
    if (d.rol === 'urunHedef'){
      const u = e.urunler.find(x => x.id === d.urun); if (!u) return;
      if (v == null) delete u.hedefAy[d.ay]; else u.hedefAy[d.ay] = v;
    } else if (d.rol === 'urunAdet'){
      if (!e.urunSatis[d.ay]) e.urunSatis[d.ay] = {};
      if (!e.urunSatis[d.ay][d.urun]) e.urunSatis[d.ay][d.urun] = {};
      if (!v) delete e.urunSatis[d.ay][d.urun][d.pers];
      else e.urunSatis[d.ay][d.urun][d.pers] = v;
    } else return;
    /* Hedef ve prim satırları değiştiği için sayfa yeniden çizilir */
    kaydet(true); setTimeout(ciz, 0);
  });
}

function urunKalibi(e, u){
  const markalar = [...new Set(e.urunler.map(x => x.marka).filter(Boolean))];
  const tip = u ? u.primTipi : 'yok';
  const kural = u ? (u.hedefKurali || 'yok') : 'kademeli';
  const kad = (u && u.kademeler.length) ? u.kademeler : [{adet:'',tutar:''}];
  kalipAc(u ? 'Ürünü düzenle' : 'Yeni hedefli ürün', `
    <div class="satir s2">
      <label class="alan"><span>Ürün adı</span>
        <input class="metinGirdi" id="urAd" value="${kacis(u ? u.ad : '')}"
          placeholder="Örn. D Vitamini 50.000 IU"></label>
      <label class="alan"><span>Marka (isteğe bağlı)</span>
        <input class="metinGirdi" id="urMarka" list="markaListe" value="${kacis(u ? (u.marka || '') : '')}"
          placeholder="Örn. Solgar">
        <datalist id="markaListe">${markalar.map(m => `<option value="${kacis(m)}">`).join('')}</datalist></label>
    </div>
    <div class="alan"><span>${YIL()} kutu hedefi — yalnızca hedef vereceğiniz ayları doldurun</span>
      <div style="display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px">
        ${yilAylari(YIL()).map((k, i) => `<label style="display:flex;flex-direction:column;gap:3px">
          <span class="goz1" style="font-size:9px">${AY_KISA[i]}</span>
          <input class="metinGirdi num urAy" data-ay="${k}" inputmode="numeric"
            style="padding:6px 7px;text-align:right"
            value="${u && u.hedefAy && u.hedefAy[k] ? nfSay.format(u.hedefAy[k]) : ''}"></label>`).join('')}
      </div>
      <div class="serit" style="margin-top:9px">
        <input class="metinGirdi num" id="urHepsiAdet" inputmode="numeric" placeholder="adet"
          style="width:90px">
        <button type="button" class="btn kucuk" id="urHepsi">Tüm aylara yaz</button>
        <button type="button" class="btn kucuk" id="urTemizle">${YIL()} hedeflerini temizle</button>
        <span class="ipucuMetin" id="urOzet"></span>
      </div>
    </div>
    <p class="ipucuMetin" style="margin:-4px 0 4px">Boş bıraktığınız aylarda ürün hedefsiz kalır —
      satışı yine kaydedilir ama gerçekleşme ve prim hesabına girmez. Başka bir yılı düzenlemek
      için üstteki yıl seçicisini değiştirin.</p>

    <label class="alan"><span>Prim kuralı</span>
      <select class="metinGirdi" id="urTip">
        <option value="yok"    ${tip === 'yok'    ? 'selected' : ''}>Prim yok — yalnızca takip et</option>
        <option value="sabit"  ${tip === 'sabit'  ? 'selected' : ''}>Kutu başı sabit tutar</option>
        <option value="kademe" ${tip === 'kademe' ? 'selected' : ''}>Kademeli — sattığı adede göre kutu başı tutar</option>
      </select></label>

    <div id="urSabitAlan" ${tip === 'sabit' ? '' : 'hidden'}>
      <label class="alan"><span>Kutu başı prim (₺)</span>
        <input class="metinGirdi num" id="urKutu" inputmode="decimal"
          value="${u && u.kutuPrim ? nfSay2.format(u.kutuPrim) : ''}" placeholder="Örn. 15"></label>
    </div>

    <div id="urKademeAlan" ${tip === 'kademe' ? '' : 'hidden'}>
      <div class="alan"><span>Kademeler — kişinin sattığı adet ve o adetteki kutu başı tutar</span>
        <div class="tsar"><table class="t" style="font-size:12.5px">
          <thead><tr><th class="sol">#</th><th>Adet (bu adetten itibaren)</th><th>Kutu Başı (₺)</th></tr></thead>
          <tbody>${Array.from({length:4}, (_, i) => `<tr>
            <td class="sol ikincil">${i+1}</td>
            <td><input class="metinGirdi num urAdet" inputmode="numeric" style="text-align:right"
              value="${kad[i] ? (kad[i].adet || '') : ''}"></td>
            <td><input class="metinGirdi num urTutar" inputmode="decimal" style="text-align:right"
              value="${kad[i] ? (kad[i].tutar || '') : ''}"></td></tr>`).join('')}
          </tbody></table></div></div>
      <p class="ipucuMetin" style="margin-top:8px">Örnek: 30 kutudan itibaren ₺10, 60 kutudan
        itibaren ₺15. Kişi 65 kutu satarsa <b>tamamı</b> ₺15 üzerinden hesaplanır.</p>
    </div>

    <div id="urSartAlan" ${tip === 'yok' ? 'hidden' : ''}>
      <label class="alan"><span>Hedef kuralı — ekip gerçekleşmesi primi nasıl etkilesin</span>
        <select class="metinGirdi" id="urKural">
          <option value="yok"      ${kural === 'yok'      ? 'selected' : ''}>Hedefe bakma — satılan her kutu tam prim üretir</option>
          <option value="kademeli" ${kural === 'kademeli' ? 'selected' : ''}>Kademeli — alt sınırın altında ödeme yok, arada orantılı, hedefte tam</option>
          <option value="kesin"    ${kural === 'kesin'    ? 'selected' : ''}>Kesin — hedef tutmazsa hiç prim ödenmez</option>
        </select></label>
      <label class="alan" id="urAltAlan" ${kural === 'kademeli' ? '' : 'hidden'}>
        <span>Alt sınır (%)</span>
        <input class="metinGirdi num" id="urAlt" inputmode="decimal" style="max-width:130px"
          value="${nfSay.format(((u && u.altSinir != null) ? u.altSinir : 0.9) * 100)}"></label>
      <p class="ipucuMetin" id="urKuralOrnek" style="margin-top:2px"></p>
    </div>

    <label class="alan" style="flex-direction:row;align-items:center;gap:8px">
      <input type="checkbox" id="urAktif" ${!u || u.aktif !== false ? 'checked' : ''}>
      <span style="text-transform:none;letter-spacing:0;font-family:var(--sans);font-size:13px;color:var(--mrk2)">
        Takipte — giriş tablosunda görünür</span></label>
  `, [
    ...(u ? [{ ad:'Sil', sinif:'tehlike', calistir: () => {
      onayla('Ürünü sil', u.ad + ' ve tüm aylardaki satış kayıtları silinecek. '
        + 'Yalnızca takipten çıkarmak için "Takipte" işaretini kaldırabilirsiniz.',
        'Sil', () => {
          e.urunler = e.urunler.filter(x => x.id !== u.id);
          Object.values(e.urunSatis).forEach(a => delete a[u.id]);
          kaydet(true); ciz(); bildir('Ürün silindi.');
        });
      return false;
    }}] : []),
    { ad:'Vazgeç' },
    { ad:'Kaydet', sinif:'ana1', calistir: k => {
      const ad = k.querySelector('#urAd').value.trim();
      if (!ad){ bildir('Ürün adı gerekli.', true); return false; }
      const yeniTip = k.querySelector('#urTip').value;
      const kutu = sayiOku(k.querySelector('#urKutu').value) || 0;
      const adetler = Array.from(k.querySelectorAll('.urAdet')).map(x => sayiOku(x.value));
      const tutarlar = Array.from(k.querySelectorAll('.urTutar')).map(x => sayiOku(x.value));
      const kademeler = adetler.map((a, i) => ({ adet: a || 0, tutar: tutarlar[i] || 0 }))
        .filter(x => x.adet > 0);
      if (yeniTip === 'sabit' && !kutu){ bildir('Kutu başı primi girin.', true); return false; }
      if (yeniTip === 'kademe' && !kademeler.length){ bildir('En az bir kademe girin.', true); return false; }
      /* Aylık hedefler yalnızca seçili yıl için yazılır, diğer yıllar korunur */
      const hedefAy = Object.assign({}, (u && u.hedefAy) || {});
      k.querySelectorAll('.urAy').forEach(x => {
        const d = sayiOku(x.value);
        if (d == null || d <= 0) delete hedefAy[x.dataset.ay];
        else hedefAy[x.dataset.ay] = d;
      });
      const v = {
        ad, marka: k.querySelector('#urMarka').value.trim(),
        hedef: 0, hedefAy,
        primTipi: yeniTip, kutuPrim: kutu, kademeler,
        hedefKurali: k.querySelector('#urKural').value,
        altSinir: kis((sayiOku(k.querySelector('#urAlt').value) || 90) / 100, 0, 1),
        aktif: k.querySelector('#urAktif').checked
      };
      if (u) Object.assign(u, v);
      else e.urunler.push({ id: yeniId(), ...v });
      kaydet(true); ciz(); bildir('Ürün kaydedildi.');
    }}
  ]);

  const kk = $('#kalip');
  const ayGirdileri = () => Array.from(kk.querySelectorAll('.urAy'));
  const ayOzet = () => {
    const d = ayGirdileri().map(x => sayiOku(x.value) || 0).filter(v => v > 0);
    kk.querySelector('#urOzet').textContent = d.length
      ? d.length + ' ay · toplam ' + SAY(topla(d)) + ' kutu'
      : 'Henüz hedef verilmedi';
  };
  kk.querySelector('#urHepsi').onclick = () => {
    const v = sayiOku(kk.querySelector('#urHepsiAdet').value);
    if (v == null || v <= 0) return bildir('Önce bir adet girin.', true);
    ayGirdileri().forEach(x => x.value = nfSay.format(v));
    ayOzet(); ornek();
  };
  kk.querySelector('#urTemizle').onclick = () => {
    ayGirdileri().forEach(x => x.value = '');
    ayOzet(); ornek();
  };
  ayGirdileri().forEach(x => x.oninput = () => { ayOzet(); ornek(); });

  const ornek = () => {
    const kr = kk.querySelector('#urKural').value;
    const alt = kis((sayiOku(kk.querySelector('#urAlt').value) || 90) / 100, 0, 1);
    const girilen = ayGirdileri().map(x => sayiOku(x.value) || 0).filter(v => v > 0);
    const hedef = girilen.length ? Math.round(topla(girilen) / girilen.length) : 100;
    const el = kk.querySelector('#urKuralOrnek');
    kk.querySelector('#urAltAlan').hidden = kr !== 'kademeli';
    if (kr === 'yok'){ el.textContent = 'Hedef tutmasa da satılan her kutu tam prim üretir.'; return; }
    if (kr === 'kesin'){
      el.textContent = 'Örnek ay hedefi ' + SAY(hedef) + ' kutu. ' + SAY(hedef - 1)
        + ' satılırsa prim ödenmez, ' + SAY(hedef) + ' satılırsa tamamı ödenir.';
      return;
    }
    const dusuk = Math.round(hedef * alt * 0.95), orta = Math.round(hedef * (alt + (1 - alt) / 2));
    el.innerHTML = 'Örnek ay hedefi <b>' + SAY(hedef) + '</b> kutu · alt sınır <b>' + YZD0(alt) + '</b> ('
      + SAY(Math.ceil(hedef * alt)) + ' kutu).<br>'
      + SAY(dusuk) + ' satılırsa (' + YZD0(dusuk / hedef) + ') <b>prim yok</b> · '
      + SAY(orta) + ' satılırsa (' + YZD0(orta / hedef) + ') hak edişin <b>' + YZD0(orta / hedef)
      + "'i</b> · " + SAY(hedef) + ' ve üzeri <b>tamamı</b>.';
  };
  kk.querySelector('#urTip').onchange = ev => {
    kk.querySelector('#urSabitAlan').hidden  = ev.target.value !== 'sabit';
    kk.querySelector('#urKademeAlan').hidden = ev.target.value !== 'kademe';
    kk.querySelector('#urSartAlan').hidden   = ev.target.value === 'yok';
  };
  kk.querySelector('#urKural').onchange = ornek;
  kk.querySelector('#urAlt').oninput = ornek;
  ayOzet(); ornek();
}

<!doctype html>
<html lang="tr" data-af-no-storage data-af-no-back>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Eczane Finans Kokpiti</title>
<link rel="icon" href="assets/logo.png">
<script src="assets/core.js"></script>
<style>
/* =========================================================
   ECZANE FİNANS KOKPİTİ — Artıfarma Group
   Tek dosya. Bağımlılık yok. Veri tarayıcıda saklanır.
   ========================================================= */

/* ---------- 1. Jetonlar ---------- */
:root{
  color-scheme: light;

  --zemin:#F6F6FA;  --kart:#FFFFFF;  --kart2:#FBFBFE;  --kart3:#F1F1F7;
  --cizgi:#E2E2EC;  --cizgi2:#EDEDF4;
  --mrk:#16172A;    --mrk2:#54556C;  --mrk3:#83849B;

  --ray:#23244A;    --ray2:#1C1D3E;  --rayYazi:#B9BAD8; --rayAktif:#FFFFFF;
  --rayCizgi:#33346A; --rayVurgu:#DC1A22;

  --marka:#2A2A5E;  --markaAcik:#3D3D86;
  --odak:#4A4AA8;

  --iyi:#0CA30C;    --iyiYazi:#0A7A2E;  --iyiZemin:#E9F6EC;
  --uyari:#FAB219;  --uyariYazi:#8A5A00; --uyariZemin:#FDF3E0;
  --kotu:#DC1A22;   --kotuYazi:#B8161D;  --kotuZemin:#FCECEC;

  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100;
  --s5:#e87ba4; --s6:#008300; --s7:#4a3aa7; --s8:#e34948;

  --izgara:#E8E8F0;
  --golge:0 1px 2px rgba(22,23,42,.05), 0 4px 14px -6px rgba(22,23,42,.10);

  --r:10px; --r2:6px;
  --sans:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --zemin:#0F1020; --kart:#191A2A; --kart2:#1E1F31; --kart3:#232437;
    --cizgi:#2E2F45; --cizgi2:#252639;
    --mrk:#F1F1F8;   --mrk2:#A6A7BE;  --mrk3:#7B7C93;

    --ray:#141527;   --ray2:#101122;  --rayYazi:#9E9FC0; --rayAktif:#FFFFFF;
    --rayCizgi:#282943; --rayVurgu:#FF4E56;

    --marka:#9A9AE8; --markaAcik:#B3B3F2;
    --odak:#8F8FE6;

    --iyi:#0CA30C;   --iyiYazi:#4BD07A;  --iyiZemin:#132A1B;
    --uyari:#FAB219; --uyariYazi:#F0B84A; --uyariZemin:#2C2312;
    --kotu:#FF4E56;  --kotuYazi:#FF7B80;  --kotuZemin:#2E1518;

    --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500;
    --s5:#d55181; --s6:#008300; --s7:#9085e9; --s8:#e66767;

    --izgara:#282940;
    --golge:0 1px 2px rgba(0,0,0,.30), 0 4px 14px -6px rgba(0,0,0,.45);
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --zemin:#0F1020; --kart:#191A2A; --kart2:#1E1F31; --kart3:#232437;
  --cizgi:#2E2F45; --cizgi2:#252639;
  --mrk:#F1F1F8;   --mrk2:#A6A7BE;  --mrk3:#7B7C93;

  --ray:#141527;   --ray2:#101122;  --rayYazi:#9E9FC0; --rayAktif:#FFFFFF;
  --rayCizgi:#282943; --rayVurgu:#FF4E56;

  --marka:#9A9AE8; --markaAcik:#B3B3F2;
  --odak:#8F8FE6;

  --iyi:#0CA30C;   --iyiYazi:#4BD07A;  --iyiZemin:#132A1B;
  --uyari:#FAB219; --uyariYazi:#F0B84A; --uyariZemin:#2C2312;
  --kotu:#FF4E56;  --kotuYazi:#FF7B80;  --kotuZemin:#2E1518;

  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500;
  --s5:#d55181; --s6:#008300; --s7:#9085e9; --s8:#e66767;

  --izgara:#282940;
  --golge:0 1px 2px rgba(0,0,0,.30), 0 4px 14px -6px rgba(0,0,0,.45);
}

/* ---------- 2. Temel ---------- */
*,*::before,*::after{box-sizing:border-box}
/* .btn/.oturumCip gibi display taşıyan sınıflar hidden özniteliğini ezmesin */
[hidden]{display:none!important}
html,body{height:100%}
body{
  margin:0; background:var(--zemin); color:var(--mrk);
  font-family:var(--sans); font-size:14px; line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font:inherit; color:inherit}
:focus-visible{outline:2px solid var(--odak); outline-offset:2px; border-radius:4px}
@media (prefers-reduced-motion: reduce){ *{animation:none!important; transition:none!important} }

.mono{font-family:var(--mono)}
.num{font-variant-numeric:tabular-nums; font-feature-settings:"tnum" 1}
.goz{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- 3. Kabuk ---------- */
.uyg{display:grid; grid-template-columns:236px 1fr; min-height:100vh}

.ray{
  background:var(--ray); border-right:1px solid var(--rayCizgi);
  display:flex; flex-direction:column; position:sticky; top:0; height:100vh; overflow-y:auto;
}
.rayBas{padding:18px 18px 14px; border-bottom:1px solid var(--rayCizgi); display:flex; gap:11px; align-items:center}
.cip{
  width:34px;height:34px;border-radius:8px;background:#fff;flex:none;
  display:grid;place-items:center;font-weight:800;color:var(--rayVurgu);
  font-size:15px;letter-spacing:-.5px;
}
.rayBas b{color:#fff;font-size:13.5px;font-weight:650;letter-spacing:-.1px;display:block;line-height:1.25}
.rayBas span{color:var(--rayYazi);font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;font-family:var(--mono)}

.rayGrup{padding:14px 10px 4px}
.rayGrupBas{
  font-family:var(--mono);font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;
  color:#6E6FA0;padding:0 10px 7px;
}
.rayLink{
  display:flex;align-items:center;gap:10px;width:100%;text-align:left;
  padding:8px 10px;border-radius:7px;border:0;background:transparent;
  color:var(--rayYazi);font-size:13.2px;cursor:pointer;position:relative;
  transition:background .12s, color .12s;
}
.rayLink svg{width:16px;height:16px;flex:none;opacity:.75}
.rayLink:hover{background:rgba(255,255,255,.05);color:#E6E6F5}
.rayLink[aria-current="page"]{background:rgba(255,255,255,.10);color:var(--rayAktif);font-weight:600}
.rayLink[aria-current="page"] svg{opacity:1}
.rayLink[aria-current="page"]::before{
  content:"";position:absolute;left:-10px;top:8px;bottom:8px;width:3px;
  background:var(--rayVurgu);border-radius:0 3px 3px 0;
}
.rayAlt{margin-top:auto;padding:12px;border-top:1px solid var(--rayCizgi);
  font-family:var(--mono);font-size:10px;color:#5E5F8C;letter-spacing:.05em}

/* ---------- 4. Üst çubuk ---------- */
.ana{min-width:0;display:flex;flex-direction:column}
.ust{
  position:sticky;top:0;z-index:30;background:var(--kart);
  border-bottom:1px solid var(--cizgi);
  display:flex;align-items:center;gap:12px;padding:10px 22px;flex-wrap:wrap;
}
.ustBas{font-size:15px;font-weight:650;letter-spacing:-.2px;margin-right:auto}
.ustBas small{display:block;font-weight:400;font-size:11.5px;color:var(--mrk3);letter-spacing:0}

.sec{
  appearance:none;background:var(--kart2);border:1px solid var(--cizgi);border-radius:var(--r2);
  padding:6px 30px 6px 10px;font-size:13px;cursor:pointer;
  background-image:linear-gradient(45deg,transparent 50%,var(--mrk3) 50%),linear-gradient(135deg,var(--mrk3) 50%,transparent 50%);
  background-position:calc(100% - 15px) 50%,calc(100% - 10px) 50%;
  background-size:5px 5px,5px 5px;background-repeat:no-repeat;
}
.sec:hover{border-color:var(--mrk3)}

.btn{
  border:1px solid var(--cizgi);background:var(--kart2);color:var(--mrk);
  padding:6px 12px;border-radius:var(--r2);cursor:pointer;font-size:13px;
  display:inline-flex;align-items:center;gap:6px;white-space:nowrap;transition:background .12s,border-color .12s;
}
.btn:hover{background:var(--kart3);border-color:var(--mrk3)}
.btn svg{width:14px;height:14px}
.btn.ana1{background:var(--marka);border-color:var(--marka);color:#fff}
.btn.ana1:hover{background:var(--markaAcik);border-color:var(--markaAcik)}
:root[data-theme="dark"] .btn.ana1,
:root:not([data-theme="light"]) .btn.ana1{color:#11122A}
@media (prefers-color-scheme: light){ :root:not([data-theme="dark"]) .btn.ana1{color:#fff} }
.btn.tehlike{color:var(--kotuYazi);border-color:var(--cizgi)}
.btn.tehlike:hover{background:var(--kotuZemin);border-color:var(--kotu)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.kucuk{padding:3px 8px;font-size:12px}

/* ---------- 5. Sayfa ---------- */
.sayfa{padding:20px 22px 64px;display:none;flex-direction:column;gap:16px}
.sayfa.acik{display:flex}
.satir{display:grid;gap:14px}
/* Izgara/esnek çocukların otomatik en küçük boyutu min-content'tir; sıfırlanmazsa
   içindeki geniş tablo sütunu taşırır. */
.satir > *{min-width:0}
.kart{min-width:0}
.s2{grid-template-columns:repeat(2,minmax(0,1fr))}
.s3{grid-template-columns:repeat(3,minmax(0,1fr))}
.s4{grid-template-columns:repeat(4,minmax(0,1fr))}
.s5{grid-template-columns:repeat(5,minmax(0,1fr))}
.s6{grid-template-columns:repeat(6,minmax(0,1fr))}
.s21{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}
.s12{grid-template-columns:minmax(0,1fr) minmax(0,2fr)}
@media(max-width:1180px){.s4,.s5,.s6{grid-template-columns:repeat(2,minmax(0,1fr))}.s3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:900px){.uyg{grid-template-columns:1fr}.ray{position:static;height:auto;flex-direction:row;overflow-x:auto;align-items:center}
  .rayBas{border:0}.rayGrup{display:flex;gap:4px;padding:8px}.rayGrupBas{display:none}.rayAlt{display:none}
  .rayLink[aria-current="page"]::before{display:none}
  .s2,.s3,.s4,.s5,.s6,.s21,.s12{grid-template-columns:1fr}}

.kart{background:var(--kart);border:1px solid var(--cizgi);border-radius:var(--r);box-shadow:var(--golge)}
.kartBas{
  padding:13px 16px 11px;border-bottom:1px solid var(--cizgi2);
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;
}
.kartBas h3{margin:0;font-size:13.5px;font-weight:650;letter-spacing:-.1px}
.kartBas p{margin:1px 0 0;font-size:11.5px;color:var(--mrk3)}
.kartBas .sag{margin-left:auto;display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.kartGovde{padding:14px 16px}
.kartGovde.sifir{padding:0}

.goz1{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--mrk3)}

/* ---------- 6. KPI ---------- */
.kpi{background:var(--kart);border:1px solid var(--cizgi);border-radius:var(--r);padding:13px 15px 11px;
  box-shadow:var(--golge);display:flex;flex-direction:column;gap:3px;min-width:0}
.kpi .et{font-family:var(--mono);font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--mrk3)}
.kpi .dg{font-size:23px;font-weight:660;letter-spacing:-.6px;font-variant-numeric:tabular-nums;line-height:1.15}
.kpi .alt{display:flex;align-items:center;gap:7px;margin-top:2px;flex-wrap:wrap}
.kpi .not{font-size:11.5px;color:var(--mrk3)}
.kpi .kivi{margin-top:6px;height:30px}

.delta{
  font-family:var(--mono);font-size:11px;font-weight:600;padding:1.5px 6px;border-radius:99px;
  display:inline-flex;align-items:center;gap:3px;font-variant-numeric:tabular-nums;
}
.delta.p{background:var(--iyiZemin);color:var(--iyiYazi)}
.delta.n{background:var(--kotuZemin);color:var(--kotuYazi)}
.delta.z{background:var(--kart3);color:var(--mrk2)}

.rozet{font-family:var(--mono);font-size:10px;letter-spacing:.05em;text-transform:uppercase;
  padding:2px 7px;border-radius:99px;border:1px solid var(--cizgi);color:var(--mrk2);background:var(--kart2);
  display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
.rozet.iyi{background:var(--iyiZemin);color:var(--iyiYazi);border-color:transparent}
.rozet.uyari{background:var(--uyariZemin);color:var(--uyariYazi);border-color:transparent}
.rozet.kotu{background:var(--kotuZemin);color:var(--kotuYazi);border-color:transparent}
.rozet i{width:6px;height:6px;border-radius:99px;background:currentColor;flex:none}

/* ---------- 7. Tablo ---------- */
.tsar{overflow:auto;max-width:100%;-webkit-overflow-scrolling:touch}
table.t{border-collapse:separate;border-spacing:0;width:100%;font-size:12.8px}
table.t th,table.t td{padding:6px 10px;border-bottom:1px solid var(--cizgi2);text-align:right;white-space:nowrap;
  font-variant-numeric:tabular-nums}
table.t th{
  font-family:var(--mono);font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--mrk3);
  font-weight:500;background:var(--kart2);position:sticky;top:0;z-index:2;border-bottom:1px solid var(--cizgi);
}
table.t th.sol,table.t td.sol{text-align:left}
table.t .kilit{position:sticky;left:0;background:var(--kart);z-index:1;text-align:left;
  border-right:1px solid var(--cizgi2);font-weight:500}
table.t th.kilit{background:var(--kart2);z-index:3}
table.t tbody tr:hover td{background:var(--kart2)}
table.t tbody tr:hover td.kilit{background:var(--kart3)}
table.t tr.tpl td{font-weight:660;background:var(--kart3);border-top:1px solid var(--cizgi)}
table.t tr.tpl td.kilit{background:var(--kart3)}
table.t tr.ara td{background:var(--kart2);font-weight:600}
table.t td.vurgu{font-weight:600}
table.t .ikincil{color:var(--mrk3)}
table.t tfoot td{font-weight:660;background:var(--kart3);border-top:1px solid var(--cizgi)}

.hucre{
  width:100%;min-width:78px;border:1px solid transparent;background:transparent;border-radius:4px;
  padding:3px 6px;text-align:right;font-variant-numeric:tabular-nums;font-size:12.8px;
}
.hucre:hover{border-color:var(--cizgi)}
.hucre:focus{border-color:var(--odak);background:var(--kart);outline:none;box-shadow:0 0 0 2px color-mix(in srgb,var(--odak) 22%,transparent)}
.hucre.tahmin{color:var(--mrk3);font-style:italic}
.hucre::placeholder{color:var(--mrk3);opacity:.5}
.metinGirdi{
  border:1px solid var(--cizgi);background:var(--kart2);border-radius:var(--r2);padding:6px 9px;font-size:13px;width:100%;
}
.metinGirdi:focus{border-color:var(--odak);outline:none}
label.alan{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--mrk2);min-width:0}
label.alan > span{font-family:var(--mono);font-size:9.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--mrk3)}

.poz{color:var(--iyiYazi)} .neg{color:var(--kotuYazi)}

/* ---------- 8. Grafik ---------- */
.gr{width:100%;display:block;overflow:visible}
.gr text{font-family:var(--sans);fill:var(--mrk3);font-size:10px;font-variant-numeric:tabular-nums}
.gr .eks{stroke:var(--izgara);stroke-width:1}
.gr .sfr{stroke:var(--cizgi);stroke-width:1}
.grSar{position:relative}
.ipucu{
  position:absolute;pointer-events:none;background:var(--kart);border:1px solid var(--cizgi);
  border-radius:var(--r2);box-shadow:var(--golge);padding:8px 10px;font-size:12px;z-index:20;
  min-width:150px;opacity:0;transition:opacity .1s;
}
.ipucu.gor{opacity:1}
.ipucu b{display:block;font-size:11px;color:var(--mrk3);font-family:var(--mono);letter-spacing:.08em;
  text-transform:uppercase;margin-bottom:5px;font-weight:500}
.ipucu .sat{display:flex;align-items:center;gap:7px;justify-content:space-between;padding:1.5px 0}
.ipucu .sat i{width:8px;height:8px;border-radius:2px;flex:none}
.ipucu .sat span{color:var(--mrk2);margin-right:auto}
.ipucu .sat em{font-style:normal;font-variant-numeric:tabular-nums;font-weight:600}

.efsane{display:flex;gap:12px;flex-wrap:wrap;padding:2px 0 0}
.efsane div{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--mrk2)}
.efsane i{width:9px;height:9px;border-radius:2px;flex:none}
.efsane i.cizgi{height:3px;width:14px;border-radius:2px}

/* ---------- 9. Kalıp / bildirim ---------- */
.perde{position:fixed;inset:0;background:rgba(16,17,32,.55);display:none;place-items:center;z-index:100;padding:20px}
.perde.acik{display:grid}
.kalip{background:var(--kart);border:1px solid var(--cizgi);border-radius:12px;box-shadow:0 24px 60px -20px rgba(0,0,0,.4);
  width:min(560px,100%);max-height:88vh;overflow:auto}
.kalip h3{margin:0;font-size:15px;font-weight:650}
.kalipBas{padding:16px 18px 12px;border-bottom:1px solid var(--cizgi2)}
.kalipGovde{padding:16px 18px;display:flex;flex-direction:column;gap:12px}
.kalipAlt{padding:12px 18px 16px;display:flex;gap:8px;justify-content:flex-end;border-top:1px solid var(--cizgi2)}

#bildirim{position:fixed;right:18px;bottom:18px;z-index:200;display:flex;flex-direction:column;gap:8px}
.bildir{background:var(--ray);color:#fff;border-radius:8px;padding:9px 14px;font-size:13px;
  box-shadow:0 10px 30px -10px rgba(0,0,0,.5);animation:gel .18s ease-out}
.bildir.kotu{background:var(--kotu)}
@keyframes gel{from{opacity:0;transform:translateY(8px)}}

.bos{padding:36px 20px;text-align:center;color:var(--mrk3);font-size:13px}
.ipucuMetin{font-size:11.5px;color:var(--mrk3);line-height:1.5}
.serit{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.ayirac{height:1px;background:var(--cizgi2);margin:2px 0}

/* ölçü çubuğu (tabloda satır içi oran) */
.olcu{position:relative;display:block;height:4px;border-radius:2px;background:var(--cizgi2);margin-top:3px;overflow:hidden}
.olcu i{position:absolute;left:0;top:0;bottom:0;border-radius:2px;background:var(--s1)}

/* ---------- 10. Giriş ekranı ---------- */
.kapi{
  position:fixed;inset:0;z-index:500;display:none;
  background:linear-gradient(150deg,#1C1D3E 0%,#23244A 55%,#2A2A5E 100%);
  place-items:center;padding:20px;overflow:auto;
}
.kapi.acik{display:grid}
.kapiKutu{
  width:min(430px,100%);background:var(--kart);border-radius:14px;
  box-shadow:0 30px 70px -22px rgba(0,0,0,.55);overflow:hidden;
}
.kapiBas{padding:26px 26px 18px;text-align:center;border-bottom:1px solid var(--cizgi2)}
.kapiBas .cip{width:44px;height:44px;font-size:18px;margin:0 auto 13px;
  box-shadow:0 2px 10px rgba(220,26,34,.22)}
.kapiBas h2{margin:0;font-size:17px;font-weight:660;letter-spacing:-.25px}
.kapiBas p{margin:5px 0 0;font-size:12.8px;color:var(--mrk3);line-height:1.5}
.kapiGovde{padding:20px 26px 24px;display:flex;flex-direction:column;gap:13px}
.sekmeler{display:flex;gap:4px;padding:4px;background:var(--kart3);border-radius:9px;margin-bottom:3px}
.sekmeler button{
  flex:1;border:0;background:transparent;padding:7px 10px;border-radius:6px;
  font-size:12.8px;font-weight:550;color:var(--mrk2);cursor:pointer;transition:.13s;
}
.sekmeler button[aria-selected="true"]{background:var(--kart);color:var(--mrk);box-shadow:var(--golge)}
.kapiUyari{
  font-size:12.5px;padding:9px 12px;border-radius:var(--r2);line-height:1.5;
  background:var(--kotuZemin);color:var(--kotuYazi);display:none;
}
.kapiUyari.gor{display:block}
.kapiNot{font-size:11.5px;color:var(--mrk3);line-height:1.55;text-align:center}
.kapiAlt{padding:13px 26px;background:var(--kart2);border-top:1px solid var(--cizgi2);
  font-family:var(--mono);font-size:10px;letter-spacing:.09em;text-transform:uppercase;
  color:var(--mrk3);text-align:center}

/* üst çubuktaki oturum rozeti */
.oturumCip{
  display:inline-flex;align-items:center;gap:7px;padding:4px 6px 4px 10px;
  border:1px solid var(--cizgi);border-radius:99px;background:var(--kart2);font-size:12.5px;
}

<script>
/* =========================================================
   BÖLÜM 1 — Veri katmanı, biçimlendirme, yardımcılar
   ========================================================= */
'use strict';

const ANAHTAR = 'artifarma:ecz-finans-v1';

/* --- Kalıcı saklama: window.storage varsa onu, yoksa localStorage --- */
const Depo = (() => {
  const yerli = (typeof window.storage === 'object' && window.storage && typeof window.storage.get === 'function');
  if (yerli) return {
    oku: k => window.storage.get(k),
    yaz: (k, v) => window.storage.set(k, v)
  };
  let bellek = {};
  let calisir = true;
  try { localStorage.setItem(ANAHTAR + ':t', '1'); localStorage.removeItem(ANAHTAR + ':t'); }
  catch (e) { calisir = false; }
  return {
    oku: async k => {
      if (!calisir) return bellek[k] ?? null;
      const h = localStorage.getItem(k);
      try { return h === null ? null : JSON.parse(h); } catch (e) { return null; }
    },
    yaz: async (k, v) => {
      if (!calisir) { bellek[k] = v; return; }
      localStorage.setItem(k, JSON.stringify(v));
    }
  };
})();

/* --- Biçimlendirme --- */
const AY_ADI = ['Ocak','Şubat','Mart','Nisan','Mayıs','Haziran','Temmuz','Ağustos','Eylül','Ekim','Kasım','Aralık'];
const AY_KISA = ['Oca','Şub','Mar','Nis','May','Haz','Tem','Ağu','Eyl','Eki','Kas','Ara'];

const nfTL  = new Intl.NumberFormat('tr-TR', { style:'currency', currency:'TRY', maximumFractionDigits:0 });
const nfTL2 = new Intl.NumberFormat('tr-TR', { style:'currency', currency:'TRY', minimumFractionDigits:2, maximumFractionDigits:2 });
const nfSay = new Intl.NumberFormat('tr-TR', { maximumFractionDigits:0 });
const nfSay1= new Intl.NumberFormat('tr-TR', { minimumFractionDigits:1, maximumFractionDigits:1 });
const nfSay2= new Intl.NumberFormat('tr-TR', { minimumFractionDigits:2, maximumFractionDigits:2 });

const TL   = v => (v == null || !isFinite(v)) ? '—' : nfTL.format(v);
const TL2  = v => (v == null || !isFinite(v)) ? '—' : nfTL2.format(v);
const SAY  = v => (v == null || !isFinite(v)) ? '—' : nfSay.format(v);
const SAY1 = v => (v == null || !isFinite(v)) ? '—' : nfSay1.format(v);
const SAY2 = v => (v == null || !isFinite(v)) ? '—' : nfSay2.format(v);
/* Türkçede yüzde işareti sayıdan önce yazılır: %12,5 */
const YZD  = v => (v == null || !isFinite(v)) ? '—' : '%' + nfSay1.format(v * 100);
const YZD0 = v => (v == null || !isFinite(v)) ? '—' : '%' + nfSay.format(Math.round(v * 100));

/** Kısa para: 1,25 Mn ₺ — büyük başlıklar için */
function TLk(v){
  if (v == null || !isFinite(v)) return '—';
  const m = Math.abs(v), i = v < 0 ? '-' : '';
  if (m >= 1e9) return i + nfSay2.format(m/1e9) + ' Mr ₺';
  if (m >= 1e6) return i + nfSay2.format(m/1e6) + ' Mn ₺';
  if (m >= 1e4) return i + nfSay.format(Math.round(m/1e3)) + ' B ₺';
  return nfTL.format(v);
}

/**
 * Türkçe ve İngilizce biçimli sayıları okur.
 * "1.234.567" → 1234567 · "1.234,50" → 1234.5 · "1,234.50" → 1234.5
 * "12,5" → 12,5 · "(1.500)" → -1500 · "₺ 45.000" → 45000
 */
function sayiOku(h){
  if (h == null) return null;
  let s = String(h).replace(/[ \s₺%]/g, '').trim();
  if (!s) return null;
  const eksi = /^\(.*\)$/.test(s) || s.startsWith('-') || s.startsWith('−');
  s = s.replace(/[()\-−+]/g, '');
  if (!/\d/.test(s)) return null;

  const nokta = s.indexOf('.'), virgul = s.indexOf(',');
  if (nokta >= 0 && virgul >= 0){
    /* İkisi de var: sonda gelen ondalık ayraçtır */
    if (s.lastIndexOf(',') > s.lastIndexOf('.')) s = s.replace(/\./g, '').replace(',', '.');
    else s = s.replace(/,/g, '');
  } else if (virgul >= 0){
    /* Yalnız virgül: birden fazlaysa binlik, tekse Türkçe ondalık */
    const p = s.split(',');
    s = p.length > 2 ? p.join('') : p.join('.');
  } else if (nokta >= 0){
    /* Yalnız nokta: "1.234" gibi tam üçlü gruplar binlik ayraçtır */
    const p = s.split('.');
    const binlik = p.length > 2
      ? p.slice(1).every(x => x.length === 3)
      : (p[1].length === 3 && p[0].length >= 1 && p[0].length <= 3);
    if (binlik) s = p.join('');
  }
  const n = parseFloat(s);
  return isFinite(n) ? (eksi ? -n : n) : null;
}

/* --- Ay anahtarları: "YYYY-MM" --- */
const ayAnh   = (y, a) => y + '-' + String(a + 1).padStart(2, '0');
const ayYil   = k => +k.slice(0, 4);
const ayIdx   = k => +k.slice(5, 7) - 1;
const ayEkle  = (k, n) => { const t = ayYil(k) * 12 + ayIdx(k) + n; return ayAnh(Math.floor(t / 12), ((t % 12) + 12) % 12); };
const ayEtiket= k => AY_KISA[ayIdx(k)] + ' ' + String(ayYil(k)).slice(2);
const ayUzun  = k => AY_ADI[ayIdx(k)] + ' ' + ayYil(k);
const yilAylari = y => Array.from({length:12}, (_, i) => ayAnh(y, i));

/** Pazar hariç açık gün sayısı (varsayılan iş günü tahmini) */
function varsayilanIsGunu(k){
  const y = ayYil(k), a = ayIdx(k), son = new Date(y, a + 1, 0).getDate();
  let n = 0;
  for (let g = 1; g <= son; g++) if (new Date(y, a, g).getDay() !== 0) n++;
  return n;
}

/* --- Küçük yardımcılar --- */
const $  = (s, k = document) => k.querySelector(s);
const $$ = (s, k = document) => Array.from(k.querySelectorAll(s));
const kacis = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const yeniId = () => Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-4);
const topla  = a => a.reduce((t, v) => t + (+v || 0), 0);
const kis    = (v, a, b) => Math.max(a, Math.min(b, v));

/* --- Şifre özeti ---
   Giriş doğrulaması yalnızca tuzlanmış SHA-256 özetiyle yapılır; şifrenin kendisi
   doğrulamada hiç kullanılmaz. Yönetici bir eczanenin şifresini sonradan okuyabilsin
   diye ayrıca okunabilir bir kopya tutulabilir (eczane bazında açılıp kapatılır).
   Sunucu olmadığı için bu giriş, gündelik erişimi engelleyen bir kilittir — dosyayı
   ele geçiren birine karşı koruma sağlamaz. */
async function ozet(metin){
  try{
    if (crypto && crypto.subtle && crypto.subtle.digest){
      const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(metin));
      return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, '0')).join('');
    }
  } catch (e){ /* güvenli olmayan bağlamda (file://) devre dışı kalabilir */ }
  let h1 = 0x811c9dc5, h2 = 0x1000193;
  for (let i = 0; i < metin.length; i++){
    h1 = Math.imul(h1 ^ metin.charCodeAt(i), 0x01000193) >>> 0;
    h2 = Math.imul(h2 + metin.charCodeAt(i) * (i + 7), 0x85ebca6b) >>> 0;
  }
  return 'fb' + h1.toString(16).padStart(8, '0') + h2.toString(16).padStart(8, '0');
}
const yeniTuz = () => yeniId() + yeniId();
const sifreOzeti = (tuz, sifre) => ozet(tuz + '§' + sifre);

/** Panoya kopyalar; izin verilmezse metni seçili bırakır */
async function panoyaKopyala(metin, etiket){
  try {
    await navigator.clipboard.writeText(metin);
    bildir((etiket || 'Metin') + ' kopyalandı.');
    return true;
  } catch (e){
    const g = document.createElement('textarea');
    g.value = metin;
    g.style.cssText = 'position:fixed;top:50%;left:50%;opacity:0';
    document.body.appendChild(g); g.select();
    let ok = false;
    try { ok = document.execCommand('copy'); } catch (h){ ok = false; }
    g.remove();
    bildir(ok ? (etiket || 'Metin') + ' kopyalandı.' : 'Kopyalanamadı — elle seçip kopyalayın.', !ok);
    return ok;
  }
}

function bildir(mesaj, kotu){
  const d = document.createElement('div');
  d.className = 'bildir' + (kotu ? ' kotu' : '');
  d.textContent = mesaj;
  $('#bildirim').appendChild(d);
  setTimeout(() => { d.style.opacity = '0'; d.style.transition = 'opacity .3s'; setTimeout(() => d.remove(), 320); }, 2400);
}

/* Onay / form kalıbı */
function kalipAc(baslik, govdeHTML, dugmeler){
  const k = $('#kalip');
  k.innerHTML = `<div class="kalipBas"><h3>${kacis(baslik)}</h3></div>
    <div class="kalipGovde">${govdeHTML}</div>
    <div class="kalipAlt">${dugmeler.map((d, i) =>
      `<button class="btn ${d.sinif || ''}" data-i="${i}">${kacis(d.ad)}</button>`).join('')}</div>`;
  $('#perde').classList.add('acik');
  k.querySelectorAll('.kalipAlt .btn').forEach(b => {
    b.onclick = () => {
      const d = dugmeler[+b.dataset.i];
      const kapat = d.calistir ? d.calistir(k) : true;
      if (kapat !== false) kalipKapat();
    };
  });
  const ilk = k.querySelector('input,select,textarea');
  if (ilk) setTimeout(() => ilk.focus(), 30);
}
const kalipKapat = () => { $('#perde').classList.remove('acik'); $('#kalip').innerHTML = ''; };
$('#perde').addEventListener('mousedown', e => { if (e.target.id === 'perde') kalipKapat(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') kalipKapat(); });

function onayla(baslik, metin, tamam, eylem){
  kalipAc(baslik, `<p style="margin:0;font-size:13.5px;color:var(--mrk2);line-height:1.6">${kacis(metin)}</p>`, [
    { ad:'Vazgeç' },
    { ad:tamam, sinif:'tehlike', calistir:() => { eylem(); } }
  ]);
}

/* =========================================================
   BÖLÜM 2 — Varsayılan şema ve durum
   ========================================================= */

/* Kategori tipleri tahsilat zamanını belirler:
   sgk → SGK vadesi sonra, ozel → özel sigorta vadesi sonra, perakende → aynı ay */
/* Renk numaraları, cironun büyük payını tutan kategorilere ayrı slotlar düşecek
   şekilde dağıtılmıştır; tekrar eden slotlar yalnızca küçük kategorilere verilir. */
const VARSAYILAN_KATEGORILER = [
  { ad:'SGK Reçete',        tip:'sgk',       stokGrubu:'İlaç',            renk:0, karMarji:0.09 },
  { ad:'Özel Sigorta',      tip:'ozel',      stokGrubu:'İlaç',            renk:6, karMarji:0.12 },
  { ad:'İlaç Perakende',    tip:'perakende', stokGrubu:'İlaç',            renk:1, karMarji:0.16 },
  { ad:'Gıda Takviyeleri',  tip:'perakende', stokGrubu:'Gıda Takviyeleri',renk:2, karMarji:0.32 },
  { ad:'Dermokozmetik',     tip:'perakende', stokGrubu:'Dermokozmetik',   renk:3, karMarji:0.30 },
  { ad:'İtriyat',           tip:'perakende', stokGrubu:'İtriyat',         renk:4, karMarji:0.28 },
  { ad:'Medikal',           tip:'perakende', stokGrubu:'Medikal',         renk:5, karMarji:0.25 },
  { ad:'Anne Bebek',        tip:'perakende', stokGrubu:'Anne Bebek',      renk:7, karMarji:0.22 },
  { ad:'Cinsel Sağlık',     tip:'perakende', stokGrubu:'Cinsel Sağlık',   renk:4, karMarji:0.30 },
  { ad:'Ağız Diş Sağlığı',  tip:'perakende', stokGrubu:'Ağız Diş Sağlığı',renk:5, karMarji:0.28 },
  { ad:'Sporcu Sağlığı',    tip:'perakende', stokGrubu:'Sporcu Sağlığı',  renk:7, karMarji:0.30 }
];

/* Reçete üstü nakit kalemler — ilk sayfada girilir, aynı ay kasaya girer */
const EK_NAKIT = [
  { alan:'muayene', ad:'Muayene Katkı Payı' },
  { alan:'katilim', ad:'Katılım Payı' },
  { alan:'fark',    ad:'İlaç Fark' }
];

const VARSAYILAN_GIDERLER = [
  ['Personel','Eczacı Maaş',0], ['Personel','Kalfa / Teknisyen Maaş',0], ['Personel','Prim',0], ['Personel','Uzman Maaş',0],
  ['İşletme','Kira',0], ['İşletme','Elektrik',0], ['İşletme','Su',0], ['İşletme','Doğalgaz / Isıtma',0],
  ['İşletme','Telefon & İnternet',0], ['İşletme','Poşet & Ambalaj',0], ['İşletme','Kırtasiye',0],
  ['İşletme','Mutfak & Yemek',0], ['İşletme','Temizlik',0],
  ['Vergi & SGK','Muhtasar',0], ['Vergi & SGK','SGK Primi',0], ['Vergi & SGK','KDV',0],
  ['Vergi & SGK','Geçici Vergi',0], ['Vergi & SGK','Belediye / Çevre',0],
  ['Profesyonel','Muhasebe Ücreti',0], ['Profesyonel','Danışmanlık',0], ['Profesyonel','Bilgi İşlem / Program',0],
  ['Profesyonel','Eczacı Odası & Reçete',0], ['Profesyonel','Eczane Sigorta',0],
  ['Diğer','Araç Kira',0], ['Diğer','Araç Yakıt',0], ['Diğer','Kargo',0], ['Diğer','Nöbet Gideri',0],
  ['Diğer','Kredi Taksiti',0], ['Diğer','Genel',0]
];

function yeniEczane(ad, yil){
  const kat = VARSAYILAN_KATEGORILER.map(k => ({ id: yeniId(), aktif: true, ...k }));
  return {
    id: yeniId(),
    kod: '',            // eczacının giriş için kullandığı kimlik — yönetici belirler
    tuz: yeniTuz(),
    sifreHash: '',      // giriş doğrulaması yalnızca bu özetle yapılır; boşsa giriş kapalı
    sifreAcik: '',      // yöneticinin okuyabilmesi için isteğe bağlı kopya (boş = saklanmıyor)
    arsiv: false,
    arsivTarih: null,
    ad: ad || 'Yeni Eczane',
    sehir: '',
    olusturma: new Date().toISOString().slice(0, 10),
    hedef: { yil: {}, gunlukAy: {}, varsayilanGunluk: 0 },
    ayar: {
      anaYil: yil,
      sgkVadeGun: 90,
      ozelVadeGun: 30,
      disiplinOrani: 0.70,
      kkKomisyon: 0,            // kredi kartı komisyon oranı (nakit girişten düşülür)
      varsayilanTedarikVade: 90
    },
    kategoriler: kat,
    tedarikciler: [{ id: yeniId(), ad: 'Ana Depo', vadeGun: 90, aktif: true }],
    personel: [],
    giderler: VARSAYILAN_GIDERLER.map(([g, a, t]) => ({ id: yeniId(), grup: g, ad: a, tutar: t, aktif: true })),
    primGruplari: [],
    /* Ürün hedeflerinin toplamı, ciro primine ön koşul olarak bağlanabilir */
    urunOnKosul: { aktif:false, kural:'kesin', altSinir:0.9, kapsam:'primsiz' },
    urunler: [],       // kutu bazlı hedef konulan ürünler
    urunSatis: {},     // "YYYY-MM" → { urunId: { persId: adet } }
    veri: {},          // "YYYY-MM" → { kat:{katId:tutar}, muayene, katilim, fark, isGunu, tahmin, hesapDisi }
    alimlar: {},       // "YYYY-MM" → { tedId: {alim, iade} }
    stok: {},          // "YYYY-MM" → { grupAdi: tutar }
    giderAy: {},       // "YYYY-MM" → { giderId: tutar }  (o aya özel sapma)
    persSatis: {}      // "YYYY-MM" → { persId: { katId: {adet, ciro} } }
  };
}

/* =========================================================
   BÖLÜM 3 — Hesap motoru (saf fonksiyonlar)
   ========================================================= */
const H = {
  /* --- ham erişim --- */
  ay(e, k){
    if (!e.veri[k]) e.veri[k] = { kat:{}, muayene:0, katilim:0, fark:0, isGunu:null, tahmin:false, hesapDisi:0 };
    const a = e.veri[k];
    if (!a.kat) a.kat = {};
    return a;
  },
  ayOku(e, k){ return e.veri[k] || null; },

  kategori(e, id){ return e.kategoriler.find(k => k.id === id); },
  aktifKat(e){ return e.kategoriler.filter(k => k.aktif); },

  /** Bir aydaki kategori cirosu */
  katCiro(e, k, katId){ const a = e.veri[k]; return a && a.kat ? (+a.kat[katId] || 0) : 0; },

  /** Tipe göre toplam: 'sgk' | 'ozel' | 'perakende' */
  tipCiro(e, k, tip){
    return topla(e.kategoriler.filter(c => c.aktif && c.tip === tip).map(c => H.katCiro(e, k, c.id)));
  },

  /** Ek nakit kalemleri (muayene + katılım + fark) */
  ekNakit(e, k){ const a = e.veri[k]; return a ? (+a.muayene || 0) + (+a.katilim || 0) + (+a.fark || 0) : 0; },

  /** O ayın kasaya aynı ay giren cirosu (perakende + ek kalemler) */
  nakitCiro(e, k){ return H.tipCiro(e, k, 'perakende') + H.ekNakit(e, k); },

  /** O ayın toplam cirosu (SGK + özel + nakit) */
  toplamCiro(e, k){ return H.tipCiro(e, k, 'sgk') + H.tipCiro(e, k, 'ozel') + H.nakitCiro(e, k); },

  /** Ayda veri var mı? */
  doluMu(e, k){
    const a = e.veri[k]; if (!a) return false;
    return H.toplamCiro(e, k) > 0;
  },
  tahminMi(e, k){ const a = e.veri[k]; return !!(a && a.tahmin); },

  isGunu(e, k){ const a = e.veri[k]; return (a && a.isGunu) ? +a.isGunu : varsayilanIsGunu(k); },

  /* --- vade / nakit akış --- */
  vadeAy(gun){ return Math.max(0, Math.round((+gun || 0) / 30)); },

  /**
   * Kasaya o ay fiilen giren para.
   * Perakende + ek kalemler bu ay; SGK, kesildiği aydan sgkVade sonra;
   * Özel sigorta, kesildiği aydan ozelVade sonra tahsil edilir.
   */
  nakitGiris(e, k){
    const sv = H.vadeAy(e.ayar.sgkVadeGun), ov = H.vadeAy(e.ayar.ozelVadeGun);
    const perakende = H.tipCiro(e, k, 'perakende') + H.ekNakit(e, k);
    const kk = kis(+e.ayar.kkKomisyon || 0, 0, 0.2);
    return perakende * (1 - kk)
         + H.tipCiro(e, ayEkle(k, -sv), 'sgk')
         + H.tipCiro(e, ayEkle(k, -ov), 'ozel');
  },

  /** Nakit girişinin kaynak kırılımı */
  nakitKirilim(e, k){
    const sv = H.vadeAy(e.ayar.sgkVadeGun), ov = H.vadeAy(e.ayar.ozelVadeGun);
    return {
      perakende: H.tipCiro(e, k, 'perakende') + H.ekNakit(e, k),
      sgk:  H.tipCiro(e, ayEkle(k, -sv), 'sgk'),
      ozel: H.tipCiro(e, ayEkle(k, -ov), 'ozel'),
      sgkKaynak: ayEkle(k, -sv), ozelKaynak: ayEkle(k, -ov)
    };
  },

  /* --- depo / tedarikçi --- */
  alimKayit(e, k, tedId){
    const a = e.alimlar[k];
    const r = a && a[tedId] ? a[tedId] : null;
    return { alim: r ? (+r.alim || 0) : 0, iade: r ? (+r.iade || 0) : 0 };
  },
  netAlim(e, k, tedId){ const r = H.alimKayit(e, k, tedId); return r.alim - r.iade; },
  toplamAlim(e, k){ return topla(e.tedarikciler.map(t => H.alimKayit(e, k, t.id).alim)); },
  toplamIade(e, k){ return topla(e.tedarikciler.map(t => H.alimKayit(e, k, t.id).iade)); },
  netAlimToplam(e, k){ return H.toplamAlim(e, k) - H.toplamIade(e, k); },

  /** O ay ödenmesi gereken tedarikçi borcu (her tedarikçi kendi vadesiyle geri kaydırılır) */
  tedarikOdeme(e, k){
    return topla(e.tedarikciler.map(t => H.netAlim(e, ayEkle(k, -H.vadeAy(t.vadeGun)), t.id)));
  },
  tedarikOdemeKirilim(e, k){
    return e.tedarikciler.map(t => {
      const kaynak = ayEkle(k, -H.vadeAy(t.vadeGun));
      return { ted:t, kaynak, tutar:H.netAlim(e, kaynak, t.id) };
    }).filter(r => r.tutar !== 0);
  },

  /** O ayki alımın ortalama vadesi (alım hacmine göre ağırlıklı, yoksa varsayılan) */
  ortVadeAy(e, k){
    let agirlik = 0, top = 0;
    e.tedarikciler.forEach(t => {
      const n = Math.max(0, H.netAlim(e, k, t.id));
      if (n > 0) { agirlik += n; top += n * H.vadeAy(t.vadeGun); }
    });
    if (agirlik > 0) return Math.round(top / agirlik);
    const akt = e.tedarikciler.filter(t => t.aktif !== false);
    if (akt.length) return Math.round(topla(akt.map(t => H.vadeAy(t.vadeGun))) / akt.length);
    return H.vadeAy(e.ayar.varsayilanTedarikVade);
  },

  /**
   * Alım kapasitesi: bu ay alınan mal, ortalama vade kadar sonra ödenir.
   * O tarihte kasaya girecek nakdin disiplin oranı kadarı harcanabilir.
   * Ödeme ayının kendi ciro verisi yoksa kapasite hesaplanamaz → null döner
   * (aksi hâlde yılın son ayları her zaman sahte "sınır aşıldı" verirdi).
   */
  alimKapasitesi(e, k){
    const hedef = ayEkle(k, H.ortVadeAy(e, k));
    if (!H.doluMu(e, hedef)) return null;
    return (+e.ayar.disiplinOrani || 0.7) * H.nakitGiris(e, hedef);
  },

  /* --- giderler --- */
  rutinGider(e, k){
    const sapma = e.giderAy[k] || {};
    return topla(e.giderler.filter(g => g.aktif !== false).map(g => H.giderTutar(e, k, g)));
  },
  /** Bir gider kaleminin o aydaki tutarı: aya özel sapma > o yılın sabiti > eski global */
  giderTutar(e, k, g){
    const s = (e.giderAy[k] || {})[g.id];
    if (s !== undefined && s !== null && s !== '') return +s || 0;
    return H.giderYil(g, ayYil(k));
  },
  /** Bir gider kaleminin bir yıldaki aylık sabit tutarı */
  giderYil(g, y){
    const v = (g.yil || {})[y];
    if (v !== undefined && v !== null && v !== '') return +v || 0;
    return +g.tutar || 0;                       // eski kayıtlar için
  },
  giderYiliVar(g, y){
    const v = (g.yil || {})[y];
    return v !== undefined && v !== null && v !== '';
  },
  hesapDisi(e, k){ const a = e.veri[k]; return a ? (+a.hesapDisi || 0) : 0; },

  /* --- kâr --- */
  /** Nakit brüt kâr = kasaya giren − tedarikçiye ödenen */
  brutKar(e, k){ return H.nakitGiris(e, k) - H.tedarikOdeme(e, k); },
  /** Net = brüt − rutin gider − hesap dışı */
  netKar(e, k){ return H.brutKar(e, k) - H.rutinGider(e, k) - H.hesapDisi(e, k); },

  /** Ürün bazlı gerçek brüt kâr (kategori kâr marjlarıyla) */
  urunBrutKar(e, k){
    return topla(e.kategoriler.filter(c => c.aktif).map(c => H.katCiro(e, k, c.id) * (+c.karMarji || 0)))
         + H.ekNakit(e, k);
  },

  /** Bir ayın tüm özet satırı */
  ozet(e, k){
    const giris = H.nakitGiris(e, k), odeme = H.tedarikOdeme(e, k),
          gider = H.rutinGider(e, k), hd = H.hesapDisi(e, k);
    const brut = giris - odeme, net = brut - gider - hd;
    return {
      ay:k, giris, odeme, gider, hesapDisi:hd, toplamGider: odeme + gider + hd,
      brut, net,
      brutY: giris ? brut / giris : null,
      netY:  giris ? net  / giris : null,
      ciro: H.toplamCiro(e, k),
      alim: H.netAlimToplam(e, k),
      kapasite: H.alimKapasitesi(e, k)
    };
  },

  /* --- yıl toplamları --- */
  yilCiro(e, y){ return topla(yilAylari(y).map(k => H.toplamCiro(e, k))); },
  yilKatCiro(e, y, katId){ return topla(yilAylari(y).map(k => H.katCiro(e, k, katId))); },
  yilOzet(e, y){
    const a = yilAylari(y).map(k => H.ozet(e, k));
    const t = (f) => topla(a.map(x => x[f]));
    const giris = t('giris');
    return {
      aylar:a, giris, odeme:t('odeme'), gider:t('gider'), hesapDisi:t('hesapDisi'),
      brut:t('brut'), net:t('net'), ciro:t('ciro'), alim:t('alim'),
      brutY: giris ? t('brut')/giris : null,
      netY:  giris ? t('net')/giris  : null
    };
  },

  /** Yılın hangi ayları gerçek veri, hangileri tahmin */
  yilDurum(e, y){
    return yilAylari(y).map(k => ({ ay:k, dolu:H.doluMu(e, k), tahmin:H.tahminMi(e, k) }));
  },

  /* --- kutu bazlı ürün hedefi ve primi ---
     Prim isteğe bağlıdır: primTipi 'yok' ise ürün yalnızca takip edilir. */
  /** Ürün hedefi aya özeldir: yalnızca hedef verilen aylarda değer taşır */
  urunHedef(e, u, k){
    const a = (u.hedefAy || {})[k];
    return (a === undefined || a === null || a === '') ? 0 : (+a || 0);
  },
  /** Bir yılda kaç aya hedef verilmiş */
  urunHedefliAylar(u, y){
    return yilAylari(y).filter(k => {
      const a = (u.hedefAy || {})[k];
      return a !== undefined && a !== null && a !== '' && +a > 0;
    });
  },
  urunAdet(e, k, uId, pId){
    const a = (e.urunSatis[k] || {})[uId];
    return a ? (+a[pId] || 0) : 0;
  },
  /** Bir ürünün o ay toplam satışı — yalnızca kayıtlı personelin adetleri sayılır,
      böylece silinmiş bir kişiden kalan yetim kayıt hedefi şişirmez. */
  urunToplam(e, k, uId){
    const a = (e.urunSatis[k] || {})[uId];
    if (!a) return 0;
    return topla(e.personel.map(p => +a[p.id] || 0));
  },
  /** Kişinin o üründen sattığı adede karşılık gelen kutu başı tutar */
  kutuTutari(u, adet){
    if (u.primTipi === 'sabit') return +u.kutuPrim || 0;
    if (u.primTipi === 'kademe'){
      let t = 0;
      [...(u.kademeler || [])].filter(x => +x.adet > 0).sort((a, b) => a.adet - b.adet)
        .forEach(x => { if (adet >= +x.adet) t = +x.tutar || 0; });
      return t;
    }
    return 0;
  },
  /**
   * Hedef kuralının prim çarpanı (0–1). Ekip gerçekleşmesine bakar.
   *  · 'yok'      — hedeften bağımsız, tam ödeme
   *  · 'kesin'    — hedef tutmazsa hiç ödeme
   *  · 'kademeli' — alt sınırın altında ödeme yok, alt sınır ile %100 arasında
   *                 gerçekleşme oranı kadar, %100 üstünde tam ödeme
   */
  urunCarpan(e, k, u){
    const kural = u.hedefKurali || 'yok';
    if (kural === 'yok') return 1;
    const hedef = H.urunHedef(e, u, k);
    if (!hedef) return 1;                      // hedef girilmemişse kural işlemez
    const oran = H.urunToplam(e, k, u.id) / hedef;
    if (kural === 'kesin') return oran >= 1 ? 1 : 0;
    const alt = kis(u.altSinir == null ? 0.9 : +u.altSinir, 0, 1);
    if (oran < alt) return 0;
    return Math.min(1, oran);
  },
  /** Bir kişinin bir üründeki hak edişi */
  urunPrim(e, k, u, pId){
    if (u.primTipi === 'yok') return 0;
    const carpan = H.urunCarpan(e, k, u);
    if (!carpan) return 0;
    const adet = H.urunAdet(e, k, u.id, pId);
    return adet * H.kutuTutari(u, adet) * carpan;
  },
  aktifUrun(e){ return e.urunler.filter(u => u.aktif !== false); },
  /** O ayın ürünleri: hedef verilmiş olanlar + (veri kaybolmasın diye) satışı girilmiş olanlar */
  ayUrunleri(e, k){
    return H.aktifUrun(e).filter(u => H.urunHedef(e, u, k) > 0 || H.urunToplam(e, k, u.id) > 0);
  },
  /** Bir ayın tüm ürün özeti */
  urunOzet(e, k){
    const urunler = H.ayUrunleri(e, k);
    const pers = H.ayPersoneli(e, k);
    const satirlar = urunler.map(u => {
      const hedef = H.urunHedef(e, u, k);
      const satilan = H.urunToplam(e, k, u.id);
      const kisi = pers.map(p => {
        const adet = H.urunAdet(e, k, u.id, p.id);
        return { p, adet, tutar: H.kutuTutari(u, adet), prim: H.urunPrim(e, k, u, p.id) };
      });
      return { u, hedef, satilan, kisi,
        prim: topla(kisi.map(x => x.prim)),
        carpan: H.urunCarpan(e, k, u),
        hamPrim: topla(kisi.map(x => x.adet * H.kutuTutari(u, x.adet))),
        oran: hedef ? satilan / hedef : null,
        kalan: hedef ? hedef - satilan : null };
    });
    const kisi = pers.map(p => ({
      p,
      adet: topla(satirlar.map(s => H.urunAdet(e, k, s.u.id, p.id))),
      prim: topla(satirlar.map(s => H.urunPrim(e, k, s.u, p.id)))
    }));
    const satilanT = topla(satirlar.map(s => s.satilan));
    /* Gerçekleşme yalnızca o ay hedef verilmiş ürünler üzerinden ölçülür */
    const hedefli = satirlar.filter(s => s.hedef > 0);
    return { urunler:satirlar, kisi, pers, hedefli,
      hedefliSatilan: topla(hedefli.map(s => s.satilan)),
      hedefT: topla(hedefli.map(s => s.hedef)),
      satilanT, primT: topla(satirlar.map(s => s.prim)),
      primliMi: urunler.some(u => u.primTipi !== 'yok') };
  },
  urunYilPrim(e, y){ return topla(yilAylari(y).map(k => H.urunOzet(e, k).primT)); },

  /**
   * Ürün hedefi ön koşulu — ciro primine uygulanacak çarpan.
   * Kutu primi tanımlı ürünler kendi hedef kurallarıyla çalışır; burada
   * varsayılan olarak yalnızca <b>primsiz</b> ürünlerin hedefleri toplanır ve
   * tek bir toplam kutu hedefi olarak ciro primine ön koşul olur.
   */
  urunOnKosul(e, k){
    const ok = e.urunOnKosul || {};
    const kapsamli = H.ayUrunleri(e, k).filter(u => ok.kapsam === 'tumu' || u.primTipi === 'yok');
    const urunler = kapsamli.map(u => ({
      u, hedef: H.urunHedef(e, u, k), satilan: H.urunToplam(e, k, u.id)
    })).filter(x => x.hedef > 0);   // yalnızca o ay hedef verilmiş ürünler
    const hedef = topla(urunler.map(x => x.hedef));
    const satilan = topla(urunler.map(x => x.satilan));
    const oran = hedef ? satilan / hedef : null;
    const alt = kis(ok.altSinir == null ? 0.9 : +ok.altSinir, 0, 1);
    let carpan = 1;
    const uygulandi = !!ok.aktif && hedef > 0;
    if (uygulandi){
      if (ok.kural === 'kademeli') carpan = oran < alt ? 0 : Math.min(1, oran);
      else carpan = oran >= 1 ? 1 : 0;
    }
    return { aktif:!!ok.aktif, kural:ok.kural, kapsam:ok.kapsam, altSinir:alt,
             urunler, hedef, satilan, oran, carpan, uygulandi };
  },

  /* --- hedefler ---
     Hedef günlük ciro olarak belirlenir; aylık hedef, o ayın iş günü sayısıyla
     çarpılarak bulunur. Böylece 24 günlük ay ile 27 günlük ay adil karşılaştırılır. */
  gunlukHedef(e, k){
    const h = e.hedef || {};
    const a = (h.gunlukAy || {})[k];
    if (a !== undefined && a !== null && a !== '') return +a || 0;   // aya özel
    const y = (h.yil || {})[ayYil(k)];
    if (y !== undefined && y !== null && y !== '') return +y || 0;   // o yılın varsayılanı
    return +h.varsayilanGunluk || 0;                                  // eski kayıtlar için
  },
  /** Bir yılın varsayılan günlük hedefi tanımlı mı? */
  yilHedefiVar(e, y){
    const v = ((e.hedef || {}).yil || {})[y];
    return v !== undefined && v !== null && v !== '' && +v > 0;
  },
  aylikHedef(e, k){ return H.gunlukHedef(e, k) * H.isGunu(e, k); },
  hedefDurum(e, k){
    const hedef = H.aylikHedef(e, k), ciro = H.toplamCiro(e, k);
    const gun = H.isGunu(e, k);
    return {
      ay:k, gun, gunlukHedef:H.gunlukHedef(e, k), hedef, ciro,
      gunlukCiro: gun ? ciro / gun : null,
      fark: hedef ? ciro - hedef : null,
      oran: hedef ? ciro / hedef : null
    };
  },
  yilHedef(e, y){ return topla(yilAylari(y).map(k => H.aylikHedef(e, k))); },

  /* --- stok --- */
  stokGruplari(e){
    const g = [];
    e.kategoriler.filter(k => k.aktif).forEach(k => {
      const ad = k.stokGrubu || k.ad;
      if (!g.includes(ad)) g.push(ad);
    });
    return g;
  },
  /** Bir stok grubunun o ayki satışı (gruba bağlı tüm kategorilerin toplamı) */
  grupSatis(e, k, grup){
    return topla(e.kategoriler.filter(c => c.aktif && (c.stokGrubu || c.ad) === grup).map(c => H.katCiro(e, k, c.id)));
  },
  grupStok(e, k, grup){ const s = e.stok[k]; return s ? (+s[grup] || 0) : 0; },
  stokAnaliz(e, k){
    const gruplar = H.stokGruplari(e);
    const sat = gruplar.map(g => H.grupSatis(e, k, g));
    const stk = gruplar.map(g => H.grupStok(e, k, g));
    const satT = topla(sat), stkT = topla(stk);
    return gruplar.map((g, i) => ({
      grup:g, satis:sat[i], stok:stk[i],
      satisPay: satT ? sat[i]/satT : null,
      stokPay:  stkT ? stk[i]/stkT : null,
      devir:    stk[i] ? sat[i]/stk[i] : null,
      ayOmru:   sat[i] ? stk[i]/sat[i] : null,
      sapma:   (satT && stkT) ? (stk[i]/stkT) - (sat[i]/satT) : null
    }));
  },

  /* --- personel ---
     Pasife alınan kişi yeni giriş listelerinden çıkar, ama geçmiş ayların
     satışları ve prim hesapları olduğu gibi kalmalıdır. Bu yüzden hesaplarda
     "o ay verisi olan herkes" kullanılır, yalnızca aktif olanlar değil. */
  persVeriVar(e, k, pId){
    const r = (e.persSatis[k] || {})[pId];
    if (r && Object.values(r).some(x => (+x.adet || 0) || (+x.ciro || 0))) return true;
    /* Kutu bazlı ürün satışı da o ay için veri sayılır */
    const u = e.urunSatis[k] || {};
    return Object.values(u).some(x => +x[pId] || 0);
  },
  /** O ayda hesaba katılacak personel: halen çalışanlar + o ay verisi olanlar */
  ayPersoneli(e, k){
    return e.personel.filter(p => p.aktif !== false || H.persVeriVar(e, k, p.id));
  },
  /** Yıl boyunca hesaba katılacak personel */
  yilPersoneli(e, y){
    return e.personel.filter(p => p.aktif !== false
      || yilAylari(y).some(k => H.persVeriVar(e, k, p.id)));
  },

  persKayit(e, k, pId, katId){
    const a = e.persSatis[k]; const p = a && a[pId] ? a[pId] : null;
    const r = p ? p[katId] : null;
    return { adet: r ? (+r.adet || 0) : 0, ciro: r ? (+r.ciro || 0) : 0 };
  },
  persToplam(e, k, pId){
    let adet = 0, ciro = 0;
    e.kategoriler.filter(c => c.aktif).forEach(c => { const r = H.persKayit(e, k, pId, c.id); adet += r.adet; ciro += r.ciro; });
    return { adet, ciro, sepet: adet ? ciro/adet : null };
  }
};

/* =========================================================
   BÖLÜM 4 — Grafik yardımcıları (elle çizilen SVG)
   ========================================================= */
const SERI = ['var(--s1)','var(--s2)','var(--s3)','var(--s4)','var(--s5)','var(--s6)','var(--s7)','var(--s8)'];
const seriRenk = i => SERI[((i % 8) + 8) % 8];

/** Eksen için hoş yuvarlak adım */
function adimSec(aralik, hedef){
  if (!(aralik > 0)) return 1;
  const ham = aralik / Math.max(1, hedef);
  const us = Math.pow(10, Math.floor(Math.log10(ham)));
  const n = ham / us;
  const g = n <= 1 ? 1 : n <= 2 ? 2 : n <= 2.5 ? 2.5 : n <= 5 ? 5 : 10;
  return g * us;
}
function eksenSinir(min, max, adet = 4){
  if (min === max) { if (min === 0) return { alt:0, ust:1, adim:0.25 }; min = Math.min(0, min); max = Math.max(0, max); }
  const a = adimSec(max - min, adet);
  return { alt: Math.floor(min / a) * a, ust: Math.ceil(max / a) * a, adim: a };
}

/** Kıvılcım çizgisi (KPI kutuları) */
function kivilcim(degerler, renk){
  const d = degerler.filter(v => isFinite(v));
  if (d.length < 2) return '<div style="height:30px"></div>';
  const G = 100, Y = 30, p = 2;
  const mn = Math.min(...d, 0), mx = Math.max(...d);
  const ar = (mx - mn) || 1;
  const x = i => p + i * (G - 2*p) / (d.length - 1);
  const y = v => Y - p - ((v - mn) / ar) * (Y - 2*p);
  const cizgi = d.map((v, i) => (i ? 'L' : 'M') + x(i).toFixed(1) + ' ' + y(v).toFixed(1)).join(' ');
  const alan = cizgi + ` L${x(d.length-1).toFixed(1)} ${Y-p} L${x(0).toFixed(1)} ${Y-p} Z`;
  const gid = 'kv' + yeniId();
  return `<svg class="gr" viewBox="0 0 ${G} ${Y}" preserveAspectRatio="none" style="height:30px" aria-hidden="true">
    <defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="${renk}" stop-opacity=".26"/><stop offset="1" stop-color="${renk}" stop-opacity="0"/>
    </linearGradient></defs>
    <path d="${alan}" fill="url(#${gid})"/>
    <path d="${cizgi}" fill="none" stroke="${renk}" stroke-width="1.6" vector-effect="non-scaling-stroke"
      stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="${x(d.length-1).toFixed(1)}" cy="${y(d[d.length-1]).toFixed(1)}" r="2" fill="${renk}"
      vector-effect="non-scaling-stroke"/>
  </svg>`;
}

/**
 * Çok serili çizgi grafiği. seriler: [{ad, renk, veri:[num|null], kesik:[bool]}]
 * Kesikli parça = tahmin.
 */
function cizgiGrafik(etiketler, seriler, sec = {}){
  const G = sec.genislik || 900, Y = sec.yukseklik || 260;
  const sl = 62, sg = 14, ust = 12, alt = 26;
  const gs = G - sl - sg, gy = Y - ust - alt;
  const tumu = seriler.flatMap(s => s.veri).filter(v => v != null && isFinite(v));
  if (!tumu.length) return `<div class="bos">Bu grafik için henüz veri yok.</div>`;
  const { alt:a0, ust:a1, adim } = eksenSinir(Math.min(0, ...tumu), Math.max(...tumu), 4);
  const x = i => sl + (etiketler.length === 1 ? gs/2 : i * gs / (etiketler.length - 1));
  const y = v => ust + gy - ((v - a0) / ((a1 - a0) || 1)) * gy;
  const bicim = sec.bicim || TLk;

  let s = '';
  for (let v = a0; v <= a1 + 1e-9; v += adim){
    s += `<line class="eks" x1="${sl}" y1="${y(v).toFixed(1)}" x2="${G-sg}" y2="${y(v).toFixed(1)}"/>`;
    s += `<text x="${sl-8}" y="${(y(v)+3.5).toFixed(1)}" text-anchor="end">${bicim(v)}</text>`;
  }
  if (a0 < 0) s += `<line class="sfr" x1="${sl}" y1="${y(0).toFixed(1)}" x2="${G-sg}" y2="${y(0).toFixed(1)}"/>`;

  etiketler.forEach((e, i) => {
    if (etiketler.length > 14 && i % 2) return;
    s += `<text x="${x(i).toFixed(1)}" y="${Y-8}" text-anchor="middle">${kacis(e)}</text>`;
  });

  seriler.forEach(sr => {
    const parcalar = [];
    let cari = null;
    sr.veri.forEach((v, i) => {
      if (v == null || !isFinite(v)) { cari = null; return; }
      const k = !!(sr.kesik && sr.kesik[i]);
      if (!cari || cari.kesik !== k) {
        if (cari && cari.n.length) { const son = cari.n[cari.n.length-1]; parcalar.push(cari); cari = { kesik:k, n:[son] }; }
        else cari = { kesik:k, n:[] };
        parcalar.push(cari);
      }
      cari.n.push({ i, v });
    });
    const bnz = [...new Set(parcalar)];
    bnz.forEach(p => {
      if (p.n.length < 1) return;
      const d = p.n.map((q, j) => (j ? 'L' : 'M') + x(q.i).toFixed(1) + ' ' + y(q.v).toFixed(1)).join(' ');
      s += `<path d="${d}" fill="none" stroke="${sr.renk}" stroke-width="2" stroke-linejoin="round"
        stroke-linecap="round" ${p.kesik ? 'stroke-dasharray="5 4" opacity=".85"' : ''}/>`;
    });
    sr.veri.forEach((v, i) => {
      if (v == null || !isFinite(v)) return;
      if (etiketler.length <= 14 || !(i % 2))
        s += `<circle cx="${x(i).toFixed(1)}" cy="${y(v).toFixed(1)}" r="3" fill="${sr.renk}"
          stroke="var(--kart)" stroke-width="2"/>`;
    });
  });

  const alan = etiketler.map((e, i) =>
    `<rect x="${(x(i) - gs/(etiketler.length*2) - 1).toFixed(1)}" y="${ust}"
      width="${(gs/etiketler.length + 2).toFixed(1)}" height="${gy}" fill="transparent"
      data-i="${i}" class="vurgAlan" style="cursor:crosshair"/>`).join('');

  return `<svg class="gr" viewBox="0 0 ${G} ${Y}" role="img">
    ${s}<line class="kilavuz" stroke="var(--mrk3)" stroke-width="1" stroke-dasharray="3 3" x1="0" y1="${ust}" x2="0" y2="${ust+gy}" opacity="0"/>
    ${alan}</svg>`;
}

/** Gruplu / yığın dikey sütun grafiği */
function sutunGrafik(etiketler, seriler, sec = {}){
  const G = sec.genislik || 900, Y = sec.yukseklik || 260;
  const sl = 62, sg = 14, ust = 12, alt = 26;
  const gs = G - sl - sg, gy = Y - ust - alt;
  const yigin = !!sec.yigin;
  const bicim = sec.bicim || TLk;

  let mn = 0, mx = 0;
  if (yigin){
    etiketler.forEach((_, i) => {
      let p = 0, n = 0;
      seriler.forEach(s => { const v = +s.veri[i] || 0; if (v >= 0) p += v; else n += v; });
      mx = Math.max(mx, p); mn = Math.min(mn, n);
    });
  } else {
    seriler.forEach(s => s.veri.forEach(v => { if (v == null) return; mx = Math.max(mx, v); mn = Math.min(mn, v); }));
  }
  if (mx === 0 && mn === 0) return `<div class="bos">Bu grafik için henüz veri yok.</div>`;
  const { alt:a0, ust:a1, adim } = eksenSinir(mn, mx, 4);
  const y = v => ust + gy - ((v - a0) / ((a1 - a0) || 1)) * gy;
  const grupG = gs / etiketler.length;
  const ic = Math.min(34, grupG * 0.72);
  const sutunG = yigin ? ic : ic / seriler.length;

  let s = '';
  for (let v = a0; v <= a1 + 1e-9; v += adim){
    s += `<line class="eks" x1="${sl}" y1="${y(v).toFixed(1)}" x2="${G-sg}" y2="${y(v).toFixed(1)}"/>`;
    s += `<text x="${sl-8}" y="${(y(v)+3.5).toFixed(1)}" text-anchor="end">${bicim(v)}</text>`;
  }
  s += `<line class="sfr" x1="${sl}" y1="${y(0).toFixed(1)}" x2="${G-sg}" y2="${y(0).toFixed(1)}"/>`;

  etiketler.forEach((et, i) => {
    const gx = sl + i * grupG + grupG/2;
    if (etiketler.length <= 16 || !(i % 2))
      s += `<text x="${gx.toFixed(1)}" y="${Y-8}" text-anchor="middle">${kacis(et)}</text>`;
    if (yigin){
      let poz = 0, neg = 0;
      seriler.forEach(sr => {
        const v = +sr.veri[i] || 0; if (!v) return;
        const bas = v > 0 ? poz : neg, son = bas + v;
        const y1 = y(Math.max(bas, son)), y2 = y(Math.min(bas, son));
        const h = Math.max(0, y2 - y1 - 2);
        s += `<rect x="${(gx - ic/2).toFixed(1)}" y="${y1.toFixed(1)}" width="${ic.toFixed(1)}" height="${h.toFixed(1)}"
          fill="${sr.renk}" rx="2"/>`;
        if (v > 0) poz = son; else neg = son;
      });
    } else {
      seriler.forEach((sr, j) => {
        const v = +sr.veri[i] || 0;
        const x0 = gx - ic/2 + j * sutunG;
        const y1 = y(Math.max(0, v)), y2 = y(Math.min(0, v));
        const h = Math.max(0, y2 - y1);
        s += `<rect x="${x0.toFixed(1)}" y="${y1.toFixed(1)}" width="${Math.max(1, sutunG-2).toFixed(1)}"
          height="${h.toFixed(1)}" fill="${sr.renk}" rx="${Math.min(4, sutunG/3).toFixed(1)}"
          ${sr.desen ? 'opacity=".55"' : ''}/>`;
      });
    }
    s += `<rect x="${(sl + i*grupG).toFixed(1)}" y="${ust}" width="${grupG.toFixed(1)}" height="${gy}"
      fill="transparent" data-i="${i}" class="vurgAlan" style="cursor:pointer"/>`;
  });

  return `<svg class="gr" viewBox="0 0 ${G} ${Y}" role="img">${s}</svg>`;
}

/** Yatay çubuk — kategori dağılımı için */
function yatayGrafik(satirlar, sec = {}){
  if (!satirlar.length) return `<div class="bos">Veri yok.</div>`;
  const mx = Math.max(...satirlar.map(s => Math.abs(s.deger)), 1);
  const bicim = sec.bicim || TL;
  return `<div style="display:flex;flex-direction:column;gap:9px">` + satirlar.map(s => `
    <div>
      <div style="display:flex;align-items:baseline;gap:8px;font-size:12.5px">
        <i style="width:9px;height:9px;border-radius:2px;background:${s.renk};flex:none"></i>
        <span style="min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${kacis(s.ad)}</span>
        <span class="num" style="margin-left:auto;font-weight:600">${bicim(s.deger)}</span>
        ${s.yan ? `<span class="num mono" style="color:var(--mrk3);font-size:11px;min-width:44px;text-align:right">${s.yan}</span>` : ''}
      </div>
      <div style="height:6px;border-radius:3px;background:var(--cizgi2);margin-top:4px;overflow:hidden">
        <div style="height:100%;width:${(Math.abs(s.deger)/mx*100).toFixed(1)}%;background:${s.renk};border-radius:3px"></div>
      </div>
    </div>`).join('') + `</div>`;
}

/** Efsane (legend) */
function efsane(oge, cizgiMi){
  return `<div class="efsane">` + oge.map(o =>
    `<div><i class="${cizgiMi ? 'cizgi' : ''}" style="background:${o.renk}${o.kesik ? ';opacity:.55' : ''}"></i>${kacis(o.ad)}</div>`
  ).join('') + `</div>`;
}

/** Grafik + ipucu sarmalayıcı: ipucu içeriğini geri çağırım üretir */
function grafikSar(html, ipucuUret){
  const id = 'g' + yeniId();
  return { html:`<div class="grSar" id="${id}">${html}<div class="ipucu"></div></div>`, id, ipucuUret };
}
function grafikBagla(sarmal){
  const kok = document.getElementById(sarmal.id);
  if (!kok || !sarmal.ipucuUret) return;
  const ip = kok.querySelector('.ipucu');
  const kilavuz = kok.querySelector('.kilavuz');
  kok.querySelectorAll('.vurgAlan').forEach(a => {
    a.addEventListener('mouseenter', ev => {
      const i = +a.dataset.i;
      ip.innerHTML = sarmal.ipucuUret(i);
      ip.classList.add('gor');
      if (kilavuz){
        const x = +a.getAttribute('x') + +a.getAttribute('width')/2;
        kilavuz.setAttribute('x1', x); kilavuz.setAttribute('x2', x); kilavuz.setAttribute('opacity', '.5');
      }
    });
    a.addEventListener('mousemove', ev => {
      const r = kok.getBoundingClientRect();
      let x = ev.clientX - r.left + 14, y = ev.clientY - r.top - 10;
      const g = ip.offsetWidth || 170;
      if (x + g > r.width) x = ev.clientX - r.left - g - 14;
      ip.style.left = Math.max(0, x) + 'px';
      ip.style.top  = Math.max(0, Math.min(y, r.height - (ip.offsetHeight || 60))) + 'px';
    });
  });
  kok.addEventListener('mouseleave', () => {
    ip.classList.remove('gor');
    if (kilavuz) kilavuz.setAttribute('opacity', '0');
  });
}

/* Sayfa çizimlerinde biriken ipucu bağlamaları */
let bekleyenGrafikler = [];
function G(html, ipucuUret){
  const s = grafikSar(html, ipucuUret);
  bekleyenGrafikler.push(s);
  return s.html;
}
function grafikleriBagla(){ bekleyenGrafikler.forEach(grafikBagla); bekleyenGrafikler = []; }

function ipSatir(renk, ad, deger){

/* =========================================================
   BÖLÜM 5 — Ortak arayüz parçaları
   ========================================================= */

function kpi(etiket, deger, sec = {}){
  const d = sec.delta;
  let dh = '';
  if (d != null && isFinite(d)){
    const s = d > 0.0005 ? 'p' : d < -0.0005 ? 'n' : 'z';
    const ok = d > 0.0005 ? '▲' : d < -0.0005 ? '▼' : '■';
    dh = `<span class="delta ${sec.tersDelta ? (s === 'p' ? 'n' : s === 'n' ? 'p' : 'z') : s}">${ok} %${nfSay1.format(Math.abs(d*100))}</span>`;
  }
  return `<div class="kpi">
    <div class="et">${kacis(etiket)}</div>
    <div class="dg ${sec.renkli && isFinite(sec.ham) ? (sec.ham < 0 ? 'neg' : 'poz') : ''}">${deger}</div>
    <div class="alt">${dh}${sec.not ? `<span class="not">${kacis(sec.not)}</span>` : ''}</div>
    ${sec.kivilcim ? `<div class="kivi">${kivilcim(sec.kivilcim, sec.kivilcimRenk || 'var(--s1)')}</div>` : ''}
  </div>`;
}

function kart(baslik, altYazi, govde, sag, govdeSinif){
  return `<section class="kart">
    <div class="kartBas"><div><h3>${baslik}</h3>${altYazi ? `<p>${altYazi}</p>` : ''}</div>
      ${sag ? `<div class="sag">${sag}</div>` : ''}</div>
    <div class="kartGovde ${govdeSinif || ''}">${govde}</div>
  </section>`;
}

const bosKart = m => `<div class="bos">${kacis(m)}</div>`;

/** Sayısal tablo hücresi girdisi */
function hucre(deger, veri, sec = {}){
  const g = Object.entries(veri).map(([k, v]) => `data-${k}="${kacis(v)}"`).join(' ');
  const gos = (deger === 0 || deger == null || deger === '') ? '' : nfSay.format(deger);
  return `<input class="hucre num ${sec.sinif || ''}" inputmode="decimal" ${g}
    value="${gos}" placeholder="${sec.yer || '·'}" aria-label="${kacis(sec.etiket || '')}">`;
}

/** Izgara girdilerini tek bir dinleyiciyle bağla (olay yetkilendirme) */
function izgaraBagla(kok, uygula){
  kok.addEventListener('change', e => {
    const t = e.target;
    if (!t.classList.contains('hucre')) return;
    const v = sayiOku(t.value);
    uygula(t, v);
    t.value = (v == null || v === 0) ? '' : nfSay.format(v);
    kaydet();
  });
  /* Ok tuşlarıyla gezinme */
  kok.addEventListener('keydown', e => {
    const t = e.target;
    if (!t.classList.contains('hucre')) return;
    const yon = { ArrowUp:[-1,0], ArrowDown:[1,0], Enter:[1,0], ArrowLeft:[0,-1], ArrowRight:[0,1] }[e.key];
    if (!yon) return;
    if ((e.key === 'ArrowLeft' || e.key === 'ArrowRight') &&
        t.selectionStart !== (e.key === 'ArrowLeft' ? 0 : t.value.length)) return;
    const hc = t.closest('td'), tr = t.closest('tr');
    if (!hc || !tr) return;
    const sut = Array.from(tr.children).indexOf(hc);
    let satirlar = Array.from(tr.parentElement.children);
    let si = satirlar.indexOf(tr) + yon[0];
    let hedef = null;
    while (si >= 0 && si < satirlar.length && !hedef){
      const h = satirlar[si].children[sut + yon[1]];
      hedef = h ? h.querySelector('.hucre') : null;
      if (!hedef) si += yon[0] || 1; else break;
    }
    if (!hedef && yon[1]){
      const h = tr.children[sut + yon[1]];
      hedef = h ? h.querySelector('.hucre') : null;
    }
    if (hedef){ e.preventDefault(); hedef.focus(); hedef.select(); }
  });
  /* Excel'den yapıştırma: sekmeyle ayrılmış blok tabloya dağıtılır */
  kok.addEventListener('paste', e => {
    const t = e.target;
    if (!t.classList.contains('hucre')) return;
    const metin = (e.clipboardData || window.clipboardData).getData('text');
    if (!metin || !/[\t\n]/.test(metin)) return;
    e.preventDefault();
    const bloklar = metin.replace(/\r/g, '').split('\n').filter(s => s.trim() !== '').map(s => s.split('\t'));
    const hc = t.closest('td'), tr = t.closest('tr');
    const sut0 = Array.from(tr.children).indexOf(hc);
    const satirlar = Array.from(tr.parentElement.children);
    let si0 = satirlar.indexOf(tr), yazilan = 0;
    bloklar.forEach((sat, r) => {
      const s = satirlar[si0 + r]; if (!s) return;
      sat.forEach((deg, c) => {
        const h = s.children[sut0 + c]; if (!h) return;
        const g = h.querySelector('.hucre'); if (!g) return;
        const v = sayiOku(deg);
        uygula(g, v); yazilan++;
        g.value = (v == null || v === 0) ? '' : nfSay.format(v);
      });
    });
    kaydet(true);
    bildir(yazilan + ' hücre yapıştırıldı.');
    ciz();
  });
}
